/* ---------------- tile art ---------------- */
// Rock is lit by where it has been cut open, not by a per-tile noise field. The old
// seven-blob speckle was the same visual weight everywhere, so a solid mass and a freshly
// exposed face looked identical and the whole board mushed together. Now the facets are
// coarse and grid-aligned (they read as rock at 16px instead of TV static) and the light
// lives entirely on exposed faces, which makes the dug silhouette the thing you see.
// This carries no information the player did not already have: an exposed face is exposed
// whether or not it catches light (DEC-18).
function drawTile(G,x,y,m,c,r){
  const M = MAT[m], p = M.pal;
  const open = (cc,rr) => cc>=0 && cc<COLS && rr>=0 && rr<ROWS && !G[idx(cc,rr)];
  px(x,y,TILE,TILE,p[0]);
  // Three coarse 4px facets on a 4x4 lattice. Three, not four: at four the tile came out
  // a checkerboard of its own palette and the material read as noise again.
  for(let i=0;i<3;i++){
    const hx = ((hash(c*7+i, r*13+i, 3)*4)|0)*4, hy = ((hash(r*11+i, c*5+i, 5)*4)|0)*4;
    px(x+hx, y+hy, 4, 4, i===1 ? p[1] : p[2]);
  }
  // Every tile gets a chiselled edge, even buried in a mass. This game is played by
  // tapping one specific tile, so a tile has to look like a discrete object you could
  // put a thumb on -- a seamless slab of rock is prettier and much worse to aim at.
  px(x, y, TILE, 1, 'rgba(255,255,255,.09)'); px(x, y, 1, TILE, 'rgba(255,255,255,.06)');
  px(x, y+TILE-1, TILE, 1, 'rgba(0,0,0,.28)'); px(x+TILE-1, y, 1, TILE, 'rgba(0,0,0,.20)');
  // Cut faces catch the lamp properly. This is where the depth comes from: the dug
  // silhouette lights up and the untouched mass behind it stays flat.
  if(open(c,r-1)){
    px(x, y, TILE, 3, p[1]);
    px(x, y, TILE, 1, 'rgba(255,255,255,.34)');
  }
  if(open(c,r+1)) px(x, y+TILE-3, TILE, 3, p[2]);   // undercut face falls into shadow
  if(open(c-1,r)) px(x, y, 2, TILE, p[2]);
  if(open(c+1,r)) px(x+TILE-2, y, 2, TILE, p[2]);
  // You can see it. You cannot have it. This used to be full-height bars every 4px plus a
  // bright cap, which at depth 11 -- where a starting tool locks both slate and silver --
  // turned most of the board into a barcode. Locked rock now just recedes behind a veil
  // with a few faint bands, which says "sealed" without shouting over the material.
  // Four fillRects, so it stays cheap on a phone even when most of the board is locked.
  if(M.hard>TOOL() && M.hard<9){
    px(x,y,TILE,TILE,'rgba(9,7,16,.42)');
    for(let i=2;i<TILE;i+=5) px(x, y+i, TILE, 1, 'rgba(198,212,238,.13)');
  }
  if(M.anchor){ px(x+2,y,3,TILE,p[1]); px(x+TILE-5,y,3,TILE,p[1]); px(x,y+6,TILE,3,p[2]); }
  // Ore is a cut gem, not a dot: a bright core with a highlight pixel, so the thing you
  // are down here for is the brightest object on the board.
  if(M.ore){
    px(x+5,y+5,6,6,p[2]); px(x+6,y+6,4,4,p[1]); px(x+7,y+7,2,2,'#fffbe8');
  }
}
// Preview verdicts sit on top of whatever the board happens to look like, including the
// brightest tile in the game. Bare text lost that fight. A solid plate with a rule above
// and below wins it regardless of what is underneath. (Designer picked C.)
// A verdict belongs beside the man it is about. Centred horizontally on him where it
// fits, clamped to the board otherwise; above him by default, below when he is near the
// top. The plate keeps it readable over any material.
function warnAt(msg, c, r, col){
  const w = textW(msg,1);
  let x = c*TILE + (TILE>>1) - (w>>1);
  x = Math.max(7, Math.min(W - w - 7, x));
  const above = r > 2;
  const y = HUD + (above ? r*TILE - 13 : (r+1)*TILE + 5);
  px(x-6, y-3, w+12, 13, '#08060c');
  px(x-6, y-3, w+12, 1, col); px(x-6, y+9, w+12, 1, col);
  textSh(msg, x, y, '#fff');
}
function edges(G,x,y,c,r){
  if(r>0 && !G[idx(c,r-1)]) px(x,y,TILE,1,'rgba(255,255,255,.22)');
  if(r<ROWS-1 && !G[idx(c,r+1)]) px(x,y+TILE-1,TILE,1,'rgba(0,0,0,.45)');
  if(c>0 && !G[idx(c-1,r)]) px(x,y,1,TILE,'rgba(255,255,255,.10)');
  if(c<COLS-1 && !G[idx(c+1,r)]) px(x+TILE-1,y,1,TILE,'rgba(0,0,0,.30)');
}
const DIGGER = ["..1111..","..1111..",".111111.","01111110","..2222..",".222222.","..2..2..","..3..3.."];
const DIGP = {'1':'#e8c23a','2':'#c2582f','3':'#3b2a1c','0':'#08060c'};
// Squash and stretch by *resampling to a different block count* rather than scaling the
// rects: 7 rows by 9 columns is a real squash that still lands on whole pixels, so the
// character keeps its edges instead of going soft the moment it moves.
// Set for one frame by the preview when the pending action would bury him.
let digDoomed = false;
const DIGP_DOOM = {'1':'#e0604f','2':'#8f2f2f','3':'#3b1c1c','0':'#08060c'};
function drawDigger(x,y,rows,cols,face){
  rows = rows||8; cols = cols||8; face = face||1;
  const ox = x + ((16 - cols*2)>>1), oy = y + (16 - rows*2);
  const pal = digDoomed ? DIGP_DOOM : DIGP;
  for(let r=0;r<rows;r++){
    const row = DIGGER[(r*8/rows)|0];
    for(let c=0;c<cols;c++){
      let s = (c*8/cols)|0; if(face<0) s = 7-s;
      const ch = row[s];
      if(ch==='.'||ch===undefined) continue;
      px(ox+c*2, oy+r*2, 2, 2, pal[ch]);
    }
  }
  // XX for eyes. Drawn over the hat brim row, which is where the face reads.
  if(digDoomed){
    const ey = oy + ((2*rows/8)|0)*2;
    for(const ex of [ox+3, ox+9]){
      px(ex,   ey,   1,1,'#fff'); px(ex+2, ey,   1,1,'#fff');
      px(ex+1, ey+1, 1,1,'#fff');
      px(ex,   ey+2, 1,1,'#fff'); px(ex+2, ey+2, 1,1,'#fff');
    }
  }
}
// The pick travels an arc. It is the only part of a swing the player can watch, so it
// gets the whole windup rather than a two-frame flicker.
function drawPick(x,y,t,face){
  const ang = -2.5 + t*3.0;                       // over the shoulder, down to the rock
  const cx = x+8 + face*3, cy = y+7;
  for(let i=3;i<=7;i++){
    const px0 = cx + Math.cos(ang)*i*face, py0 = cy + Math.sin(ang)*i;
    px(px0-1, py0-1, 2, 2, i>=6 ? '#ccd4de' : '#6b4a28');
  }
}

/* ---------------- render ---------------- */
// Which collapse frame is on screen, what preceded it, and how far between the two we
// are. The pair is what lets a falling mass slide instead of teleporting a row at a time.
function animView(){
  if(!(anim && anim.frames.length)) return null;
  const i = Math.min(anim.i, anim.frames.length-1);
  const prev = i>0 ? anim.frames[i-1]
                   : (anim.sim.g0 ? {g:anim.sim.g0, pc:anim.sim.pc0, pr:anim.sim.pr0} : null);
  return {cur:anim.frames[i], prev:prev, t:Math.min(1, anim.t/STEP)};
}

// Darkness is per tile and centred on the lamp. It is mood, never information: the
// falloff bottoms out well short of black so no part of the screen is ever unreadable,
// and nothing is revealed that was not already visible (DEC-18).
// The tint the lamp falls off into. These used to be brown-first, so the darkness itself
// was adding brown on top of brown rock; each is now the biome's own hue, cooled.
const BTINT = ['#120a12','#080b16','#03100f','#0d0616','#0c0208'];
let VIG = null;
function lightPass(lx, ly){
  const bi = biomeIdx(depth), dark = BTINT[bi] || '#0a0a10';
  const flick = 1 + Math.sin(now/97)*.035 + Math.sin(now/41)*.02;   // the lamp is not a spotlight
  const R = (7.2 + SV.lantern*1.15) * flick;
  const breath = bi===4 ? Math.sin(now/1500)*.05 : 0;               // IT BREATHES
  let q = -1;
  for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++){
    const dx=(c+.5)-lx, dy=(r+.5)-ly;
    const d = Math.sqrt(dx*dx+dy*dy)/R;
    let a = Math.pow(Math.max(0, d-.45), 1.5);
    // Bottoms out at .54, never black: the far corner of the board has to stay planable
    // or the light would be withholding information instead of setting mood (DEC-18).
    // Raised from .44 because the board had almost no falloff left after the palette went
    // cooler -- the lamp needs somewhere to fall off TO for the room to have any depth.
    a = Math.min(1, a) * .54 + breath;
    const k = (a*14)|0; if(k<=0) continue;
    if(k!==q){ q=k; ctx.globalAlpha = k/14; ctx.fillStyle = dark; }
    ctx.fillRect(c*TILE, HUD+r*TILE, TILE, TILE);
  }
  ctx.globalAlpha = 1;
}

function render(){
  digDoomed = false;                 // set by the preview below, read when he is drawn
  const B = biomeAt(depth||1);
  // Shake leans vertical: what hits you in this game always arrives from above.
  const sx = shake>0 ? (Math.random()-.5)*shake*.6 : 0;
  const sy = shake>0 ? (Math.random()-.5)*shake : 0;
  const drop = slide>0 ? (slide*slide)*(H-HUD) : 0;   // the new screen rising into place
  ctx.save(); ctx.translate(sx|0, sy|0);
  px(-8,0,W+16,H,B.wall);

  ctx.save(); ctx.translate(0, (drop*.35)|0);        // far rock lags the near rock
  for(let i=0;i<16;i++){                             // distant mass, so the wall has bulk
    const bx = hash(i,depth,1234)*W - 6, by = HUD + hash(depth,i,4321)*(H-HUD);
    px(bx, by, 7+hash(i,i,depth)*20, 3+hash(i,depth,9)*6, 'rgba(0,0,0,.17)');
  }
  for(let r=0;r<ROWS;r++){                           // strata behind the dug-out space
    const t = r + depth*ROWS;
    if(t%3===0) px(-8, HUD+r*TILE+(t%6===0?4:9), W+16, 1, 'rgba(255,255,255,.045)');
  }
  ctx.restore();

  ctx.save(); ctx.translate(0, drop|0);

  const av = animView();
  const af = av ? av.cur : null;
  const G = af ? af.g : (scr ? scr.g : null);
  const F = scr ? scr.f : null;
  if(G){
    for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++){
      const m = G[idx(c,r)]; if(!m) continue;
      // A tile that was one row higher last frame is mid-fall: draw it between the two.
      const falling = av && av.prev && r>0 && !av.prev.g[idx(c,r)] && av.prev.g[idx(c,r-1)]===m;
      const x = c*TILE, y = HUD + r*TILE - (falling ? (1-av.t)*TILE : 0);
      drawTile(G,x,y,m,c,r); edges(G,x,y,c,r);
      if(F && F[idx(c,r)]){                      // a find, glinting through the rock
        const t = Math.sin(now/220 + c + r)*.5+.5;
        px(x+4,y+4,TILE-8,TILE-8, t>.5?'#f0e0a0':'#d8c070');
        px(x+6,y+6,2,2,'#fffbe8');
      }
      // Ore catches the lamp every few seconds. Ore is already visible; this only makes
      // the thing you are here for feel worth walking to.
      if(MAT[m].ore){
        const g = Math.sin(now/300 + c*2.1 + r*1.3);
        if(g > .93) px(x+4+((now/90+c)%6|0), y+4, 2, 2, '#fffbe8');
      }
    }
  }

  if(scr) lightPass(dig.x+.5, dig.y+.5);

  // THE PREVIEW (LAB-03). The promise, drawn.
  //
  // Four distinct things have to be readable at once, and they have to be told apart
  // WITHOUT relying on colour -- a phone in sunlight, or a colour-blind player, still has
  // to be able to plan. So each one gets its own shape:
  //
  //   removed      cross-hatched, hard white border   -- this is going away
  //   falls from   hollow, a chevron pointing down    -- this leaves, going that way
  //   lands here   solid ghost with a bracket under   -- this is where it stops
  //   you          ghost digger, or a hatched cage    -- what happens to the man
  //
  // Everything drawn here is read off the resolve result that the commit will replay.
  // Nothing in this block recomputes a consequence, which is the only reason the drawing
  // and the outcome cannot disagree.
  if(mode==='play' && pending && G){
    const P = pending, t = Math.sin(now/90)*.5+.5;
    const fin = P.sim.frames.length ? P.sim.frames[P.sim.frames.length-1] : null;

    // 1. cells this action removes
    for(let i=0;i<P.cells.length;i+=2){
      const x=P.cells[i]*TILE, y=HUD+P.cells[i+1]*TILE;
      ctx.fillStyle = t>.5 ? 'rgba(255,255,255,.30)' : 'rgba(255,255,255,.10)';
      ctx.fillRect(x,y,TILE,TILE);
      for(let d=-TILE;d<TILE;d+=4){                       // hatch: "gone", not "selected"
        for(let k=0;k<TILE;k++){
          const hx = x+d+k, hy = y+k;
          if(hx>=x && hx<x+TILE) px(hx, hy, 1, 1, 'rgba(255,255,255,.5)');
        }
      }
      px(x,y,TILE,1,'#fff'); px(x,y+TILE-1,TILE,1,'#fff');
      px(x,y,1,TILE,'#fff'); px(x+TILE-1,y,1,TILE,'#fff');
    }

    if(fin){
      // 2. every mass that loses its footing: mark where it leaves from, and which way.
      for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++){
        const was = G[idx(c,r)], willBe = fin.g[idx(c,r)];
        if(!was || was === willBe) continue;
        if(P.cells.includes(c) && (() => {              // already drawn as removed
          for(let i=0;i<P.cells.length;i+=2) if(P.cells[i]===c && P.cells[i+1]===r) return true;
          return false; })()) continue;
        px(c*TILE, HUD+r*TILE, TILE, 1, 'rgba(255,255,255,.35)');
        // Outlined, not bare: a white chevron vanishes into the bright core of an ore
        // tile, which is exactly where a falling mass most often is. The dark shadow
        // underneath is what makes it survive gold and copper. (Designer picked B.)
        const cx = c*TILE, cy = HUD + r*TILE;
        for(let k=0;k<5;k++){ px(cx+3+k, cy+5+k, 3, 3, '#08060c'); px(cx+11-k, cy+5+k, 3, 3, '#08060c'); }
        for(let k=0;k<4;k++){ px(cx+4+k, cy+6+k, 1, 1, '#fff'); px(cx+11-k, cy+6+k, 1, 1, '#fff'); }
      }
      // 3. where it all comes to rest
      ctx.globalAlpha = .40;
      for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++){
        const m = fin.g[idx(c,r)];
        if(!m || G[idx(c,r)]===m) continue;
        px(c*TILE, HUD+r*TILE, TILE, TILE, MAT[m].pal[1]);
      }
      ctx.globalAlpha = 1;
      for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++){
        const m = fin.g[idx(c,r)];
        if(!m || G[idx(c,r)]===m) continue;
        if(r+1>=ROWS || fin.g[idx(c,r+1)]!==m || G[idx(c,r+1)]===fin.g[idx(c,r+1)]){
          px(c*TILE+1, HUD+r*TILE+TILE-2, TILE-2, 1, '#fff3c0');   // it stops on this line
          px(c*TILE+1, HUD+r*TILE+TILE-4, 1, 3, '#fff3c0');
          px(c*TILE+TILE-2, HUD+r*TILE+TILE-4, 1, 3, '#fff3c0');
        }
      }
      // 4. and what becomes of the man
      if(!P.sim.buried){
        const gy = HUD + fin.pr*TILE;
        ctx.globalAlpha = .8; drawDigger(fin.pc*TILE+1, gy+1); ctx.globalAlpha = 1;
        if(P.sim.out) warnAt('THROUGH', fin.pc, fin.pr, '#5ed986');
        else if(fin.pr > P.sim.pr0 && P.sim.pr0 >= 0) warnAt('YOU RIDE IT DOWN', fin.pc, fin.pr, '#5ed986');
      }
    }
    if(P.sim.buried){
      // The warning is drawn ON the man. A marker around him was occluded by his own
      // sprite and read as clutter; and a banner at the top of the board is nowhere near
      // where the player is looking, so contrast never was the problem -- proximity was.
      // He goes red and his eyes become XX. That is the whole warning, and it is on the
      // one object the player is already watching.
      digDoomed = true;
      warnAt('THIS BURIES YOU', pc, pr, '#e0604f');
    }
  }

  if(mode!=='panel' && scr){
    // During the burial beat he is drawn in the doomed palette, flattened, under the rock
    // that landed on him -- so the frame itself says what happened.
    if(mode==='doom') digDoomed = true;
    const dx = dig.x*TILE+1, dy = HUD + dig.y*TILE+1;
    const gx = dx+8, gy = dy+8;
    // Lamp glow rides the character and pulses with the flicker in lightPass, so the
    // pool of light is one thing rather than two effects fighting each other.
    const rad = 58 + Math.sin(now/97)*4;
    const g = ctx.createRadialGradient(gx, gy, 3, gx, gy, rad);
    g.addColorStop(0,'rgba(255,228,150,.22)'); g.addColorStop(.45,'rgba(255,214,140,.07)');
    g.addColorStop(1,'rgba(255,228,150,0)');
    ctx.fillStyle=g; ctx.fillRect(0,HUD,W,H-HUD);

    // 1px idle bob, and a hop while walking: whole pixels only, so it never goes mushy.
    let bob = 0;
    if(dig.hop>0) bob = -Math.round(Math.sin(dig.hop*Math.PI)*3);
    else if(mode==='play' && !pending) bob = Math.sin(now/430)>0 ? 0 : 1;
    const rows = dig.sq<.9 ? 7 : (dig.sq>1.08 ? 9 : 8);
    const cols = dig.sq<.9 ? 9 : (dig.sq>1.08 ? 7 : 8);
    drawDigger(dx, dy+bob, rows, cols, dig.face);
    if(dig.swing>=0) drawPick(dx, dy+bob, dig.swing, dig.face);
  }

  // reachable targets, so the constraint is visible instead of learned by failure
  if(mode==='play' && scr && !pending){
    for(const p of reachCells()){
      const c=p[0], r=p[1];
      if(c<0||c>=COLS||r<0||r>=ROWS) continue;
      const m = scr.g[idx(c,r)]; if(!m) continue;
      const x=c*TILE, y=HUD+r*TILE;
      const col = breakable(m) ? 'rgba(94,217,134,.6)' : 'rgba(224,96,79,.5)';
      px(x,y,3,1,col); px(x,y,1,3,col);
      px(x+TILE-3,y,3,1,col); px(x+TILE-1,y,1,3,col);
      px(x,y+TILE-1,3,1,col); px(x,y+TILE-3,1,3,col);
      px(x+TILE-3,y+TILE-1,3,1,col); px(x+TILE-1,y+TILE-3,1,3,col);
    }
  }

  // The cluster you just took, blown out white and fading. Drawn over the tiles it
  // removed, so the swing visibly consumes them.
  for(const f of flashes){
    ctx.globalAlpha = Math.max(0, 1-f.t) * .8;
    for(let i=0;i<f.cells.length;i+=2)
      px(f.cells[i]*TILE, HUD+f.cells[i+1]*TILE, TILE, TILE, '#fff8dc');
  }
  ctx.globalAlpha = 1;
  // Tap rings expand out from under the fingertip so the confirmation is visible around
  // the thumb that is covering the tile.
  for(const rg of rings){
    const s = 3 + rg.t*15, a = Math.max(0, 1-rg.t);
    ctx.globalAlpha = a*a;
    px(rg.x-s, rg.y-s, s*2, 1, rg.c); px(rg.x-s, rg.y+s-1, s*2, 1, rg.c);
    px(rg.x-s, rg.y-s, 1, s*2, rg.c); px(rg.x+s-1, rg.y-s, 1, s*2, rg.c);
  }
  ctx.globalAlpha = 1;

  // Motes drift in the lamplight. Nothing depends on them; they exist so that a screen
  // you are standing still on is never a photograph.
  for(const mo of motes){
    const tw = .55 + Math.sin(now/500 + mo.ph)*.45;
    ctx.globalAlpha = mo.a * tw;
    px(mo.x, mo.y, 1, 1, '#d8cdf0');
  }
  ctx.globalAlpha=1;

  for(const p of parts){ ctx.globalAlpha=Math.max(0,Math.min(1,p.life)); px(p.x,p.y,p.s||2,p.s||2,p.c); }
  ctx.globalAlpha=1;
  // The number lands at double size for a beat before it settles. Cheapest possible pop,
  // and it keeps the payout legible on a phone.
  for(const f of floats){
    ctx.globalAlpha = Math.max(0, Math.min(1, f.life*1.4));
    const big = f.pop > .62;
    textSh(f.t, big ? f.x-(textW(f.t,1)>>1) : f.x, f.y, f.c, big?2:1);
  }
  ctx.globalAlpha=1;

  ctx.restore();                                   // end of the sliding world layer

  if(!VIG){ VIG = ctx.createLinearGradient(0,HUD,0,H);
    // Light on the character now does the depth work, so the old flat vignette pulls
    // right back -- stacked, the two of them crushed the bottom of the board.
    VIG.addColorStop(0,'rgba(0,0,0,0)'); VIG.addColorStop(1,'rgba(0,0,0,.20)'); }
  ctx.fillStyle=VIG; ctx.fillRect(0,HUD,W,H-HUD);
  ctx.restore();                                   // end of the shake

  drawHUD();

  if(msg && now<msgT){
    const a = Math.min(1,(msgT-now)/350);
    const rise = Math.max(0, 1-(now-msgAt)/140);   // slides up out of the floor
    ctx.globalAlpha=a;
    const w = textW(msg,1)+6, y = H-14 + Math.round(rise*10);
    px((W-w)>>1, y, w, 9, 'rgba(8,6,12,.85)');
    textC(msg, y+2, '#c0b4d8');
    ctx.globalAlpha=1;
  }
}

function drawHUD(){
  px(0,0,W,HUD,'#120e1a'); px(0,HUD-1,W,1,'#08060c');
  const L = lab ? RESTARTW + 2 : 3;              // clear of whichever buttons are showing
  textSh(lab ? 'BOARD' : 'DEPTH', L, 3, '#665a80');
  // The depth number kicks a pixel when it changes -- the one number the whole run is about.
  textSh(String(lab ? lab.i+1 : depth), L, 11 - (popDepth>.5?1:0), popDepth>0?'#fff3c0':'#e8b830', 2);

  const px0 = L + 37;                            // picks as pips: a count you read at a glance
  for(let i=0;i<Math.max(0,picks);i++){
    const x = px0 + (i%PIPROW)*5, y = 4 + ((i/PIPROW)|0)*7;
    px(x,y,3,5,'#5ed986'); px(x+1,y+5,1,1,'#3a8a55');
  }
  // The pip you just spent flies off rather than blinking out, so a swing visibly costs.
  for(const g of pips){
    ctx.globalAlpha = Math.max(0, g.life);
    px(g.x, g.y - (1-g.life)*7, 3, 5, '#e0604f');
  }
  ctx.globalAlpha = 1;
  if(picks<=0 && mode!=='panel' && scr) textSh('NO PICKS', px0, 5, '#e0604f');
  if(!lab && depth>0 && depth%3!==0) textSh((3-(depth%3))+' TO LAND', px0, 19, '#665a80');
  if(lab){ textSh(lab.def.name.slice(0,12), px0, 19, '#665a80'); return; }

  const bw = 40, bx = W-MENUW-bw-3, cap = Math.max(1,CAP());
  textSh('BAG', bx, 3, '#665a80');
  px(bx, 11, bw, 6, '#251d33');
  const full = haul>=CAP();
  // The bar chases the number instead of jumping to it, and a full bag pulses at you.
  const fillc = full ? (Math.sin(now/160)>0 ? '#e0604f' : '#f0836f') : (popBag>0 ? '#fff3c0' : '#e8b830');
  px(bx, 11, Math.round(bw*Math.min(1, hudBag/cap)), 6, fillc);
  textSh(String(haul), bx+2, 19, popBag>0?'#fff3c0':'#c0b4d8');
}

/* ---------------- input ---------------- */
function local(e){ const b=cv.getBoundingClientRect();
  return [(e.clientX-b.left)*(W/b.width), (e.clientY-b.top)*(H/b.height)]; }
function tileAt(x,y){
  if(y<HUD) return null;
  const c = Math.floor(x/TILE), r = Math.floor((y-HUD)/TILE);
  if(c<0||c>=COLS||r<0||r>=ROWS) return null;
  return [c,r];
}
function tap(x,y){
  if(y<HUD) return;                                // the HUD is a readout; the menu is a DOM button
  if(mode!=='play' || !scr) return;
  const t = tileAt(x,y); if(!t) return;
  const c=t[0], r=t[1], m = scr.g[idx(c,r)];

  if(!m){
    if(SV.beams && beamsLeft>0 && !pending && inReach(c,r) && placeBeam(c,r)) return;
    const res = resolve(liveBoard(), {t:ACT.WALK, c:c, r:r});
    if(res.ok){
      pending=null;
      if(c !== pc) dig.face = c > pc ? 1 : -1;
      dig.hop = 1;                                 // one bounce per step, however far
      scr.g = res.board.cell; scr.f = res.board.find;
      pc = res.board.player.c; pr = res.board.player.r;
      tone(520,.03,'square',.05);
      ring(c,r,'#9fe8bb'); buzz(6);
    }
    else { pending = null; ring(c,r,'#5e5470'); }   // a tap that did nothing still answers
    return;
  }
  if(!inReach(c,r)){ pending=null; ring(c,r,'#e0604f'); buzz(12); toast('TOO FAR. WALK CLOSER.'); return; }
  if(!breakable(m)){
    pending=null; ring(c,r,'#e0604f'); buzz(12);
    toast(MAT[m].hard===2 ? 'BASALT. YOU NEED THE DRILL.' : 'SLATE. YOU NEED AN IRON PICK.');
    tone(120,.09,'square',.09); return;
  }
  if(picks<=0){ ring(c,r,'#e0604f'); buzz(12); toast('NO PICKS LEFT ON THIS SCREEN'); tone(120,.12,'square',.09); return; }
  if(pending && pending.c===c && pending.r===r){ commitBreak(); return; }
  pending = planBreak(c,r);
  ring(c,r,'#fff'); buzz(8);
  tone(660,.04,'square',.06);
}
cv.addEventListener('pointerdown', e=>{ e.preventDefault(); ac();
  const p = local(e); tap(p[0], p[1]); }, {passive:false});
// Reachable from play AND from mid-collapse. A collapse that somehow never finishes used
// to leave the player with no legal input at all; the way out must not depend on the
// simulation being in a good mood.
menuEl.addEventListener('click', e=>{ e.preventDefault(); ac();
  if(mode!=='panel') pausePanel(); }, {passive:false});
restartEl.addEventListener('click', e=>{ e.preventDefault(); ac(); restartLab(); }, {passive:false});

/* ---------------- update ---------------- */
function update(dt){
  // The room keeps running through a hitstop: motes, lamp and HUD easing are ambience,
  // not the action being frozen.
  for(const mo of motes){
    mo.x += mo.vx*dt*60; mo.y += mo.vy*dt*60;
    if(mo.y < HUD-2 || mo.x < -2 || mo.x > W+2){
      const n = newMote(false); mo.x=n.x; mo.y=n.y; mo.vx=n.vx; mo.vy=n.vy; mo.a=n.a; mo.ph=n.ph;
    }
  }
  if(popDepth>0) popDepth = Math.max(0, popDepth - dt*3);
  if(popBag>0)   popBag   = Math.max(0, popBag - dt*3);
  if(slide>0)    slide    = Math.max(0, slide - dt*3.4);
  hudBag += (haul - hudBag) * Math.min(1, dt*9);
  for(let i=pips.length-1;i>=0;i--){ pips[i].life -= dt*2.2; if(pips[i].life<=0) pips.splice(i,1); }
  // Touch feedback runs ahead of the hitstop return below: the ring answers the finger,
  // so it must never be the thing that freezes.
  for(let i=rings.length-1;i>=0;i--){ rings[i].t += dt*3.4; if(rings[i].t>=1) rings.splice(i,1); }
  for(let i=flashes.length-1;i>=0;i--){ flashes[i].t += dt*5.5; if(flashes[i].t>=1) flashes.splice(i,1); }
  if(dig.hop>0) dig.hop = Math.max(0, dig.hop - dt*6);
  if(dig.swing>=0){ dig.swing += dt/.22; if(dig.swing>1) dig.swing = -1; }

  // The burial beat. Everything else still animates -- dust settles, the hat arcs away,
  // the shake decays -- and only when it has all played out does the panel arrive.
  if(mode==='doom'){
    doomT += dt;
    if(doomT >= DOOM_TIME){ doomT = -1; endLeg('buried'); }
  }

  // Impact freeze. A collapse hits harder when the first frame of it holds still.
  if(hitstop>0){ hitstop -= dt; if(hitstop>0) return; }

  if(shake>0) shake = Math.max(0, shake - dt*14);
  for(let i=parts.length-1;i>=0;i--){ const p=parts[i];
    p.x+=p.vx*dt*60; p.y+=p.vy*dt*60; p.vy+=p.g*dt*60; p.life-=dt*(p.fd||1.4);
    if(p.life<=0 || p.y>H) parts.splice(i,1); }
  for(let i=floats.length-1;i>=0;i--){ const f=floats[i];
    f.y+=f.vy*dt*60; f.vy *= Math.pow(.86, dt*60);      // shoots up, then hangs
    if(f.pop>0) f.pop -= dt*4;
    f.life-=dt*1.1; if(f.life<=0) floats.splice(i,1); }

  // Where the character actually is on screen. During a collapse it rides the frame
  // interpolation; the rest of the time it walks to the tile the rules already moved it to.
  const av = animView();
  if(av){
    const p = av.prev || av.cur;
    dig.x = p.pc + (av.cur.pc - p.pc)*av.t;
    dig.y = p.pr + (av.cur.pr - p.pr)*av.t;
    if(av.cur.pr !== p.pr) dig.sq = 1.15;               // stretched out in the air
    else dig.sq += (1-dig.sq)*Math.min(1, dt*14);
  } else if(mode==='doom'){
    dig.x = pc; dig.y = pr; dig.sq = .35;               // stays flattened for the beat
  } else {
    const k = Math.min(1, dt*16);
    if(Math.abs(pc-dig.x)>.02 || Math.abs(pr-dig.y)>.02){
      dig.x += (pc-dig.x)*k; dig.y += (pr-dig.y)*k;
    } else { dig.x = pc; dig.y = pr; }
    dig.sq += (1-dig.sq)*Math.min(1, dt*14);
  }

  if(mode==='anim' && anim){
    anim.t += dt;
    if(anim.t > STEP){
      anim.t = 0;
      const prev = anim.frames[anim.i];
      anim.i++;
      if(anim.i < anim.frames.length){
        const f = anim.frames[anim.i];
        if(prev && f.pr !== prev.pr) shake = Math.max(shake, 2);
        if(prev){
          let landed = 0, lastImpact = null;
          for(let c=0;c<COLS;c++) for(let r=0;r<ROWS;r++){
            if(prev.g[idx(c,r)] && !f.g[idx(c,r)]) dust(c*TILE, HUD+r*TILE, 2);
            // A tile that was falling and has now stopped just hit something.
            if(r>0 && r<ROWS-1 && f.g[idx(c,r)] && !prev.g[idx(c,r)]
               && prev.g[idx(c,r-1)]===f.g[idx(c,r)] && f.g[idx(c,r+1)] && landed<5){
              // The material that just stopped decides how the hit reads (LAB-04).
              lastImpact = landImpact(c*TILE, HUD+r*TILE, f.g[idx(c,r)]); landed++;
            }
          }
          if(landed && lastImpact){
            shake = Math.max(shake, lastImpact.shake);
            noise(lastImpact.snd.d, lastImpact.snd.v, lastImpact.snd.lp);
          }
        }
      } else {
        finishSim(anim.sim);
        return;
      }
    }
  }
}

// Is there any swing left that does not bury you? Walking is free and does not change
// the grid, so this enumerates every standing spot you could reach and every tile you
// could reach from it. If the answer is no, the screen is genuinely over: the only
// remaining moves all end the leg, so ending it here just saves the player the search.
// Runs once per settle, not per frame.
function safeSwingExists(){
  const reach = walkTargets(scr.g, pc, pr);
  for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++){
    if(!reach[idx(c,r)]) continue;
    // Ask the question on a board standing there, rather than moving the real player and
    // putting him back. A hypothetical is a board, never a mutated global.
    const hypo = makeBoard(scr.g, scr.f, c, r, Math.max(1, picks), {depth:depth});
    for(const p of [[c,r-1],[c-1,r],[c+1,r],[c,r+1],[c-1,r+1],[c+1,r+1]]){
      const nc=p[0], nr=p[1];
      if(nc<0||nc>=COLS||nr<0||nr>=ROWS) continue;
      if(!breakable(scr.g[idx(nc,nr)])) continue;
      const res = resolve(hypo, {t:ACT.BREAK, c:nc, r:nr, tool:TOOL()});
      if(res.ok && !res.board.player.buried) return true;
    }
  }
  return false;
}

let last = 0;
function loop(ts){
  now = ts;
  const dt = Math.min(.05, (ts-last)/1000 || 0); last = ts;
  update(dt); render();
  requestAnimationFrame(loop);
}

// The contract, reachable from the console. LAB-02's board format and LAB-03's
// preview-equals-commit check both drive it from here, and so does any check that wants
// to resolve a board without a running game around it.
window.LAB = {ACT, makeBoard, cloneBoard, boardToJSON, boardFromJSON, resolve,
              genScreen, liveBoard, MAT, COLS, ROWS, idx};

/* ---------------- boot ---------------- */
(async function(){
  const s = await load();
  if(s) SV = Object.assign(NEW(), s);
  if(!SV.screens) SV.screens = {};
  if(!SV.reroll) SV.reroll = {};
  if(!SV.finds) SV.finds = [];
  requestAnimationFrame(loop);
  if(!SV.seen){ SV.seen = 1; save(); howPanel(surface); }
  else surface();
})();
</script>
</body>
</html>
