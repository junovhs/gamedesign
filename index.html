"use strict";
/* =============================================================================
   PACKHOUSE — complete but shallow

   Three layers, deliberately kept from touching each other:
     CROPS  bend the physics of the floor    (gravity / adjacency / supply / output)
     GEAR   bends the vocabulary of the crane (charges / sight / carry)
     STAMPS are read-only labels orders care about; they change no rule at all

   One gesture: press to plan, release to pack. Drag = crane swap, within reach.
   ========================================================================== */

const cv=document.getElementById('c');
const ctx=cv.getContext('2d');
let W=0,H=0,DPR=1,ST=0,SB=0;
let COLS=7,ROWS=8,cell=48,bx=0,by=0,bw=0,bh=0,topH=150,botH=92,gantryH=34;

function measureSafe(){
  const d=document.createElement('div');
  d.style.cssText='position:fixed;visibility:hidden;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)';
  document.body.appendChild(d);const cs=getComputedStyle(d);
  ST=parseFloat(cs.paddingTop)||0;SB=parseFloat(cs.paddingBottom)||0;d.remove();
}
function layout(){
  topH=Math.max(128,Math.min(168,H*.192))+ST;
  botH=Math.max(70,Math.min(96,H*.115))+SB;
  const aw=W-16,ah=H-topH-botH-6;
  cell=Math.max(22,Math.floor(Math.min(aw/COLS,ah/(ROWS+0.9))));
  gantryH=Math.round(cell*.78);
  bw=cell*COLS;bh=cell*ROWS;
  bx=Math.round((W-bw)/2);
  by=Math.round(topH+gantryH+Math.max(0,(ah-gantryH-bh)/2));
}
function resize(){
  DPR=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  cv.style.width=W+'px';cv.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);layout();
}
addEventListener('resize',resize);

const INK='#f6fbff',DIM='rgba(236,246,255,.66)',FAINT='rgba(236,246,255,.3)';
const CYAN='#6ae9ff',GOLD='#ffd36b',MINT='#79ffc7',ROSE='#ff8fb0';

 {id:'berry',name:'Frost Berries',short:'berries',shape:'cluster',

 {id:'lemon',name:'Cider Lemons',short:'lemons',shape:'lemon',

/* ============================ SHIFTS ===================================== */
function ord(tier,count,stamp,reward){return {tier,count,stamp:stamp||null,reward:reward||0};}

 {name:'Chain Reaction',sub:'land a package beside its match',cols:7,rows:8,slots:3,fixed:['apple','orange','pear'],

  orders:[ord(4,2),ord(3,1,'bumper'),ord(3,1,'deep')],stretch:ord(4,1,'fresh',900),

 {name:'Night Market',sub:'open floor, orders keep coming',cols:7,rows:8,slots:3,endless:true,

/* ============================ SAVE ======================================= */
const KEY='packhouse-p4';
let run={stage:0,total:0,chainsMade:0,best:{},seenChain:false,seenTruck:false,
  crops:['apple','orange','pear'],owned:[],equip:{HANDS:null,EYES:null,POCKETS:null},
  loadout:['apple','orange','pear'],stored:null,unlockedNight:false};
function load(){try{const v=JSON.parse(localStorage.getItem(KEY));if(v)run=Object.assign(run,v);}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(run));}catch(e){}}
const hasGear=id=>run.equip[gearById(id).slot]===id;

/* ============================ AUDIO ====================================== */
let AC=null,master=null,muted=false;
function initAudio(){if(AC)return;try{AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=.4;master.connect(AC.destination);}catch(e){AC=null;}}
function tone(f,dur,type,vol,slide,delay){
  if(!AC||muted)return;dur=dur||.14;type=type||'sine';vol=vol||.12;slide=slide||1;delay=delay||0;
  const t2=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t2);
  if(slide!==1)o.frequency.exponentialRampToValueAtTime(Math.max(30,f*slide),t2+dur);
  g.gain.setValueAtTime(.0001,t2);g.gain.exponentialRampToValueAtTime(vol,t2+.012);
  g.gain.exponentialRampToValueAtTime(.0001,t2+dur);
  o.connect(g);g.connect(master);o.start(t2);o.stop(t2+dur+.03);
}
function noise(dur,vol,f){
  if(!AC||muted)return;dur=dur||.3;vol=vol||.14;f=f||1300;
  const t2=AC.currentTime,n=AC.createBufferSource(),len=Math.floor(AC.sampleRate*dur);
  const buf=AC.createBuffer(1,len,AC.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*(1-i/len);
  n.buffer=buf;const bp=AC.createBiquadFilter(),g=AC.createGain();
  bp.type='bandpass';bp.frequency.value=f;bp.Q.value=1;g.gain.value=vol;
  g.gain.exponentialRampToValueAtTime(.0001,t2+dur);
  n.connect(bp);bp.connect(g);g.connect(master);n.start(t2);n.stop(t2+dur);
}
const SC=[0,2,4,7,9,12,14,16,19,21,24,26,28];
const hz=i=>220*Math.pow(2,SC[Math.max(0,Math.min(SC.length-1,i))]/12);
function sfxPack(tier,chain){tone(hz(tier+chain*2),.17,'triangle',.15);tone(hz(tier+chain*2+3),.22,'sine',.09,1,.04);}
function sfxNo(){tone(118,.12,'square',.05,.72);}
function sfxTap(){tone(600,.045,'sine',.06);}
function sfxCrane(){tone(300,.16,'triangle',.09,1.7);noise(.14,.05,600);}
function sfxSetup(){tone(hz(4),.1,'sine',.06);tone(hz(7),.16,'sine',.05,1,.05);}
function sfxTruck(){noise(.5,.2,1500);tone(70,.55,'sine',.2,.45);}
function sfxWin(){[2,5,8,11].forEach((n,i)=>tone(hz(n),.45,'triangle',.13,1,i*.08));}
function sfxOrder(){[4,8,11].forEach((n,i)=>tone(hz(n),.3,'sine',.1,1,i*.06));}

/* ============================ STATE ====================================== */
let grid=[],flying=[],parts=[],rings=[],floats=[],lines=[];
let uid=1,busy=false,shakeAmt=0,flash=0,t=0;
let cfg=STAGES[0],st=null,rng=null,colQ=[],crops=[];
let screen='title',prevScreen='play';
let hintText='',hintTime=0;
let buttons=[],pressBtn=null,down=null,preview=null;
let spotIds=new Set(),pendingSetup=new Set();
let crane={c:3,x:0,arm:0,armT:0,busy:false};
let cardOffer=[],pickedCard=null,loadPick=[];

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let x=Math.imul(a^a>>>15,1|a);x=x+Math.imul(x^x>>>7,61|x)^x;return((x^x>>>14)>>>0)/4294967296;};}
function shuffle(a,r){for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));const s=a[i];a[i]=a[j];a[j]=s;}return a;}

function makeP(color,tier,stamps){
  return {id:uid++,color,tier,stamps:stamps?stamps.slice():[],craned:false,
    r:0,c:0,px:0,py:0,vx:0,vy:0,pop:0,flash:0,wig:0,scale:1,tR:null,tC:null,gone:false};
}
const at=(r,c)=>(r<0||c<0||r>=ROWS||c>=COLS)?null:grid[r][c];
const bxc=c=>bx+c*cell+cell/2, byr=r=>by+r*cell+cell/2;
function hint(s,time){hintText=s;hintTime=time===undefined?4.5:time;}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const tierName=tr=>['produce','basket','crate','truck'][Math.min(3,Math.max(0,tr-1))];
const craneReach=()=>2+(hasGear('longarm')?1:0);
const setupNeed=()=>hasGear('tally')?2:3;

/* ============================ PHYSICS ==================================== */
const isHang=(color,tier)=>{const c=crops[color];return !!(c&&c.hang&&tier>=c.hang);};
const isSink=(color,tier)=>{const c=crops[color];return !!(c&&c.sink&&tier>=c.sink);};

function applyGravity(b){
  for(let c=0;c<COLS;c++){
    let w=ROWS-1;
    for(let r=ROWS-1;r>=0;r--){
      const q=b[r][c];if(!q)continue;
      if(isHang(q.color,q.tier)){w=r-1;continue;}
      if(w!==r){b[w][c]=q;b[r][c]=null;q.r=w;q.c=c;}
      w--;
    }
  }
  for(let pass=0;pass<ROWS;pass++){
    let moved=false;
    for(let c=0;c<COLS;c++)for(let r=ROWS-2;r>=0;r--){
      const q=b[r][c];if(!q||!isSink(q.color,q.tier))continue;
      const below=b[r+1][c];
      if(below&&(isHang(below.color,below.tier)||isSink(below.color,below.tier)))continue;
      b[r+1][c]=q;b[r][c]=below||null;
      q.r=r+1;if(below)below.r=r;
      moved=true;
    }
    if(!moved)break;
  }
}

/* ============================ SUPPLY ===================================== */
function fillQ(c){
  while(colQ[c].length<6){
    const bag=[];
    for(let k=0;k<2;k++)for(let i=0;i<crops.length;i++)bag.push({color:i,tier:1});
    shuffle(bag,rng);
    if(cfg.basketDrop&&rng()<cfg.basketDrop)bag[Math.floor(rng()*bag.length)].tier=2;
    const out=[];
    for(const s of bag){out.push(s);if(crops[s.color].pairs&&s.tier===1)out.push({color:s.color,tier:1});}
    colQ[c].push.apply(colQ[c],out);
  }
}
function pull(c){fillQ(c);const s=colQ[c].shift();fillQ(c);return s;}

/* ============================ BOARD ====================================== */
function buildBoard(){
  grid=Array.from({length:ROWS},()=>Array(COLS).fill(null));
  flying=[];parts=[];rings=[];floats=[];lines=[];
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    const stripe=(c+((r/2)|0)+st.index)%crops.length;
    const color=rng()<.5?stripe:Math.floor(rng()*crops.length);
    const p=makeP(color,1);p.r=r;p.c=c;p.px=c;p.py=r-ROWS-1;grid[r][c]=p;
  }
  const spots=[];
  for(let r=2;r<ROWS;r++)for(let c=0;c<COLS;c++)spots.push([r,c]);
  shuffle(spots,rng);
  let i=0;
  for(let k=0;k<cfg.seedCrates&&i<spots.length;k++){const s=spots[i++],p=grid[s[0]][s[1]];p.tier=3;p.color=Math.floor(rng()*crops.length);}
  for(let k=0;k<cfg.seedBaskets&&i<spots.length;k++){const s=spots[i++],p=grid[s[0]][s[1]];p.tier=2;p.color=Math.floor(rng()*crops.length);}
  if(hasGear('coldroom')&&run.stored){
    const cc=Math.floor(COLS/2);
    const p=makeP(Math.min(run.stored.color,crops.length-1),run.stored.tier,run.stored.stamps);
    p.r=ROWS-1;p.c=cc;p.px=cc;p.py=-2;p.flash=1;grid[ROWS-1][cc]=p;
    hint('The cold room kept your '+tierName(p.tier)+'.',5);
    run.stored=null;save();
  }
  applyGravity(grid);
  for(const row of grid)for(const p of row)if(p){p.px=p.c;p.py=p.r-ROWS-1;}
  ensurePlayable();ensureOpportunity();refreshRoots();
}

/* ============================ GROUPS & SIM =============================== */
function nbrs(p,color){
  const d=[[p.r-1,p.c],[p.r+1,p.c],[p.r,p.c-1],[p.r,p.c+1]];
  if(crops[color]&&crops[color].diag)d.push([p.r-1,p.c-1],[p.r-1,p.c+1],[p.r+1,p.c-1],[p.r+1,p.c+1]);
  return d;
}
function floodGrid(r,c){
  const s=at(r,c);if(!s)return[];
  const out=[s],stack=[s],seen=new Set([s.id]);
  while(stack.length){
    const p=stack.pop();
    for(const d of nbrs(p,s.color)){
      const q=at(d[0],d[1]);
      if(q&&!seen.has(q.id)&&q.color===s.color&&q.tier===s.tier){seen.add(q.id);out.push(q);stack.push(q);}
    }
  }
  return out;
}
function cloneB(){return grid.map((row,r)=>row.map((p,c)=>p?{color:p.color,tier:p.tier,r,c,stamps:p.stamps,craned:p.craned}:null));}
function floodB(b,r,c){
  const s=b[r][c];if(!s)return[];
  const out=[s],stack=[s],seen=new Set([s]);
  while(stack.length){
    const p=stack.pop();
    for(const d of nbrs(p,s.color)){
      const rr2=d[0],cc2=d[1];
      if(rr2<0||cc2<0||rr2>=ROWS||cc2>=COLS)continue;
      const q=b[rr2][cc2];
      if(q&&!seen.has(q)&&q.color===s.color&&q.tier===s.tier){seen.add(q);out.push(q);stack.push(q);}
    }
  }
  return out;
}
const isBulk=(color,n)=>!!(cfg.bulk&&n>=5&&!crops[color].noBulk);
const packScore=(fromTier,size,chainIdx)=>10*fromTier*size*chainIdx;

function stampsFor(group,chainIdx,bulk){
  const out=[];
  for(const q of group)for(const s of (q.stamps||[]))if(out.indexOf(s)<0)out.push(s);
  if(chainIdx>1&&out.indexOf('fresh')<0)out.push('fresh');
  if(bulk&&out.indexOf('bumper')<0)out.push('bumper');
  if(group.some(q=>q.craned)&&out.indexOf('handled')<0)out.push('handled');
  return out;
}

/* Full consequence of pressing (r,c) — this drives the plan overlay. */
function simulate(r,c){
  const src=at(r,c);
  if(!src||src.tier>=4)return null;
  const live=floodGrid(r,c);
  if(live.length<2)return null;
  const b=cloneB(),tgt=b[r][c];
  const g=floodB(b,r,c);
  const bulk=isBulk(tgt.color,g.length);
  const stamps=stampsFor(g,1,bulk);
  let leave=null;
  if(bulk&&crops[tgt.color].leaveBehind){
    let far=null,fd=-1;
    for(const q of g){if(q===tgt)continue;const d=Math.abs(q.r-r)+Math.abs(q.c-c);if(d>fd){fd=d;far=q;}}
    if(far)leave={r:far.r,c:far.c};
  }
  for(const q of g)b[q.r][q.c]=null;
  let cur={color:tgt.color,tier:Math.min(4,tgt.tier+(bulk?2:1)),r,c,stamps,craned:false};
  b[r][c]=cur;
  if(leave&&!b[leave.r][leave.c])b[leave.r][leave.c]={color:tgt.color,tier:1,r:leave.r,c:leave.c,stamps:[],craned:false};
  applyGravity(b);
  const landR=cur.r,landC=cur.c;
  let chain=1,pts=packScore(tgt.tier,g.length,1),matches=[];
  while(cur.tier<4){
    const g2=floodB(b,cur.r,cur.c);
    if(g2.length<2)break;
    if(chain===1)matches=g2.filter(q=>q!==cur).map(q=>({r:q.r,c:q.c}));
    chain++;
    const b2=isBulk(cur.color,g2.length),from=cur.tier;
    const s2=stampsFor(g2,chain,b2);
    for(const q of g2)b[q.r][q.c]=null;
    cur={color:cur.color,tier:Math.min(4,from+(b2?2:1)),r:cur.r,c:cur.c,stamps:s2,craned:false};
    b[cur.r][cur.c]=cur;applyGravity(b);
    pts+=packScore(from,g2.length,chain);
  }
  const finalStamps=cur.stamps.slice();
  if(cur.r>=ROWS-2&&finalStamps.indexOf('deep')<0)finalStamps.push('deep');
  return {group:live.map(q=>({r:q.r,c:q.c})),groupSize:live.length,bulk,
    landR,landC,tier:Math.min(4,src.tier+(bulk?2:1)),chain,matches,points:pts,
    color:src.color,stamps:finalStamps,finalTier:cur.tier};
}

/* ============================ FLOOR GUARANTEES =========================== */
function anyMove(){
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    const p=grid[r][c];if(!p)continue;
    if(p.tier>=4)return true;
    if(floodGrid(r,c).length>=2)return true;
  }
  return false;
}
function ensurePlayable(){
  if(anyMove())return;
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS-1;c++){
    const a=grid[r][c],b=grid[r][c+1];
    if(a&&b&&a.tier<4&&b.tier<4){b.color=a.color;b.tier=a.tier;b.flash=1;return;}
  }
}
function chainRoots(){
  const s=new Set();
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    const p=grid[r][c];if(!p||p.tier>=4)continue;
    const sim=simulate(r,c);
    if(sim&&sim.chain>1)s.add(p.id);
  }
  return s;
}
function ensureOpportunity(){
  if(cfg.noGuarantee)return;
  if(chainRoots().size)return;
  let best=null;
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    const p=grid[r][c];if(!p||p.tier>=4)continue;
    const s=simulate(r,c);
    if(s&&s.tier<4&&(!best||s.groupSize>best.s.groupSize))best={r,c,s};
  }
  if(!best)return;
  const inG=new Set(best.s.group.map(q=>q.r*COLS+q.c));
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    if(inG.has(r*COLS+c))continue;
    const p=grid[r][c];if(!p||p.tier>=4)continue;
    const oc=p.color,ot=p.tier;
    p.color=best.s.color;p.tier=best.s.tier;
    const s2=simulate(best.r,best.c);
    if(s2&&s2.chain>1){p.flash=1;p.pop=.55;return;}
    p.color=oc;p.tier=ot;
  }
}
function refreshRoots(){spotIds=run.chainsMade>=3?new Set():chainRoots();}

/* ============================ EFFECTS ==================================== */
function ring(x,y,color,max,width){rings.push({x,y,r:cell*.2,max,color,width:width||3,life:1});}
function burst(x,y,color,n,power){
  n=n||18;power=power||2;
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2,s=(.35+Math.random())*power;
    parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-.4,life:1,decay:.016+Math.random()*.018,
      size:cell*(.03+Math.random()*.07),color,rot:Math.random()*6.28,spin:(Math.random()-.5)*.4});
  }
  if(parts.length>620)parts.splice(0,parts.length-620);
}
function pop(x,y,text,color,size){floats.push({x,y,text,color:color||INK,size:size||16,life:1,vy:-.7});}

/* ============================ ORDERS ===================================== */
function newRandomOrder(){
  const tier=2+Math.floor(rng()*3);
  const stamp=rng()<.55?STAMP_IDS[Math.floor(rng()*STAMP_IDS.length)]:null;
  const count=tier>=4?1:(1+Math.floor(rng()*2));
  const o=ord(tier,count,stamp,0);
  o.reward=60*tier*count*(stamp?2:1);
  return o;
}
function freshOrder(){const o=newRandomOrder();o.have=0;return o;}
function registerPackage(p){
  for(const o of st.orders){
    if(o.have>=o.count)continue;
    if(o.tier!==p.tier)continue;
    if(o.stamp&&p.stamps.indexOf(o.stamp)<0)continue;
    o.have++;
    if(o.have>=o.count){
      sfxOrder();o.justDone=1.4;
      st.receipts+=o.reward||120*o.tier;
      pop(bxc(p.c),byr(p.r)-cell*.9,'ORDER FILLED',MINT,17);
      if(cfg.endless){const idx=st.orders.indexOf(o);setTimeout(()=>{if(st&&st.orders[idx])st.orders[idx]=freshOrder();},900);}
    }
    break;
  }
  const s=st.stretch;
  if(s&&s.have<s.count&&s.tier===p.tier&&(!s.stamp||p.stamps.indexOf(s.stamp)>=0)){
    s.have++;
    if(s.have>=s.count){
      st.receipts+=s.reward;sfxWin();flash=Math.max(flash,.3);
      pop(W/2,by+bh*.36,'STRETCH ORDER +'+s.reward,GOLD,20);
    }
  }
}
const ordersDone=()=>st.orders.every(o=>o.have>=o.count);

/* ============================ ACTIONS ==================================== */
function startStage(i){
  cfg=STAGES[i];run.stage=i;
  COLS=cfg.cols;ROWS=cfg.rows;layout();
  crops=(cfg.fixed||run.loadout).map(id=>CROPS[cropIndex(id)]);
  rng=mulberry32(cfg.seed+(cfg.endless?Math.floor(Math.random()*99999):0));
  colQ=Array.from({length:COLS},()=>[]);
  for(let c=0;c<COLS;c++)fillQ(c);
  const orders=(cfg.orders||[]).map(o=>Object.assign({},o,{have:0}));
  if(cfg.endless)while(orders.length<3)orders.push(freshOrder());
  if(hasGear('orderbook')&&orders.length)orders[0].have=Math.min(orders[0].have+1,orders[0].count);
  st={index:i,actions:0,receipts:0,bestChain:0,chains:0,setups:0,cashed:0,credit:0,trucks:0,fleet:0,
      forklift:cfg.forklift+(hasGear('gloves')?1:0),orders,lastChain:1,
      stretch:cfg.stretch?Object.assign({},cfg.stretch,{have:0}):null,
      done:false,redraw:1,apron:hasGear('apron')?1:0,pocket:null,armed:null,firstPack:false};
  busy=false;preview=null;down=null;flash=0;pendingSetup=new Set();
  crane={c:Math.floor(COLS/2),x:0,arm:0,armT:0,busy:false};
  crane.x=bxc(crane.c);
  buildBoard();
  screen='play';hint(cfg.teach,7);save();
}

async function attemptPack(r,c){
  if(busy||screen!=='play')return;
  const p=at(r,c);

  if(st.pocket){
    colQ[c].unshift({color:st.pocket.color,tier:st.pocket.tier,stamps:st.pocket.stamps});
    st.pocket=null;sfxOrder();
    pop(bxc(c),by-8,'DOWN CHUTE '+(c+1),CYAN,14);
    hint('It will arrive next time that column needs filling.');
    return;
  }
  if(!p)return;
  if(st.armed==='apron'){
    st.armed=null;st.pocket={color:p.color,tier:p.tier,stamps:p.stamps.slice()};
    grid[r][c]=null;st.apron--;st.actions++;busy=true;
    burst(bxc(c),byr(r),crops[p.color].light,16,2);sfxCrane();
    hint('Pocketed. Now tap a column to send it down that chute.',6);
    applyGravity(grid);await wait(220);await refill();busy=false;afterAction(false);
    return;
  }

  if(p.tier>=4){await dispatch(p);return;}
  const g=floodGrid(r,c);
  if(g.length<2){p.wig=1;sfxNo();hint('Packages only merge with touching produce of the same crop and the same size.');return;}

  const before=chainRoots();
  const wasSetupRoot=pendingSetup.has(p.id);
  busy=true;st.actions++;st.lastChain=1;
  crane.c=c;
  await doPack(g,p,1);
  await refill();
  busy=false;
  afterAction(st.lastChain>1,before,wasSetupRoot);
}

async function doPack(group,target,chainIdx){
  st.bestChain=Math.max(st.bestChain,chainIdx);
  st.lastChain=Math.max(st.lastChain,chainIdx);
  const from=target.tier,crop=crops[target.color];
  const bulk=isBulk(target.color,group.length);
  const stamps=stampsFor(group,chainIdx,bulk);
  let leave=null;
  if(bulk&&crop.leaveBehind){
    let far=null,fd=-1;
    for(const q of group){if(q===target)continue;const d=Math.abs(q.r-target.r)+Math.abs(q.c-target.c);if(d>fd){fd=d;far=q;}}
    if(far)leave={r:far.r,c:far.c};
  }
  sfxPack(from,chainIdx);
  for(const q of group){q.pop=.42+chainIdx*.09;q.flash=.85;}
  await wait(95);
  for(const q of group){
    if(q===target)continue;
    grid[q.r][q.c]=null;q.tR=target.r;q.tC=target.c;q.gone=true;flying.push(q);
  }
  await wait(140);flying.length=0;
  target.tier=Math.min(4,from+(bulk?2:1));
  target.stamps=stamps;target.craned=false;target.pop=1;target.flash=1;
  if(leave&&!grid[leave.r][leave.c]){
    const lp=makeP(target.color,1);
    lp.r=leave.r;lp.c=leave.c;lp.px=leave.c;lp.py=leave.r;lp.pop=.7;
    grid[leave.r][leave.c]=lp;
    pop(bxc(leave.c),byr(leave.r)-cell*.4,'LEFT BEHIND',crop.light,12);
  }
  const x=bxc(target.c),y=byr(target.r);
  burst(x,y,crop.main,12+group.length*4,1.4+target.tier*.35);
  ring(x,y,crop.light,cell*(1+target.tier*.3),2+target.tier);
  shakeAmt=Math.max(shakeAmt,2+target.tier+chainIdx);
  const pts=packScore(from,group.length,chainIdx);
  st.receipts+=pts;
  pop(x,y-cell*.36,'+'+pts,crop.light,15+Math.min(9,chainIdx*3));
  if(bulk)pop(x,y-cell*.8,'BULK ORDER',GOLD,14);
  if(chainIdx>1){
    pop(x,y-cell*1.02,'CHAIN \u00d7'+chainIdx,INK,15+chainIdx);
    flash=Math.max(flash,.08*chainIdx);
    st.chains++;run.chainsMade++;save();
    if(!run.seenChain){run.seenChain=true;hint('A chain: it landed touching a match, so it packed again.',7);}
  }
  if(target.tier===4){
    st.trucks++;
    if(!run.seenTruck){run.seenTruck=true;save();hint('A truck. Press it to send it out \u2014 it collects every '+crop.short+' on the floor.',7);}
    else hint('Truck loaded. Send it, or build a second one beside it for a fleet pickup.');
  }
  if(!st.firstPack&&st.index===0){st.firstPack=true;hint('It settled in the column you pressed, as low as the stack allows.',6);}
  await wait(140);
  applyGravity(grid);
  await wait(230);
  if(target.r>=ROWS-2&&target.stamps.indexOf('deep')<0)target.stamps.push('deep');
  registerPackage(target);
  if(target.tier<4){
    const next=floodGrid(target.r,target.c);
    if(next.length>=2){await wait(70);await doPack(next,target,chainIdx+1);}
  }
}

async function refill(){
  let any=false;
  for(let c=0;c<COLS;c++){
    let top=ROWS;
    for(let r=0;r<ROWS;r++)if(grid[r][c]){top=r;break;}
    let k=top;
    for(let r=top-1;r>=0;r--){
      const s=pull(c),p=makeP(s.color,s.tier,s.stamps);
      p.r=r;p.c=c;p.px=c;p.py=-k-.5;k--;grid[r][c]=p;any=true;
    }
  }
  if(any)tone(920,.05,'sine',.04);
  applyGravity(grid);
  await wait(280);
}

async function dispatch(truck){
  busy=true;st.actions++;crane.c=truck.c;
  const mate=[[truck.r-1,truck.c],[truck.r+1,truck.c],[truck.r,truck.c-1],[truck.r,truck.c+1]]
    .map(d=>at(d[0],d[1])).find(q=>q&&q.tier>=4);
  if(mate)await fleetRun(truck,mate);else await singleRun(truck);
  await refill();busy=false;afterAction(false);
}
async function singleRun(truck){
  const crop=crops[truck.color],doomed=[];
  truck.pop=1;truck.flash=1;ring(bxc(truck.c),byr(truck.r),crop.light,cell*1.6,4);
  await wait(180);
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){const q=grid[r][c];if(q&&q.color===truck.color)doomed.push(q);}
  sfxTruck();flash=.3;shakeAmt=Math.max(shakeAmt,16);
  let value=0;
  for(const q of doomed){
    grid[q.r][q.c]=null;value+=15*q.tier;
    burst(bxc(q.c),byr(q.r),crop.main,9,2.1);
    lines.push({x1:bxc(q.c),y1:byr(q.r),x2:bxc(truck.c),y2:byr(truck.r),color:crop.light,life:1});
  }
  st.receipts+=value;
  pop(bxc(truck.c),byr(truck.r)-cell*.5,'DISPATCHED +'+value,crop.light,19);
  await wait(240);applyGravity(grid);await wait(230);
}
async function fleetRun(a,b){
  sfxTruck();sfxWin();flash=.9;shakeAmt=Math.max(shakeAmt,24);
  hint('Fleet pickup \u2014 the whole floor goes out at once.');
  await wait(240);
  let value=0;
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    const q=grid[r][c];if(!q)continue;
    grid[r][c]=null;value+=18*q.tier;
    burst(bxc(c),byr(r),crops[q.color].main,9,2.6);
  }
  st.fleet++;st.trucks++;st.receipts+=value;
  pop(W/2,by+bh/2,'FLEET PICKUP +'+value,INK,26);
  await wait(260);
}

const inReach=c=>Math.abs(c-crane.c)<=craneReach();
async function doSwap(r1,c1,r2,c2){
  if(st.forklift<=0||busy)return;
  if(!inReach(c1)||!inReach(c2)){sfxNo();hint('The crane cannot reach that far. It parks where you last packed.');return;}
  const a=grid[r1][c1],b=grid[r2][c2];
  if(!a||!b)return;
  const before=chainRoots();
  busy=true;crane.busy=true;crane.c=c2;crane.armT=r2;
  sfxCrane();await wait(230);
  grid[r1][c1]=b;grid[r2][c2]=a;
  a.r=r2;a.c=c2;a.pop=.5;a.craned=true;
  b.r=r1;b.c=c1;b.pop=.5;b.craned=true;
  st.forklift--;st.actions++;
  pop(bxc(c2),byr(r2)-cell*.4,'CRANE',CYAN,13);
  await wait(160);crane.armT=0;crane.busy=false;
  applyGravity(grid);await wait(200);
  const after=chainRoots();
  let fresh=false;
  after.forEach(id=>{if(!before.has(id))fresh=true;});
  if(fresh&&hasGear('grease')){
    st.forklift++;sfxSetup();
    pop(bxc(c2),byr(r2)-cell*.9,'GREASE RAG \u2014 LOAD BACK',CYAN,12);
  }
  busy=false;
  afterAction(false,before,false);
}

/* --- setups: named after the fact, never advertised in advance --- */
function findPieceById(id){
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)if(grid[r][c]&&grid[r][c].id===id)return grid[r][c];
  return null;
}
function afterAction(madeChain,before,wasSetupRoot){
  ensurePlayable();ensureOpportunity();
  const after=chainRoots();
  if(wasSetupRoot&&madeChain){
    st.cashed++;st.credit++;sfxSetup();
    pop(W/2,by+bh*.2,'SETUP CASHED',GOLD,17);
    if(st.credit>=setupNeed()){
      st.credit=0;st.forklift++;
      pop(W/2,by+bh*.28,'+1 CRANE LOAD',CYAN,18);sfxWin();
    }
  }
  pendingSetup=new Set();
  if(before&&!madeChain&&st.index>0&&before.size<6){
    const freshIds=[];
    after.forEach(id=>{if(!before.has(id))freshIds.push(id);});
    if(freshIds.length){
      st.setups++;pendingSetup=new Set(freshIds);sfxSetup();
      const root=findPieceById(freshIds[0]);
      if(root)pop(bxc(root.c),byr(root.r)-cell*.55,'LINED UP',GOLD,13);
    }
  }
  spotIds=run.chainsMade>=3?new Set():after;
  if(!cfg.endless&&ordersDone()&&!st.done){st.done=true;sfxWin();hint('Every order filled. Close the shift, or keep packing.',6);}
  if(cfg.endless)st.done=true;
}

function closeShift(){
  run.total+=st.receipts;
  run.best[st.index]=Math.max(run.best[st.index]||0,st.receipts);
  if(hasGear('coldroom')){
    let best=null;
    for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
      const p=grid[r][c];
      if(p&&p.tier>=2&&p.tier<4&&(!best||p.tier>best.tier))best=p;
    }
    run.stored=best?{color:best.color,tier:best.tier,stamps:best.stamps.slice()}:null;
  }
  const unowned=GEAR.filter(g=>run.owned.indexOf(g.id)<0);
  cardOffer=shuffle(unowned.slice(),Math.random).slice(0,3);
  pickedCard=null;
  save();screen='result';
}
function takeCard(g){
  if(pickedCard)return;
  pickedCard=g.id;run.owned.push(g.id);
  if(!run.equip[g.slot])run.equip[g.slot]=g.id;
  sfxWin();save();
}
function advanceStage(){
  if(cfg.endless){screen='title';return;}
  const next=st.index+1;
  const unlockOrder=['berry','dragon','lemon'];
  if(next-1<unlockOrder.length){
    const id=unlockOrder[next-1];
    if(run.crops.indexOf(id)<0){run.crops.push(id);save();}
  }
  if(next>=STAGES.length-1){run.unlockedNight=true;save();screen='title';run.stage=Math.min(next,STAGES.length-1);return;}
  run.stage=next;save();
  if(STAGES[next].fixed){startStage(next);return;}
  loadPick=run.loadout.filter(id=>run.crops.indexOf(id)>=0).slice(0,STAGES[next].slots);
  screen='loadout';
}

/* ============================ PREVIEW ==================================== */
function buildPreview(r,c){
  const p=at(r,c);
  if(st.pocket)return {kind:'chute',r,c};
  if(!p)return null;
  if(p.tier>=4){
    const targets=[];let mate=false,value=0;
    for(const d of [[r-1,c],[r+1,c],[r,c-1],[r,c+1]]){const q=at(d[0],d[1]);if(q&&q.tier>=4)mate=true;}
    for(let rr2=0;rr2<ROWS;rr2++)for(let cc2=0;cc2<COLS;cc2++){
      const q=grid[rr2][cc2];if(q&&q.color===p.color){targets.push({r:rr2,c:cc2});value+=15*q.tier;}
    }
    return {kind:'dispatch',r,c,targets,mate,value,color:p.color};
  }
  const s=simulate(r,c);
  if(!s)return {kind:'invalid',r,c};
  s.kind='pack';s.r=r;s.c=c;s.setup=pendingSetup.has(p.id);
  return s;
}

/* ============================ ANIMATION ================================== */
function spring(p){
  const tr=p.tR!==null?p.tR:p.r,tc=p.tC!==null?p.tC:p.c;
  p.vy+=(tr-p.py)*.42;p.vy*=.7;p.py+=p.vy;
  p.vx+=(tc-p.px)*.42;p.vx*=.7;p.px+=p.vx;
  p.pop*=.86;p.flash*=.9;p.wig*=.9;
  if(p.gone)p.scale=Math.max(0,p.scale-.1);
}
function update(dt){
  t+=dt;
  if(st){
    crane.x+=(bxc(crane.c)-crane.x)*.18;
    crane.arm+=(crane.armT-crane.arm)*.24;
    for(const o of st.orders)if(o.justDone)o.justDone=Math.max(0,o.justDone-dt);
  }
  for(const row of grid)for(const p of row)if(p)spring(p);
  for(const p of flying)spring(p);
  for(let i=parts.length-1;i>=0;i--){const q=parts[i];q.x+=q.vx*cell*.06;q.y+=q.vy*cell*.06;q.vy+=.09;q.vx*=.985;q.rot+=q.spin;q.life-=q.decay;if(q.life<=0)parts.splice(i,1);}
  for(let i=rings.length-1;i>=0;i--){const q=rings[i];q.r+=(q.max-q.r)*.15;q.life-=.034;if(q.life<=0)rings.splice(i,1);}
  for(let i=floats.length-1;i>=0;i--){const q=floats[i];q.y+=q.vy;q.vy*=.97;q.life-=.014;if(q.life<=0)floats.splice(i,1);}
  for(let i=lines.length-1;i>=0;i--){lines[i].life-=.04;if(lines[i].life<=0)lines.splice(i,1);}
  shakeAmt*=.84;flash*=.87;if(hintTime>0)hintTime-=dt;
}

/* ============================ DRAW HELPERS =============================== */
function rr(x,y,w,h,r){ctx.beginPath();r=Math.min(r,w/2,h/2);ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();}
function txt(s,x,y,size,color,align,weight){ctx.font=(weight||700)+' '+size+'px ui-rounded,"Avenir Next","Segoe UI",system-ui,sans-serif';ctx.textAlign=align||'center';ctx.textBaseline='middle';ctx.fillStyle=color||INK;ctx.fillText(s,x,y);}
function tw(s,size,weight){ctx.font=(weight||700)+' '+size+'px ui-rounded,"Avenir Next","Segoe UI",system-ui,sans-serif';return ctx.measureText(s).width;}
function wrap(text,x,y,maxW,lh,size,color,align){
  ctx.font='600 '+size+'px ui-rounded,"Avenir Next","Segoe UI",system-ui,sans-serif';
  ctx.textAlign=align||'left';ctx.textBaseline='middle';ctx.fillStyle=color||INK;
  const words=text.split(' ');let line='';
  for(const w of words){const test=line?line+' '+w:w;if(ctx.measureText(test).width>maxW&&line){ctx.fillText(line,x,y);y+=lh;line=w;}else line=test;}
  if(line){ctx.fillText(line,x,y);y+=lh;}return y;
}

function drawFruit(crop,rad){
  ctx.save();
  const g=ctx.createRadialGradient(-rad*.28,-rad*.34,rad*.05,0,0,rad);
  g.addColorStop(0,crop.light);g.addColorStop(.42,crop.main);g.addColorStop(1,crop.dark);ctx.fillStyle=g;
  const s=crop.shape;
  if(s==='pear'){ctx.beginPath();ctx.ellipse(0,rad*.08,rad*.66,rad*.92,0,0,Math.PI*2);ctx.fill();}
  else if(s==='cluster'){for(const d of [[-.26,-.22,.4],[.26,-.22,.4],[-.42,.2,.38],[0,.18,.4],[.42,.2,.38],[0,.58,.36]]){ctx.beginPath();ctx.arc(d[0]*rad,d[1]*rad,rad*d[2],0,Math.PI*2);ctx.fill();}}
  else if(s==='lemon'){ctx.beginPath();ctx.ellipse(0,0,rad*.9,rad*.6,-.35,0,Math.PI*2);ctx.fill();}
  else if(s==='spiky'){
    ctx.beginPath();ctx.ellipse(0,0,rad*.68,rad*.9,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=crop.leaf;
    for(let i=0;i<5;i++){ctx.save();ctx.rotate(i*1.256+.5);ctx.beginPath();ctx.moveTo(0,-rad*.5);ctx.lineTo(rad*.24,-rad*.98);ctx.lineTo(-rad*.12,-rad*.86);ctx.closePath();ctx.fill();ctx.restore();}
  }
  else{ctx.beginPath();ctx.arc(0,0,rad*.84,0,Math.PI*2);ctx.fill();}
  if(s!=='spiky'){
    ctx.fillStyle=crop.leaf;ctx.fillRect(-rad*.07,-rad*.98,rad*.14,rad*.34);
    ctx.save();ctx.rotate(-.45);ctx.beginPath();ctx.ellipse(rad*.25,-rad*.72,rad*.36,rad*.17,0,0,Math.PI*2);ctx.fill();ctx.restore();
  }

function drawPack(crop,tier,base,phase){
  if(tier<=1){drawFruit(crop,base*.5);return;}
  if(tier===2){
    ctx.fillStyle='#4fe0f2';rr(-base*.7,-base*.16,base*1.4,base*.86,base*.18);ctx.fill();
    ctx.strokeStyle='#bcfbff';ctx.lineWidth=Math.max(1,base*.045);
    for(let i=-2;i<=2;i++){ctx.beginPath();ctx.moveTo(i*base*.25,-base*.1);ctx.lineTo(i*base*.19,base*.6);ctx.stroke();}
    ctx.save();ctx.translate(-base*.27,-base*.3);drawFruit(crop,base*.23);ctx.restore();
    ctx.save();ctx.translate(base*.25,-base*.28);drawFruit(crop,base*.23);ctx.restore();
    return;
  }
  if(tier===3){
    const g=ctx.createLinearGradient(-base,-base,base,base);g.addColorStop(0,'#6d86ff');g.addColorStop(1,'#3a2496');
    ctx.fillStyle=g;rr(-base*.74,-base*.58,base*1.48,base*1.16,7);ctx.fill();
    ctx.strokeStyle='#c1cdff';ctx.lineWidth=Math.max(1,base*.06);
    for(const y of [-.34,0,.34]){ctx.beginPath();ctx.moveTo(-base*.64,base*y);ctx.lineTo(base*.64,base*y);ctx.stroke();}
    ctx.fillStyle=crop.main;rr(-base*.33,-base*.2,base*.66,base*.4,5);ctx.fill();
    txt(crop.L,0,base*.02,base*.34,'#fff','center',900);
    return;
  }
  ctx.fillStyle='rgba(0,0,0,.25)';ctx.fillRect(-base*.78,base*.36,base*1.56,base*.16);
  ctx.fillStyle=crop.dark;rr(-base*.74,-base*.44,base*.96,base*.76,6);ctx.fill();
  ctx.fillStyle=crop.main;rr(-base*.67,-base*.37,base*.82,base*.58,5);ctx.fill();
  ctx.fillStyle='#e7f5ff';rr(base*.13,-base*.26,base*.53,base*.57,5);ctx.fill();
  ctx.fillStyle='#72d9ff';rr(base*.29,-base*.18,base*.24,base*.21,2);ctx.fill();
  ctx.fillStyle='#101f3c';
  for(const wx of [-base*.42,base*.44]){ctx.beginPath();ctx.arc(wx,base*.37,base*.16,0,Math.PI*2);ctx.fill();}
  ctx.fillStyle='#bdefff';
  for(const wx of [-base*.42,base*.44]){ctx.beginPath();ctx.arc(wx,base*.37,base*.06,0,Math.PI*2);ctx.fill();}
  ctx.fillStyle='rgba(255,255,255,'+(.45+.35*Math.sin(phase||0))+')';
  ctx.beginPath();ctx.moveTo(base*.66,0);ctx.lineTo(base*.84,-base*.1);ctx.lineTo(base*.84,base*.1);ctx.closePath();ctx.fill();
}
function drawStampPips(stamps,base){

}
function drawPiece(p,alpha){
  const x=bx+p.px*cell+cell/2,y=by+p.py*cell+cell/2;
  if(y<by-cell*2.5||y>by+bh+cell*2.5)return;
  const base=cell*.5,sc=p.scale*(1+p.pop*.4),crop=crops[p.color];
  ctx.save();ctx.globalAlpha=alpha===undefined?1:alpha;
  ctx.translate(x+p.wig*Math.sin(t*40)*cell*.07,y);ctx.scale(sc,sc*(1-p.pop*.15));
  if(p.flash>.02){
    const g=ctx.createRadialGradient(0,0,0,0,0,base*1.35);
    g.addColorStop(0,'rgba(255,255,255,'+(.08+p.flash*.24)+')');g.addColorStop(.45,crop.main+'55');g.addColorStop(1,crop.main+'00');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,base*1.35,0,Math.PI*2);ctx.fill();
  }
  if(isHang(p.color,p.tier)){
    ctx.strokeStyle='rgba(200,225,255,.4)';ctx.lineWidth=1.4;ctx.setLineDash([3,3]);
    ctx.beginPath();ctx.moveTo(-base*.8,base*.74);ctx.lineTo(base*.8,base*.74);ctx.stroke();ctx.setLineDash([]);

}

/* ---- the gantry: chutes, reach bracket, and the crane ---- */
function drawGantry(){
  const y0=by-gantryH-2,railY=y0+7;
  ctx.strokeStyle='rgba(150,225,255,.3)';ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(bx-8,railY);ctx.lineTo(bx+bw+8,railY);ctx.stroke();
  ctx.strokeStyle='rgba(150,225,255,.1)';ctx.lineWidth=1;
  for(let c=0;c<=COLS;c++){ctx.beginPath();ctx.moveTo(bx+c*cell,railY);ctx.lineTo(bx+c*cell,y0+gantryH);ctx.stroke();}

  if(st&&st.forklift>0){
    const reach=craneReach();
    const a=bx+Math.max(0,crane.c-reach)*cell,b=bx+Math.min(COLS,crane.c+reach+1)*cell;
    ctx.fillStyle='rgba(106,233,255,.07)';ctx.fillRect(a,railY+2,b-a,gantryH-8);
    ctx.strokeStyle='rgba(106,233,255,.25)';ctx.lineWidth=1;ctx.strokeRect(a+.5,railY+2.5,b-a-1,gantryH-9);
  }

  const depth=hasGear('clipboard')?3:1;
  for(let c=0;c<COLS;c++){
    const q=colQ[c]||[];
    for(let i=Math.min(depth,q.length)-1;i>=0;i--){
      const s=q[i];if(!s)continue;
      ctx.save();ctx.globalAlpha=i===0?.95:.32;
      ctx.translate(bx+c*cell+cell*.5+(i?(i%2?cell*.2:-cell*.2):0),y0+gantryH*.62-i*cell*.13);
      drawPack(crops[s.color],s.tier,i===0?cell*.3:cell*.18,0);
      ctx.restore();
    }
  }

  const cx=crane.x,cabY=railY;
  const armEnd=crane.arm>0.02?by+crane.arm*cell+cell*.5:cabY+gantryH*.55;
  ctx.strokeStyle='rgba(140,220,255,.5)';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(cx,cabY+6);ctx.lineTo(cx,armEnd-cell*.2);ctx.stroke();
  ctx.fillStyle='#0d2b58';rr(cx-cell*.3,cabY-9,cell*.6,18,5);ctx.fill();
  ctx.strokeStyle=CYAN;ctx.lineWidth=1.4;rr(cx-cell*.3,cabY-9,cell*.6,18,5);ctx.stroke();
  ctx.fillStyle=CYAN;rr(cx-cell*.15,cabY-5,cell*.3,10,3);ctx.fill();
  ctx.strokeStyle=CYAN;ctx.lineWidth=2;
  ctx.beginPath();ctx.arc(cx,armEnd-cell*.14,cell*.12,.5,2.64);ctx.stroke();
  ctx.beginPath();ctx.arc(cx,armEnd-cell*.14,cell*.12,3.64,5.78);ctx.stroke();
}

function drawPreview(){
  const pv=preview;if(!pv)return;
  if(pv.kind==='chute'){
    ctx.fillStyle='rgba(106,233,255,.1)';ctx.fillRect(bx+pv.c*cell,by,cell,bh);
    ctx.strokeStyle=CYAN;ctx.lineWidth=2;ctx.strokeRect(bx+pv.c*cell+1,by+1,cell-2,bh-2);
    txt('SEND DOWN THIS CHUTE',bxc(pv.c),by+bh*.5,10.5,CYAN,'center',900);
    return;
  }
  if(pv.kind==='invalid'){
    ctx.strokeStyle='rgba(255,150,160,.85)';ctx.lineWidth=2.4;
    rr(bx+pv.c*cell+3,by+pv.r*cell+3,cell-6,cell-6,9);ctx.stroke();
    txt('no match touching',bxc(pv.c),by+pv.r*cell-6,11,'rgba(255,180,190,.9)','center',800);
    return;
  }
  if(pv.kind==='move'){
    const ok=inReach(pv.c)&&inReach(pv.to.c)&&st.forklift>0;
    const col=ok?CYAN:'rgba(255,150,160,.9)';
    const a={x:bxc(pv.c),y:byr(pv.r)},b={x:bxc(pv.to.c),y:byr(pv.to.r)};
    ctx.strokeStyle=col;ctx.lineWidth=2.5;
    rr(bx+pv.c*cell+3,by+pv.r*cell+3,cell-6,cell-6,9);ctx.stroke();
    rr(bx+pv.to.c*cell+3,by+pv.to.r*cell+3,cell-6,cell-6,9);ctx.stroke();
    ctx.setLineDash([5,5]);ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();ctx.setLineDash([]);
    txt(ok?'CRANE SWAP':'OUT OF REACH',(a.x+b.x)/2,(a.y+b.y)/2-cell*.55,12,col,'center',900);
    return;
  }
  if(pv.kind==='dispatch'){
    const crop=crops[pv.color];
    for(const q of pv.targets){
      ctx.strokeStyle=crop.light;ctx.globalAlpha=.5+.25*Math.sin(t*7);ctx.lineWidth=2;
      ctx.beginPath();ctx.arc(bxc(q.c),byr(q.r),cell*.42,0,Math.PI*2);ctx.stroke();ctx.globalAlpha=1;
    }
    txt(pv.mate?'FLEET PICKUP \u2014 CLEARS THE FLOOR':'COLLECTS '+pv.targets.length+' \u00b7 +'+pv.value,
      bxc(pv.c),by+pv.r*cell-8,11.5,pv.mate?GOLD:crop.light,'center',900);
    return;
  }

  ctx.save();
  ctx.setLineDash([4,4]);ctx.lineWidth=1.8;ctx.strokeStyle='rgba(255,255,255,.75)';
  for(const q of pv.group)rr(bx+q.c*cell+4,by+q.r*cell+4,cell-8,cell-8,9);
  ctx.stroke();ctx.setLineDash([]);

  const sx=bxc(pv.c),sy=byr(pv.r),lx=bxc(pv.landC),ly=byr(pv.landR);
  if(pv.landR!==pv.r||pv.landC!==pv.c){
    ctx.strokeStyle='rgba(255,255,255,.4)';ctx.lineWidth=2;ctx.setLineDash([3,6]);
    ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(lx,ly-cell*.3);ctx.stroke();ctx.setLineDash([]);
    ctx.fillStyle='rgba(255,255,255,.6)';
    ctx.beginPath();ctx.moveTo(lx-cell*.11,ly-cell*.36);ctx.lineTo(lx+cell*.11,ly-cell*.36);ctx.lineTo(lx,ly-cell*.18);ctx.closePath();ctx.fill();
  }
  ctx.globalAlpha=.55+.15*Math.sin(t*6);
  ctx.save();ctx.translate(lx,ly);drawPack(crops[pv.color],pv.tier,cell*.5,t*6);ctx.restore();
  ctx.globalAlpha=1;
  ctx.strokeStyle='#fff';ctx.lineWidth=2.4;ctx.setLineDash([6,4]);
  rr(bx+pv.landC*cell+3,by+pv.landR*cell+3,cell-6,cell-6,9);ctx.stroke();ctx.setLineDash([]);

  for(const m of pv.matches){
    ctx.strokeStyle=GOLD;ctx.lineWidth=2.6;ctx.globalAlpha=.65+.3*Math.sin(t*8);
    ctx.beginPath();ctx.arc(bxc(m.c),byr(m.r),cell*.4,0,Math.PI*2);ctx.stroke();
    ctx.setLineDash([4,4]);ctx.beginPath();ctx.moveTo(lx,ly);ctx.lineTo(bxc(m.c),byr(m.r));ctx.stroke();ctx.setLineDash([]);
    ctx.globalAlpha=1;
  }

  let label=tierName(pv.tier).toUpperCase();
  if(pv.bulk)label='BULK '+label;
  if(pv.setup)label='\u2726 '+label;
  const sub=pv.chain>1?('CHAIN \u00d7'+pv.chain+'  \u00b7  +'+pv.points):('+'+pv.points);
  const lensOn=hasGear('lens')&&pv.stamps.length>0;
  const stampLine=lensOn?pv.stamps.map(s=>STAMPS[s].name).join('  '):'';
  const boxW=Math.max(tw(label,12,900),tw(sub,12,800),lensOn?tw(stampLine,9,900)+16:0)+20;
  const boxH=lensOn?38:26;
  let py=by+pv.landR*cell-(lensOn?32:24);
  if(py<by+4)py=by+pv.landR*cell+cell+10;
  ctx.fillStyle='rgba(6,16,38,.88)';rr(lx-boxW/2,py-13,boxW,boxH,8);ctx.fill();
  ctx.strokeStyle=pv.chain>1?GOLD:'rgba(255,255,255,.3)';ctx.lineWidth=1.4;rr(lx-boxW/2,py-13,boxW,boxH,8);ctx.stroke();
  txt(label,lx,py-4,11,INK,'center',900);
  txt(sub,lx,py+7,11,pv.chain>1?GOLD:DIM,'center',800);
  if(lensOn){
    let sx2=lx-boxW/2+10;
    for(const s of pv.stamps){
      ctx.fillStyle=STAMPS[s].col;ctx.beginPath();ctx.arc(sx2+3,py+18,3,0,Math.PI*2);ctx.fill();
      txt(STAMPS[s].name,sx2+9,py+18,8,STAMPS[s].col,'left',900);
      sx2+=13+tw(STAMPS[s].name,8,900);
    }
  }
  ctx.restore();
}

function drawBoard(){

  for(let r=1;r<ROWS;r++){ctx.beginPath();ctx.moveTo(bx,by+r*cell);ctx.lineTo(bx+bw,by+r*cell);ctx.stroke();}
  for(let c=1;c<COLS;c++){ctx.beginPath();ctx.moveTo(bx+c*cell,by);ctx.lineTo(bx+c*cell,by+bh);ctx.stroke();}

  drawGantry();

  ctx.save();ctx.beginPath();rr(bx-2,by-2,bw+4,bh+4,12);ctx.clip();

    for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){

      ctx.beginPath();ctx.arc(bxc(c),byr(r)+cell*.34,cell*.07,0,Math.PI*2);ctx.stroke();ctx.globalAlpha=1;
    }
  }
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)if(grid[r][c]){
    let a=1;
    if(preview&&preview.kind==='pack'&&preview.group.some(q=>q.r===r&&q.c===c))a=.5;

  ctx.globalAlpha=1;
  for(const rg of rings){ctx.globalAlpha=rg.life*.85;ctx.strokeStyle=rg.color;ctx.lineWidth=rg.width;ctx.beginPath();ctx.arc(rg.x,rg.y,rg.r,0,Math.PI*2);ctx.stroke();}
  for(const p of parts){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.color;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillRect(-p.size*.5,-p.size*.22,p.size,p.size*.44);ctx.restore();}
  ctx.globalAlpha=1;ctx.restore();
  for(const f of floats){ctx.globalAlpha=Math.max(0,Math.min(1,f.life*1.6));txt(f.text,f.x,f.y,f.size,f.color,'center',900);}
  ctx.globalAlpha=1;ctx.restore();
}

        ctx.fillStyle='rgba(255,255,255,.05)';rr(x,y+h*.1,wEach,h*.8,9);ctx.fill();
        ctx.strokeStyle='rgba(255,255,255,.13)';ctx.lineWidth=1;rr(x,y+h*.1,wEach,h*.8,9);ctx.stroke();
        txt(p.label,x+wEach/2,y+h*.5,11,p.col,'center',900);
      }
    }
  }
  if(hintTime>0){ctx.globalAlpha=Math.min(1,hintTime);wrap(hintText,W/2,hintY,W-28,13,11.5,DIM,'center');ctx.globalAlpha=1;}
}
function drawPlay(){
  drawBoard();drawHud();drawBottom();
  if(flash>.01){ctx.fillStyle='rgba(255,255,255,'+Math.min(.8,flash)+')';ctx.fillRect(0,0,W,H);}
}

/* ============================ SCREENS ==================================== */
function drawTitle(){
  const cx=W/2,cy=H*.22;
  for(let i=0;i<4;i++){
    const a=t*.5+i*Math.PI/2,x=cx+Math.cos(a)*Math.min(W,H)*.22,y=cy+Math.sin(a)*Math.min(W,H)*.08;

function drawLoadout(){
  const cx=W/2,slots=STAGES[run.stage].slots;
  txt('PICK YOUR CROPS',cx,36+ST,19,INK,'center',900);
  txt('Choose '+slots+' for shift '+(run.stage+1)+'. They decide how the floor behaves.',cx,58+ST,10.5,DIM,'center',650);
  const list=run.crops.map(id=>CROPS[cropIndex(id)]);
  const avail=H-(80+ST)-84;
  const cardH=Math.max(46,Math.min(64,avail/Math.max(3,list.length)-7));

    buttons.push({id:'crop:'+crop.id,x,y,w,h:cardH,disabled:false});
    ctx.fillStyle=on?'rgba(106,233,255,.14)':'rgba(255,255,255,.05)';rr(x,y,w,cardH,11);ctx.fill();
    ctx.strokeStyle=on?'rgba(160,248,255,.85)':'rgba(255,255,255,.12)';ctx.lineWidth=on?2:1;rr(x,y,w,cardH,11);ctx.stroke();
    ctx.save();ctx.translate(x+28,y+cardH*.5);drawFruit(crop,14);ctx.restore();
    txt(crop.name,x+52,y+cardH*.3,12,INK,'left',900);
    txt(crop.axis,x+w-12,y+cardH*.3,9,on?CYAN:FAINT,'right',900);
    wrap(crop.rule,x+52,y+cardH*.62,w-70,11,10,DIM,'left');
    y+=cardH+7;
  }

  button('golive',cx-Math.min(260,W*.7)/2,Math.min(H-64,y+6),Math.min(260,W*.7),48,
    ok?'START SHIFT':'PICK '+(slots-loadPick.length)+' MORE',{primary:ok,disabled:!ok,size:15});
}

function drawResult(){
  drawBoard();ctx.fillStyle='rgba(5,10,29,.91)';ctx.fillRect(0,0,W,H);buttons=[];
  const cx=W/2;let y=H*.1;
  txt('SHIFT COMPLETE',cx,y,Math.min(26,W*.068),INK,'center',900);y+=26;
  txt(cfg.name,cx,y,12,DIM,'center',650);y+=28;
  const stats=[['Receipts',st.receipts.toLocaleString()],['Actions',st.actions],
    ['Chains',st.chains],['Lined up',st.setups],['Setups cashed',st.cashed],
    ['Longest chain','\u00d7'+Math.max(1,st.bestChain)],['Trucks sent',st.trucks]];
  for(const s of stats){txt(s[0],cx-8,y,11.5,DIM,'right',650);txt(String(s[1]),cx+8,y,12,INK,'left',900);y+=18;}
  y+=8;
  if(!pickedCard&&cardOffer.length){
    txt('TAKE ONE FROM THE LOCKER',cx,y,11.5,CYAN,'center',900);y+=18;
    const n=cardOffer.length,cw=Math.min(112,(W-40)/n),x0=(W-cw*n-8*(n-1))/2,ch=Math.min(118,H*.185);
    for(let i=0;i<n;i++){
      const g=cardOffer[i],x=x0+i*(cw+8);
      buttons.push({id:'card:'+g.id,x,y,w:cw,h:ch,disabled:false});
      ctx.fillStyle='rgba(255,255,255,.06)';rr(x,y,cw,ch,10);ctx.fill();
      ctx.strokeStyle='rgba(255,255,255,.2)';ctx.lineWidth=1.2;rr(x,y,cw,ch,10);ctx.stroke();
      txt(g.slot,x+cw/2,y+13,8.5,CYAN,'center',900);
      txt(g.name,x+cw/2,y+30,10,INK,'center',900);
      wrap(g.desc,x+7,y+50,cw-14,11,9,DIM,'left');
    }
    y+=ch+10;
  }else if(pickedCard){
    const g=gearById(pickedCard);
    txt('ADDED TO YOUR KIT',cx,y,10.5,FAINT,'center',800);y+=17;
    txt(g.name,cx,y,14,CYAN,'center',900);y+=16;
    y=wrap(g.desc,24,y,W-48,12,10.5,DIM,'left')+6;
  }else{txt('Locker empty \u2014 you own it all.',cx,y,11,FAINT,'center',650);y+=22;}
  const w=Math.min(280,W*.72);
  const blocked=!pickedCard&&cardOffer.length>0;
  button('next',cx-w/2,Math.min(H-104,y+2),w,48,cfg.endless?'BACK TO TITLE':'NEXT SHIFT',{primary:true,size:15,disabled:blocked});
  button('replay',cx-w/2,Math.min(H-50,y+56),w,36,'REPLAY THIS SHIFT',{size:12});
}

function drawKit(){
  const cx=W/2;txt('KIT & CROPS',cx,34+ST,18,INK,'center',900);
  txt('Gear changes what the crane can do. Crops change how the floor behaves.',cx,55+ST,10,DIM,'center',650);
  let y=74+ST;
  for(const slot of SLOTS){
    txt(slot,16,y,10,CYAN,'left',900);y+=14;
    const items=GEAR.filter(g=>g.slot===slot),n=items.length,cw=(W-32-8*(n-1))/n,hh=52;
    for(let i=0;i<n;i++){
      const g=items[i],owned=run.owned.indexOf(g.id)>=0,on=run.equip[slot]===g.id,x=16+i*(cw+8);
      if(owned)buttons.push({id:'equip:'+g.id,x,y,w:cw,h:hh,disabled:false});
      ctx.globalAlpha=owned?1:.3;
      ctx.fillStyle=on?'rgba(106,233,255,.16)':'rgba(255,255,255,.05)';rr(x,y,cw,hh,9);ctx.fill();
      ctx.strokeStyle=on?'rgba(160,248,255,.85)':'rgba(255,255,255,.12)';ctx.lineWidth=on?2:1;rr(x,y,cw,hh,9);ctx.stroke();
      txt(owned?g.name:'LOCKED',x+cw/2,y+14,9,owned?INK:FAINT,'center',900);
      if(owned)wrap(g.desc,x+6,y+30,cw-12,9.5,8,DIM,'left');
      ctx.globalAlpha=1;
    }
    y+=62;
  }
  txt('CROPS',16,y,10,CYAN,'left',900);y+=14;
  const cn=CROPS.length,cw2=(W-32-6*(cn-1))/cn;
  for(let i=0;i<cn;i++){
    const crop=CROPS[i],has=run.crops.indexOf(crop.id)>=0,x=16+i*(cw2+6);
    ctx.globalAlpha=has?1:.26;
    ctx.fillStyle='rgba(255,255,255,.05)';rr(x,y,cw2,48,9);ctx.fill();
    ctx.save();ctx.translate(x+cw2/2,y+17);drawFruit(crop,11);ctx.restore();
    txt(has?crop.axis:'?',x+cw2/2,y+38,7.5,has?CYAN:FAINT,'center',900);
    ctx.globalAlpha=1;
  }
  y+=58;
  button('back',cx-Math.min(230,W*.6)/2,Math.min(H-58,y),Math.min(230,W*.6),42,'BACK',{primary:true,size:14});

function drawGuide(){
  if(prevScreen==='play'&&st)drawBoard();
  ctx.fillStyle='rgba(5,10,29,.95)';ctx.fillRect(0,0,W,H);buttons=[];
  const cx=W/2;txt('HOW PACKING WORKS',cx,32+ST,16,INK,'center',900);
  let y=58+ST;
  const lw=Math.min(W-40,300),lx=cx-lw/2;
  for(let i=0;i<4;i++){
    const x=lx+lw*(i+.5)/4;
    ctx.save();ctx.translate(x,y+11);drawPack(CROPS[0],i+1,16,t*6);ctx.restore();
    txt(['produce','basket','crate','truck'][i],x,y+33,8.5,DIM,'center',700);
    if(i<3)txt('\u2192',lx+lw*(i+1)/4,y+11,12,FAINT,'center',900);
  }
  y+=54;
  const rows=[
    ['PRESS','Hold a piece to see its group, the exact landing cell, what it will chain with, and the score. Release to pack, drag away to cancel.'],
    ['LANDING','The package settles in the column you pressed, as low as the stack allows. Choosing the column is the whole game.'],
    ['CHAIN','Land it touching a matching package of the same size and it packs again, immediately.'],
    ['LINED UP','A move that makes no chain but leaves one ready is a setup. Cash setups in for crane loads.'],
    ['CRANE','Drag a piece onto a neighbour to swap them. The crane parks where you last packed, and only reaches so far.'],
    ['CROPS','Each crop bends one rule of the floor. You choose which turn up before the shift.'],
    ['STAMPS','How a package was made leaves a stamp, and orders ask for stamps. There is always more than one route.']
  ];
  for(const r of rows){txt(r[0],18,y,10.5,CYAN,'left',900);y+=14;y=wrap(r[1],18,y,W-36,12,10,DIM,'left')+5;}
  y+=2;
  for(const id of STAMP_IDS){
    ctx.fillStyle=STAMPS[id].col;ctx.beginPath();ctx.arc(22,y,4,0,Math.PI*2);ctx.fill();
    txt(STAMPS[id].name,32,y,9.5,STAMPS[id].col,'left',900);
    txt(STAMPS[id].how,34+tw(STAMPS[id].name,9.5,900)+6,y,9.5,DIM,'left',600);
    y+=15;
  }
  button('closeGuide',cx-Math.min(220,W*.6)/2,Math.min(H-56,y+4),Math.min(220,W*.6),42,'BACK',{primary:true,size:14});
}

/* ============================ INPUT ====================================== */
function pos(e){const r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top};}
function cellAt(x,y){if(x<bx||x>=bx+bw||y<by||y>=by+bh)return null;return{r:Math.floor((y-by)/cell),c:Math.floor((x-bx)/cell)};}
function btnAt(x,y){for(let i=buttons.length-1;i>=0;i--){const b=buttons[i],p=5;if(x>=b.x-p&&x<=b.x+b.w+p&&y>=b.y-p&&y<=b.y+b.h+p)return b;}return null;}

function onDown(e){
  e.preventDefault();initAudio();
  const q=pos(e),b=btnAt(q.x,q.y);
  if(b){pressBtn=b.id;down={btn:b.id};tone(660,.05,'triangle',.07);return;}
  if(screen!=='play'||busy)return;
  const g=cellAt(q.x,q.y);if(!g)return;
  down={x:q.x,y:q.y,r:g.r,c:g.c,mode:'pack',to:null};
  preview=buildPreview(g.r,g.c);
  const p=at(g.r,g.c);if(p)p.pop=Math.max(p.pop,.2);
  sfxTap();
}
function onMove(e){
  if(!down||down.btn||screen!=='play'||!st)return;
  const q=pos(e),dx=q.x-down.x,dy=q.y-down.y;
  if(Math.sqrt(dx*dx+dy*dy)>cell*.5&&!st.pocket&&!st.armed){
    const g=cellAt(q.x,q.y);
    if(g&&Math.abs(g.r-down.r)+Math.abs(g.c-down.c)===1&&st.forklift>0){
      if(down.mode!=='move'||!down.to||down.to.r!==g.r||down.to.c!==g.c){
        down.mode='move';down.to=g;preview={kind:'move',r:down.r,c:down.c,to:g};sfxTap();
      }
      return;
    }
  }
  if(down.mode==='move'){down.mode='pack';down.to=null;preview=buildPreview(down.r,down.c);}
}
function onUp(e){
  const d=down;down=null;pressBtn=null;
  if(!d)return;
  const q=pos(e);
  if(d.btn){const b=btnAt(q.x,q.y);if(b&&b.id===d.btn&&!b.disabled)handleBtn(b.id);preview=null;return;}
  preview=null;
  if(screen!=='play'||busy)return;
  if(d.mode==='move'&&d.to){doSwap(d.r,d.c,d.to.r,d.to.c);return;}
  const g=cellAt(q.x,q.y);
  if(g&&g.r===d.r&&g.c===d.c)attemptPack(d.r,d.c);
}
function handleBtn(id){
  if(id.indexOf('crop:')===0){
    const cid=id.slice(5),i=loadPick.indexOf(cid);
    if(i>=0)loadPick.splice(i,1);
    else if(loadPick.length<STAGES[run.stage].slots)loadPick.push(cid);
    sfxTap();return;
  }
  if(id.indexOf('card:')===0){const g=gearById(id.slice(5));if(g)takeCard(g);return;}
  if(id.indexOf('equip:')===0){
    const g=gearById(id.slice(6));
    if(g&&run.owned.indexOf(g.id)>=0){run.equip[g.slot]=run.equip[g.slot]===g.id?null:g.id;save();sfxTap();}
    return;
  }
  if(id==='start'){
    const s=STAGES[run.stage];
    if(s.fixed){startStage(run.stage);return;}
    loadPick=run.loadout.filter(x=>run.crops.indexOf(x)>=0).slice(0,s.slots);
    screen='loadout';return;
  }
  if(id==='golive'){
    if(loadPick.length!==STAGES[run.stage].slots)return;
    run.loadout=loadPick.slice();save();startStage(run.stage);return;
  }
  if(id==='night'){run.stage=STAGES.length-1;loadPick=run.loadout.filter(x=>run.crops.indexOf(x)>=0).slice(0,3);screen='loadout';return;}
  if(id==='reset'){
    run={stage:0,total:0,chainsMade:0,best:{},seenChain:false,seenTruck:false,
      crops:['apple','orange','pear'],owned:[],equip:{HANDS:null,EYES:null,POCKETS:null},
      loadout:['apple','orange','pear'],stored:null,unlockedNight:false};
    save();startStage(0);return;
  }
  if(id==='kit'){prevScreen=screen;screen='kit';return;}
  if(id==='guide'){prevScreen=screen;screen='guide';return;}
  if(id==='closeGuide'||id==='back'){screen=prevScreen==='play'?'play':'title';return;}
  if(id==='mute'){muted=!muted;if(master)master.gain.value=muted?0:.4;return;}
  if(id==='restart'||id==='replay'){startStage(st.index);return;}
  if(id==='next'){advanceStage();return;}
  if(id==='close'){closeShift();return;}
  if(id.indexOf('order:')===0){
    const i=parseInt(id.slice(6),10);
    if(st.redraw>0&&st.orders[i]&&st.orders[i].have<st.orders[i].count){
      st.orders[i]=freshOrder();st.redraw--;sfxOrder();
      hint('Order swapped. That was your one redraw this shift.');
    }
    return;
  }
  if(id==='apron'){st.armed=st.armed==='apron'?null:'apron';hint('Tap the piece you want to pocket.');return;}
}

cv.addEventListener('pointerdown',onDown,{passive:false});
cv.addEventListener('pointermove',onMove,{passive:false});
cv.addEventListener('pointerup',onUp,{passive:false});
cv.addEventListener('pointercancel',()=>{down=null;pressBtn=null;preview=null;});
cv.addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('keydown',e=>{
  initAudio();const k=e.key;
  if(screen==='title'&&(k==='Enter'||k===' '))handleBtn('start');
  else if(screen==='guide'&&(k==='Escape'||k==='Enter'||k===' '))handleBtn('closeGuide');
  else if(screen==='kit'&&(k==='Escape'||k==='Enter'))handleBtn('back');
  else if(screen==='result'&&k==='Enter')handleBtn('next');
  else if(screen==='play'){
    const kl=k.toLowerCase();
    if(kl==='i'){prevScreen='play';screen='guide';}
    else if(kl==='r')handleBtn('restart');
    else if(kl==='m')handleBtn('mute');
    else if(kl==='f'&&st&&st.done)handleBtn('close');
  }
});

/* ============================ FRAME ====================================== */
let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  update(dt);buttons=[];drawBg();
  if(screen==='title')drawTitle();
  else if(screen==='loadout')drawLoadout();
  else if(screen==='play')drawPlay();
  else if(screen==='result')drawResult();
  else if(screen==='kit')drawKit();
  else if(screen==='guide')drawGuide();
  requestAnimationFrame(frame);
}

measureSafe();load();
cfg=STAGES[Math.min(run.stage,STAGES.length-1)];
COLS=cfg.cols;ROWS=cfg.rows;
crops=(cfg.fixed||run.loadout).map(id=>CROPS[cropIndex(id)]);
resize();requestAnimationFrame(frame);
</script>
