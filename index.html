<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#91c7d1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="data:,">
<title>The Little Digger</title>
<style>
  :root {
    color-scheme:dark;
    --cream:#fff8dc;
    --ink:#233a38;
    --glass:rgba(31,52,48,.72);
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body {
    width:100%; height:100%; margin:0; overflow:hidden; overscroll-behavior:none;
    background:#91c7d1; touch-action:none; -webkit-user-select:none; user-select:none;
    font-family:Georgia,serif;
  }
  canvas { position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; }
  #top {
    position:fixed; z-index:3;
    top:max(10px,env(safe-area-inset-top));
    left:max(12px,env(safe-area-inset-left));
    right:max(12px,env(safe-area-inset-right));
    display:flex; justify-content:space-between; align-items:flex-start; gap:12px;
    color:var(--cream); pointer-events:none;
    text-shadow:0 2px 7px rgba(25,47,46,.7);
  }
  #place small,#hunt small { display:block; font:700 9px/1.2 ui-monospace,monospace; letter-spacing:.13em; text-transform:uppercase; opacity:.8; }
  #place b { display:block; margin-top:3px; font-size:clamp(20px,4vw,32px); line-height:.9; letter-spacing:-.035em; }
  #hunt { text-align:right; }
  #hunt b { display:block; margin-top:2px; font:700 clamp(20px,4vw,30px)/1 ui-monospace,monospace; }
  #finds {
    position:fixed; z-index:3;
    right:max(12px,env(safe-area-inset-right));
    top:calc(max(10px,env(safe-area-inset-top)) + 51px);
    padding:6px 9px; border:1px solid rgba(255,255,255,.18); border-radius:999px;
    color:#f9f0ce; background:rgba(32,51,47,.5);
    font:700 9px/1 ui-monospace,monospace; letter-spacing:.08em; pointer-events:none;
  }
  #call {
    position:fixed; z-index:4; left:50%; top:25%;
    transform:translate(-50%,-50%) scale(.86); opacity:0;
    color:#314d46; background:rgba(255,248,218,.94);
    border:2px solid rgba(53,82,73,.25); border-radius:50%;
    padding:14px 18px; min-width:82px; text-align:center;
    box-shadow:0 9px 26px rgba(31,57,53,.24);
    font:700 clamp(15px,4vw,24px)/1 Georgia,serif; pointer-events:none;
    transition:opacity .16s ease,transform .16s ease;
  }
  #call::after {
    content:""; position:absolute; left:44%; bottom:-9px; width:16px; height:16px;
    background:inherit; transform:rotate(45deg); border-right:2px solid rgba(53,82,73,.18);
    border-bottom:2px solid rgba(53,82,73,.18);
  }
  #call.show { opacity:1; transform:translate(-50%,-50%) scale(1); }
  #start {
    position:fixed; inset:0; z-index:8; display:grid; place-items:center; padding:26px;
    color:#fff7dc; text-align:center; background:
      linear-gradient(rgba(40,70,66,.08),rgba(25,49,46,.28));
  }
  #start .card {
    width:min(390px,88vw); padding:25px 22px 21px;
    border:1px solid rgba(255,255,255,.27); border-radius:25px;
    background:rgba(37,61,56,.7); box-shadow:0 24px 70px rgba(26,51,49,.33);
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  }
  #start h1 { margin:0; font-size:clamp(29px,8vw,47px); line-height:.84; letter-spacing:-.055em; }
  #start p { margin:14px auto 17px; max-width:280px; font:10px/1.6 ui-monospace,monospace; letter-spacing:.06em; opacity:.82; }
  #start button {
    min-width:170px; min-height:54px; border:0; border-radius:16px;
    color:#29413c; background:#f1ca72; box-shadow:0 7px 20px rgba(20,40,38,.3);
    font:700 12px/1 ui-monospace,monospace; letter-spacing:.12em; text-transform:uppercase;
  }
  #rotate {
    position:fixed; z-index:7; inset:0; display:none; place-items:center; padding:40px;
    color:#fff7dc; background:#294440; text-align:center;
    font:700 13px/1.6 ui-monospace,monospace; letter-spacing:.08em;
  }
  @media (max-width:330px) {
    #place b { font-size:18px; }
    #finds { top:55px; }
  }
</style>
</head>
<body>
<canvas id="game" aria-label="The Little Digger playable map"></canvas>
<div id="top">
  <div id="place"><small>mossbell meadow</small><b>The Little Digger</b></div>
  <div id="hunt"><small>this outing</small><b id="clock">1:40</b></div>
</div>
<div id="finds">0 keepsakes</div>
<div id="call" role="status"></div>
<div id="start">
  <div class="card">
    <h1>The Little<br>Digger</h1>
    <p>left thumb wanders · right thumb digs<br>each miss is a clue</p>
    <button id="play">Enter the meadow</button>
  </div>
</div>
<div id="rotate">Turn your phone if you like —<br>the meadow works both ways.</div>
<script>
"use strict";

const canvas = document.querySelector("#game");
const ctx = canvas.getContext("2d", { alpha:false });
const callout = document.querySelector("#call");
const clockEl = document.querySelector("#clock");
const findsEl = document.querySelector("#finds");
const coarse = matchMedia("(pointer:coarse)").matches || "ontouchstart" in window;
const TAU = Math.PI * 2;
const clamp = (v,a,b) => Math.max(a,Math.min(b,v));
const lerp = (a,b,t) => a+(b-a)*t;
const smooth = t => t*t*(3-2*t);
const hash = (a,b=0) => {
  const n = Math.sin(a*127.1+b*311.7)*43758.5453;
  return n-Math.floor(n);
};

let W=0,H=0,DPR=1,horizon=0,scale=1;
let started=false,last=performance.now(),time=0,frameCount=0,fps=60;
let savedFinds=Number(localStorage.getItem("little-digger-finds")||0);

const world = { minX:-78,maxX:78,minZ:-58,maxZ:82 };
const player = {
  x:5,z:8,facing:-1.2,speed:0,step:0,
  digging:0,digDuration:.82,foundFlash:0
};
const camera = { x:5,z:-9 };
const input = {
  stickId:null, stickX:0,stickY:0, originX:0,originY:0,
  keys:{}, digId:null, digPulse:0
};
const holes=[];
const dirt=[];
const targets=[];
let huntTime=100;
let outingFinds=0;
let callTimer=0;

function resize(){
  DPR=Math.min(devicePixelRatio||1,coarse?1.45:1.8);
  W=innerWidth; H=innerHeight;
  canvas.width=Math.round(W*DPR); canvas.height=Math.round(H*DPR);
  canvas.style.width=W+"px"; canvas.style.height=H+"px";
  ctx.setTransform(DPR,0,0,DPR,0,0);
  horizon=H*(W>H?.31:.22);
  scale=clamp(Math.min(W/33,H/27),11,25);
}
addEventListener("resize",resize);
resize();

function roundRect(x,y,w,h,r){
  const rr=Math.min(r,w/2,h/2);
  ctx.beginPath();
  ctx.roundRect(x,y,w,h,rr);
}
function ellipse(x,y,rx,ry,fill,stroke,line=1){
  ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,TAU);
  if(fill){ctx.fillStyle=fill;ctx.fill();}
  if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=line;ctx.stroke();}
}
function blob(points,fill,stroke,line=1){
  if(!points.length)return;
  ctx.beginPath();
  const n=points.length;
  const first=points[0],last=points[n-1];
  ctx.moveTo((first[0]+last[0])/2,(first[1]+last[1])/2);
  for(let i=0;i<n;i++){
    const p=points[i],q=points[(i+1)%n];
    ctx.quadraticCurveTo(p[0],p[1],(p[0]+q[0])/2,(p[1]+q[1])/2);
  }
  ctx.closePath();
  if(fill){ctx.fillStyle=fill;ctx.fill();}
  if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=line;ctx.stroke();}
}

function project(x,z,y=0){
  const depth=z-camera.z;
  const perspective=clamp(1-depth*.0042,.72,1.22);
  return {
    x:W*.5+(x-camera.x)*scale*perspective,
    y:horizon+depth*scale*.43-y*scale*perspective,
    s:scale*perspective,
    depth
  };
}

const clouds=Array.from({length:9},(_,i)=>({
  x:hash(i,2)*1.2-.1,y:.07+hash(i,3)*.22,
  size:.65+hash(i,4)*1.25,speed:.0018+hash(i,5)*.002
}));

function drawSky(){
  const sky=ctx.createLinearGradient(0,0,0,horizon+110);
  sky.addColorStop(0,"#75b7cb");
  sky.addColorStop(.55,"#abd7d3");
  sky.addColorStop(1,"#e7dfbb");
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);

  const sunX=W*(W>H?.76:.72),sunY=H*.12;
  const glow=ctx.createRadialGradient(sunX,sunY,0,sunX,sunY,Math.min(W,H)*.23);
  glow.addColorStop(0,"rgba(255,245,188,.72)");
  glow.addColorStop(.24,"rgba(255,235,172,.23)");
  glow.addColorStop(1,"rgba(255,235,172,0)");
  ctx.fillStyle=glow;ctx.fillRect(0,0,W,horizon+80);

  for(const c of clouds){
    let x=((c.x+time*c.speed)%1.35-.12)*W;
    const y=c.y*horizon;
    const s=Math.min(W,H)*.075*c.size;
    ctx.save();
    ctx.globalAlpha=.45;
    ctx.fillStyle="#f7f0d8";
    ellipse(x,y,s*.72,s*.25,"#f7f0d8");
    ellipse(x-s*.34,y-s*.08,s*.38,s*.3,"#f7f0d8");
    ellipse(x+s*.18,y-s*.13,s*.48,s*.39,"#f7f0d8");
    ellipse(x+s*.54,y-s*.03,s*.33,s*.25,"#f7f0d8");
    ctx.restore();
  }

  drawHillBand(horizon+16,.8,"#729f85",.007,28);
  drawHillBand(horizon+35,1.45,"#64896d",.011,38);
  drawHillBand(horizon+51,2.3,"#52745c",.015,42);
}
function drawHillBand(base,phase,color,freq,amp){
  ctx.beginPath();ctx.moveTo(0,H);
  ctx.lineTo(0,base);
  for(let x=0;x<=W+16;x+=16){
    const wx=x+camera.x*scale*.08;
    const y=base-Math.sin(wx*freq+phase)*amp-Math.sin(wx*freq*.47+phase*2.7)*amp*.55;
    ctx.lineTo(x,y);
  }
  ctx.lineTo(W,H);ctx.closePath();ctx.fillStyle=color;ctx.fill();
}

function terrainHeight(x,z){
  const meadow=Math.sin(x*.075)*.35+Math.cos(z*.055)*.28;
  const bank=clamp((z-52)/19,0,1)*2.1;
  return meadow+bank;
}
function drawGround(){
  const ground=ctx.createLinearGradient(0,horizon,H*.85,H);
  ground.addColorStop(0,"#88a56d");
  ground.addColorStop(.28,"#9bb875");
  ground.addColorStop(1,"#78965f");
  ctx.fillStyle=ground;ctx.fillRect(0,horizon,W,H-horizon);

  ctx.save();
  ctx.globalAlpha=.12;
  for(let z=-10;z<95;z+=7){
    const p=project(0,z);
    ctx.strokeStyle=z%14?"#efe2a8":"#496f55";
    ctx.lineWidth=clamp(p.s*.12,1,3);
    ctx.beginPath();
    ctx.moveTo(0,p.y+Math.sin(z)*3);
    ctx.quadraticCurveTo(W*.48,p.y+Math.sin(z*.7)*8,W,p.y-Math.cos(z)*4);
    ctx.stroke();
  }
  ctx.restore();

  // The pale footpath gently organizes the map without answering where treasure is.
  ctx.save();
  ctx.lineCap="round";
  ctx.strokeStyle="rgba(223,205,151,.35)";
  ctx.lineWidth=scale*2.1;
  ctx.beginPath();
  for(let z=-25;z<88;z+=3){
    const x=12+Math.sin(z*.065)*13;
    const p=project(x,z,terrainHeight(x,z));
    if(z===-25)ctx.moveTo(p.x,p.y);else ctx.lineTo(p.x,p.y);
  }
  ctx.stroke();ctx.restore();
}

function drawStream(){
  const points=[[-12,14],[-9,20],[-5,27],[1,34],[8,42],[16,51],[25,61],[36,73]];
  const projected=points.map(([x,z])=>project(x,z,terrainHeight(x,z)+.035));
  ctx.save();ctx.lineCap="round";ctx.lineJoin="round";
  const layers=[
    ["rgba(55,125,139,.58)",scale*2.8],
    ["rgba(91,171,178,.67)",scale*2.18],
    ["rgba(151,211,204,.58)",scale*1.38]
  ];
  for(const [color,width] of layers){
    ctx.strokeStyle=color;ctx.lineWidth=width;
    ctx.beginPath();ctx.moveTo(projected[0].x,projected[0].y);
    for(let i=1;i<projected.length-1;i++){
      const p=projected[i],q=projected[i+1];
      ctx.quadraticCurveTo(p.x,p.y,(p.x+q.x)/2,(p.y+q.y)/2);
    }
    const end=projected[projected.length-1];ctx.lineTo(end.x,end.y);ctx.stroke();
  }
  ctx.strokeStyle="rgba(239,242,211,.46)";ctx.lineWidth=Math.max(1,scale*.13);
  ctx.setLineDash([scale*.7,scale*1.4]);ctx.lineDashOffset=-time*scale*1.5;
  ctx.beginPath();ctx.moveTo(projected[0].x,projected[0].y);
  for(let i=1;i<projected.length-1;i++){
    const p=projected[i],q=projected[i+1];
    ctx.quadraticCurveTo(p.x,p.y,(p.x+q.x)/2,(p.y+q.y)/2);
  }
  ctx.stroke();ctx.setLineDash([]);ctx.restore();
}

const foliage=[];
for(let i=0;i<260;i++){
  let x=lerp(world.minX,world.maxX,hash(i,9));
  let z=lerp(world.minZ,world.maxZ,hash(i,17));
  if(Math.abs(x-(12+Math.sin(z*.065)*13))<3.2) x+=hash(i,3)<.5?-4:4;
  foliage.push({x,z,type:i%8,size:.55+hash(i,21)*.62,phase:hash(i,7)*TAU});
}
const stones=Array.from({length:34},(_,i)=>({
  x:lerp(-70,70,hash(i,41)),z:lerp(-48,78,hash(i,43)),
  size:.45+hash(i,47)*1.1,turn:hash(i,53)*TAU
}));

function drawFoliage(o,p){
  const s=p.s*o.size;
  const sway=Math.sin(time*1.5+o.phase)*s*.035;
  ctx.save();ctx.translate(p.x,p.y);ctx.rotate(sway);
  const palettes=[
    ["#4d7954","#73935d"],["#557f50","#90aa68"],["#6e884e","#a7b66e"],
    ["#46705a","#80a377"],["#5c8051","#89a45f"],["#527458","#9db16f"],
    ["#638555","#d8b670"],["#50765b","#d99a88"]
  ];
  const c=palettes[o.type];
  ctx.strokeStyle=c[0];ctx.fillStyle=c[1];ctx.lineCap="round";
  ctx.lineWidth=Math.max(1,s*.07);
  if(o.type<2){
    for(let i=-2;i<=2;i++){
      ctx.beginPath();ctx.moveTo(0,0);
      ctx.quadraticCurveTo(i*s*.13,-s*.22,i*s*.18,-s*(.42-Math.abs(i)*.035));
      ctx.stroke();
    }
  }else if(o.type<6){
    ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(0,-s*.5);ctx.stroke();
    for(let i=0;i<3;i++){
      const y=-s*(.16+i*.11),side=i%2?1:-1;
      ellipse(side*s*.12,y,s*.14,s*.065,c[1]);
      ellipse(-side*s*.1,y-s*.045,s*.12,s*.055,c[1]);
    }
  }else{
    ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(0,-s*.46);ctx.stroke();
    ellipse(0,-s*.5,s*.12,s*.09,c[1]);
    ellipse(-s*.095,-s*.49,s*.095,s*.07,c[1]);
    ellipse(s*.095,-s*.49,s*.095,s*.07,c[1]);
  }
  ctx.restore();
}

function drawStone(o,p){
  const s=p.s*o.size;
  ctx.save();ctx.translate(p.x,p.y);ctx.rotate(o.turn*.18);
  ctx.shadowColor="rgba(42,65,52,.18)";ctx.shadowBlur=s*.18;ctx.shadowOffsetY=s*.1;
  blob([[-s*.5,0],[-s*.42,-s*.28],[-s*.12,-s*.48],[s*.28,-s*.42],[s*.5,-s*.12],[s*.37,s*.05],[-s*.2,s*.08]],"#9da995","#667c70",Math.max(1,s*.045));
  ctx.restore();
}

function drawTree(x,z,seed,large=false){
  const h=large?7.8:4.8;
  const p=project(x,z,terrainHeight(x,z));
  const s=p.s;
  ctx.save();ctx.translate(p.x,p.y);
  ctx.lineCap="round";ctx.lineJoin="round";
  ctx.strokeStyle="#705849";ctx.lineWidth=s*(large?.72:.5);
  ctx.beginPath();ctx.moveTo(0,0);
  ctx.bezierCurveTo(-s*.28,-s*h*.28,s*.38,-s*h*.57,s*.05,-s*h*.82);
  ctx.stroke();
  ctx.strokeStyle="#826453";ctx.lineWidth=s*(large?.26:.18);
  for(let i=0;i<4;i++){
    const yy=-s*h*(.38+i*.12),side=i%2?1:-1;
    ctx.beginPath();ctx.moveTo((i%2?-.08:.08)*s,yy);
    ctx.quadraticCurveTo(side*s*.7,yy-s*.22,side*s*1.05,yy-s*.62);
    ctx.stroke();
  }
  const leaf="#4f7f59",light="#6f9d65",warm="#89ac6d";
  const clusters=large?10:7;
  for(let i=0;i<clusters;i++){
    const a=hash(seed,i)*TAU,r=(.18+hash(seed+8,i)*.92)*s*(large?1.65:1.15);
    const cx=Math.cos(a)*r,cy=-s*h*.76+Math.sin(a)*r*.42;
    ellipse(cx,cy,s*(.72+hash(i,seed)*.45),s*(.48+hash(i+2,seed)*.28),i%3===0?warm:i%2?light:leaf,"#436b50",Math.max(1,s*.04));
  }
  ctx.restore();
}

function drawWaterfall(){
  const x=-12,z=14;
  const p=project(x,z,terrainHeight(x,z));
  const s=p.s;
  ctx.save();ctx.translate(p.x,p.y);ctx.scale(1,1.18);

  // One sculpted cliff silhouette: broad moss shelves instead of a rock pile.
  const cliff=[
    [-s*5.2,s*.8],[-s*5,-s*1.6],[-s*4.35,-s*3.8],[-s*2.9,-s*5.4],
    [-s*.7,-s*6.2],[s*1.4,-s*6],[s*3.7,-s*4.8],[s*4.8,-s*2.4],
    [s*5.1,s*.8],[s*3.8,s*1.5],[-s*3.7,s*1.5]
  ];
  ctx.shadowColor="rgba(30,56,47,.28)";ctx.shadowBlur=s*.7;ctx.shadowOffsetY=s*.25;
  blob(cliff,"#788779","#4d675d",Math.max(1.2,s*.09));
  ctx.shadowColor="transparent";

  blob([
    [-s*5.1,-s*1.9],[-s*4.2,-s*4],[-s*2.5,-s*5.7],[-s*.6,-s*6.45],
    [s*1.65,-s*6.2],[s*3.8,-s*4.9],[s*4.7,-s*2.6],[s*3.2,-s*3],
    [s*1.4,-s*4.15],[-s*.8,-s*4.35],[-s*2.7,-s*3.5]
  ],"#6f9167","#496f58",Math.max(1,s*.07));

  // Shaded folds make the cliff feel carved and soft.
  ctx.globalAlpha=.28;ctx.strokeStyle="#b9b896";ctx.lineCap="round";
  for(let i=-3;i<=3;i++){
    ctx.lineWidth=s*(.28+hash(i,4)*.24);
    ctx.beginPath();
    ctx.moveTo(i*s*1.05,-s*(4.7+hash(i,2)*.8));
    ctx.quadraticCurveTo(i*s*.95+s*.35,s*-2.2,i*s*1.2,s*.7);
    ctx.stroke();
  }
  ctx.globalAlpha=1;

  // Keep the diorama's successful layered water: translucent sheets, moving light,
  // white lip, receiving pool, mist, and recycled splash beads.
  const waterTop=-s*5.95,waterBottom=s*.92;
  for(let i=0;i<4;i++){
    const wave=Math.sin(time*2.4+i*1.7)*s*.09;
    ctx.strokeStyle=["rgba(108,190,197,.74)","rgba(143,213,211,.72)","rgba(82,166,183,.66)","rgba(205,239,224,.46)"][i];
    ctx.lineWidth=s*(1.28-i*.17);ctx.lineCap="round";
    ctx.beginPath();ctx.moveTo(-s*.2+i*s*.12,waterTop);
    ctx.bezierCurveTo(s*.25+wave,-s*3.9,-s*.3-wave,-s*1.2,s*.12+i*s*.05,waterBottom);
    ctx.stroke();
  }
  ctx.strokeStyle="rgba(245,248,220,.9)";ctx.lineWidth=s*.32;
  ctx.beginPath();ctx.moveTo(-s*1.05,waterTop+s*.05);ctx.quadraticCurveTo(0,waterTop-s*.25,s*1.1,waterTop+s*.04);ctx.stroke();

  const pool=ctx.createRadialGradient(0,s*1.12,s*.2,0,s*1.12,s*3.8);
  pool.addColorStop(0,"rgba(187,230,216,.82)");pool.addColorStop(.55,"rgba(80,162,170,.76)");pool.addColorStop(1,"rgba(66,129,137,.05)");
  ctx.fillStyle=pool;ctx.beginPath();ctx.ellipse(0,s*1.15,s*4,s*1.35,0,0,TAU);ctx.fill();
  ctx.strokeStyle="rgba(239,244,216,.65)";ctx.lineWidth=s*.14;
  for(let i=0;i<3;i++){
    ctx.beginPath();ctx.ellipse(0,s*(1.05+i*.18),s*(1.5+i*.82+Math.sin(time*2+i)*.12),s*(.25+i*.15),0,0,TAU);ctx.stroke();
  }
  for(let i=0;i<14;i++){
    const life=(time*(.48+hash(i,3)*.5)+hash(i,7))%1;
    const a=hash(i,5)*TAU,r=s*(.35+hash(i,9)*1.05)*life;
    const sx=Math.cos(a)*r,sy=s*.8-Math.sin(life*Math.PI)*s*(.45+hash(i,11)*.72)+Math.sin(a)*r*.22;
    ellipse(sx,sy,s*(.07+hash(i,13)*.07),s*(.1+hash(i,13)*.1),`rgba(247,249,226,${Math.sin(life*Math.PI)*.75})`);
  }
  ctx.restore();
}

function drawHole(h,p){
  const s=p.s;
  ctx.save();ctx.translate(p.x,p.y);
  ellipse(0,s*.05,s*.78,s*.32,"rgba(58,57,39,.66)","#5e6948",s*.08);
  ctx.strokeStyle="rgba(211,185,116,.55)";ctx.lineWidth=s*.12;
  ctx.beginPath();ctx.arc(0,0,s*.78,Math.PI*.05,Math.PI*.96);ctx.stroke();
  ctx.restore();
}
function drawDirt(d,p){
  ellipse(p.x,p.y,p.s*d.size,p.s*d.size*.72,"#a98253","#765e43",Math.max(.7,p.s*.035));
}

function drawBunny(){
  const p=project(player.x,player.z,terrainHeight(player.x,player.z));
  const s=p.s;
  const moving=player.speed>0.1;
  const bounce=moving?Math.abs(Math.sin(player.step))*s*.12:Math.sin(time*2.2)*s*.025;
  const dig=player.digging>0;
  const peck=dig?Math.sin((1-player.digging/player.digDuration)*Math.PI*6)*s*.16:0;
  const dir=player.facing;
  const flip=Math.cos(dir)<0?-1:1;
  ctx.save();ctx.translate(p.x,p.y-bounce);ctx.scale(flip*1.2,1.2);

  ctx.globalAlpha=.22;ellipse(0,s*.08,s*.85,s*.25,"#324f43");
  ctx.globalAlpha=1;

  const outline="#6e6857",fur="#f4e5bf",light="#fff3d2",warm="#d8bd8d",pink="#d79e92";
  // feet
  ellipse(-s*.43,s*.02,s*.4,s*.2,warm,outline,s*.055);
  ellipse(s*.4,s*.02,s*.4,s*.2,warm,outline,s*.055);
  // soft pear-shaped body
  blob([
    [-s*.64,0],[-s*.72,-s*.72],[-s*.4,-s*1.32],[0,-s*1.52],
    [s*.5,-s*1.25],[s*.68,-s*.62],[s*.55,0]
  ],fur,outline,s*.07);
  ellipse(s*.52,-s*.6,s*.34,s*.38,light,outline,s*.055);
  // neckerchief gives a strong readable color note at phone size
  ctx.fillStyle="#d8795f";ctx.strokeStyle="#8f584d";ctx.lineWidth=s*.055;
  ctx.beginPath();ctx.moveTo(-s*.42,-s*1.18);ctx.quadraticCurveTo(0,-s*.98,s*.52,-s*1.22);
  ctx.lineTo(s*.36,-s*.88);ctx.quadraticCurveTo(0,-s*.72,-s*.36,-s*.9);ctx.closePath();ctx.fill();ctx.stroke();
  ctx.beginPath();ctx.moveTo(s*.28,-s*.95);ctx.lineTo(s*.72,-s*.46);ctx.lineTo(s*.23,-s*.54);ctx.closePath();ctx.fill();ctx.stroke();

  const headX=dig?s*(.28+peck/s):s*.08,headY=dig?-s*1.35+Math.abs(peck)*.45:-s*1.62;
  ellipse(headX,headY,s*.62,s*.55,light,outline,s*.07);
  ellipse(headX+s*.45,headY+s*.1,s*.37,s*.29,fur,outline,s*.055);
  // ears: broad tapered storybook shapes, asymmetrical but not antennae
  ctx.save();ctx.translate(headX,headY-s*.37);
  ctx.rotate(-.16+Math.sin(time*1.3)*.025);
  blob([[-s*.43,s*.06],[-s*.54,-s*.82],[-s*.3,-s*1.62],[-s*.03,-s*.9],[-s*.04,s*.08]],fur,outline,s*.065);
  blob([[-s*.34,-s*.08],[-s*.39,-s*.76],[-s*.29,-s*1.27],[-s*.16,-s*.68],[-s*.15,-s*.05]],pink,null);
  ctx.restore();
  ctx.save();ctx.translate(headX+s*.2,headY-s*.35);ctx.rotate(.2);
  blob([[s*.03,s*.06],[-s*.02,-s*.86],[s*.28,-s*1.53],[s*.49,-s*.76],[s*.44,s*.08]],fur,outline,s*.065);
  blob([[s*.12,-s*.06],[s*.1,-s*.74],[s*.26,-s*1.2],[s*.37,-s*.62],[s*.34,-s*.04]],pink,null);
  ctx.restore();
  // face
  ellipse(headX+s*.29,headY-s*.04,s*.075,s*.095,"#263936");
  ellipse(headX+s*.33,headY-s*.08,s*.022,s*.027,"#fffbe8");
  ellipse(headX+s*.68,headY+s*.08,s*.065,s*.052,"#7b5a54");
  ctx.strokeStyle="#8a6760";ctx.lineWidth=s*.04;ctx.lineCap="round";
  ctx.beginPath();ctx.moveTo(headX+s*.67,headY+s*.14);ctx.quadraticCurveTo(headX+s*.56,headY+s*.25,headX+s*.46,headY+s*.2);ctx.stroke();
  // little shovel, readable as a treasured tool rather than a body spike
  ctx.save();ctx.translate(s*.58,-s*.55);ctx.rotate(dig?-.75-peck/s*.8:-.34);
  ctx.strokeStyle="#806247";ctx.lineWidth=s*.09;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(s*.86,-s*.72);ctx.stroke();
  blob([[s*.72,-s*.67],[s*.96,-s*.92],[s*1.12,-s*.72],[s*.88,-s*.52]],"#a6a18a","#5e685e",s*.045);
  ctx.restore();
  ctx.restore();
}

function spawnHunt(){
  targets.length=0;
  outingFinds=0;
  huntTime=100;
  for(let i=0;i<6;i++){
    let x,z,tries=0;
    do{
      x=lerp(world.minX+8,world.maxX-8,Math.random());
      z=lerp(world.minZ+8,world.maxZ-8,Math.random());
      tries++;
    }while((Math.hypot(x+12,z-14)<15||Math.hypot(x-player.x,z-player.z)<12)&&tries<30);
    targets.push({x,z,name:["a blue button","a brass bell","a moon coin","a tiny key","a painted bead","a silver thimble"][i]});
  }
}
spawnHunt();

function gradeFor(distance){
  if(distance<2.2)return 4;
  if(distance<5.5)return 3;
  if(distance<10)return 2;
  if(distance<17)return 1;
  return 0;
}
function say(text,duration=1.45){
  callout.textContent=text;callout.classList.add("show");callTimer=duration;
}
function beginDig(){
  if(!started||player.digging>0)return;
  player.digging=player.digDuration;
  input.digPulse=1;
}
function finishDig(){
  const x=player.x+Math.cos(player.facing)*1.5;
  const z=player.z+Math.sin(player.facing)*1.5;
  holes.push({x,z,life:1});
  if(holes.length>28)holes.shift();
  for(let i=0;i<10;i++)dirt.push({
    x,z,y:.15,vx:(Math.random()-.5)*6,vz:(Math.random()-.5)*4,
    vy:2+Math.random()*3,size:.06+Math.random()*.06,life:.75
  });
  let nearest=Infinity,index=-1;
  for(let i=0;i<targets.length;i++){
    const d=Math.hypot(targets[i].x-x,targets[i].z-z);
    if(d<nearest){nearest=d;index=i;}
  }
  const grade=gradeFor(nearest);
  if(grade===4&&index>=0){
    const found=targets.splice(index,1)[0];
    outingFinds++;savedFinds++;
    localStorage.setItem("little-digger-finds",savedFinds);
    findsEl.textContent=savedFinds+" keepsake"+(savedFinds===1?"":"s");
    player.foundFlash=1;
    say(found.name+"!",2.1);
  }else{
    say(["prrp.","prrp?","prrp!","BRRRP!"][grade],1.35);
  }
}

function update(dt){
  time+=dt;
  if(!started)return;
  huntTime=Math.max(0,huntTime-dt);
  if(huntTime<=0){
    say(outingFinds?`${outingFinds} thing${outingFinds===1?"":"s"} tucked away`:"the meadow waits",2.2);
    spawnHunt();
  }
  const mins=Math.floor(huntTime/60),secs=Math.floor(huntTime%60);
  clockEl.textContent=mins+":"+String(secs).padStart(2,"0");
  findsEl.textContent=savedFinds+" keepsake"+(savedFinds===1?"":"s");
  if(callTimer>0){
    callTimer-=dt;
    if(callTimer<=0)callout.classList.remove("show");
  }

  let ix=0,iz=0;
  if(input.stickId!==null){
    const dx=input.stickX-input.originX,dy=input.stickY-input.originY;
    const len=Math.hypot(dx,dy),max=Math.min(W,H)*.13;
    if(len>max*.12){ix=clamp(dx/max,-1,1);iz=clamp(dy/max,-1,1);}
  }
  if(input.keys.ArrowLeft||input.keys.KeyA)ix-=1;
  if(input.keys.ArrowRight||input.keys.KeyD)ix+=1;
  if(input.keys.ArrowUp||input.keys.KeyW)iz-=1;
  if(input.keys.ArrowDown||input.keys.KeyS)iz+=1;
  const len=Math.hypot(ix,iz);
  const locked=player.digging>0;
  if(len>.08&&!locked){
    ix/=Math.max(1,len);iz/=Math.max(1,len);
    const speed=8.5;
    player.x=clamp(player.x+ix*speed*dt,world.minX,world.maxX);
    player.z=clamp(player.z+iz*speed*dt,world.minZ,world.maxZ);
    player.facing=Math.atan2(iz,ix);
    player.speed=lerp(player.speed,speed,1-Math.pow(.001,dt));
    player.step+=dt*9;
  }else player.speed=lerp(player.speed,0,1-Math.pow(.003,dt));

  if(player.digging>0){
    const before=player.digging;
    player.digging=Math.max(0,player.digging-dt);
    if(before>0&&player.digging===0)finishDig();
  }
  player.foundFlash=Math.max(0,player.foundFlash-dt*1.5);
  input.digPulse=Math.max(0,input.digPulse-dt*4);
  camera.x=lerp(camera.x,player.x-(H>W?6.5:0),1-Math.pow(.045,dt));
  camera.z=lerp(camera.z,player.z-(H>W?36:17),1-Math.pow(.045,dt));
  camera.x=clamp(camera.x,world.minX+11,world.maxX-11);
  camera.z=clamp(camera.z,world.minZ+10,world.maxZ-1);
  for(let i=dirt.length-1;i>=0;i--){
    const d=dirt[i];d.life-=dt;d.x+=d.vx*dt;d.z+=d.vz*dt;d.y+=d.vy*dt;d.vy-=8*dt;
    if(d.y<0){d.y=0;d.vy*=-.16;}
    if(d.life<=0)dirt.splice(i,1);
  }
}

function drawJoystick(){
  if(!coarse&&!input.stickId)return;
  const r=clamp(Math.min(W,H)*.105,34,58);
  const ox=input.stickId!==null?input.originX:Math.max(r+17,17+safeLeft());
  const oy=input.stickId!==null?input.originY:H-r-17-safeBottom();
  ctx.save();ctx.globalAlpha=input.stickId!==null?.82:.45;
  ellipse(ox,oy,r,r,"rgba(34,59,53,.42)","rgba(255,248,218,.43)",2);
  let dx=input.stickId!==null?input.stickX-ox:0,dy=input.stickId!==null?input.stickY-oy:0;
  const len=Math.hypot(dx,dy),m=len>r*.58?r*.58/len:1;dx*=m;dy*=m;
  ellipse(ox+dx,oy+dy,r*.42,r*.42,"rgba(245,218,143,.86)","rgba(255,251,228,.66)",2);
  ctx.restore();
}
function digButton(){
  const r=clamp(Math.min(W,H)*.115,38,62);
  return {x:W-r-17-safeRight(),y:H-r-17-safeBottom(),r};
}
function drawDigButton(){
  const b=digButton(),pulse=input.digPulse;
  ctx.save();ctx.globalAlpha=.88;
  ellipse(b.x,b.y,b.r*(1-pulse*.05),b.r*(1-pulse*.05),pulse?"#f1b967":"rgba(39,65,58,.69)","rgba(255,248,218,.58)",2);
  ctx.translate(b.x,b.y);ctx.rotate(-.55);
  ctx.strokeStyle="#f7e7bb";ctx.lineWidth=b.r*.1;ctx.lineCap="round";
  ctx.beginPath();ctx.moveTo(0,b.r*.4);ctx.lineTo(0,-b.r*.35);ctx.stroke();
  ctx.fillStyle="#f7e7bb";ctx.beginPath();ctx.moveTo(-b.r*.2,-b.r*.28);ctx.lineTo(0,-b.r*.66);ctx.lineTo(b.r*.2,-b.r*.28);ctx.closePath();ctx.fill();
  ctx.restore();
}
function safeBottom(){return 0;}
function safeLeft(){return 0;}
function safeRight(){return 0;}

function render(){
  drawSky();drawGround();drawStream();
  const drawables=[];
  for(const h of holes)drawables.push({z:h.z,draw:()=>drawHole(h,project(h.x,h.z,terrainHeight(h.x,h.z)))});
  for(const o of stones)if(Math.abs(o.x-camera.x)<55&&Math.abs(o.z-camera.z)<75)drawables.push({z:o.z,draw:()=>drawStone(o,project(o.x,o.z,terrainHeight(o.x,o.z)))});
  for(const o of foliage)if(Math.abs(o.x-camera.x)<50&&Math.abs(o.z-camera.z)<70)drawables.push({z:o.z,draw:()=>drawFoliage(o,project(o.x,o.z,terrainHeight(o.x,o.z)))});
  [[-18,54,8,true],[37,59,17,false],[-52,30,24,false],[49,17,31,false],[-8,-4,44,false],[55,-28,51,false],[-55,-34,62,false]].forEach(t=>{
    if(Math.abs(t[0]-camera.x)<60&&Math.abs(t[1]-camera.z)<82)drawables.push({z:t[1],draw:()=>drawTree(t[0],t[1],t[2],t[3])});
  });
  if(Math.abs(-12-camera.x)<65&&Math.abs(14-camera.z)<90)drawables.push({z:14,draw:drawWaterfall});
  for(const d of dirt)drawables.push({z:d.z,draw:()=>drawDirt(d,project(d.x,d.z,terrainHeight(d.x,d.z)+d.y))});
  drawables.push({z:player.z,draw:drawBunny});
  drawables.sort((a,b)=>a.z-b.z);
  for(const d of drawables)d.draw();

  const shade=ctx.createLinearGradient(0,0,0,H);
  shade.addColorStop(0,"rgba(22,47,46,.08)");
  shade.addColorStop(.5,"rgba(255,247,211,0)");
  shade.addColorStop(1,"rgba(25,45,40,.14)");
  ctx.fillStyle=shade;ctx.fillRect(0,0,W,H);
  drawJoystick();drawDigButton();
}

function point(e){return{x:e.clientX,y:e.clientY};}
function down(e){
  if(!started)return;
  const p=point(e),b=digButton();
  if(Math.hypot(p.x-b.x,p.y-b.y)<b.r*1.3){
    input.digId=e.pointerId;beginDig();canvas.setPointerCapture(e.pointerId);e.preventDefault();return;
  }
  if(p.x<W*.58&&p.y>H*.42&&input.stickId===null){
    input.stickId=e.pointerId;input.originX=p.x;input.originY=p.y;input.stickX=p.x;input.stickY=p.y;
    canvas.setPointerCapture(e.pointerId);e.preventDefault();
  }
}
function move(e){
  if(e.pointerId===input.stickId){input.stickX=e.clientX;input.stickY=e.clientY;e.preventDefault();}
}
function up(e){
  if(e.pointerId===input.stickId)input.stickId=null;
  if(e.pointerId===input.digId)input.digId=null;
}
canvas.addEventListener("pointerdown",down);
canvas.addEventListener("pointermove",move);
canvas.addEventListener("pointerup",up);
canvas.addEventListener("pointercancel",up);
addEventListener("keydown",e=>{
  input.keys[e.code]=true;
  if(e.code==="Space"||e.code==="KeyE"){beginDig();e.preventDefault();}
});
addEventListener("keyup",e=>input.keys[e.code]=false);

document.querySelector("#play").addEventListener("click",()=>{
  started=true;document.querySelector("#start").style.display="none";
  say("listen to each dig",1.8);
});

function loop(now){
  const dt=Math.min(.033,(now-last)/1000||0);last=now;
  update(dt);render();
  frameCount++;
  if(frameCount%60===0)fps=Math.round(1/dt);
  window.__littleDigger={
    ready:true,started,fps,viewport:[W,H],finds:savedFinds,
    player:{x:player.x,z:player.z,digging:player.digging>0},
    targets:targets.length,proximityUI:false,
    waterfall:{layeredWater:true,cliff:"sculpted"}
  };
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
