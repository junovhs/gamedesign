<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>PACKHOUSE</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#1a120b;overflow:hidden;
    -webkit-tap-highlight-color:transparent;touch-action:none;overscroll-behavior:none;}
  canvas{display:block;width:100%;height:100%;}
  *{user-select:none;-webkit-user-select:none;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
"use strict";
/* ============================================================
   PACKHOUSE — a produce-packing puzzle toy
   One gesture: tap matching produce to pack it into baskets, crates, and trucks.
   ============================================================ */

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let W=0,H=0,DPR=1;

const COLS=7, ROWS=8;
let cell=48, bx=0, by=0, bw=0, bh=0, topH=110, botH=92;
let ST=0, SB=0; // safe-area insets (notch / home indicator)
function measureSafeArea(){
  try{
    const d=document.createElement('div');
    d.style.cssText='position:fixed;top:0;left:0;width:1px;height:1px;visibility:hidden;'+
      'padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);';
    document.body.appendChild(d);
    const cs=getComputedStyle(d);
    ST=parseFloat(cs.paddingTop)||0; SB=parseFloat(cs.paddingBottom)||0;
    d.remove();
  }catch(e){ ST=0; SB=0; }
}

function layout(){
  topH = Math.max(88, Math.min(126, H*0.155)) + ST;
  botH = Math.max(74, Math.min(104, H*0.13)) + SB;
  const availW = W-22, availH = H-topH-botH-16;
  cell = Math.floor(Math.min(availW/COLS, availH/ROWS));
  bw = cell*COLS; bh = cell*ROWS;
  bx = Math.round((W-bw)/2);
  by = Math.round(topH + (availH-bh)/2 + 4);
}
function resize(){
  DPR = Math.min(2, window.devicePixelRatio||1);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W*DPR); cv.height = Math.round(H*DPR);
  cv.style.width=W+'px'; cv.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  layout();
}
window.addEventListener('resize', resize);

/* ---------------- palette ---------------- */
const COLORS = [
  {c:'#e94f45', d:'#9f251f', g:'rgba(233,79,69,',   name:'apples'},
  {c:'#f29b38', d:'#ad5a16', g:'rgba(242,155,56,',  name:'oranges'},
  {c:'#79b84a', d:'#3f7726', g:'rgba(121,184,74,',  name:'pears'},
  {c:'#7857b8', d:'#432b78', g:'rgba(120,87,184,',  name:'berries'}
];
const INK='#fff8e8', INK_DIM='rgba(255,248,232,0.65)', INK_FAINT='rgba(255,248,232,0.32)';
const GLASS='#ffd38a';

/* ---------------- audio ---------------- */
let AC=null, master=null, droneGain=null, droneFilter=null, muted=false;
function initAudio(){
  if(AC) return;
  try{
    AC = new (window.AudioContext||window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = 0.5; master.connect(AC.destination);
    droneGain = AC.createGain(); droneGain.gain.value = 0.0; droneGain.connect(master);
    droneFilter = AC.createBiquadFilter(); droneFilter.type='lowpass';
    droneFilter.frequency.value=420; droneFilter.Q.value=2; droneFilter.connect(droneGain);
    [55, 82.41, 110.0, 164.81].forEach((f,i)=>{
      const o=AC.createOscillator(); o.type = i===3?'triangle':'sine';
      o.frequency.value=f*(1+ (i%2?0.004:-0.003));
      const g=AC.createGain(); g.gain.value = i===3?0.10:0.22;
      o.connect(g); g.connect(droneFilter); o.start();
    });
    setDrone(0.05);
  }catch(e){ AC=null; }
}
function setDrone(v){
  if(!AC||!droneGain) return;
  const t=AC.currentTime;
  droneGain.gain.cancelScheduledValues(t);
  droneGain.gain.linearRampToValueAtTime(muted?0:v, t+0.25);
  droneFilter.frequency.linearRampToValueAtTime(340 + v*2600, t+0.3);
}
function tone(freq, dur=0.16, type='sine', vol=0.18, slide=0, delay=0){
  if(!AC||muted) return;
  const t=AC.currentTime+delay;
  const o=AC.createOscillator(), g=AC.createGain();
  o.type=type; o.frequency.setValueAtTime(freq,t);
  if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(28,freq*slide), t+dur);
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(vol,t+0.012);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t+dur+0.03);
}
function noise(dur=0.4, vol=0.22, freq=900, sweep=0.15){
  if(!AC||muted) return;
  const t=AC.currentTime;
  const n = AC.createBufferSource();
  const len = Math.floor(AC.sampleRate*dur);
  const buf = AC.createBuffer(1,len,AC.sampleRate);
  const d = buf.getChannelData(0);
  for(let i=0;i<len;i++) d[i] = (Math.random()*2-1)*(1-i/len);
  n.buffer=buf;
  const f=AC.createBiquadFilter(); f.type='bandpass'; f.frequency.setValueAtTime(freq,t);
  f.frequency.exponentialRampToValueAtTime(Math.max(80,freq*sweep), t+dur);
  f.Q.value=1.1;
  const g=AC.createGain(); g.gain.value=vol;
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  n.connect(f); f.connect(g); g.connect(master); n.start(t); n.stop(t+dur);
}
const SCALE=[0,2,4,7,9,12,14,16,19,21,24,26,28];
function noteHz(i){ return 220*Math.pow(2, SCALE[Math.max(0,Math.min(SCALE.length-1,i))]/12); }
function sfxTap(){ tone(520,0.06,'sine',0.10); }
function sfxBad(){ tone(120,0.14,'square',0.07,0.7); }
function sfxMerge(tier,chain){
  const base = (tier-1)*2 + Math.min(8,chain-1);
  tone(noteHz(base+2),0.20,'triangle',0.20);
  tone(noteHz(base+5),0.28,'sine',0.13,1,0.04);
  if(chain>1) tone(noteHz(base+9),0.32,'sine',0.09,1,0.09);
}
function sfxSpawn(){ tone(880,0.05,'sine',0.05); }
function sfxPrism(){
  tone(noteHz(9),0.6,'triangle',0.22,2.0);
  tone(noteHz(12),0.5,'sine',0.14,2.0,0.03);
}
function sfxBoom(){ noise(0.7,0.28,1600,0.06); tone(70,0.7,'sine',0.25,0.4); }
function sfxGlass(){
  noise(0.35,0.16,4200,0.3);
  [12,16,19,24].forEach((n,i)=>tone(noteHz(n),0.5,'sine',0.12,1,i*0.045));
}
function sfxFizzle(){ tone(300,0.5,'sawtooth',0.10,0.25); }
function sfxUI(){ tone(660,0.07,'triangle',0.10); }
function sfxWin(){ [0,4,7,11,14].forEach((n,i)=>tone(noteHz(n+4),0.6,'triangle',0.16,1,i*0.09)); }
function sfxLose(){ [10,7,4,0].forEach((n,i)=>tone(noteHz(n),0.5,'sine',0.13,0.9,i*0.11)); }

/* ---------------- run + stage data ---------------- */
const STAGES = [
  { name:"Morning Sort", sub:"the first carts have arrived",
    moves:14, colors:3, stones:0, relics:0, goal:{b2:5},
    hint:"Tap two or more matching loose fruits. They pack into a basket." },
  { name:"Crate Orders", sub:"the farm stand needs larger loads",
    moves:16, colors:3, stones:0, relics:0, goal:{b3:3},
    hint:"Matching baskets pack into a crate. Choose where the crate lands." },
  { name:"Delivery Day", sub:"a truck is due before closing",
    moves:18, colors:3, stones:0, relics:1, goal:{prism:1},
    hint:"Pack crates into a truck, then tap the truck to ship that produce." },
  { name:"Crowded Floor", sub:"broken pallets block the packing lanes",
    moves:20, colors:3, stones:3, relics:1, goal:{relic:1},
    hint:"A truck loads matching produce and anything directly beside its route." },
  { name:"Market Rush", sub:"four crops, several equipment deliveries",
    moves:22, colors:4, stones:4, relics:2, goal:{relic:2, prism:1},
    hint:"Two trucks parked together can clear the entire loading floor." },
  { name:"Closing Bell", sub:"fill every order before the doors shut",
    moves:26, colors:4, stones:5, relics:3, goal:{relic:3},
    hint:"Use everything you learned: pack, position, ship, and save time." }
];

const VERBS = [
  {id:'shift',  name:'Handcart',   verb:'MOVE',    desc:"Move one item into a neighbouring space once each shift."},
  {id:'ember',  name:'Crowbar',    verb:'CLEAR',   desc:"Remove one item or broken pallet once each shift."},
  {id:'sight',  name:'Order Sheet',verb:'PLAN',    desc:"Highlight every packable group and show which move will chain."},
  {id:'keep',   name:'Cold Room',  verb:'STORE',   desc:"Carry your best packed load into the next shift."}
];

const CODEX = [
  {id:'bloom',  t:"Pack",        x:"Tap two or more touching items with the same produce and package size. They pack into the square you tapped."},
  {id:'chain',  t:"Efficient run",x:"If the new package lands beside matching packages, the workers pack again automatically. Three packs in one run save a move."},
  {id:'leap',   t:"Bulk pack",   x:"Five or more matching items fill two package sizes at once. A large pile can go straight into a crate."},
  {id:'prism',  t:"Delivery truck",x:"Pack crates into a truck. Tap it to collect every remaining item of that produce and leave the loading floor."},
  {id:'fuse',   t:"Departure time",x:"A truck waits for three moves. Ship it now, or risk waiting for a second truck before it leaves."},
  {id:'nova',   t:"Fleet pickup",x:"Two trucks parked side by side can take every load on the floor in one coordinated pickup."},
  {id:'stone',  t:"Broken pallet",x:"A broken pallet blocks a space. A nearby truck can carry it away, or a crowbar can clear it immediately."},
  {id:'glass',  t:"Equipment crate",x:"Load an equipment crate beside a departing truck. Its tool is added permanently to the tool shed."}
];

let run = null;
function newRun(){
  run = { stage:0, relics:0, lumens:0, verbs:{}, codex:{}, keptPiece:null, best:{} };
}
function unlockVerb(){
  const idx = run.relics-1;
  if(idx>=0 && idx<VERBS.length && !run.verbs[VERBS[idx].id]){
    run.verbs[VERBS[idx].id]=true;
    return VERBS[idx];
  }
  return null;
}
function learn(id){
  if(!run.codex[id]){ run.codex[id]=true; codexPulse=1.6; }
}
let codexPulse=0;

/* ---------------- board state ---------------- */
let grid=[];         // grid[r][c] = piece|null
let flying=[];       // pieces animating into a merge, no longer on grid
let particles=[];
let rings=[];
let floats=[];       // floating text
let shake=0, chainGlow=0, whiteFlash=0;
let busy=false;
let chain=0, bestChain=0;
let st=null;         // per-round state
let uid=1;

function makePiece(color, tier, kind){
  return { id:uid++, color, tier:tier||1, kind:kind||'mote',
           r:0,c:0, px:0,py:0, vx:0,vy:0, tr:null,tc:null,
           scale:1, sv:0, pop:0, rot:Math.random()*6.28, spin:(Math.random()-0.5)*0.4,
           flash:0, fuse:0, bornMove:-99, doomed:false, shrink:false, hint:0 };
}
function at(r,c){ return (r<0||c<0||r>=ROWS||c>=COLS)?null:grid[r][c]; }

function randColor(){ return Math.floor(Math.random()*st.colors); }

function buildBoard(){
  grid=[]; flying=[]; particles=[]; rings=[]; floats=[];
  for(let r=0;r<ROWS;r++){ grid.push(new Array(COLS).fill(null)); }
  for(let c=0;c<COLS;c++){
    let lastCol=null;
    for(let r=0;r<ROWS;r++){
      const col=(lastCol!==null && Math.random()<0.38)?lastCol:randColor();
      lastCol=col;
      const p=makePiece(col,1,'mote');
      p.r=r;p.c=c;p.px=c;p.py=r-ROWS-1;
      grid[r][c]=p;
    }
  }
  // seed a few tier-2s in later stages so the board reads as "in progress"
  if(run.stage>=2){
    for(let i=0;i<2+run.stage;i++){
      const r=2+Math.floor(Math.random()*(ROWS-3)), c=Math.floor(Math.random()*COLS);
      if(grid[r][c] && grid[r][c].kind==='mote') grid[r][c].tier=2;
    }
  }
  // stones
  const spots=[];
  for(let r=Math.floor(ROWS/2);r<ROWS;r++) for(let c=0;c<COLS;c++) spots.push([r,c]);
  shuffle(spots);
  let si=0;
  for(let i=0;i<st.stones;i++){
    const [r,c]=spots[si++]; const p=makePiece(0,1,'stone'); p.r=r;p.c=c;p.px=c;p.py=r-ROWS-2; grid[r][c]=p;
  }
  for(let i=0;i<st.relics;i++){
    const [r,c]=spots[si++]; const p=makePiece(0,1,'relic'); p.r=r;p.c=c;p.px=c;p.py=r-ROWS-2; grid[r][c]=p;
  }
  // kept piece from last round
  if(run.verbs.keep && run.keptPiece){
    const c=Math.floor(COLS/2);
    const p=makePiece(run.keptPiece.color, run.keptPiece.tier, 'mote');
    p.r=ROWS-1;p.c=c;p.px=c;p.py=-2; p.flash=1;
    grid[ROWS-1][c]=p;
    hint("The cold room saved your "+tierName(p.tier)+".");
    run.keptPiece=null;
  }
  // avoid an opening board with no move
  let guard=0;
  while(!anyMove() && guard++<40) reshuffle(true);
}
function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); const t=a[i];a[i]=a[j];a[j]=t;} }

function startStage(i){
  run.stage=i;
  const S=STAGES[i];
  st = { cfg:S, moves:S.moves, movesUsed:0, colors:S.colors, stones:S.stones||0, relics:S.relics||0,
         b2:0,b3:0,prism:0,relic:0, lumens:0, done:false, over:false, sight:false,
         charges:{shift: run.verbs.shift?1:0, ember: run.verbs.ember?1:0}, armed:null, shiftFrom:null };
  chain=0; bestChain=0; busy=false; whiteFlash=0;
  buildBoard();
  screen='play';
  hintText = S.hint; hintTime = 5.2;
  setDrone(0.06);
}

function tierName(t){ return ['loose produce','basket','crate','truck'][Math.min(3,t-1)]; }

/* ---------------- grouping / logic ---------------- */
function floodGroup(r,c){
  const p0=at(r,c);
  if(!p0||p0.kind!=='mote') return [];
  const seen=new Set([p0.id]); const out=[p0]; const stack=[p0];
  while(stack.length){
    const p=stack.pop();
    const n=[[p.r-1,p.c],[p.r+1,p.c],[p.r,p.c-1],[p.r,p.c+1]];
    for(const [rr,cc] of n){
      const q=at(rr,cc);
      if(q && !seen.has(q.id) && q.kind==='mote' && q.color===p0.color && q.tier===p0.tier){
        seen.add(q.id); out.push(q); stack.push(q);
      }
    }
  }
  return out;
}
function anyMove(){
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    const p=grid[r][c];
    if(!p||p.kind!=='mote') continue;
    if(p.tier>=4) return true;
    if(floodGroup(r,c).length>=2) return true;
  }
  return false;
}
function reshuffle(silent){
  const motes=[];
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){ const p=grid[r][c]; if(p&&p.kind==='mote') motes.push(p); }
  const cols = motes.map(p=>p.color);
  shuffle(cols);
  motes.forEach((p,i)=>{ p.color=cols[i]; if(!silent){ p.pop=0.5; p.flash=0.5; } });
  if(!silent){ hint("The sorting table is reshuffled."); tone(300,0.5,'sine',0.10,1.6); }
}

const wait = ms => new Promise(res=>setTimeout(res, ms));

function px(c){ return bx + c*cell + cell/2; }
function py(r){ return by + r*cell + cell/2; }

function burstParticles(x,y,color,n,power){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2, s=(0.4+Math.random())*power;
    particles.push({x,y,vx:Math.cos(a)*s, vy:Math.sin(a)*s-0.4, life:1, decay:0.012+Math.random()*0.02,
      size:cell*(0.03+Math.random()*0.09), col:color, rot:Math.random()*6.3, spin:(Math.random()-0.5)*0.5, shard:Math.random()<0.4});
  }
  if(particles.length>900) particles.splice(0, particles.length-900);
}
function ring(x,y,col,rad,w){ rings.push({x,y,r:cell*0.2,max:rad,col,life:1,w:w||3}); }
function floatText(x,y,txt,col,size){ floats.push({x,y,txt,col:col||INK,life:1,size:size||16,vy:-0.7}); }

/* ---------------- actions ---------------- */
async function attemptAct(r,c){
  if(busy||st.over) return;
  const p=at(r,c);

  // armed abilities
  if(st.armed==='ember'){
    if(!p){ sfxBad(); return; }
    st.armed=null; st.charges.ember=0;
    busy=true;
    p.flash=1; burstParticles(px(c),py(r),'#ffd7a0',22,3.2); ring(px(c),py(r),'#ffd7a0',cell*1.2,3);
    tone(180,0.5,'sawtooth',0.16,0.4); noise(0.3,0.12,2400,0.2);
    grid[r][c]=null;
    shake=Math.max(shake,4);
    await wait(140);
    await settle();
    spendMove(0);
    busy=false; afterResolve();
    return;
  }
  if(st.armed==='shift'){
    if(!st.shiftFrom){
      if(!p){ sfxBad(); return; }
      st.shiftFrom={r,c}; sfxUI(); hint("Now tap a neighbour.");
      return;
    } else {
      const f=st.shiftFrom;
      const d=Math.abs(f.r-r)+Math.abs(f.c-c);
      if(d!==1){ st.shiftFrom=(p?{r,c}:null); sfxBad(); return; }
      const a=grid[f.r][f.c], b=grid[r][c];
      grid[f.r][f.c]=b; grid[r][c]=a;
      if(a){ a.r=r;a.c=c;a.pop=0.35; }
      if(b){ b.r=f.r;b.c=f.c;b.pop=0.35; }
      st.armed=null; st.shiftFrom=null; st.charges.shift=0;
      tone(700,0.14,'triangle',0.14,1.4);
      busy=true;
      await wait(200); await settle(); spendMove(0);
      busy=false; afterResolve();
      return;
    }
  }

  if(!p){ sfxBad(); return; }
  if(p.kind==='stone'){ sfxBad(); p.pop=0.4; hint("Broken pallet. Load it beside a truck, or clear it with the crowbar."); learn('stone'); return; }
  if(p.kind==='relic'){ sfxBad(); p.pop=0.4; hint("Equipment crate. Park a truck beside it and dispatch the load."); learn('glass'); return; }

  if(p.tier>=4){ await prismAction(p); return; }

  const group=floodGroup(r,c);
  if(group.length<2){
    sfxBad(); p.pop=0.45; p.hint=1;
    hint("That item needs a touching match: same produce, same package size.");
    return;
  }
  busy=true; chain=0;
  spendMove(1);
  await doMerge(group,p);
  await wait(60);
  busy=false; afterResolve();
}

function spendMove(n){
  st.moves-=n; st.movesUsed+=n;
  if(n>0) decayFuses();
}
function decayFuses(){
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    const p=grid[r][c];
    if(p && p.kind==='mote' && p.tier>=4 && p.bornMove < st.movesUsed){
      p.fuse--;
      if(p.fuse<=0){
        grid[r][c]=null;
        burstParticles(px(p.c),py(p.r),COLORS[p.color].c,18,2.0);
        noise(0.35,0.10,180,0.5); tone(92,0.4,'triangle',0.12,0.7);
        hint("A waiting truck left before you could load it.");
      }
    }
  }
}

async function doMerge(group, target){
  chain++; bestChain=Math.max(bestChain,chain);
  chainGlow=Math.min(1.4, 0.4+chain*0.22);
  setDrone(Math.min(0.32, 0.06+chain*0.06));
  const tier=target.tier;
  const col=COLORS[target.color];
  learn('bloom');
  if(chain>1) learn('chain');

  // anticipation
  for(const g of group){ g.pop=0.35+0.1*chain; g.flash=0.7; }
  sfxMerge(tier, chain);
  await wait(90 + (chain>1?40:0));

  const others = group.filter(g=>g!==target);
  for(const g of others){
    grid[g.r][g.c]=null;
    g.tr=target.r; g.tc=target.c; g.shrink=true;
    flying.push(g);
  }
  await wait(150);
  for(const g of flying){ burstParticles(px(target.c),py(target.r),col.c,4,1.2); }
  flying.length=0;

  // grow the target — five or more kin leap two tiers
  const gained = group.length;
  const leap = gained>=5 ? 2 : 1;
  if(leap===2){ learn('leap'); floatText(px(target.c),py(target.r)-cell*0.8,"BULK PACK",'#ffffff',18); tone(noteHz(14),0.4,'triangle',0.16,1.6); }
  target.tier = Math.min(4, tier+leap);
  target.pop = 0.9; target.flash=1;
  const X=px(target.c), Y=py(target.r);
  ring(X,Y,col.c, cell*(1.0+0.35*target.tier), 2+target.tier);
  burstParticles(X,Y,col.c, 10+gained*5, 1.4+0.5*target.tier);
  shake=Math.max(shake, 1.5+target.tier*1.2 + chain);

  const pts = 10*tier*gained*chain;
  st.lumens += pts;
  floatText(X, Y-cell*0.4, "+"+pts, col.c, 15+Math.min(12,chain*2));
  if(chain>=2) floatText(X, Y-cell*0.85, "CHAIN "+chain, INK, 13+Math.min(10,chain*2));

  if(target.tier>=2) st.b2++;
  if(target.tier>=3) st.b3++;
  if(target.tier===4){
    target.fuse=3; target.bornMove=st.movesUsed;
    learn('prism'); learn('fuse');
    sfxPrism(); shake=Math.max(shake,9);
    hint("Truck ready. Tap to ship now, or build a second truck beside it before departure.");
  }

  // an efficient packing run saves time
  if(chain===3){
    st.moves++;
    floatText(X,Y-cell*1.15,"+1 MOVE",'#fff3c2',16);
    tone(noteHz(12),0.34,'triangle',0.12,1.3);
    hint("Three automatic packs in one run saved a move.");
  }

  await wait(170);
  await settle();

  // auto-chain: does the new piece now stand beside its own kind?
  if(target.tier<4){
    const g2=floodGroup(target.r,target.c);
    if(g2.length>=2){
      await wait(90);
      await doMerge(g2, target);
      return;
    }
  }
  chainGlow=Math.max(chainGlow,0.3);
  setDrone(0.06);
}

function breakFixed(q){
  const X=px(q.c), Y=py(q.r);
  if(q.kind==='relic'){
    grid[q.r][q.c]=null;
    st.relic++; run.relics++;
    burstParticles(X,Y,GLASS,42,3.4);
    burstParticles(X,Y,'#ffe6a8',20,2.4);
    ring(X,Y,GLASS,cell*2.2,4); ring(X,Y,'#ffe6a8',cell*1.4,2);
    floatText(X,Y-cell*0.5,"TOOL",GLASS,20);
    sfxGlass(); shake=Math.max(shake,12); learn('glass');
    const v=unlockVerb();
    if(v){ hint(v.name+" added to the tool shed."); }
  } else {
    grid[q.r][q.c]=null;
    burstParticles(X,Y,'#8ea0bd',26,2.6);
    ring(X,Y,'#8ea0bd',cell*1.3,3);
    noise(0.28,0.16,900,0.2); shake=Math.max(shake,6); learn('stone');
  }
}

async function prismAction(p){
  // nova if touching another prism
  const nb=[[p.r-1,p.c],[p.r+1,p.c],[p.r,p.c-1],[p.r,p.c+1]];
  let partner=null;
  for(const [rr,cc] of nb){ const q=at(rr,cc); if(q&&q.kind==='mote'&&q.tier>=4) partner=q; }
  busy=true; spendMove(1);
  if(partner) await nova(p,partner);
  else await detonate(p);
  busy=false; afterResolve();
}

async function detonate(p){
  const col=COLORS[p.color];
  p.pop=1.2; p.flash=1;
  ring(px(p.c),py(p.r),col.c,cell*1.4,4);
  tone(noteHz(4),0.35,'sine',0.16,2.4);
  await wait(230);
  const doomed=[];
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    const q=grid[r][c];
    if(q && q.kind==='mote' && q.color===p.color) doomed.push(q);
  }
  if(!doomed.includes(p)) doomed.push(p);
  const fixed=new Set();
  for(const q of doomed){
    const nb=[[q.r-1,q.c],[q.r+1,q.c],[q.r,q.c-1],[q.r,q.c+1]];
    for(const [rr,cc] of nb){ const f=at(rr,cc); if(f&&(f.kind==='stone'||f.kind==='relic')) fixed.add(f); }
  }
  sfxBoom(); shake=Math.max(shake,20); whiteFlash=Math.max(whiteFlash,0.35);
  ring(px(p.c),py(p.r),col.c,Math.max(bw,bh)*1.1,6);
  let i=0;
  for(const q of doomed){
    grid[q.r][q.c]=null;
    burstParticles(px(q.c),py(q.r),col.c,12,2.4);
    tone(noteHz(6+(i%7)),0.22,'sine',0.07,1,i*0.014);
    i++;
  }
  const pts = doomed.length*45;
  st.lumens += pts; st.prism++;
  floatText(px(p.c),py(p.r)-cell*0.5,"+"+pts,col.c,22);
  await wait(180);
  for(const f of fixed) breakFixed(f);
  await wait(220);
  await settle();
  chainGlow=1.2; setDrone(0.06);
}

async function nova(a,b){
  learn('nova');
  whiteFlash=1; shake=Math.max(shake,26);
  sfxBoom(); sfxGlass();
  [a,b].forEach(p=>{ ring(px(p.c),py(p.r),'#ffffff',Math.max(bw,bh)*1.3,8); });
  hint("FLEET PICKUP");
  await wait(260);
  const relics=[];
  let count=0;
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    const q=grid[r][c];
    if(!q) continue;
    if(q.kind==='relic'){ relics.push(q); continue; }
    grid[r][c]=null; count++;
    burstParticles(px(c),py(r),q.kind==='stone'?'#8ea0bd':COLORS[q.color].c,10,3.0);
  }
  for(let i=0;i<10;i++) tone(noteHz(i+6),0.5,'sine',0.09,1,i*0.05);
  st.prism++;
  const pts=count*40;
  st.lumens+=pts;
  floatText(W/2, by+bh/2, "+"+pts, '#ffffff', 28);
  await wait(240);
  for(const q of relics) breakFixed(q);
  await wait(260);
  await settle();
  setDrone(0.06);
}

async function settle(){
  let anySpawn=false;
  for(let c=0;c<COLS;c++){
    let write=ROWS-1;
    for(let r=ROWS-1;r>=0;r--){
      const p=grid[r][c];
      if(p){
        if(write!==r){ grid[write][c]=p; grid[r][c]=null; p.r=write; }
        write--;
      }
    }
    let k=1, lastCol=null;
    const below = at(write+1,c);
    if(below && below.kind==='mote') lastCol=below.color;
    for(let r=write;r>=0;r--){
      // produce arrives in batches: the same crop often follows itself down a chute
      const col = (lastCol!==null && Math.random()<0.42) ? lastCol : randColor();
      lastCol = col;
      const p=makePiece(col, Math.random()<(run.stage>=3?0.05:0.0)?2:1, 'mote');
      p.r=r;p.c=c;p.px=c;p.py=-k-0.4; k++;
      grid[r][c]=p; anySpawn=true;
    }
  }
  if(anySpawn) sfxSpawn();
  await wait(300);
}

function goalMet(){
  const g=st.cfg.goal;
  if(g.b2!==undefined && st.b2<g.b2) return false;
  if(g.b3!==undefined && st.b3<g.b3) return false;
  if(g.prism!==undefined && st.prism<g.prism) return false;
  if(g.relic!==undefined && st.relic<g.relic) return false;
  return true;
}

function afterResolve(){
  if(st.over) return;
  const met=goalMet();
  if(met && !st.done){
    st.done=true;
    hint("Orders filled. Close the shift, or keep packing for a better score.");
    sfxWin();
  }
  if(st.moves<=0){
    endRound(met);
    return;
  }
  if(!anyMove()) reshuffle(false);
}

function endRound(win){
  st.over=true; st.win=win;
  if(win){
    const bonus = Math.max(0,st.moves)*15;
    st.bonus=bonus; st.lumens+=bonus;
    run.lumens+=st.lumens;
    run.best[run.stage]=Math.max(run.best[run.stage]||0, st.lumens);
    // KEEP: carry brightest surviving piece
    if(run.verbs.keep){
      let best=null;
      for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
        const p=grid[r][c];
        if(p&&p.kind==='mote'&&(!best||p.tier>best.tier)) best=p;
      }
      if(best && best.tier>=2) run.keptPiece={color:best.color, tier:Math.min(3,best.tier)};
    }
    sfxWin();
  } else {
    sfxLose();
  }
  setDrone(0.03);
  screen='result';
}

function hint(t){ hintText=t; hintTime=4.0; }
let hintText='', hintTime=0;

/* ---------------- screens ---------------- */
let screen='title';   // title | play | result | cabinet | codex
let prevScreen='play';
let t=0;

/* ---------------- update ---------------- */
function spring(p){
  const tr = p.tr!==null?p.tr:p.r, tc = p.tc!==null?p.tc:p.c;
  p.vy += (tr-p.py)*0.42; p.vy*=0.70; p.py+=p.vy;
  p.vx += (tc-p.px)*0.42; p.vx*=0.70; p.px+=p.vx;
  p.pop *= 0.86; if(p.pop<0.001)p.pop=0;
  p.flash *= 0.90; if(p.flash<0.002)p.flash=0;
  p.hint *= 0.93;
  p.rot += p.spin*0.02*(p.tier>=3?3:1);
  if(p.shrink) p.scale = Math.max(0, p.scale-0.10);
}
function update(dt){
  t+=dt;
  // The title screen exists before a stage board is built. Iterate only rows
  // that actually exist so the first animation frame cannot crash to black.
  for(let r=0;r<grid.length;r++){
    const row=grid[r];
    if(!row) continue;
    for(let c=0;c<row.length;c++){ const p=row[c]; if(p) spring(p); }
  }
  for(const p of flying) spring(p);
  for(let i=particles.length-1;i>=0;i--){
    const q=particles[i];
    q.x+=q.vx*cell*0.06; q.y+=q.vy*cell*0.06; q.vy+=0.09; q.vx*=0.985;
    q.rot+=q.spin; q.life-=q.decay*1.6;
    if(q.life<=0) particles.splice(i,1);
  }
  for(let i=rings.length-1;i>=0;i--){
    const g=rings[i]; g.r += (g.max-g.r)*0.14; g.life-=0.035;
    if(g.life<=0) rings.splice(i,1);
  }
  for(let i=floats.length-1;i>=0;i--){
    const f=floats[i]; f.y+=f.vy; f.vy*=0.97; f.life-=0.014;
    if(f.life<=0) floats.splice(i,1);
  }
  shake*=0.86; if(shake<0.05)shake=0;
  chainGlow*=0.95;
  whiteFlash*=0.88;
  codexPulse*=0.97;
  if(hintTime>0) hintTime-=dt;
}

/* ---------------- drawing helpers ---------------- */
function rr(x,y,w,h,r){
  ctx.beginPath();
  r=Math.min(r,w/2,h/2);
  ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y); ctx.closePath();
}
function poly(x,y,rad,n,rot){
  ctx.beginPath();
  for(let i=0;i<n;i++){
    const a=rot+i*Math.PI*2/n;
    const px2=x+Math.cos(a)*rad, py2=y+Math.sin(a)*rad;
    if(i===0)ctx.moveTo(px2,py2); else ctx.lineTo(px2,py2);
  }
  ctx.closePath();
}
function txt(s,x,y,size,col,align,weight){
  ctx.font=(weight||600)+' '+size+'px ui-rounded, "Avenir Next", "Segoe UI", system-ui, sans-serif';
  ctx.textAlign=align||'center'; ctx.textBaseline='middle';
  ctx.fillStyle=col||INK; ctx.fillText(s,x,y);
}
function measure(s,size,weight){
  ctx.font=(weight||600)+' '+size+'px ui-rounded, "Avenir Next", "Segoe UI", system-ui, sans-serif';
  return ctx.measureText(s).width;
}

/* ---------------- background ---------------- */
function drawBG(){
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#6c3f1f'); g.addColorStop(0.48,'#3a2415'); g.addColorStop(1,'#17100b');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  // sun through dusty packhouse windows
  const rg=ctx.createRadialGradient(W*0.18,H*0.08,0,W*0.18,H*0.08,Math.max(W,H)*0.9);
  rg.addColorStop(0,'rgba(255,220,145,0.20)'); rg.addColorStop(1,'rgba(255,190,90,0)');
  ctx.fillStyle=rg; ctx.fillRect(0,0,W,H);
  // wooden wall boards
  ctx.strokeStyle='rgba(255,224,170,0.055)'; ctx.lineWidth=1;
  for(let y=0;y<H;y+=34){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }
  // drifting dust
  ctx.save();
  for(let i=0;i<30;i++){
    const s=(i*37)%100/100;
    const x=(s*W + Math.sin(t*0.22+i)*18)%W;
    const y=(t*(4+s*7)+i*83)%(H+30)-15;
    ctx.globalAlpha=0.09+0.08*Math.sin(t+i);
    ctx.fillStyle='#ffe0a2'; ctx.beginPath(); ctx.arc(x,y,0.7+s*1.2,0,6.3); ctx.fill();
  }
  ctx.restore();
}

/* ---------------- piece drawing ---------------- */
function pieceXY(p){ return [bx + p.px*cell + cell/2, by + p.py*cell + cell/2]; }

function drawFruitIcon(color, rad){
  const col=COLORS[color];
  ctx.fillStyle=col.d; ctx.beginPath(); ctx.ellipse(0,rad*0.16,rad*0.86,rad*0.78,0,0,6.3); ctx.fill();
  const g=ctx.createLinearGradient(0,-rad,0,rad);
  g.addColorStop(0,col.c); g.addColorStop(1,col.d);
  ctx.fillStyle=g;
  if(color===2){
    ctx.beginPath(); ctx.ellipse(0,rad*0.05,rad*0.72,rad*0.92,0,0,6.3); ctx.fill();
  }else if(color===3){
    for(const [dx,dy] of [[-0.28,-0.2],[0.28,-0.2],[-0.45,0.25],[0,0.25],[0.45,0.25],[0,0.68]]){
      ctx.beginPath(); ctx.arc(dx*rad,dy*rad,rad*0.34,0,6.3); ctx.fill();
    }
  }else{
    ctx.beginPath(); ctx.arc(0,0,rad*0.82,0,6.3); ctx.fill();
  }
  ctx.fillStyle='#5a7d2a'; ctx.fillRect(-rad*0.08,-rad*0.95,rad*0.16,rad*0.34);
  ctx.save(); ctx.rotate(-0.45); ctx.beginPath(); ctx.ellipse(rad*0.25,-rad*0.75,rad*0.34,rad*0.17,0,0,6.3); ctx.fill(); ctx.restore();
  ctx.fillStyle='rgba(255,255,255,0.34)'; ctx.beginPath(); ctx.ellipse(-rad*0.26,-rad*0.28,rad*0.19,rad*0.12,-0.5,0,6.3); ctx.fill();
}
function renderPiece(p, ghostAlpha){
  const [x,y]=pieceXY(p);
  if(y < by-cell*1.6 || y > by+bh+cell*1.6) { if(p.py< -2.2) return; }
  const base=cell*0.5, sc=p.scale*(1+p.pop*0.45);
  ctx.save(); ctx.globalAlpha=(ghostAlpha!==undefined?ghostAlpha:1); ctx.translate(x,y); ctx.scale(sc,sc*(1-p.pop*0.18));

  if(p.kind==='stone'){
    // broken wooden pallet
    ctx.fillStyle='rgba(0,0,0,0.28)'; rr(-base*.76,-base*.62,base*1.52,base*1.32,5); ctx.fill();
    ctx.fillStyle='#8b5a2b';
    for(let i=-1;i<=1;i++){ rr(-base*.68,i*base*.34-base*.11,base*1.36,base*.22,3); ctx.fill(); }
    ctx.fillStyle='#4e2e18'; ctx.fillRect(-base*.55,-base*.62,base*.16,base*1.25); ctx.fillRect(base*.38,-base*.62,base*.16,base*1.25);
    ctx.strokeStyle='#d49a55'; ctx.lineWidth=1.4; ctx.beginPath(); ctx.moveTo(-base*.48,-base*.5); ctx.lineTo(base*.1,base*.06); ctx.lineTo(-base*.28,base*.55); ctx.stroke();
    ctx.restore(); return;
  }

  if(p.kind==='relic'){
    // equipment crate with visible wrench
    const pulse=.5+.5*Math.sin(t*2+p.id);
    const ag=ctx.createRadialGradient(0,0,0,0,0,base*1.35); ag.addColorStop(0,'rgba(255,211,138,'+(.22+.16*pulse)+')'); ag.addColorStop(1,'rgba(255,211,138,0)');
    ctx.fillStyle=ag; ctx.beginPath(); ctx.arc(0,0,base*1.35,0,6.3); ctx.fill();
    ctx.fillStyle='#b97836'; rr(-base*.68,-base*.68,base*1.36,base*1.36,6); ctx.fill();
    ctx.strokeStyle='#f0bf73'; ctx.lineWidth=2; rr(-base*.68,-base*.68,base*1.36,base*1.36,6); ctx.stroke();
    ctx.fillStyle='#6d431f'; ctx.fillRect(-base*.58,-base*.12,base*1.16,base*.24);
    ctx.strokeStyle='#fff0c8'; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(-base*.12,-base*.08,base*.20,.7,5.6); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0,base*.05); ctx.lineTo(base*.36,base*.42); ctx.stroke();
    ctx.restore(); return;
  }

  const col=COLORS[p.color], pulse=.5+.5*Math.sin(t*5+p.id);
  const shake2=p.hint*Math.sin(t*40)*cell*.05; ctx.translate(shake2,0);
  if(p.flash>0){ const gg=ctx.createRadialGradient(0,0,0,0,0,base*1.25); gg.addColorStop(0,col.g+(0.18+p.flash*.25)+')'); gg.addColorStop(1,col.g+'0)'); ctx.fillStyle=gg; ctx.beginPath(); ctx.arc(0,0,base*1.25,0,6.3); ctx.fill(); }

  if(p.tier===1){
    drawFruitIcon(p.color,base*.48);
  }else if(p.tier===2){
    // wicker basket filled with the same produce
    ctx.fillStyle='#c78a45'; rr(-base*.68,-base*.12,base*1.36,base*.82,base*.18); ctx.fill();
    ctx.strokeStyle='#f2c27a'; ctx.lineWidth=1.4;
    for(let i=-2;i<=2;i++){ ctx.beginPath(); ctx.moveTo(i*base*.25,-base*.08); ctx.lineTo(i*base*.19,base*.62); ctx.stroke(); }
    ctx.beginPath(); ctx.arc(0,-base*.08,base*.48,Math.PI,0); ctx.stroke();
    ctx.save(); ctx.translate(-base*.28,-base*.26); drawFruitIcon(p.color,base*.22); ctx.restore();
    ctx.save(); ctx.translate(base*.24,-base*.24); drawFruitIcon(p.color,base*.22); ctx.restore();
  }else if(p.tier===3){
    // wooden produce crate
    ctx.fillStyle='#a66a31'; rr(-base*.72,-base*.58,base*1.44,base*1.16,5); ctx.fill();
    ctx.fillStyle='#d89a52'; ctx.fillRect(-base*.66,-base*.48,base*1.32,base*.20); ctx.fillRect(-base*.66,-base*.08,base*1.32,base*.20); ctx.fillRect(-base*.66,base*.32,base*1.32,base*.20);
    ctx.fillStyle=col.c; rr(-base*.32,-base*.20,base*.64,base*.40,4); ctx.fill();
    ctx.fillStyle='#fff7d6'; ctx.font='800 '+Math.max(7,base*.34)+'px system-ui'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(String(COLORS[p.color].name[0]).toUpperCase(),0,1);
  }else{
    // delivery truck: visually directional and obviously tappable
    ctx.fillStyle='rgba(0,0,0,.28)'; ctx.fillRect(-base*.75,base*.36,base*1.5,base*.18);
    ctx.fillStyle=col.d; rr(-base*.72,-base*.42,base*.92,base*.72,5); ctx.fill();
    ctx.fillStyle=col.c; rr(-base*.66,-base*.36,base*.80,base*.58,4); ctx.fill();
    ctx.fillStyle='#e8d6aa'; rr(base*.12,-base*.24,base*.52,base*.54,4); ctx.fill();
    ctx.fillStyle='#91c5d7'; rr(base*.28,-base*.17,base*.24,base*.20,2); ctx.fill();
    ctx.fillStyle='#2a2119'; for(const wx of [-base*.42,base*.42]){ ctx.beginPath(); ctx.arc(wx,base*.36,base*.16,0,6.3); ctx.fill(); ctx.fillStyle='#c7b18a'; ctx.beginPath(); ctx.arc(wx,base*.36,base*.07,0,6.3); ctx.fill(); ctx.fillStyle='#2a2119'; }
    ctx.fillStyle='rgba(255,255,255,'+(.45+.4*pulse)+')'; ctx.beginPath(); ctx.moveTo(base*.66,0); ctx.lineTo(base*.82,-base*.10); ctx.lineTo(base*.82,base*.10); ctx.closePath(); ctx.fill();
  }
  ctx.restore();

  if(p.kind==='mote' && p.tier>=4){
    const n=Math.max(0,p.fuse);
    for(let i=0;i<3;i++){
      ctx.beginPath(); ctx.arc(x-cell*.18+i*cell*.18,y+cell*.43,cell*.045,0,6.3);
      ctx.fillStyle=i<n?'#fff2ad':'rgba(255,255,255,.18)'; ctx.fill();
    }
  }
}

/* ---------------- board drawing ---------------- */
let sightGroups=null;
function computeSight(){
  const seen=new Set(); const out=[];
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    const p=grid[r][c];
    if(!p||p.kind!=='mote'||p.tier>=4||seen.has(p.id)) continue;
    const g=floodGroup(r,c);
    g.forEach(q=>seen.add(q.id));
    if(g.length>=2){
      // would it chain? simulate: the target tier+1 beside a same-colour tier+1
      let chains=false;
      const nt=Math.min(4,p.tier+1);
      for(const q of g){
        const nb=[[q.r-1,q.c],[q.r+1,q.c],[q.r,q.c-1],[q.r,q.c+1]];
        for(const [rr2,cc2] of nb){
          const o=at(rr2,cc2);
          if(o && !g.includes(o) && o.kind==='mote' && o.color===p.color && o.tier===nt) chains=true;
        }
      }
      out.push({cells:g, chains, tier:p.tier, color:p.color});
    }
  }
  return out;
}

function drawBoard(){
  ctx.save();
  const sx=(Math.random()-0.5)*shake, sy=(Math.random()-0.5)*shake;
  ctx.translate(sx,sy);

  // pool
  ctx.save();
  ctx.shadowColor='rgba(0,0,0,0.6)'; ctx.shadowBlur=30; ctx.shadowOffsetY=8;
  ctx.fillStyle='rgba(45,27,15,0.86)';
  rr(bx-8,by-8,bw+16,bh+16,18); ctx.fill();
  ctx.restore();
  ctx.strokeStyle='rgba(255,205,130,'+(0.18+chainGlow*0.30)+')'; ctx.lineWidth=2;
  rr(bx-8,by-8,bw+16,bh+16,18); ctx.stroke();

  // cell lattice
  ctx.strokeStyle='rgba(255,225,175,0.08)'; ctx.lineWidth=1;
  for(let r=1;r<ROWS;r++){ ctx.beginPath(); ctx.moveTo(bx,by+r*cell); ctx.lineTo(bx+bw,by+r*cell); ctx.stroke(); }
  for(let c=1;c<COLS;c++){ ctx.beginPath(); ctx.moveTo(bx+c*cell,by); ctx.lineTo(bx+c*cell,by+bh); ctx.stroke(); }

  ctx.save();
  ctx.beginPath(); rr(bx-2,by-2,bw+4,bh+4,12); ctx.clip();

  // sight overlay
  if(st && st.sight){
    const groups = computeSight();
    for(const g of groups){
      ctx.save();
      ctx.globalAlpha=0.5;
      ctx.strokeStyle = g.chains? '#ffffff' : 'rgba(180,220,255,0.5)';
      ctx.lineWidth = g.chains?2.4:1.2;
      ctx.setLineDash(g.chains?[]:[4,4]);
      for(const q of g.cells){
        rr(bx+q.c*cell+3, by+q.r*cell+3, cell-6, cell-6, 8); ctx.stroke();
      }
      ctx.setLineDash([]);
      ctx.restore();
      const f=g.cells[0];
      if(g.chains){
        txt("⚡", bx+f.c*cell+cell*0.5, by+f.r*cell+cell*0.22, cell*0.24, '#ffffff');
      }
    }
  }

  // shift selection
  if(st && st.shiftFrom){
    const f=st.shiftFrom;
    ctx.strokeStyle='#9fe8ff'; ctx.lineWidth=3;
    rr(bx+f.c*cell+2, by+f.r*cell+2, cell-4, cell-4, 9); ctx.stroke();
    const nbs=[[f.r-1,f.c],[f.r+1,f.c],[f.r,f.c-1],[f.r,f.c+1]];
    ctx.fillStyle='rgba(159,232,255,0.14)';
    for(const [rr2,cc2] of nbs){
      if(rr2<0||cc2<0||rr2>=ROWS||cc2>=COLS) continue;
      rr(bx+cc2*cell+3, by+rr2*cell+3, cell-6, cell-6, 9); ctx.fill();
    }
  }

  // pieces
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){ const p=grid[r][c]; if(p) renderPiece(p); }
  for(const p of flying) renderPiece(p, Math.max(0,p.scale));

  // keyboard cursor
  if(kbActive && screen==='play'){
    ctx.strokeStyle='rgba(255,255,255,'+(0.5+0.3*Math.sin(t*6))+')'; ctx.lineWidth=2.5;
    rr(bx+kc*cell+2, by+kr*cell+2, cell-4, cell-4, 9); ctx.stroke();
  }

  // rings
  for(const g of rings){
    ctx.globalAlpha=g.life*0.8; ctx.strokeStyle=g.col; ctx.lineWidth=g.w;
    ctx.beginPath(); ctx.arc(g.x,g.y,g.r,0,6.3); ctx.stroke();
  }
  ctx.globalAlpha=1;
  // particles
  for(const q of particles){
    ctx.globalAlpha=Math.max(0,q.life);
    ctx.fillStyle=q.col;
    if(q.shard){
      ctx.save(); ctx.translate(q.x,q.y); ctx.rotate(q.rot);
      ctx.fillRect(-q.size*0.5,-q.size*0.22,q.size,q.size*0.44); ctx.restore();
    } else {
      ctx.beginPath(); ctx.arc(q.x,q.y,q.size*q.life,0,6.3); ctx.fill();
    }
  }
  ctx.globalAlpha=1;
  ctx.restore(); // clip

  // floats
  for(const f of floats){
    ctx.globalAlpha=Math.max(0,Math.min(1,f.life*1.6));
    txt(f.txt, f.x, f.y, f.size, f.col, 'center', 800);
  }
  ctx.globalAlpha=1;
  ctx.restore();
}

/* ---------------- UI ---------------- */
let uiButtons=[];
function button(id,x,y,w,h,label,opts){
  opts=opts||{};
  uiButtons.push({id,x,y,w,h,disabled:!!opts.disabled});
  const hot = (pressedBtn===id);
  ctx.save();
  const a = opts.disabled?0.28:1;
  ctx.globalAlpha=a;
  if(opts.primary){
    const g=ctx.createLinearGradient(0,y,0,y+h);
    g.addColorStop(0,'#f3c36f'); g.addColorStop(1,'#c47a2b');
    ctx.fillStyle=g;
  } else {
    ctx.fillStyle= opts.active? 'rgba(255,210,130,0.22)' : 'rgba(255,255,255,0.055)';
  }
  rr(x+(hot?1:0),y+(hot?1:0),w,h,opts.round===undefined?h*0.32:opts.round); ctx.fill();
  ctx.strokeStyle = opts.active? 'rgba(255,220,150,0.85)' : (opts.primary?'rgba(255,255,255,0.5)':'rgba(255,255,255,0.16)');
  ctx.lineWidth=1.4;
  rr(x,y,w,h,opts.round===undefined?h*0.32:opts.round); ctx.stroke();
  txt(label, x+w/2, y+h/2+ (opts.sub?-h*0.14:0), opts.size||15, opts.primary?'#2e1b0e':(opts.active?'#fff0c6':INK), 'center', 700);
  if(opts.sub) txt(opts.sub, x+w/2, y+h/2+h*0.24, 10.5, opts.primary?'rgba(6,34,43,0.7)':INK_DIM,'center',600);

}

function goalChips(){
  const g=st.cfg.goal, out=[];
  if(g.b2!==undefined) out.push({icon:'basket', have:st.b2, need:g.b2, label:'baskets'});
  if(g.b3!==undefined) out.push({icon:'crate', have:st.b3, need:g.b3, label:'crates'});

  if(g.relic!==undefined) out.push({icon:'tool', have:st.relic, need:g.relic, label:'tools'});

}
function drawGoalIcon(kind,x,y,s,done){
  ctx.save(); ctx.translate(x,y); ctx.globalAlpha=done?1:.85; ctx.lineWidth=1.4;
  if(kind==='basket'){
    ctx.fillStyle='#c78a45'; rr(-s,-s*.2,s*2,s*1.35,2); ctx.fill(); ctx.strokeStyle='#f3c17b'; ctx.beginPath(); ctx.arc(0,-s*.15,s*.65,Math.PI,0); ctx.stroke();

  }else if(kind==='truck'){
    ctx.fillStyle='#e94f45'; ctx.fillRect(-s,-s*.6,s*1.25,s); ctx.fillStyle='#e8d6aa'; ctx.fillRect(s*.2,-s*.35,s*.75,s*.75); ctx.fillStyle='#241a12'; ctx.beginPath(); ctx.arc(-s*.5,s*.52,s*.28,0,6.3); ctx.arc(s*.55,s*.52,s*.28,0,6.3); ctx.fill();

function wrapText(text,x,y,maxW,lh,size,col){
  ctx.font='600 '+size+'px ui-rounded, "Avenir Next", "Segoe UI", system-ui, sans-serif';
  ctx.textAlign='left'; ctx.textBaseline='middle'; ctx.fillStyle=col;
  const words=text.split(' '); let line='';
  for(const w of words){
    const test=line?line+' '+w:w;
    if(ctx.measureText(test).width>maxW && line){ ctx.fillText(line,x,y); y+=lh; line=w; }
    else line=test;
  }
  if(line){ ctx.fillText(line,x,y); y+=lh; }
  return y;
}

/* ---------------- main loop ---------------- */
let last=performance.now();
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now;
  update(dt);
  uiButtons=[];
  if(screen==='title') drawTitle();
  else {
    drawBG();
    if(screen==='play') drawPlay();
    else if(screen==='result') drawResult();
    else if(screen==='cabinet') drawCabinet();
    else if(screen==='codex') drawCodex();
  }
  requestAnimationFrame(frame);
}

/* ---------------- input ---------------- */
let pointerDown=null, pressedBtn=null;
let kbActive=false, kr=ROWS-1, kc=Math.floor(COLS/2);

function pos(e){
  const rect=cv.getBoundingClientRect();
  const p = (e.touches&&e.touches[0])||(e.changedTouches&&e.changedTouches[0])||e;
  return {x:p.clientX-rect.left, y:p.clientY-rect.top};
}
function cellAt(x,y){
  if(x<bx||y<by||x>=bx+bw||y>=by+bh) return null;
  return {c:Math.floor((x-bx)/cell), r:Math.floor((y-by)/cell)};
}
function btnAt(x,y){
  for(let i=uiButtons.length-1;i>=0;i--){
    const b=uiButtons[i];
    const pad=6;
    if(x>=b.x-pad&&x<=b.x+b.w+pad&&y>=b.y-pad&&y<=b.y+b.h+pad) return b;
  }
  return null;
}
function onDown(e){
  e.preventDefault(); initAudio();
  const {x,y}=pos(e);
  const b=btnAt(x,y);
  if(b){ pressedBtn=b.id; pointerDown={x,y,btn:b.id}; sfxUI(); return; }
  const cl = (screen==='play')? cellAt(x,y):null;
  pointerDown={x,y,cell:cl};
  if(cl && !busy) { const p=at(cl.r,cl.c); if(p){ p.pop=Math.max(p.pop,0.18); sfxTap(); } }
}
function onUp(e){
  e.preventDefault();
  const {x,y}=pos(e);
  const pd=pointerDown; pointerDown=null; pressedBtn=null;
  if(!pd) return;
  if(pd.btn){
    const b=btnAt(x,y);
    if(b && b.id===pd.btn && !b.disabled) handleButton(b.id);
    return;
  }
  if(screen!=='play') return;
  const cl=cellAt(x,y);
  if(!cl||!pd.cell) return;
  const dx=Math.abs(x-pd.x), dy=Math.abs(y-pd.y);
  // drag = shift gesture if shift is armed or available
  if((dx>cell*0.45||dy>cell*0.45)){
    if(st.armed==='shift' || (st.charges.shift>0 && !st.armed)){
      const from=pd.cell;
      const d=Math.abs(from.r-cl.r)+Math.abs(from.c-cl.c);
      if(d===1){
        st.armed='shift'; st.shiftFrom=from;
        attemptAct(cl.r,cl.c);
        return;
      }
    }
    return; // ignore stray drags: prevents accidental moves
  }
  if(cl.r===pd.cell.r && cl.c===pd.cell.c){
    kbActive=false;
    attemptAct(cl.r,cl.c);
  }
}
function handleButton(id){
  if(id==='start'){ if(!run) newRun(); startStage(run.stage); return; }
  if(id==='howto'){ prevScreen='title'; screen='codex'; return; }
  if(id==='codex'){ prevScreen=screen; screen='codex'; codexPulse=0; return; }
  if(id==='closecodex'){ screen=prevScreen==='title'?'title':'play'; return; }
  if(id==='mute'){ muted=!muted; if(master) master.gain.value = muted?0:0.5; setDrone(muted?0:0.06); return; }
  if(id==='retry'){ startStage(run.stage); return; }
  if(id==='next'){
    if(run.stage>=STAGES.length-1){ screen='cabinet'; return; }
    startStage(run.stage+1); return;
  }
  if(id==='cabinet'){ prevScreen=screen; screen='cabinet'; return; }
  if(id==='back'){
    if(st && st.over && st.win && run.stage>=STAGES.length-1){ newRunKeepCabinet(); return; }
    screen = (st && st.over)? 'result' : (st? 'play':'title'); return;
  }
  if(id==='finish'){ endRound(true); return; }
  if(id==='sight'){ st.sight=!st.sight; return; }
  if(id==='shift'||id==='ember'){
    if(st.charges[id]<=0) return;
    st.armed = (st.armed===id)? null : id;
    st.shiftFrom=null;
    hint(id==='shift'? 'Tap an item, then a neighbouring space.' : 'Tap one item or pallet to clear it.');
    return;
  }
}
function newRunKeepCabinet(){
  // loop the tides, keep the cabinet
  const keep={relics:run.relics, lumens:run.lumens, verbs:run.verbs, codex:run.codex, best:run.best};
  newRun(); run.relics=keep.relics; run.lumens=keep.lumens; run.verbs=keep.verbs; run.codex=keep.codex; run.best=keep.best;
  startStage(0);
}

cv.addEventListener('pointerdown', onDown, {passive:false});
cv.addEventListener('pointerup', onUp, {passive:false});

window.addEventListener('keydown', e=>{
  initAudio();
  const k=e.key;
  if(screen==='title'){ if(k==='Enter'||k===' '){ handleButton('start'); e.preventDefault(); } return; }
  if(screen==='codex'){ if(k==='Escape'||k==='Enter'||k===' '||k.toLowerCase()==='i'){ handleButton('closecodex'); e.preventDefault(); } return; }
  if(screen==='cabinet'){ if(k==='Escape'||k==='Enter'){ handleButton('back'); } return; }
  if(screen==='result'){
    if(k==='Enter'||k===' '){ handleButton(st.win?'next':'retry'); e.preventDefault(); }
    if(k.toLowerCase()==='c') handleButton('cabinet');
    return;
  }
  // play
  if(k==='ArrowLeft'){ kbActive=true; kc=Math.max(0,kc-1); e.preventDefault(); }
  else if(k==='ArrowRight'){ kbActive=true; kc=Math.min(COLS-1,kc+1); e.preventDefault(); }
  else if(k==='ArrowUp'){ kbActive=true; kr=Math.max(0,kr-1); e.preventDefault(); }
  else if(k==='ArrowDown'){ kbActive=true; kr=Math.min(ROWS-1,kr+1); e.preventDefault(); }
  else if(k==='Enter'||k===' '){ kbActive=true; attemptAct(kr,kc); e.preventDefault(); }
  else if(k==='1') handleButton('shift');
  else if(k==='2') handleButton('ember');
  else if(k==='3') handleButton('sight');
  else if(k.toLowerCase()==='i') { prevScreen='play'; screen='codex'; codexPulse=0; }
  else if(k.toLowerCase()==='r') handleButton('retry');
  else if(k.toLowerCase()==='f' && st.done) handleButton('finish');
  else if(k.toLowerCase()==='m') handleButton('mute');
});

/* ---------------- boot ---------------- */
measureSafeArea();
resize();
newRun();
requestAnimationFrame(frame);
</script>
</body>
</html>
