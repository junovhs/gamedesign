<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>THE LITTLE DIGGER</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#08060c;
    font-family:ui-monospace,Menlo,Consolas,monospace;-webkit-user-select:none;user-select:none;touch-action:manipulation}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  #stage{position:relative}
  canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges}
  #ui{position:absolute;inset:0;pointer-events:none;display:flex;align-items:center;justify-content:center}
  .panel{pointer-events:auto;width:100%;height:100%;background:rgba(8,6,12,.93);
    display:flex;align-items:center;justify-content:center;padding:4%}
  .card{width:100%;max-width:440px;max-height:100%;overflow:auto;background:#1e1826;
    border:4px solid #08060c;box-shadow:6px 6px 0 #08060c;padding:13px}
  .card::-webkit-scrollbar{width:8px}.card::-webkit-scrollbar-thumb{background:#4d3d63}
  h1{margin:0 0 3px;font-size:22px;letter-spacing:4px;color:#e8b830;text-shadow:3px 3px 0 #08060c;line-height:1.15}
  h2{margin:0 0 9px;font-size:13px;letter-spacing:3px;color:#5ed986}
  h2.bad{color:#e0604f}
  p.s{margin:0 0 11px;font-size:11px;line-height:1.65;color:#9c90b4;letter-spacing:.4px}
  p.s b{color:#e8b830}
  .st{font-size:11px;color:#c0b4d8;margin:3px 0;letter-spacing:1px;display:flex;justify-content:space-between}
  .st b{color:#e8b830}
  .row{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:8px}
  button.b{pointer-events:auto;cursor:pointer;font-family:inherit;font-weight:bold;font-size:11px;
    letter-spacing:2px;padding:12px 10px;background:#5ed986;color:#0b2a16;border:3px solid #08060c;
    box-shadow:4px 4px 0 #08060c;flex:1;min-width:100px;text-transform:uppercase;transition:transform .05s,box-shadow .05s}
  button.b:active{transform:translate(4px,4px);box-shadow:0 0 0 #08060c}
  button.b.a{background:#f09a52;color:#361a06}
  button.b.g{background:#392c4c;color:#c0b4d8}
  button.b:disabled{background:#2e2640;color:#665a80;cursor:default}
  .it{display:flex;gap:9px;align-items:center;padding:8px;margin-bottom:6px;background:#161020;border:3px solid #08060c}
  .it .t{flex:1}
  .it .n{font-size:11px;letter-spacing:1px;color:#e8b830;margin-bottom:3px}
  .it .d{font-size:10px;line-height:1.5;color:#9c90b4}
  .it button.b{flex:0 0 auto;min-width:70px;padding:9px 6px}
  .it.off{opacity:.45}
  .fg{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-bottom:8px}
  .fc{background:#161020;border:3px solid #08060c;padding:5px;text-align:center}
  .fc .q{font-size:19px;color:#392c4c;line-height:1.2}
  .fc .l{font-size:7px;letter-spacing:.3px;color:#665a80;margin-top:2px;line-height:1.3}
  .fc.got .q{color:#e8b830}
  .fc.got .l{color:#9c90b4}
  /* The way out is a DOM button, not canvas pixels. Sized in CSS pixels it stays a real
     thumb target (>=44px) no matter how small the canvas scales on a given phone, which
     the old 10x7 canvas-space glyph never was. */
  #menu{position:absolute;top:0;right:0;width:46px;height:46px;padding:0;margin:0;
    pointer-events:auto;cursor:pointer;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:4px;background:#392c4c;border:0;
    border-left:2px solid #08060c;border-bottom:2px solid #08060c}
  #menu i{display:block;width:20px;height:3px;background:#c0b4d8}
  #menu:active{background:#5ed986}
  #menu:active i{background:#0b2a16}
  #menu[hidden]{display:none}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="cv"></canvas><div id="ui"></div>
<button id="menu" aria-label="Menu" hidden><i></i><i></i><i></i></button></div></div>
<script>
"use strict";
/* ==================================================================
   THE LITTLE DIGGER
   You dig a hole in your backyard. Each screen is one room of it,
   and it stays dug.
   Break the wrong block and the ceiling comes down on you. Break the
   right one and the mass drops -- and you ride it down.
   ================================================================== */

const TILE = 16, COLS = 10, ROWS = 16, HUD = 28;
// The top-right of the HUD belongs to the menu button, which is a DOM element sized in
// CSS pixels. Nothing on the canvas may be drawn under it, so the readouts reserve this
// much width; PIPROW is the pick-pip wrap, kept short enough to clear the bag meter.
const MENUW = 36, PIPROW = 8;
const W = COLS*TILE, H = HUD + ROWS*TILE;      // 160 x 284
const idx = (c,r) => r*COLS + c;

const cv = document.getElementById('cv'), ctx = cv.getContext('2d',{alpha:false});
const uiEl = document.getElementById('ui'), stage = document.getElementById('stage');
const menuEl = document.getElementById('menu');

let SCALE = 2;
function fit(){
  // The exact ratio, never floored. Flooring to an integer scale threw away up to a
  // whole step of size -- a 390-wide phone landed on 2x and played inside a 320px box
  // with black bars, which shrank every touch target with it. The device pixel ratio is
  // 2-3 on any phone this runs on, so a fractional CSS scale still lands each game pixel
  // on several device pixels and stays crisp under image-rendering:pixelated.
  SCALE = Math.min(window.innerWidth/W, window.innerHeight/H);
  cv.width = W; cv.height = H;
  cv.style.width = (W*SCALE)+'px'; cv.style.height = (H*SCALE)+'px';
  stage.style.width = (W*SCALE)+'px'; stage.style.height = (H*SCALE)+'px';
  ctx.imageSmoothingEnabled = false;
}
window.addEventListener('resize', fit); fit();

/* ---------------- pixel font: 3x5 ---------------- */
const FONT = {
 '0':[7,5,5,5,7],'1':[2,6,2,2,7],'2':[7,1,7,4,7],'3':[7,1,7,1,7],'4':[5,5,7,1,1],
 '5':[7,4,7,1,7],'6':[7,4,7,5,7],'7':[7,1,1,1,1],'8':[7,5,7,5,7],'9':[7,5,7,1,7],
 'A':[7,5,7,5,5],'B':[6,5,6,5,6],'C':[7,4,4,4,7],'D':[6,5,5,5,6],'E':[7,4,7,4,7],
 'F':[7,4,7,4,4],'G':[7,4,5,5,7],'H':[5,5,7,5,5],'I':[7,2,2,2,7],'J':[1,1,1,5,7],
 'K':[5,5,6,5,5],'L':[4,4,4,4,7],'M':[5,7,7,5,5],'N':[6,5,5,5,5],'O':[7,5,5,5,7],
 'P':[7,5,7,4,4],'Q':[7,5,5,7,1],'R':[7,5,7,6,5],'S':[7,4,7,1,7],'T':[7,2,2,2,2],
 'U':[5,5,5,5,7],'V':[5,5,5,5,2],'W':[5,5,7,7,5],'X':[5,5,2,5,5],'Y':[5,5,7,2,2],
 'Z':[7,1,2,4,7],' ':[0,0,0,0,0],'.':[0,0,0,0,2],',':[0,0,0,2,2],'-':[0,0,7,0,0],
 '!':[2,2,2,0,2],'?':[7,1,3,0,2],':':[0,2,0,2,0],'/':[1,1,2,4,4],'+':[0,2,7,2,0],
 '(':[2,4,4,4,2],')':[2,1,1,1,2],'>':[4,2,1,2,4],'<':[1,2,4,2,1],'*':[0,5,2,5,0],
 "'":[2,2,0,0,0],'%':[5,1,2,4,5],'#':[5,7,5,7,5],'=':[0,7,0,7,0]
};
function px(x,y,w,h,c){ ctx.fillStyle=c; ctx.fillRect(x|0,y|0,w|0,h|0); }
function textW(s,sc){ sc=sc||1; return s.length*4*sc - sc; }
function text(s,x,y,c,sc){
  sc = sc||1; ctx.fillStyle = c;
  for(let i=0;i<s.length;i++){
    const g = FONT[s[i].toUpperCase()]; if(!g) continue;
    const gx = x + i*4*sc;
    for(let r=0;r<5;r++){ const b=g[r];
      if(b&4) ctx.fillRect(gx,      y+r*sc, sc, sc);
      if(b&2) ctx.fillRect(gx+sc,   y+r*sc, sc, sc);
      if(b&1) ctx.fillRect(gx+2*sc, y+r*sc, sc, sc);
    }
  }
}
function textSh(s,x,y,c,sc){ sc=sc||1; text(s,x+sc,y+sc,'#08060c',sc); text(s,x,y,c,sc); }
function textC(s,y,c,sc){ sc=sc||1; textSh(s,(W-textW(s,sc))>>1,y,c,sc); }

/* ---------------- audio ---------------- */
let AC=null, MUTED=false;
function ac(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
  if(AC && AC.state==='suspended') AC.resume(); return AC; }
function tone(f,d,ty,v,f2){ if(MUTED||!ac())return; const t=AC.currentTime;
  const o=AC.createOscillator(), g=AC.createGain();
  o.type=ty||'square'; o.frequency.setValueAtTime(f,t);
  if(f2) o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t+d);
  g.gain.setValueAtTime(v||.1,t); g.gain.exponentialRampToValueAtTime(.0008,t+d);
  o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+d+.02); }
function noise(d,v,lp){ if(MUTED||!ac())return; const t=AC.currentTime;
  const n=Math.floor(AC.sampleRate*d), b=AC.createBuffer(1,n,AC.sampleRate), dt=b.getChannelData(0);
  for(let i=0;i<n;i++) dt[i]=(Math.random()*2-1)*(1-i/n);
  const s=AC.createBufferSource(); s.buffer=b;
  const f=AC.createBiquadFilter(); f.type='lowpass'; f.frequency.value=lp||900;
  const g=AC.createGain(); g.gain.value=v||.16;
  s.connect(f); f.connect(g); g.connect(AC.destination); s.start(t); }

/* ---------------- materials ---------------- */
// hard = tool level required. loose = falls unless the tile directly below holds it.
// Everything else is structural: it hangs off the two side walls, so cutting a mass
// free of BOTH walls is what drops it.
const MAT = {
  1:{n:'DIRT',    loose:true,  hard:0, val:0,  pal:['#7d5836','#93683f','#573a22']},
  2:{n:'STONE',   loose:false, hard:0, val:0,  pal:['#635d6e','#77707f','#4a4456']},
  3:{n:'COPPER',  loose:false, hard:0, val:5,  pal:['#c07a3c','#dd9550','#8e5626'], ore:1},
  4:{n:'IRON',    loose:false, hard:0, val:11, pal:['#a3acb9','#c2cbd8','#7b838f'], ore:1},
  5:{n:'SLATE',   loose:false, hard:1, val:0,  pal:['#414859','#515a6d','#2f3441']},
  6:{n:'SILVER',  loose:false, hard:1, val:26, pal:['#cfd9e6','#eef4fb','#9ba7b6'], ore:1},
  7:{n:'BASALT',  loose:false, hard:2, val:0,  pal:['#272332','#332e40','#1a1722']},
  8:{n:'GOLD',    loose:false, hard:1, val:55, pal:['#dda927','#f5cd56','#ad7f16'], ore:1},
  9:{n:'CUTLERY', loose:true,  hard:0, val:3,  pal:['#b3bdc9','#d6e1ed','#8d97a3'], ore:1},
 10:{n:'TILE',    loose:false, hard:0, val:0,  pal:['#c7d2cc','#dfe8e2','#a0aaa4']},
 11:{n:'PIPE',    loose:false, hard:0, val:2,  pal:['#54724f','#6a8c5f','#3d553b'], ore:1, burst:1},
 12:{n:'ROOT',    loose:false, hard:0, val:3,  pal:['#7f5e2e','#9a763c','#604723'], ore:1, regrow:1},
 13:{n:'MEAT',    loose:false, hard:1, val:80, pal:['#8f3d4d','#ad5061','#6d2a38'], ore:1, alive:1},
 14:{n:'BEAM',    loose:false, hard:9, val:0,  pal:['#8f6e3c','#ad874c','#6d512a'], anchor:1}
};

/* ---------------- biomes: one new behaviour per layer, deeper is stranger --------- */
// mix = the bulk rock a block can be made of. ore/oreRate is rolled separately, so
// how rich a layer is stays a dial rather than a side effect of the block shuffling.
const BIOMES = [
 {from:1,  name:'THE BACKYARD',       wall:'#2b1e15', ore:3,  oreRate:.13,
  mix:[[1,55],[2,45]],                 note:'DIRT SLIDES. IT WILL NOT HOLD A CEILING.'},
 {from:5,  name:'THE CUTLERY',        wall:'#1a1d27', ore:4,  oreRate:.12,
  mix:[[2,42],[5,33],[9,25]],          note:'CUTLERY SLIDES LIKE DIRT. SLATE NEEDS AN IRON PICK.'},
 {from:11, name:'SOMEONES FLOOR',     wall:'#132020', ore:6,  oreRate:.10,
  mix:[[10,48],[5,34],[11,18]],        note:'BURST A PIPE AND THE WATER DIGS FOR YOU.'},
 {from:18, name:'THE UPSIDE ORCHARD', wall:'#180f1e', ore:8,  oreRate:.09,
  mix:[[2,38],[12,36],[5,26]],         note:'ROOTS GROW BACK WHILE YOU WORK.'},
 {from:26, name:'IT BREATHES',        wall:'#100609', ore:13, oreRate:.08,
  mix:[[7,44],[5,34],[2,22]],          note:'IT MOVES WHEN YOU ARE NOT LOOKING.'}
];
function biomeAt(d){ let b=BIOMES[0]; for(const x of BIOMES) if(d>=x.from) b=x; return b; }
function biomeIdx(d){ let i=0; for(let k=0;k<BIOMES.length;k++) if(d>=BIOMES[k].from) i=k; return i; }

/* ---------------- finds: visible in the rock, each one changes something ---------- */
const FINDS = [
 {n:'SPRINKLER HEAD', d:2,  v:40,   perk:'pick', txt:'+1 PICK'},
 {n:'GARDEN GNOME',   d:4,  v:90,   perk:'bag',  txt:'+3 SATCHEL'},
 {n:'A FORK',         d:7,  v:150,  perk:'pick', txt:'+1 PICK'},
 {n:'WEDDING RING',   d:10, v:400,  perk:'bag',  txt:'+3 SATCHEL'},
 {n:'RUBBER DUCK',    d:13, v:700,  perk:'pick', txt:'+1 PICK'},
 {n:'A DOORKNOB',     d:16, v:1100, perk:'bag',  txt:'+3 SATCHEL'},
 {n:'AN APPLE CORE',  d:20, v:1900, perk:'pick', txt:'+1 PICK'},
 {n:'A TOOTH',        d:23, v:3000, perk:'bag',  txt:'+3 SATCHEL'},
 {n:'SOMETHING WARM', d:28, v:6000, perk:'pick', txt:'+1 PICK'}
];

/* ---------------- save ---------------- */
const KEY='digger:v2';
const NEW = () => ({bank:0, deepest:0, tool:0, lantern:0, satchel:0, beams:0,
                    finds:[], screens:{}, reroll:{}, dives:0, best:0,
                    seed:(Math.random()*1e9)|0, seen:0});
let SV = NEW(), mem = null;
async function load(){ try{ const r=localStorage.getItem(KEY); if(r) return JSON.parse(r);}catch(e){} return mem; }
async function save(){ mem=JSON.parse(JSON.stringify(SV)); try{ localStorage.setItem(KEY, JSON.stringify(SV)); }catch(e){} }

const perkN   = (p) => SV.finds.reduce((a,i)=> a + (FINDS[i] && FINDS[i].perk===p ? 1:0), 0);
const PICKS   = () => 7 + SV.lantern + perkN('pick');
const CAP     = () => 20 + SV.satchel*8 + perkN('bag')*3;
const TOOL    = () => SV.tool;
const liftMax = () => Math.floor(SV.deepest/3)*3;

/* ---------------- world ---------------- */
// Math.imul, not `*`: a plain 32-bit-sized multiply overflows the float mantissa and
// throws away the low bits, which made every screen come out identical.
function hash(a,b,s){
  let h = Math.imul(a|0, 374761393) ^ Math.imul(b|0, 668265263) ^ Math.imul(s|0, 2246822519);
  h = Math.imul(h ^ (h>>>13), 1274126177);
  h ^= h>>>16;
  return (h>>>0) / 4294967296;
}
function pickMix(mix,t){ let s=0; for(const m of mix) s+=m[1]; let x=t*s;
  for(const m of mix){ x-=m[1]; if(x<=0) return m[0]; } return mix[0][0]; }

function genScreen(d, entryCol, salt){
  const B = biomeAt(d), G = new Uint8Array(COLS*ROWS), F = new Uint8Array(COLS*ROWS);
  // salt re-rolls one depth without disturbing the rest of the shaft: the seed is the
  // world, so a wedged screen has to be reshaped locally or not at all.
  const s = SV.seed + d*7919 + (salt||0)*104729;
  // 2x2 blocks, each forced to differ from its left and upper neighbour. That keeps
  // material arriving in small readable chunks instead of one continent of dirt.
  const bcols = Math.ceil(COLS/2), brows = Math.ceil(ROWS/2);
  const blocks = new Uint8Array(bcols*brows);
  for(let by=0; by<brows; by++) for(let bx=0; bx<bcols; bx++){
    const left = bx>0 ? blocks[by*bcols+bx-1] : 0;
    const up   = by>0 ? blocks[(by-1)*bcols+bx] : 0;
    let m = 0;
    for(let k=0;k<8;k++){
      m = pickMix(B.mix, hash(bx*31+k, by*17+k, s));
      if(m!==left && m!==up) break;
    }
    // A block is occasionally a seam of ore instead of bulk rock.
    if(hash(bx*13, by*7, s+2201) < B.oreRate) m = B.ore;
    blocks[by*bcols+bx] = m;
  }
  for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++){
    let m = blocks[((r>>1)*bcols) + (c>>1)];
    if(hash(c,r,s+555) < .22) m = pickMix(B.mix, hash(c,r,s+91));   // roughen the edges
    G[idx(c,r)] = m;
  }
  // The side walls have to be structural or nothing in the screen hangs from anything.
  const wallMat = biomeIdx(d)>=4 ? 7 : (biomeIdx(d)===2 ? 10 : 2);
  for(let r=0;r<ROWS;r++) for(const c of [0,COLS-1]){
    const m = G[idx(c,r)];
    if(!m || MAT[m].loose) G[idx(c,r)] = wallMat;
  }
  // A soft seam wanders top to bottom in broken segments: there is always a route
  // down, and it is never the whole answer.
  const soft = biomeIdx(d)===1 ? 9 : (biomeIdx(d)===2 ? 11 : 1);
  let sc = entryCol;
  for(let r=0;r<ROWS-1;r++){
    if(hash(r, d, s+77) < .55) sc += hash(r, d, s+31) < .5 ? -1 : 1;
    sc = Math.max(1, Math.min(COLS-2, sc));
    if(hash(r,sc,s+404) < .6) G[idx(sc,r)] = soft;
  }
  // One find, where you can see it long before you can have it.
  for(let i=0;i<FINDS.length;i++){
    if(FINDS[i].d === d && SV.finds.indexOf(i) < 0){
      const fc = 1 + Math.floor(hash(d,i,s+13)*(COLS-2));
      const fr = 4 + Math.floor(hash(d,i,s+29)*(ROWS-6));
      if(!G[idx(fc,fr)]) G[idx(fc,fr)] = 2;
      F[idx(fc,fr)] = i+1;
    }
  }
  // The floor goes in LAST so nothing above can punch a drain hole in it. It is laid in
  // two alternating materials, so breaking through is several swings, not one.
  const fa = biomeIdx(d)===2 ? 10 : 2, fb = biomeIdx(d)===2 ? 2 : 10;
  for(let c=0;c<COLS;c++){
    G[idx(c,ROWS-1)] = hash(c, d, s+900) < .5 ? fa : fb;   // both hard:0, both structural
    F[idx(c,ROWS-1)] = 0;
  }
  const st = {g:G, f:F, ec:Math.max(1, Math.min(COLS-2, entryCol))};
  openEntry(st, st.ec);
  settle(st.g, st.f, -1, -1);          // hand the player a screen that is already stable
  openEntry(st, st.ec);
  return st;
}
function openEntry(st, ec){
  st.g[idx(ec,0)]=0; st.f[idx(ec,0)]=0;
  st.g[idx(ec,1)]=0; st.f[idx(ec,1)]=0;
  if(!st.g[idx(ec,2)]) st.g[idx(ec,2)] = 2;
  st.ec = ec;
}
function getScreen(d, entryCol){
  const k = String(d), want = Math.max(1, Math.min(COLS-2, entryCol));
  if(SV.screens[k]){
    const s = SV.screens[k];
    const st = {g:Uint8Array.from(s.g), f:Uint8Array.from(s.f), ec:s.ec};
    openEntry(st, want);               // re-open the way in, in case a later visit filled it
    return st;
  }
  return genScreen(d, want, SV.reroll[k]||0);
}
function storeScreen(d, st){
  if(!st) return;
  SV.screens[String(d)] = {g:Array.from(st.g), f:Array.from(st.f), ec:st.ec};
}

/* ---------------- support: what is holding what up ---------------- */
// Structural material hangs off the side walls (and off beams) through orthogonal
// contact. Loose material is held only by whatever is directly beneath it.
function computeSupport(G){
  const sup = new Uint8Array(COLS*ROWS), stack = [];
  const seed = (c,r) => { const i=idx(c,r); if(!sup[i]){ sup[i]=1; stack.push(c,r); } };
  for(let r=0;r<ROWS;r++) for(const c of [0,COLS-1]){
    const m=G[idx(c,r)]; if(m && !MAT[m].loose) seed(c,r);
  }
  for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++){
    const m=G[idx(c,r)]; if(m && MAT[m].anchor) seed(c,r);
  }
  while(stack.length){
    const r = stack.pop(), c = stack.pop();
    const nb = [[c-1,r],[c+1,r],[c,r-1],[c,r+1]];
    for(const p of nb){
      const nc=p[0], nr=p[1];
      if(nc<0||nc>=COLS||nr<0||nr>=ROWS) continue;
      const i=idx(nc,nr), m=G[i];
      if(!m || sup[i]) continue;
      // A loose tile only counts as held when the supporter is the tile right below it.
      if(MAT[m].loose && !(nc===c && nr===r-1)) continue;
      sup[i]=1; stack.push(nc,nr);
    }
  }
  return sup;
}

// One pass = one row of falling, and each pass is an animation frame. The cascade is
// watchable and, more to the point, predictable enough to plan around.
function settle(G, F, pc0, pr0){
  const frames = [], fell = [];
  // The state before anything moved. The renderer needs it to slide the very first row
  // of the fall; without it the opening row of every collapse snaps into place.
  const g0 = Uint8Array.from(G);
  let pc = pc0, pr = pr0, buried = false, out = false;
  for(let guard=0; guard<400; guard++){
    const sup = computeSupport(G);
    let moved = false;
    for(let r=ROWS-1;r>=0;r--) for(let c=0;c<COLS;c++){
      const i=idx(c,r), m=G[i];
      if(!m || sup[i]) continue;
      if(r===ROWS-1){                                               // falls into the dark
        // A find riding that tile would be gone for good, since the generator places
        // each one exactly once. Treat it as landing in your bag instead.
        if(F[i]) fell.push(F[i]-1);
        G[i]=0; F[i]=0; moved=true;
      }
      else if(!G[i+COLS]){ G[i+COLS]=m; F[i+COLS]=F[i]; G[i]=0; F[i]=0; moved=true; }
    }
    if(pr>=0){
      if(G[idx(pc,pr)]){ buried=true; frames.push({g:Uint8Array.from(G),pc:pc,pr:pr}); break; }
      if(pr>=ROWS-1){ out=true; frames.push({g:Uint8Array.from(G),pc:pc,pr:pr}); break; }
      if(!G[idx(pc,pr+1)]){ pr++; moved=true; }
    }
    if(!moved) break;
    frames.push({g:Uint8Array.from(G), pc:pc, pr:pr});
  }
  return {frames:frames, buried:buried, out:out, pc:pc, pr:pr, fell:fell, g0:g0, pc0:pc0, pr0:pr0};
}

/* ---------------- clusters ---------------- */
// One swing takes the nearest MAXBREAK tiles of the same material, breadth-first from
// where you tapped. Capping it means a big seam is several decisions instead of one
// free room-clear, and *where* in a mass you swing is itself a choice. The preview
// outlines the exact tiles, so the cap never has to be guessed at.
const MAXBREAK = 6;
function cluster(G, c, r){
  const m = G[idx(c,r)]; if(!m) return [];
  const seen = new Uint8Array(COLS*ROWS), out = [], q = [c,r];
  seen[idx(c,r)] = 1;
  let head = 0;
  while(head < q.length && out.length/2 < MAXBREAK){
    const cc = q[head++], rr = q[head++];
    out.push(cc, rr);
    const nb=[[cc,rr+1],[cc-1,rr],[cc+1,rr],[cc,rr-1]];
    for(const p of nb){
      const nc=p[0], nr=p[1];
      if(nc<0||nc>=COLS||nr<0||nr>=ROWS) continue;
      const i=idx(nc,nr);
      if(seen[i] || G[i]!==m) continue;
      seen[i]=1; q.push(nc,nr);
    }
  }
  return out;
}

/* ---------------- run state ---------------- */
let mode = 'boot';           // boot | play | anim | panel
let scr = null;              // {g,f,ec}
let depth = 0, pc = 0, pr = 0;
let picks = 0, haul = 0, beamsLeft = 0;
let pending = null;          // previewed, not yet committed
let anim = null;
let parts = [], floats = [], shake = 0, msg = '', msgT = 0, msgAt = 0;
let now = 0;

/* ---------------- feel ----------------
   Everything below is presentation. None of it may answer a question the player is
   supposed to answer by swinging (DEC-03): light, weight and motion set mood, and the
   preview is still the only thing that tells you what a swing does. */
const STEP = .058;              // seconds a collapse spends on each row it falls
let hitstop = 0;                // impact freeze; render keeps drawing the stalled frame
let motes = [];                 // ambient drift, so a screen with nothing happening still breathes
let slide = 0;                  // 1 -> 0: the new screen rising into place under you
let dig = {x:0, y:0, face:1, sq:1, swing:-1, hop:0};
let hudBag = 0, popDepth = 0, popBag = 0, pips = [];

function toast(m){ msg = m; msgT = now + 1600; msgAt = now; }
function fl(x,y,t,c){ floats.push({x:x,y:y,t:t,c:c||'#e8b830',life:1,vy:-1.6,pop:1}); }
// Chunks: varied sizes and real gravity, so a broken tile throws rock rather than confetti.
function debris(x,y,pal,n){ for(let i=0;i<(n||6);i++) parts.push({
  x:x+Math.random()*TILE, y:y+Math.random()*TILE,
  vx:(Math.random()-.5)*2.4, vy:-Math.random()*1.9-.2, g:.17,
  s:1+((Math.random()*2.4)|0), c:pal[(Math.random()*pal.length)|0],
  life:.55+Math.random()*.55, fd:1.4}); }
function dust(x,y,n){ for(let i=0;i<(n||5);i++) parts.push({
  x:x+Math.random()*TILE, y:y+Math.random()*TILE,
  vx:(Math.random()-.5)*.7, vy:-Math.random()*.35, g:.02,
  s:1, c:'#8d80a4', life:.4+Math.random()*.4, fd:1.4}); }
// Ore pays out in light before it pays out in numbers.
function spark(x,y,c){ for(let i=0;i<5;i++) parts.push({
  x:x+4+Math.random()*8, y:y+4+Math.random()*8,
  vx:(Math.random()-.5)*3, vy:(Math.random()-.5)*3, g:.01,
  s:1, c:i&1?'#fffbe8':c, life:.22+Math.random()*.22, fd:3.4}); }
// A mass landing shoves the dust sideways, which is what sells the weight of it.
function puff(x,y,n){ for(let i=0;i<(n||8);i++){ const d=Math.random()<.5?-1:1; parts.push({
  x:x+Math.random()*TILE, y:y+TILE-2-Math.random()*3,
  vx:d*(.6+Math.random()*1.7), vy:-Math.random()*.3, g:.008,
  s:1+((Math.random()*2)|0), c:Math.random()<.5?'#8d80a4':'#6d6284',
  life:.45+Math.random()*.45, fd:1.1}); } }
function newMote(anywhere){ return {
  x:Math.random()*W, y: anywhere ? HUD+Math.random()*(H-HUD) : H-Math.random()*8,
  vx:(Math.random()-.5)*.14, vy:-.05-Math.random()*.13,
  a:.10+Math.random()*.22, ph:Math.random()*6.28}; }

/* ---------------- movement ---------------- */
const standable = (G,c,r) => (c>=0 && c<COLS && r>=0 && r<ROWS-1 && !G[idx(c,r)] && !!G[idx(c,r+1)]);

// Walking the surface you have already dug is free. Picks are only ever spent breaking.
function walkTargets(G, c, r){
  const seen = new Uint8Array(COLS*ROWS), stack=[c,r];
  seen[idx(c,r)]=1;
  while(stack.length){
    const rr=stack.pop(), cc=stack.pop();
    const nb=[[cc-1,rr],[cc+1,rr],[cc-1,rr-1],[cc+1,rr-1],[cc-1,rr+1],[cc+1,rr+1]];
    for(const p of nb){
      const nc=p[0], nr=p[1];
      if(nc<0||nc>=COLS||nr<0||nr>=ROWS) continue;
      const i=idx(nc,nr);
      if(seen[i] || !standable(G,nc,nr)) continue;
      seen[i]=1; stack.push(nc,nr);
    }
  }
  return seen;
}
// Arm's reach. You have to stand next to what you break, which is exactly why a
// collapse is dangerous.
function reachCells(){
  return [[pc,pr-1],[pc-1,pr],[pc+1,pr],[pc,pr+1],[pc-1,pr+1],[pc+1,pr+1]];
}
function inReach(c,r){
  for(const p of reachCells()) if(p[0]===c && p[1]===r) return true;
  return false;
}
function breakable(m){ return !!m && MAT[m].hard <= TOOL(); }

/* ---------------- the break ---------------- */
function planBreak(c,r){
  const cells = cluster(scr.g, c, r);
  const G = Uint8Array.from(scr.g), F = Uint8Array.from(scr.f);
  const isBurst = !!MAT[scr.g[idx(c,r)]].burst;
  let gain = 0; const got = [];
  const take = (j) => { const m=G[j]; if(!m) return;
    if(MAT[m].ore) gain += MAT[m].val;
    if(F[j]) got.push(F[j]-1);
    G[j]=0; F[j]=0; };
  for(let i=0;i<cells.length;i+=2) take(idx(cells[i], cells[i+1]));
  // A burst pipe blows a hole straight down: the one block that digs for you.
  if(isBurst){
    for(let i=0;i<cells.length;i+=2){
      const bc = cells[i];
      for(let br=cells[i+1]+1, k=0; k<3 && br<ROWS; k++, br++){
        const j = idx(bc,br);
        if(G[j] && MAT[G[j]].hard <= TOOL()) take(j); else break;
      }
    }
  }
  const sim = settle(G, F, pc, pr);
  return {c:c, r:r, cells:cells, g:G, f:F, sim:sim, gain:gain, got:got};
}

function commitBreak(){
  const p = pending; pending = null;
  picks--;
  if(p.c !== pc) dig.face = p.c > pc ? 1 : -1;
  dig.swing = 0;                                  // the arc plays over the break
  pips.push({x:40+(picks%PIPROW)*5, y:4+((picks/PIPROW)|0)*7, life:1});
  ac(); tone(220,.06,'square',.1,90); noise(.13,.2,1400);
  for(let i=0;i<p.cells.length;i+=2){
    const m = scr.g[idx(p.cells[i],p.cells[i+1])];
    if(!m) continue;
    debris(p.cells[i]*TILE, HUD + p.cells[i+1]*TILE, MAT[m].pal, 5);
    if(MAT[m].ore) spark(p.cells[i]*TILE, HUD + p.cells[i+1]*TILE, MAT[m].pal[1]);
  }
  if(p.gain>0){
    const room = Math.max(0, CAP()-haul), got = Math.min(room, p.gain);
    haul += got; popBag = 1;
    if(got>0) fl(p.c*TILE+8, HUD+p.r*TILE, '+'+got, '#e8b830');
    if(got<p.gain) toast('SATCHEL FULL');
  }
  awardFinds(p.got);
  scr.g = p.g; scr.f = p.f;
  shake = Math.min(7, 1.5 + p.sim.frames.length*.7);
  // The bigger the thing you just cut loose, the longer the world holds its breath.
  hitstop = Math.min(.10, .035 + p.sim.frames.length*.012);
  if(p.sim.frames.length>2) noise(.3,.22,600);
  applyBiomeQuirk();
  startAnim(p.sim);
}

// A break that dislodges nothing has no frames to play, so finish it on the spot
// rather than leaving an empty animation running.
function startAnim(s){
  if(!s.frames.length){ finishSim(s); return; }
  anim = {frames:s.frames, i:0, t:0, sim:s};
  mode = 'anim';
}
function awardFinds(list){
  if(!list || !list.length) return;
  for(const fi of list){
    if(FINDS[fi] === undefined || SV.finds.indexOf(fi) >= 0) continue;
    SV.finds.push(fi); SV.bank += FINDS[fi].v;
    toast(FINDS[fi].n + '  ' + FINDS[fi].txt);
    tone(880,.12,'triangle',.12,1320);
  }
}
function finishSim(s){
  anim = null;
  awardFinds(s.fell);
  if(s.frames.length){
    const last = s.frames[s.frames.length-1];
    scr.g = last.g; pc = last.pc; pr = last.pr;
  }
  storeScreen(depth, scr);
  // You rode something down. Land it: squash, dust out from under the boots, a thud
  // scaled to the drop.
  const drop = s.pr0 >= 0 ? pr - s.pr0 : 0;
  if(drop > 0 && !s.buried && !s.out){
    dig.sq = Math.max(.62, .86 - drop*.06);
    puff(pc*TILE, HUD+pr*TILE, 5+Math.min(8, drop*2));
    shake = Math.max(shake, Math.min(6, 1.6+drop*.9));
    hitstop = Math.max(hitstop, .04);
    tone(110-Math.min(50,drop*6), .16, 'sine', .13, 55);
  }
  if(s.buried){ endLeg('buried'); return; }
  if(s.out){ fellThrough(); return; }
  mode = 'play';
  if(s.frames.length) noise(.12,.14,700);
  // Out of picks, or every remaining swing would bury you: either way the screen is
  // finished with you. You keep the haul -- only a burial costs it.
  if(picks<=0 || !safeSwingExists()) endLeg('stuck');
}

// One new behaviour per layer, applied after the dust settles.
function applyBiomeQuirk(){
  const bi = biomeIdx(depth);
  if(bi===3 && Math.random()<.45){                     // roots grow back
    const opts=[];
    for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++){
      if(scr.g[idx(c,r)] || (c===pc&&r===pr)) continue;
      const nb=[[c-1,r],[c+1,r],[c,r-1],[c,r+1]];
      for(const p of nb){ const nc=p[0],nr=p[1];
        if(nc<0||nc>=COLS||nr<0||nr>=ROWS) continue;
        if(scr.g[idx(nc,nr)]===12){ opts.push(c,r); break; } }
    }
    if(opts.length){ const k=((Math.random()*(opts.length/2))|0)*2;
      scr.g[idx(opts[k],opts[k+1])] = 12; toast('IT GREW BACK'); }
  } else if(bi===4 && Math.random()<.35){              // it moves when you are not looking
    const opts=[];
    for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++){
      if(scr.g[idx(c,r)]!==13) continue;
      const nc=c+Math.sign(pc-c), nr=r+Math.sign(pr-r);
      if(nc<0||nc>=COLS||nr<0||nr>=ROWS) continue;
      if(!scr.g[idx(nc,nr)] && !(nc===pc&&nr===pr)) opts.push(c,r,nc,nr);
    }
    if(opts.length){ const k=((Math.random()*(opts.length/4))|0)*4;
      scr.g[idx(opts[k+2],opts[k+3])] = 13; scr.g[idx(opts[k],opts[k+1])] = 0;
      tone(70,.18,'sine',.12,50); toast('SOMETHING MOVED'); }
  }
}

function placeBeam(c,r){
  if(!SV.beams || beamsLeft<=0 || picks<=0) return false;
  if(scr.g[idx(c,r)] || !inReach(c,r)) return false;
  scr.g[idx(c,r)] = 14; picks--; beamsLeft--;
  tone(330,.09,'square',.1); toast('BEAM SET');
  startAnim(settle(scr.g, scr.f, pc, pr));
  return true;
}

/* ---------------- descending, banking, dying ---------------- */
function enterScreen(d, entryCol){
  if(scr) storeScreen(depth, scr);
  depth = d;
  scr = getScreen(d, entryCol);
  pc = scr.ec; pr = 1;
  const s = settle(scr.g, scr.f, pc, pr);           // drop onto whatever is under the entry
  if(s.frames.length) scr.g = s.frames[s.frames.length-1].g;
  pc = s.pc; pr = Math.min(s.pr, ROWS-2);
  awardFinds(s.fell);                               // anything shaken loose on the way in
  picks = PICKS(); beamsLeft = SV.beams ? 2 : 0; pending = null; anim = null;
  // Arriving is a landing, not a cut: the room rises into place under you and you hit
  // the floor of it.
  dig.x = pc; dig.y = pr; dig.sq = .7; dig.swing = -1; dig.hop = 0;
  slide = 1; popDepth = 1; hudBag = haul;
  parts.length = 0; floats.length = 0; pips.length = 0;
  if(!motes.length) for(let i=0;i<14;i++) motes.push(newMote(true));
  puff(pc*TILE, HUD+pr*TILE, 8);
  shake = Math.max(shake, 2.5);
  if(d > SV.deepest) SV.deepest = d;
  if(d > SV.best) SV.best = d;
  // You can arrive on a screen where every swing in reach buries you. finishSim() only
  // ever ran that check after a break, so an arrival like that left the player standing
  // with no legal input and nothing to press. Worse, the screen is persistent: ending
  // the leg would strand them again on the next visit. Reshape it instead.
  if(!safeSwingExists()) reshapeScreen();
  storeScreen(depth, scr); save();
  if(depth % 3 === 0) landingPanel();
  else { mode='play'; clearUI(); toast(biomeAt(d).name); }
}

// Re-roll this one depth and drop the player back into it. Destructive to whatever was
// already dug here, which is why it only ever runs when the alternative is a dead end.
function reshapeScreen(){
  const k = String(depth), want = scr ? scr.ec : (COLS>>1);
  for(let tries=0; tries<6; tries++){
    SV.reroll[k] = (SV.reroll[k]||0) + 1;
    delete SV.screens[k];
    scr = genScreen(depth, want, SV.reroll[k]);
    pc = scr.ec; pr = 1;
    const s = settle(scr.g, scr.f, pc, pr);
    if(s.frames.length) scr.g = s.frames[s.frames.length-1].g;
    pc = s.pc; pr = Math.min(s.pr, ROWS-2);
    awardFinds(s.fell);
    dig.x = pc; dig.y = pr; dig.sq = .7; dig.swing = -1; dig.hop = 0;
    if(safeSwingExists()) break;
  }
  storeScreen(depth, scr); save();
  toast('THE ROCK SHIFTED');
}

function fellThrough(){
  const bonus = Math.max(0, picks)*3;                // leftover picks are the mastery score
  if(bonus>0){ haul = Math.min(CAP(), haul+bonus); fl(pc*TILE, HUD+(ROWS-2)*TILE, '+'+bonus, '#5ed986'); }
  tone(140,.2,'sine',.13,70);
  enterScreen(depth+1, pc);
}

// Burial is the only thing that costs you the haul. Running dry or walking out is a
// worse trip, not a punishment -- that keeps efficiency and danger as separate pressures
// and keeps a three-minute session from ever ending in nothing.
function endLeg(reason){
  mode = 'panel';
  const buried = reason==='buried';
  const amount = haul; haul = 0;
  if(!buried) SV.bank += amount;
  storeScreen(depth, scr); save();
  if(buried){ noise(.5,.3,300); tone(90,.5,'sawtooth',.13,40); }
  else { tone(392,.12,'triangle',.11); }
  const title = buried ? 'BURIED' : (reason==='quit' ? 'BACK UP TOP' : 'THAT IS THE SCREEN');
  const why = buried
    ? 'The mass came down on top of you instead of under you.'
    : (reason==='quit' ? 'You climbed out with what you had.'
                       : 'Nothing left down here you can swing at safely.');
  ui(`<div class="panel"><div class="card">
    <h1>${title}</h1>
    <h2 class="${buried?'bad':''}">DEPTH ${depth}</h2>
    <p class="s">${why} ${buried ? `You lost <b>${amount}</b>.` : `Banked <b>${amount}</b>.`}</p>
    <p class="s">The hole is still there. So is every lift stop you have planted.</p>
    <div class="st"><span>PURSE</span><b>${SV.bank}</b></div>
    <div class="row"><button class="b" id="ok">BACK UP TOP</button></div>
  </div></div>`);
  on('#ok', surface);
}

function landingPanel(){
  mode = 'panel';
  const banked = haul; SV.bank += haul; haul = 0;
  SV.dives++;
  storeScreen(depth, scr); save();
  tone(523,.1,'triangle',.12); setTimeout(()=>tone(784,.16,'triangle',.12),90);
  const b = biomeAt(depth);
  ui(`<div class="panel"><div class="card">
    <h1>LANDING ${depth}</h1>
    <h2>${b.name}</h2>
    <p class="s">Banked <b>${banked}</b>. The lift stops here from now on.</p>
    <p class="s">${b.note}</p>
    <div class="st"><span>PURSE</span><b>${SV.bank}</b></div>
    <div class="st"><span>DEEPEST</span><b>${SV.deepest}</b></div>
    <div class="row">
      <button class="b" id="down">GO DEEPER</button>
      <button class="b g" id="out">LIFT OUT</button>
    </div>
    <div class="row"><button class="b a" id="shop">SHOP</button></div>
  </div></div>`);
  on('#down', ()=>{ clearUI(); mode='play'; toast('COMMITTED'); });
  on('#out', surface);
  on('#shop', ()=>shop(landingPanel));
}

/* ---------------- menus ---------------- */
// The menu button is visible exactly when there is no panel already covering the screen.
function clearUI(){ uiEl.innerHTML=''; menuEl.hidden = false; }
function ui(h){ uiEl.innerHTML=''; menuEl.hidden = true;
  const d=document.createElement('div'); d.innerHTML=h.trim(); uiEl.appendChild(d.firstChild); }
function on(sel,fn){ const n=uiEl.querySelector(sel); if(n) n.onclick=()=>{ ac(); tone(700,.04,'square',.08); fn(); }; }

const SHOP = [
 {k:'tool1', n:'IRON PICK', c:150, has:()=>SV.tool>=1, buy:()=>{SV.tool=Math.max(SV.tool,1);},
  d:'Breaks slate, silver and gold. There is a lot down there you cannot touch yet.'},
 {k:'tool2', n:'THE DRILL', c:900, has:()=>SV.tool>=2, req:()=>SV.tool>=1, buy:()=>{SV.tool=2;},
  d:'Breaks basalt. Nothing else will.'},
 {k:'lamp',  n:'LANTERN', c:()=>60+SV.lantern*90, has:()=>SV.lantern>=5, lvl:()=>SV.lantern,
  buy:()=>{SV.lantern++;}, d:'+1 pick on every screen.'},
 {k:'bag',   n:'SATCHEL', c:()=>50+SV.satchel*80, has:()=>SV.satchel>=5, lvl:()=>SV.satchel,
  buy:()=>{SV.satchel++;}, d:'+6 carry. What does not fit stays in the ground.'},
 {k:'beam',  n:'BEAMS', c:280, has:()=>!!SV.beams, buy:()=>{SV.beams=1;},
  d:'Two a screen. A beam holds whatever touches it, so you choose what does not fall.'}
];
function costOf(it){ return typeof it.c==='function' ? it.c() : it.c; }

function shop(back){
  mode='panel';
  let rows='';
  for(const it of SHOP){
    const owned = it.has(), locked = it.req && !it.req(), cost = costOf(it);
    const can = !owned && !locked && SV.bank>=cost;
    const lvl = it.lvl ? ' '+'I'.repeat(Math.min(5, it.lvl()+1)) : '';
    rows += `<div class="it ${owned||locked?'off':''}"><div class="t">
      <div class="n">${it.n}${it.lvl&&!owned?lvl:''}</div>
      <div class="d">${locked?'NEEDS THE IRON PICK FIRST.':it.d}</div></div>
      <button class="b ${can?'':'g'}" data-k="${it.k}" ${can?'':'disabled'}>${owned?'OWNED':cost}</button></div>`;
  }
  ui(`<div class="panel"><div class="card">
    <h1>SHOP</h1><h2>PURSE ${SV.bank}</h2>
    ${rows}
    <div class="row"><button class="b g" id="back">BACK</button></div>
  </div></div>`);
  for(const it of SHOP){
    const n = uiEl.querySelector('[data-k="'+it.k+'"]');
    if(n && !n.disabled) n.onclick = ()=>{ ac();
      const cost = costOf(it);
      if(SV.bank < cost) return;
      SV.bank -= cost; it.buy(); save();
      tone(660,.09,'triangle',.12); setTimeout(()=>tone(990,.12,'triangle',.11),70);
      shop(back);
    };
  }
  on('#back', back);
}

function findsPanel(back){
  mode='panel';
  let cells='';
  for(let i=0;i<FINDS.length;i++){
    const got = SV.finds.indexOf(i)>=0;
    cells += `<div class="fc ${got?'got':''}"><div class="q">${got?'*':'?'}</div>
      <div class="l">${got?FINDS[i].n:'DEPTH '+FINDS[i].d}</div></div>`;
  }
  ui(`<div class="panel"><div class="card">
    <h1>THE HOLE</h1><h2>${SV.finds.length} / ${FINDS.length}</h2>
    <p class="s">Things in the ground that should not be in the ground. You can see them
      glinting in the rock before you can reach them. Each one changes something.</p>
    <div class="fg">${cells}</div>
    <div class="st"><span>PICKS EVERY SCREEN</span><b>${PICKS()}</b></div>
    <div class="st"><span>SATCHEL</span><b>${CAP()}</b></div>
    <div class="st"><span>DEEPEST</span><b>${SV.deepest}</b></div>
    <div class="row"><button class="b g" id="back">BACK</button></div>
  </div></div>`);
  on('#back', back);
}

function surface(){
  mode='panel'; scr=null; depth=0; haul=0; anim=null; pending=null;
  save();
  const lm = liftMax();
  ui(`<div class="panel"><div class="card">
    <h1>THE LITTLE<br>DIGGER</h1>
    <h2>YOUR BACKYARD</h2>
    <p class="s">The hole is where you left it.</p>
    <div class="st"><span>PURSE</span><b>${SV.bank}</b></div>
    <div class="st"><span>DEEPEST</span><b>${SV.deepest}</b></div>
    <div class="st"><span>PICKS EVERY SCREEN</span><b>${PICKS()}</b></div>
    <div class="st"><span>SATCHEL</span><b>${CAP()}</b></div>
    <div class="row">
      <button class="b" id="dig">START DIGGING</button>
      ${lm>0?`<button class="b a" id="lift">LIFT TO ${lm}</button>`:''}
    </div>
    <div class="row">
      <button class="b g" id="shop">SHOP</button>
      <button class="b g" id="finds">THE HOLE</button>
      <button class="b g" id="how">HOW</button>
    </div>
    <div class="row"><button class="b g" id="wipe">START THE WHOLE HOLE OVER</button></div>
  </div></div>`);
  on('#dig',  ()=>{ clearUI(); enterScreen(1, COLS>>1); });
  on('#lift', ()=>{ clearUI(); enterScreen(lm, COLS>>1); });
  on('#shop', ()=>shop(surface));
  on('#finds',()=>findsPanel(surface));
  on('#how',  ()=>howPanel(surface));
  on('#wipe', ()=>wipePanel(surface));
}

function howPanel(back){
  mode='panel';
  ui(`<div class="panel"><div class="card">
    <h1>HOW</h1>
    <p class="s"><b>TAP ONCE</b> on rock you can reach and you will see exactly what falls.
      <b>TAP AGAIN</b> to swing. Walking along the floor you have dug is free.</p>
    <p class="s">Rock hangs off the two side walls. Cut a mass free of both and it drops.
      <b>Stand on it and you ride it down. Stand under it and you are buried.</b></p>
    <p class="s">Every third screen is a landing: the lift stops there forever after, so
      the next trip starts where this one got to.</p>
    <p class="s">Only being buried costs you what you are carrying. Running out of picks
      just ends the trip.</p>
    <div class="row"><button class="b g" id="back">BACK</button></div>
  </div></div>`);
  on('#back', back);
}

// Resuming has to put back the mode we interrupted. Pausing mid-collapse and resuming
// into 'play' would leave the animation half-run and the board reading from a frame the
// rules had already moved past -- a second way to get stuck, introduced by the fix for
// the first one.
let pausedFrom = 'play';
function pausePanel(){
  if(mode!=='panel') pausedFrom = mode;
  mode='panel';
  // Only offered when the screen really is finished with you, so it stays an escape
  // hatch rather than a free re-roll to fish for a richer screen.
  const wedged = pausedFrom==='play' && scr && !safeSwingExists();
  ui(`<div class="panel"><div class="card">
    <h1>DEPTH ${depth}</h1><h2>${biomeAt(depth).name}</h2>
    <div class="st"><span>CARRYING</span><b>${haul} / ${CAP()}</b></div>
    <div class="st"><span>PICKS LEFT</span><b>${picks}</b></div>
    <div class="st"><span>PURSE</span><b>${SV.bank}</b></div>
    <div class="row"><button class="b" id="res">KEEP DIGGING</button></div>
    ${wedged?`<div class="row"><button class="b a" id="shift">I AM STUCK — SHIFT THE ROCK</button></div>`:''}
    <div class="row">
      <button class="b g" id="mute">SOUND ${MUTED?'OFF':'ON'}</button>
      <button class="b g" id="how">HOW</button>
    </div>
    <div class="row"><button class="b a" id="quit">GET ME OUT (KEEP THE HAUL)</button></div>
    <div class="row"><button class="b g" id="wipe">START THE WHOLE HOLE OVER</button></div>
  </div></div>`);
  on('#res',  ()=>{ clearUI(); mode=pausedFrom; });
  on('#shift',()=>{ clearUI(); mode='play'; reshapeScreen(); });
  on('#mute', ()=>{ MUTED=!MUTED; pausePanel(); });
  on('#how',  ()=>howPanel(pausePanel));
  on('#quit', ()=>{ clearUI(); endLeg('quit'); });
  on('#wipe', ()=>wipePanel(pausePanel));
}

// Wiping is the only irreversible button in the game, so it asks once and says exactly
// what it costs before it does it.
function wipePanel(back){
  mode='panel';
  ui(`<div class="panel"><div class="card">
    <h1>START OVER?</h1><h2 class="bad">THIS CANNOT BE UNDONE</h2>
    <p class="s">Fills in the whole hole. You lose the <b>${SV.bank}</b> in your purse,
      depth <b>${SV.deepest}</b>, every tool you bought and all <b>${SV.finds.length}</b>
      of the things you found down there. A brand new backyard.</p>
    <div class="row"><button class="b g" id="no">NO, GO BACK</button></div>
    <div class="row"><button class="b a" id="yes">YES, FILL IT IN</button></div>
  </div></div>`);
  on('#no', back);
  on('#yes',()=>{
    try{ localStorage.removeItem(KEY); }catch(e){}
    mem = null; SV = NEW();
    scr=null; depth=0; haul=0; picks=0; anim=null; pending=null;
    parts.length=0; floats.length=0; pips.length=0; motes.length=0;
    SV.seen = 1;                       // they have played; do not re-teach the tutorial
    save(); tone(140,.3,'sawtooth',.12,60); surface();
  });
}

/* ---------------- tile art ---------------- */
function drawTile(x,y,m,c,r){
  const M = MAT[m], p = M.pal;
  px(x,y,TILE,TILE,p[0]);
  for(let i=0;i<7;i++){                    // deterministic speckle: material, not paint
    const hx=(hash(c*16+i, r*16+i, 7)*TILE)|0, hy=(hash(r*16+i, c*16+i, 11)*TILE)|0;
    px(x+hx, y+hy, 2+((hash(c,r,i)*2)|0), 2, (i%2) ? p[2] : p[1]);
  }
  if(M.hard>TOOL() && M.hard<9){           // you can see it. you cannot have it.
    for(let i=0;i<TILE;i+=4) px(x+i,y,1,TILE,'#0d0b12');
    px(x,y,TILE,1,'#7d8aa0');
  }
  if(M.anchor){ px(x+2,y,3,TILE,p[1]); px(x+TILE-5,y,3,TILE,p[1]); px(x,y+6,TILE,3,p[2]); }
  if(M.ore){ px(x+5,y+5,3,3,p[1]); px(x+9,y+9,2,2,p[1]); }
}
function edges(G,x,y,c,r){
  if(r>0 && !G[idx(c,r-1)]) px(x,y,TILE,1,'rgba(255,255,255,.22)');
  if(r<ROWS-1 && !G[idx(c,r+1)]) px(x,y+TILE-1,TILE,1,'rgba(0,0,0,.45)');
  if(c>0 && !G[idx(c-1,r)]) px(x,y,1,TILE,'rgba(255,255,255,.10)');
  if(c<COLS-1 && !G[idx(c+1,r)]) px(x+TILE-1,y,1,TILE,'rgba(0,0,0,.30)');
}
const DIGGER = ["..1111..","..1111..",".111111.","01111110","..2222..",".222222.","..2..2..","..3..3.."];
const DIGP = {'1':'#e8c23a','2':'#c2582f','3':'#3b2a1c','0':'#08060c'};
// Squash and stretch by *resampling to a different block count* rather than scaling the
// rects: 7 rows by 9 columns is a real squash that still lands on whole pixels, so the
// character keeps its edges instead of going soft the moment it moves.
function drawDigger(x,y,rows,cols,face){
  rows = rows||8; cols = cols||8; face = face||1;
  const ox = x + ((16 - cols*2)>>1), oy = y + (16 - rows*2);
  for(let r=0;r<rows;r++){
    const row = DIGGER[(r*8/rows)|0];
    for(let c=0;c<cols;c++){
      let s = (c*8/cols)|0; if(face<0) s = 7-s;
      const ch = row[s];
      if(ch==='.'||ch===undefined) continue;
      px(ox+c*2, oy+r*2, 2, 2, DIGP[ch]);
    }
  }
}
// The pick travels an arc. It is the only part of a swing the player can watch, so it
// gets the whole windup rather than a two-frame flicker.
function drawPick(x,y,t,face){
  const ang = -2.5 + t*3.0;                       // over the shoulder, down to the rock
  const cx = x+8 + face*3, cy = y+7;
  for(let i=3;i<=7;i++){
    const px0 = cx + Math.cos(ang)*i*face, py0 = cy + Math.sin(ang)*i;
    px(px0-1, py0-1, 2, 2, i>=6 ? '#ccd4de' : '#6b4a28');
  }
}

/* ---------------- render ---------------- */
// Which collapse frame is on screen, what preceded it, and how far between the two we
// are. The pair is what lets a falling mass slide instead of teleporting a row at a time.
function animView(){
  if(!(anim && anim.frames.length)) return null;
  const i = Math.min(anim.i, anim.frames.length-1);
  const prev = i>0 ? anim.frames[i-1]
                   : (anim.sim.g0 ? {g:anim.sim.g0, pc:anim.sim.pc0, pr:anim.sim.pr0} : null);
  return {cur:anim.frames[i], prev:prev, t:Math.min(1, anim.t/STEP)};
}

// Darkness is per tile and centred on the lamp. It is mood, never information: the
// falloff bottoms out well short of black so no part of the screen is ever unreadable,
// and nothing is revealed that was not already visible (DEC-03).
const BTINT = ['#150d07','#0a0c15','#05100f','#0c0514','#0a0205'];
let VIG = null;
function lightPass(lx, ly){
  const bi = biomeIdx(depth), dark = BTINT[bi] || '#0a0a10';
  const flick = 1 + Math.sin(now/97)*.035 + Math.sin(now/41)*.02;   // the lamp is not a spotlight
  const R = (7.2 + SV.lantern*1.15) * flick;
  const breath = bi===4 ? Math.sin(now/1500)*.05 : 0;               // IT BREATHES
  let q = -1;
  for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++){
    const dx=(c+.5)-lx, dy=(r+.5)-ly;
    const d = Math.sqrt(dx*dx+dy*dy)/R;
    let a = Math.pow(Math.max(0, d-.45), 1.5);
    // Bottoms out at .44, never black: the far corner of the board has to stay planable
    // or the light would be withholding information instead of setting mood (DEC-03).
    a = Math.min(1, a) * .44 + breath;
    const k = (a*14)|0; if(k<=0) continue;
    if(k!==q){ q=k; ctx.globalAlpha = k/14; ctx.fillStyle = dark; }
    ctx.fillRect(c*TILE, HUD+r*TILE, TILE, TILE);
  }
  ctx.globalAlpha = 1;
}

function render(){
  const B = biomeAt(depth||1);
  // Shake leans vertical: what hits you in this game always arrives from above.
  const sx = shake>0 ? (Math.random()-.5)*shake*.6 : 0;
  const sy = shake>0 ? (Math.random()-.5)*shake : 0;
  const drop = slide>0 ? (slide*slide)*(H-HUD) : 0;   // the new screen rising into place
  ctx.save(); ctx.translate(sx|0, sy|0);
  px(-8,0,W+16,H,B.wall);

  ctx.save(); ctx.translate(0, (drop*.35)|0);        // far rock lags the near rock
  for(let i=0;i<16;i++){                             // distant mass, so the wall has bulk
    const bx = hash(i,depth,1234)*W - 6, by = HUD + hash(depth,i,4321)*(H-HUD);
    px(bx, by, 7+hash(i,i,depth)*20, 3+hash(i,depth,9)*6, 'rgba(0,0,0,.17)');
  }
  for(let r=0;r<ROWS;r++){                           // strata behind the dug-out space
    const t = r + depth*ROWS;
    if(t%3===0) px(-8, HUD+r*TILE+(t%6===0?4:9), W+16, 1, 'rgba(255,255,255,.045)');
  }
  ctx.restore();

  ctx.save(); ctx.translate(0, drop|0);

  const av = animView();
  const af = av ? av.cur : null;
  const G = af ? af.g : (scr ? scr.g : null);
  const F = scr ? scr.f : null;
  if(G){
    for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++){
      const m = G[idx(c,r)]; if(!m) continue;
      // A tile that was one row higher last frame is mid-fall: draw it between the two.
      const falling = av && av.prev && r>0 && !av.prev.g[idx(c,r)] && av.prev.g[idx(c,r-1)]===m;
      const x = c*TILE, y = HUD + r*TILE - (falling ? (1-av.t)*TILE : 0);
      drawTile(x,y,m,c,r); edges(G,x,y,c,r);
      if(F && F[idx(c,r)]){                      // a find, glinting through the rock
        const t = Math.sin(now/220 + c + r)*.5+.5;
        px(x+4,y+4,TILE-8,TILE-8, t>.5?'#f0e0a0':'#d8c070');
        px(x+6,y+6,2,2,'#fffbe8');
      }
      // Ore catches the lamp every few seconds. Ore is already visible; this only makes
      // the thing you are here for feel worth walking to.
      if(MAT[m].ore){
        const g = Math.sin(now/300 + c*2.1 + r*1.3);
        if(g > .93) px(x+4+((now/90+c)%6|0), y+4, 2, 2, '#fffbe8');
      }
    }
  }

  if(scr) lightPass(dig.x+.5, dig.y+.5);

  // preview: exactly what this swing does, before it costs anything
  if(mode==='play' && pending && G){
    const P = pending, t = Math.sin(now/90)*.5+.5;
    for(let i=0;i<P.cells.length;i+=2){
      const x=P.cells[i]*TILE, y=HUD+P.cells[i+1]*TILE;
      ctx.fillStyle = t>.5 ? 'rgba(255,255,255,.30)' : 'rgba(255,255,255,.10)';
      ctx.fillRect(x,y,TILE,TILE);
      px(x,y,TILE,1,'#fff'); px(x,y+TILE-1,TILE,1,'#fff');
      px(x,y,1,TILE,'#fff'); px(x+TILE-1,y,1,TILE,'#fff');
    }
    const fin = P.sim.frames.length ? P.sim.frames[P.sim.frames.length-1] : null;
    if(fin){
      ctx.globalAlpha = .40;                     // ghost of where everything ends up
      for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++){
        const m = fin.g[idx(c,r)];
        if(!m || G[idx(c,r)]===m) continue;
        px(c*TILE, HUD+r*TILE, TILE, TILE, MAT[m].pal[1]);
      }
      ctx.globalAlpha = 1;
      if(!P.sim.buried){
        const gy = HUD + fin.pr*TILE;
        ctx.globalAlpha = .8; drawDigger(fin.pc*TILE+1, gy+1); ctx.globalAlpha = 1;
        if(P.sim.out) textC('THROUGH', HUD+4, '#5ed986');
      }
    }
    if(P.sim.buried){
      px(pc*TILE-2, HUD+pr*TILE-2, TILE+4, TILE+4, 'rgba(224,96,79,.55)');
      textC('THIS BURIES YOU', HUD+4, '#e0604f');
    }
  }

  if(mode!=='panel' && scr){
    const dx = dig.x*TILE+1, dy = HUD + dig.y*TILE+1;
    const gx = dx+8, gy = dy+8;
    // Lamp glow rides the character and pulses with the flicker in lightPass, so the
    // pool of light is one thing rather than two effects fighting each other.
    const rad = 58 + Math.sin(now/97)*4;
    const g = ctx.createRadialGradient(gx, gy, 3, gx, gy, rad);
    g.addColorStop(0,'rgba(255,228,150,.22)'); g.addColorStop(.45,'rgba(255,214,140,.07)');
    g.addColorStop(1,'rgba(255,228,150,0)');
    ctx.fillStyle=g; ctx.fillRect(0,HUD,W,H-HUD);

    // 1px idle bob, and a hop while walking: whole pixels only, so it never goes mushy.
    let bob = 0;
    if(dig.hop>0) bob = -Math.round(Math.sin(dig.hop*Math.PI)*3);
    else if(mode==='play' && !pending) bob = Math.sin(now/430)>0 ? 0 : 1;
    const rows = dig.sq<.9 ? 7 : (dig.sq>1.08 ? 9 : 8);
    const cols = dig.sq<.9 ? 9 : (dig.sq>1.08 ? 7 : 8);
    drawDigger(dx, dy+bob, rows, cols, dig.face);
    if(dig.swing>=0) drawPick(dx, dy+bob, dig.swing, dig.face);
  }

  // reachable targets, so the constraint is visible instead of learned by failure
  if(mode==='play' && scr && !pending){
    for(const p of reachCells()){
      const c=p[0], r=p[1];
      if(c<0||c>=COLS||r<0||r>=ROWS) continue;
      const m = scr.g[idx(c,r)]; if(!m) continue;
      const x=c*TILE, y=HUD+r*TILE;
      const col = breakable(m) ? 'rgba(94,217,134,.6)' : 'rgba(224,96,79,.5)';
      px(x,y,3,1,col); px(x,y,1,3,col);
      px(x+TILE-3,y,3,1,col); px(x+TILE-1,y,1,3,col);
      px(x,y+TILE-1,3,1,col); px(x,y+TILE-3,1,3,col);
      px(x+TILE-3,y+TILE-1,3,1,col); px(x+TILE-1,y+TILE-3,1,3,col);
    }
  }

  // Motes drift in the lamplight. Nothing depends on them; they exist so that a screen
  // you are standing still on is never a photograph.
  for(const mo of motes){
    const tw = .55 + Math.sin(now/500 + mo.ph)*.45;
    ctx.globalAlpha = mo.a * tw;
    px(mo.x, mo.y, 1, 1, '#d8cdf0');
  }
  ctx.globalAlpha=1;

  for(const p of parts){ ctx.globalAlpha=Math.max(0,Math.min(1,p.life)); px(p.x,p.y,p.s||2,p.s||2,p.c); }
  ctx.globalAlpha=1;
  // The number lands at double size for a beat before it settles. Cheapest possible pop,
  // and it keeps the payout legible on a phone.
  for(const f of floats){
    ctx.globalAlpha = Math.max(0, Math.min(1, f.life*1.4));
    const big = f.pop > .62;
    textSh(f.t, big ? f.x-(textW(f.t,1)>>1) : f.x, f.y, f.c, big?2:1);
  }
  ctx.globalAlpha=1;

  ctx.restore();                                   // end of the sliding world layer

  if(!VIG){ VIG = ctx.createLinearGradient(0,HUD,0,H);
    // Light on the character now does the depth work, so the old flat vignette pulls
    // right back -- stacked, the two of them crushed the bottom of the board.
    VIG.addColorStop(0,'rgba(0,0,0,0)'); VIG.addColorStop(1,'rgba(0,0,0,.20)'); }
  ctx.fillStyle=VIG; ctx.fillRect(0,HUD,W,H-HUD);
  ctx.restore();                                   // end of the shake

  drawHUD();

  if(msg && now<msgT){
    const a = Math.min(1,(msgT-now)/350);
    const rise = Math.max(0, 1-(now-msgAt)/140);   // slides up out of the floor
    ctx.globalAlpha=a;
    const w = textW(msg,1)+6, y = H-14 + Math.round(rise*10);
    px((W-w)>>1, y, w, 9, 'rgba(8,6,12,.85)');
    textC(msg, y+2, '#c0b4d8');
    ctx.globalAlpha=1;
  }
}

function drawHUD(){
  px(0,0,W,HUD,'#120e1a'); px(0,HUD-1,W,1,'#08060c');
  textSh('DEPTH', 3, 3, '#665a80');
  // The depth number kicks a pixel when it changes -- the one number the whole run is about.
  textSh(String(depth), 3, 11 - (popDepth>.5?1:0), popDepth>0?'#fff3c0':'#e8b830', 2);

  const px0 = 40;                                // picks as pips: a count you read at a glance
  for(let i=0;i<Math.max(0,picks);i++){
    const x = px0 + (i%PIPROW)*5, y = 4 + ((i/PIPROW)|0)*7;
    px(x,y,3,5,'#5ed986'); px(x+1,y+5,1,1,'#3a8a55');
  }
  // The pip you just spent flies off rather than blinking out, so a swing visibly costs.
  for(const g of pips){
    ctx.globalAlpha = Math.max(0, g.life);
    px(g.x, g.y - (1-g.life)*7, 3, 5, '#e0604f');
  }
  ctx.globalAlpha = 1;
  if(picks<=0 && mode!=='panel' && scr) textSh('NO PICKS', px0, 5, '#e0604f');
  if(depth>0 && depth%3!==0) textSh((3-(depth%3))+' TO LAND', px0, 19, '#665a80');

  const bw = 40, bx = W-MENUW-bw-3, cap = Math.max(1,CAP());
  textSh('BAG', bx, 3, '#665a80');
  px(bx, 11, bw, 6, '#251d33');
  const full = haul>=CAP();
  // The bar chases the number instead of jumping to it, and a full bag pulses at you.
  const fillc = full ? (Math.sin(now/160)>0 ? '#e0604f' : '#f0836f') : (popBag>0 ? '#fff3c0' : '#e8b830');
  px(bx, 11, Math.round(bw*Math.min(1, hudBag/cap)), 6, fillc);
  textSh(String(haul), bx+2, 19, popBag>0?'#fff3c0':'#c0b4d8');
}

/* ---------------- input ---------------- */
function local(e){ const b=cv.getBoundingClientRect();
  return [(e.clientX-b.left)*(W/b.width), (e.clientY-b.top)*(H/b.height)]; }
function tileAt(x,y){
  if(y<HUD) return null;
  const c = Math.floor(x/TILE), r = Math.floor((y-HUD)/TILE);
  if(c<0||c>=COLS||r<0||r>=ROWS) return null;
  return [c,r];
}
function tap(x,y){
  if(y<HUD) return;                                // the HUD is a readout; the menu is a DOM button
  if(mode!=='play' || !scr) return;
  const t = tileAt(x,y); if(!t) return;
  const c=t[0], r=t[1], m = scr.g[idx(c,r)];

  if(!m){
    if(SV.beams && beamsLeft>0 && !pending && inReach(c,r) && placeBeam(c,r)) return;
    const reach = walkTargets(scr.g, pc, pr);
    if(reach[idx(c,r)]){
      pending=null;
      if(c !== pc) dig.face = c > pc ? 1 : -1;
      dig.hop = 1;                                 // one bounce per step, however far
      pc=c; pr=r; tone(520,.03,'square',.05);
    }
    else pending = null;
    return;
  }
  if(!inReach(c,r)){ pending=null; toast('TOO FAR. WALK CLOSER.'); return; }
  if(!breakable(m)){
    pending=null;
    toast(MAT[m].hard===2 ? 'BASALT. YOU NEED THE DRILL.' : 'SLATE. YOU NEED AN IRON PICK.');
    tone(120,.09,'square',.09); return;
  }
  if(picks<=0){ toast('NO PICKS LEFT ON THIS SCREEN'); tone(120,.12,'square',.09); return; }
  if(pending && pending.c===c && pending.r===r){ commitBreak(); return; }
  pending = planBreak(c,r);
  tone(660,.04,'square',.06);
}
cv.addEventListener('pointerdown', e=>{ e.preventDefault(); ac();
  const p = local(e); tap(p[0], p[1]); }, {passive:false});
// Reachable from play AND from mid-collapse. A collapse that somehow never finishes used
// to leave the player with no legal input at all; the way out must not depend on the
// simulation being in a good mood.
menuEl.addEventListener('click', e=>{ e.preventDefault(); ac();
  if(mode!=='panel') pausePanel(); }, {passive:false});

/* ---------------- update ---------------- */
function update(dt){
  // The room keeps running through a hitstop: motes, lamp and HUD easing are ambience,
  // not the action being frozen.
  for(const mo of motes){
    mo.x += mo.vx*dt*60; mo.y += mo.vy*dt*60;
    if(mo.y < HUD-2 || mo.x < -2 || mo.x > W+2){
      const n = newMote(false); mo.x=n.x; mo.y=n.y; mo.vx=n.vx; mo.vy=n.vy; mo.a=n.a; mo.ph=n.ph;
    }
  }
  if(popDepth>0) popDepth = Math.max(0, popDepth - dt*3);
  if(popBag>0)   popBag   = Math.max(0, popBag - dt*3);
  if(slide>0)    slide    = Math.max(0, slide - dt*3.4);
  hudBag += (haul - hudBag) * Math.min(1, dt*9);
  for(let i=pips.length-1;i>=0;i--){ pips[i].life -= dt*2.2; if(pips[i].life<=0) pips.splice(i,1); }
  if(dig.hop>0) dig.hop = Math.max(0, dig.hop - dt*6);
  if(dig.swing>=0){ dig.swing += dt/.22; if(dig.swing>1) dig.swing = -1; }

  // Impact freeze. A collapse hits harder when the first frame of it holds still.
  if(hitstop>0){ hitstop -= dt; if(hitstop>0) return; }

  if(shake>0) shake = Math.max(0, shake - dt*14);
  for(let i=parts.length-1;i>=0;i--){ const p=parts[i];
    p.x+=p.vx*dt*60; p.y+=p.vy*dt*60; p.vy+=p.g*dt*60; p.life-=dt*(p.fd||1.4);
    if(p.life<=0 || p.y>H) parts.splice(i,1); }
  for(let i=floats.length-1;i>=0;i--){ const f=floats[i];
    f.y+=f.vy*dt*60; f.vy *= Math.pow(.86, dt*60);      // shoots up, then hangs
    if(f.pop>0) f.pop -= dt*4;
    f.life-=dt*1.1; if(f.life<=0) floats.splice(i,1); }

  // Where the character actually is on screen. During a collapse it rides the frame
  // interpolation; the rest of the time it walks to the tile the rules already moved it to.
  const av = animView();
  if(av){
    const p = av.prev || av.cur;
    dig.x = p.pc + (av.cur.pc - p.pc)*av.t;
    dig.y = p.pr + (av.cur.pr - p.pr)*av.t;
    if(av.cur.pr !== p.pr) dig.sq = 1.15;               // stretched out in the air
    else dig.sq += (1-dig.sq)*Math.min(1, dt*14);
  } else {
    const k = Math.min(1, dt*16);
    if(Math.abs(pc-dig.x)>.02 || Math.abs(pr-dig.y)>.02){
      dig.x += (pc-dig.x)*k; dig.y += (pr-dig.y)*k;
    } else { dig.x = pc; dig.y = pr; }
    dig.sq += (1-dig.sq)*Math.min(1, dt*14);
  }

  if(mode==='anim' && anim){
    anim.t += dt;
    if(anim.t > STEP){
      anim.t = 0;
      const prev = anim.frames[anim.i];
      anim.i++;
      if(anim.i < anim.frames.length){
        const f = anim.frames[anim.i];
        if(prev && f.pr !== prev.pr) shake = Math.max(shake, 2);
        if(prev){
          let landed = 0;
          for(let c=0;c<COLS;c++) for(let r=0;r<ROWS;r++){
            if(prev.g[idx(c,r)] && !f.g[idx(c,r)]) dust(c*TILE, HUD+r*TILE, 2);
            // A tile that was falling and has now stopped just hit something.
            if(r>0 && r<ROWS-1 && f.g[idx(c,r)] && !prev.g[idx(c,r)]
               && prev.g[idx(c,r-1)]===f.g[idx(c,r)] && f.g[idx(c,r+1)] && landed<5){
              puff(c*TILE, HUD+r*TILE, 3); landed++;
            }
          }
          if(landed){ shake = Math.max(shake, 2.5); noise(.05,.09,500); }
        }
      } else {
        finishSim(anim.sim);
        return;
      }
    }
  }
}

// Is there any swing left that does not bury you? Walking is free and does not change
// the grid, so this enumerates every standing spot you could reach and every tile you
// could reach from it. If the answer is no, the screen is genuinely over: the only
// remaining moves all end the leg, so ending it here just saves the player the search.
// Runs once per settle, not per frame.
function safeSwingExists(){
  const reach = walkTargets(scr.g, pc, pr);
  const spc = pc, spr = pr;
  try{
    for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++){
      if(!reach[idx(c,r)]) continue;
      pc = c; pr = r;
      for(const p of reachCells()){
        const nc=p[0], nr=p[1];
        if(nc<0||nc>=COLS||nr<0||nr>=ROWS) continue;
        if(!breakable(scr.g[idx(nc,nr)])) continue;
        if(!planBreak(nc,nr).sim.buried) return true;
      }
    }
    return false;
  } finally { pc = spc; pr = spr; }
}

let last = 0;
function loop(ts){
  now = ts;
  const dt = Math.min(.05, (ts-last)/1000 || 0); last = ts;
  update(dt); render();
  requestAnimationFrame(loop);
}

/* ---------------- boot ---------------- */
(async function(){
  const s = await load();
  if(s) SV = Object.assign(NEW(), s);
  if(!SV.screens) SV.screens = {};
  if(!SV.reroll) SV.reroll = {};
  if(!SV.finds) SV.finds = [];
  requestAnimationFrame(loop);
  if(!SV.seen){ SV.seen = 1; save(); howPanel(surface); }
  else surface();
})();
</script>
