<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>DOWNSHAFT</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#08060c;
    font-family:ui-monospace,Menlo,Consolas,monospace;-webkit-user-select:none;user-select:none;touch-action:manipulation}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  #stage{position:relative}
  canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges}
  #ui{position:absolute;inset:0;pointer-events:none;display:flex;align-items:center;justify-content:center}
  .panel{pointer-events:auto;width:100%;height:100%;background:rgba(8,6,12,.93);
    display:flex;align-items:center;justify-content:center;padding:4%}
  .card{width:100%;max-width:440px;max-height:100%;overflow:auto;background:#1e1826;
    border:4px solid #08060c;box-shadow:6px 6px 0 #08060c;padding:13px}
  .card::-webkit-scrollbar{width:8px}.card::-webkit-scrollbar-thumb{background:#4d3d63}
  h1{margin:0 0 3px;font-size:22px;letter-spacing:4px;color:#e8b830;text-shadow:3px 3px 0 #08060c;line-height:1.15}
  h2{margin:0 0 9px;font-size:13px;letter-spacing:3px;color:#5ed986}
  h2.bad{color:#e0604f}
  p.s{margin:0 0 11px;font-size:11px;line-height:1.65;color:#9c90b4;letter-spacing:.4px}
  p.s b{color:#e8b830}
  .st{font-size:11px;color:#c0b4d8;margin:3px 0;letter-spacing:1px;display:flex;justify-content:space-between}
  .st b{color:#e8b830}
  .row{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:8px}
  /* 13px of padding, not 12: at font-size 11 that is what puts the box over the 44px
     thumb minimum. Measured at a real 390x844 viewport, where 12px lands on 43. */
  button.b{pointer-events:auto;cursor:pointer;font-family:inherit;font-weight:bold;font-size:11px;
    letter-spacing:2px;padding:13px 10px;background:#5ed986;color:#0b2a16;border:3px solid #08060c;
    box-shadow:4px 4px 0 #08060c;flex:1;min-width:100px;text-transform:uppercase;transition:transform .05s,box-shadow .05s}
  button.b:active{transform:translate(4px,4px);box-shadow:0 0 0 #08060c}
  button.b.a{background:#f09a52;color:#361a06}
  button.b.g{background:#392c4c;color:#c0b4d8}
  button.b:disabled{background:#2e2640;color:#665a80;cursor:default}
  .it{display:flex;gap:9px;align-items:center;padding:8px;margin-bottom:6px;background:#161020;border:3px solid #08060c}
  .it .t{flex:1}
  .it .n{font-size:11px;letter-spacing:1px;color:#e8b830;margin-bottom:3px}
  .it .d{font-size:10px;line-height:1.5;color:#9c90b4}
  .it button.b{flex:0 0 auto;min-width:70px;padding:13px 8px}
  .it.off{opacity:.45}
  .fg{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-bottom:8px}
  .fc{background:#161020;border:3px solid #08060c;padding:5px;text-align:center}
  .fc .q{font-size:19px;color:#392c4c;line-height:1.2}
  .fc .l{font-size:7px;letter-spacing:.3px;color:#665a80;margin-top:2px;line-height:1.3}
  .fc.got .q{color:#e8b830}
  .fc.got .l{color:#9c90b4}
  /* The way out is a DOM button, not canvas pixels. Sized in CSS pixels it stays a real
     thumb target (>=44px) no matter how small the canvas scales on a given phone, which
     the old 10x7 canvas-space glyph never was. */
  #menu{position:absolute;top:0;right:0;width:46px;height:46px;padding:0;margin:0;
    pointer-events:auto;cursor:pointer;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:4px;background:#392c4c;border:0;
    border-left:2px solid #08060c;border-bottom:2px solid #08060c}
  #menu i{display:block;width:20px;height:3px;background:#c0b4d8}
  #menu:active{background:#5ed986}
  #menu:active i{background:#0b2a16}
  #menu[hidden]{display:none}
  /* Restart sits opposite the menu, same 46px thumb target. Top-left is the one corner
     nothing else uses, and a retry has to be reachable without crossing the board with
     your hand. */
  #restart{position:absolute;top:0;left:0;width:46px;height:46px;padding:0;margin:0;
    pointer-events:auto;cursor:pointer;display:flex;align-items:center;justify-content:center;
    background:#392c4c;border:0;border-right:2px solid #08060c;border-bottom:2px solid #08060c;
    font-family:inherit;font-size:24px;line-height:1;color:#c0b4d8}
  #restart:active{background:#e8b830;color:#3a2a06}
  #restart[hidden]{display:none}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="cv"></canvas><div id="ui"></div>
<button id="menu" aria-label="Menu" hidden><i></i><i></i><i></i></button>
<button id="restart" aria-label="Restart this board" hidden>&#8635;</button></div></div>
<script>
"use strict";
/* ==================================================================
   DOWNSHAFT
   You dig a hole in your backyard. Each screen is one room of it,
   and it stays dug. It gets stranger the deeper you go.
   Break the wrong block and the ceiling comes down on you. Break the
   right one and the mass drops -- and you ride it down.
   ================================================================== */

const TILE = 16, COLS = 10, ROWS = 16, HUD = 28;
// The top-right of the HUD belongs to the menu button, which is a DOM element sized in
// CSS pixels. Nothing on the canvas may be drawn under it, so the readouts reserve this
// much width; PIPROW is the pick-pip wrap, kept short enough to clear the bag meter.
const MENUW = 36, PIPROW = 8;
// The laboratory's restart button takes the mirror corner, so the HUD gives up the
// same width on the left whenever a handcrafted board is loaded.
const RESTARTW = 36;
const W = COLS*TILE, H = HUD + ROWS*TILE;      // 160 x 284
const idx = (c,r) => r*COLS + c;

const cv = document.getElementById('cv'), ctx = cv.getContext('2d',{alpha:false});
const uiEl = document.getElementById('ui'), stage = document.getElementById('stage');
const menuEl = document.getElementById('menu');
const restartEl = document.getElementById('restart');

let SCALE = 2;
function fit(){
  // The exact ratio, never floored. Flooring to an integer scale threw away up to a
  // whole step of size -- a 390-wide phone landed on 2x and played inside a 320px box
  // with black bars, which shrank every touch target with it. The device pixel ratio is
  // 2-3 on any phone this runs on, so a fractional CSS scale still lands each game pixel
  // on several device pixels and stays crisp under image-rendering:pixelated.
  SCALE = Math.min(window.innerWidth/W, window.innerHeight/H);
  cv.width = W; cv.height = H;
  cv.style.width = (W*SCALE)+'px'; cv.style.height = (H*SCALE)+'px';
  stage.style.width = (W*SCALE)+'px'; stage.style.height = (H*SCALE)+'px';
  ctx.imageSmoothingEnabled = false;
}
window.addEventListener('resize', fit); fit();

/* ---------------- pixel font: 3x5 ---------------- */
const FONT = {
 '0':[7,5,5,5,7],'1':[2,6,2,2,7],'2':[7,1,7,4,7],'3':[7,1,7,1,7],'4':[5,5,7,1,1],
 '5':[7,4,7,1,7],'6':[7,4,7,5,7],'7':[7,1,1,1,1],'8':[7,5,7,5,7],'9':[7,5,7,1,7],
 'A':[7,5,7,5,5],'B':[6,5,6,5,6],'C':[7,4,4,4,7],'D':[6,5,5,5,6],'E':[7,4,7,4,7],
 'F':[7,4,7,4,4],'G':[7,4,5,5,7],'H':[5,5,7,5,5],'I':[7,2,2,2,7],'J':[1,1,1,5,7],
 'K':[5,5,6,5,5],'L':[4,4,4,4,7],'M':[5,7,7,5,5],'N':[6,5,5,5,5],'O':[7,5,5,5,7],
 'P':[7,5,7,4,4],'Q':[7,5,5,7,1],'R':[7,5,7,6,5],'S':[7,4,7,1,7],'T':[7,2,2,2,2],
 'U':[5,5,5,5,7],'V':[5,5,5,5,2],'W':[5,5,7,7,5],'X':[5,5,2,5,5],'Y':[5,5,7,2,2],
 'Z':[7,1,2,4,7],' ':[0,0,0,0,0],'.':[0,0,0,0,2],',':[0,0,0,2,2],'-':[0,0,7,0,0],
 '!':[2,2,2,0,2],'?':[7,1,3,0,2],':':[0,2,0,2,0],'/':[1,1,2,4,4],'+':[0,2,7,2,0],
 '(':[2,4,4,4,2],')':[2,1,1,1,2],'>':[4,2,1,2,4],'<':[1,2,4,2,1],'*':[0,5,2,5,0],
 "'":[2,2,0,0,0],'%':[5,1,2,4,5],'#':[5,7,5,7,5],'=':[0,7,0,7,0]
};
function px(x,y,w,h,c){ ctx.fillStyle=c; ctx.fillRect(x|0,y|0,w|0,h|0); }
function textW(s,sc){ sc=sc||1; return s.length*4*sc - sc; }
function text(s,x,y,c,sc){
  sc = sc||1; ctx.fillStyle = c;
  for(let i=0;i<s.length;i++){
    const g = FONT[s[i].toUpperCase()]; if(!g) continue;
    const gx = x + i*4*sc;
    for(let r=0;r<5;r++){ const b=g[r];
      if(b&4) ctx.fillRect(gx,      y+r*sc, sc, sc);
      if(b&2) ctx.fillRect(gx+sc,   y+r*sc, sc, sc);
      if(b&1) ctx.fillRect(gx+2*sc, y+r*sc, sc, sc);
    }
  }
}
function textSh(s,x,y,c,sc){ sc=sc||1; text(s,x+sc,y+sc,'#08060c',sc); text(s,x,y,c,sc); }
function textC(s,y,c,sc){ sc=sc||1; textSh(s,(W-textW(s,sc))>>1,y,c,sc); }

/* ---------------- audio ---------------- */
let AC=null, MUTED=false;
function ac(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
  if(AC && AC.state==='suspended') AC.resume(); return AC; }
function tone(f,d,ty,v,f2){ if(MUTED||!ac())return; const t=AC.currentTime;
  const o=AC.createOscillator(), g=AC.createGain();
  o.type=ty||'square'; o.frequency.setValueAtTime(f,t);
  if(f2) o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t+d);
  g.gain.setValueAtTime(v||.1,t); g.gain.exponentialRampToValueAtTime(.0008,t+d);
  o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+d+.02); }
function noise(d,v,lp){ if(MUTED||!ac())return; const t=AC.currentTime;
  const n=Math.floor(AC.sampleRate*d), b=AC.createBuffer(1,n,AC.sampleRate), dt=b.getChannelData(0);
  for(let i=0;i<n;i++) dt[i]=(Math.random()*2-1)*(1-i/n);
  const s=AC.createBufferSource(); s.buffer=b;
  const f=AC.createBiquadFilter(); f.type='lowpass'; f.frequency.value=lp||900;
  const g=AC.createGain(); g.gain.value=v||.16;
  s.connect(f); f.connect(g); g.connect(AC.destination); s.start(t); }

/* ---------------- materials ---------------- */
// hard = tool level required. loose = falls unless the tile directly below holds it.
// Everything else is structural: it hangs off the two side walls, so cutting a mass
// free of BOTH walls is what drops it.
// Palette rule: bulk rock is cool and low-chroma so it reads as a backdrop, and ORE IS
// THE ONLY SATURATED THING ON SCREEN. The old set made dirt the loudest colour in the
// game, which is why every screen came out brown -- the thing you were digging past was
// shouting louder than the thing you were digging for. Neighbouring bulk materials are
// also separated by value, not just hue, so the 2x2 block structure stays legible once
// the lamp falls off toward the corners.
const MAT = {
  1:{n:'DIRT',    loose:true,  hard:0, val:0,  pal:['#4e3f39','#5f4d45','#312724']},
  2:{n:'STONE',   loose:false, hard:0, val:0,  pal:['#666c85','#7e85a1','#464b60']},
  3:{n:'COPPER',  loose:false, hard:0, val:5,  pal:['#c8622a','#f08b3c','#8a3d13'], ore:1},
  4:{n:'IRON',    loose:false, hard:0, val:11, pal:['#8fa2bd','#c3d6f0','#5d6c85'], ore:1},
  5:{n:'SLATE',   loose:false, hard:1, val:0,  pal:['#3a4257','#4a536b','#272d3d']},
  6:{n:'SILVER',  loose:false, hard:1, val:26, pal:['#d2e2f2','#ffffff','#94a6bb'], ore:1},
  7:{n:'BASALT',  loose:false, hard:2, val:0,  pal:['#221f2e','#2e2a3d','#141220']},
  8:{n:'GOLD',    loose:false, hard:1, val:55, pal:['#e8b422','#ffe872','#a3720b'], ore:1},
  9:{n:'CUTLERY', loose:true,  hard:0, val:3,  pal:['#aebccd','#e2eefb','#7d8a9c'], ore:1},
 10:{n:'TILE',    loose:false, hard:0, val:0,  pal:['#a1b2ab','#c3d4cd','#77857f']},
 11:{n:'PIPE',    loose:false, hard:0, val:2,  pal:['#3f8f6a','#5cc190','#28603f'], ore:1, burst:1},
 12:{n:'ROOT',    loose:false, hard:0, val:3,  pal:['#6f7434','#8a9145','#4a4d21'], ore:1, regrow:1},
 13:{n:'MEAT',    loose:false, hard:1, val:80, pal:['#a83550','#d8556f','#75203a'], ore:1, alive:1},
 14:{n:'BEAM',    loose:false, hard:9, val:0,  pal:['#8f6e3c','#b8904f','#5e4526'], anchor:1}
};

/* ---------------- biomes: one new behaviour per layer, deeper is stranger --------- */
// mix = the bulk rock a block can be made of. ore/oreRate is rolled separately, so
// how rich a layer is stays a dial rather than a side effect of the block shuffling.
const BIOMES = [
 {from:1,  name:'THE BACKYARD',       wall:'#17111c', ore:3,  oreRate:.13,
  mix:[[1,55],[2,45]],                 note:'DIRT SLIDES. IT WILL NOT HOLD A CEILING.'},
 {from:5,  name:'THE CUTLERY',        wall:'#0e1223', ore:4,  oreRate:.12,
  mix:[[2,42],[5,33],[9,25]],          note:'CUTLERY SLIDES LIKE DIRT. SLATE NEEDS AN IRON PICK.'},
 {from:11, name:'SOMEONES FLOOR',     wall:'#07171a', ore:6,  oreRate:.10,
  mix:[[10,48],[5,34],[11,18]],        note:'BURST A PIPE AND THE WATER DIGS FOR YOU.'},
 {from:18, name:'THE UPSIDE ORCHARD', wall:'#150a1e', ore:8,  oreRate:.09,
  mix:[[2,38],[12,36],[5,26]],         note:'ROOTS GROW BACK WHILE YOU WORK.'},
 {from:26, name:'IT BREATHES',        wall:'#11040c', ore:13, oreRate:.08,
  mix:[[7,44],[5,34],[2,22]],          note:'IT MOVES WHEN YOU ARE NOT LOOKING.'}
];
function biomeAt(d){ let b=BIOMES[0]; for(const x of BIOMES) if(d>=x.from) b=x; return b; }
function biomeIdx(d){ let i=0; for(let k=0;k<BIOMES.length;k++) if(d>=BIOMES[k].from) i=k; return i; }

/* ---------------- finds: visible in the rock, each one changes something ---------- */
const FINDS = [
 {n:'SPRINKLER HEAD', d:2,  v:40,   perk:'pick', txt:'+1 PICK'},
 {n:'GARDEN GNOME',   d:4,  v:90,   perk:'bag',  txt:'+3 SATCHEL'},
 {n:'A FORK',         d:7,  v:150,  perk:'pick', txt:'+1 PICK'},
 {n:'WEDDING RING',   d:10, v:400,  perk:'bag',  txt:'+3 SATCHEL'},
 {n:'RUBBER DUCK',    d:13, v:700,  perk:'pick', txt:'+1 PICK'},
 {n:'A DOORKNOB',     d:16, v:1100, perk:'bag',  txt:'+3 SATCHEL'},
 {n:'AN APPLE CORE',  d:20, v:1900, perk:'pick', txt:'+1 PICK'},
 {n:'A TOOTH',        d:23, v:3000, perk:'bag',  txt:'+3 SATCHEL'},
 {n:'SOMETHING WARM', d:28, v:6000, perk:'pick', txt:'+1 PICK'}
];

/* ---------------- save ---------------- */
const KEY='digger:v2';
const NEW = () => ({bank:0, deepest:0, tool:0, lantern:0, satchel:0, beams:0,
                    finds:[], screens:{}, reroll:{}, dives:0, best:0,
                    seed:(Math.random()*1e9)|0, seen:0});
let SV = NEW(), mem = null;
async function load(){ try{ const r=localStorage.getItem(KEY); if(r) return JSON.parse(r);}catch(e){} return mem; }
async function save(){ mem=JSON.parse(JSON.stringify(SV)); try{ localStorage.setItem(KEY, JSON.stringify(SV)); }catch(e){} }

const perkN   = (p) => SV.finds.reduce((a,i)=> a + (FINDS[i] && FINDS[i].perk===p ? 1:0), 0);
const PICKS   = () => 7 + SV.lantern + perkN('pick');
const CAP     = () => 20 + SV.satchel*8 + perkN('bag')*3;
const TOOL    = () => SV.tool;
const liftMax = () => Math.floor(SV.deepest/3)*3;

/* ---------------- world ---------------- */
// Math.imul, not `*`: a plain 32-bit-sized multiply overflows the float mantissa and
// throws away the low bits, which made every screen come out identical.
function hash(a,b,s){
  let h = Math.imul(a|0, 374761393) ^ Math.imul(b|0, 668265263) ^ Math.imul(s|0, 2246822519);
  h = Math.imul(h ^ (h>>>13), 1274126177);
  h ^= h>>>16;
  return (h>>>0) / 4294967296;
}
function pickMix(mix,t){ let s=0; for(const m of mix) s+=m[1]; let x=t*s;
  for(const m of mix){ x-=m[1]; if(x<=0) return m[0]; } return mix[0][0]; }

function genScreen(d, entryCol, salt){
  const B = biomeAt(d), G = new Uint8Array(COLS*ROWS), F = new Uint8Array(COLS*ROWS);
  // salt re-rolls one depth without disturbing the rest of the shaft: the seed is the
  // world, so a wedged screen has to be reshaped locally or not at all.
  const s = SV.seed + d*7919 + (salt||0)*104729;
  // 2x2 blocks, each forced to differ from its left and upper neighbour. That keeps
  // material arriving in small readable chunks instead of one continent of dirt.
  const bcols = Math.ceil(COLS/2), brows = Math.ceil(ROWS/2);
  const blocks = new Uint8Array(bcols*brows);
  for(let by=0; by<brows; by++) for(let bx=0; bx<bcols; bx++){
    const left = bx>0 ? blocks[by*bcols+bx-1] : 0;
    const up   = by>0 ? blocks[(by-1)*bcols+bx] : 0;
    let m = 0;
    for(let k=0;k<8;k++){
      m = pickMix(B.mix, hash(bx*31+k, by*17+k, s));
      if(m!==left && m!==up) break;
    }
    // A block is occasionally a seam of ore instead of bulk rock.
    if(hash(bx*13, by*7, s+2201) < B.oreRate) m = B.ore;
    blocks[by*bcols+bx] = m;
  }
  for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++){
    let m = blocks[((r>>1)*bcols) + (c>>1)];
    if(hash(c,r,s+555) < .22) m = pickMix(B.mix, hash(c,r,s+91));   // roughen the edges
    G[idx(c,r)] = m;
  }
  // The side walls have to be structural or nothing in the screen hangs from anything.
  const wallMat = biomeIdx(d)>=4 ? 7 : (biomeIdx(d)===2 ? 10 : 2);
  for(let r=0;r<ROWS;r++) for(const c of [0,COLS-1]){
    const m = G[idx(c,r)];
    if(!m || MAT[m].loose) G[idx(c,r)] = wallMat;
  }
  // A soft seam wanders top to bottom in broken segments: there is always a route
  // down, and it is never the whole answer.
  const soft = biomeIdx(d)===1 ? 9 : (biomeIdx(d)===2 ? 11 : 1);
  let sc = entryCol;
  for(let r=0;r<ROWS-1;r++){
    if(hash(r, d, s+77) < .55) sc += hash(r, d, s+31) < .5 ? -1 : 1;
    sc = Math.max(1, Math.min(COLS-2, sc));
    if(hash(r,sc,s+404) < .6) G[idx(sc,r)] = soft;
  }
  // One find, where you can see it long before you can have it.
  for(let i=0;i<FINDS.length;i++){
    if(FINDS[i].d === d && SV.finds.indexOf(i) < 0){
      const fc = 1 + Math.floor(hash(d,i,s+13)*(COLS-2));
      const fr = 4 + Math.floor(hash(d,i,s+29)*(ROWS-6));
      if(!G[idx(fc,fr)]) G[idx(fc,fr)] = 2;
      F[idx(fc,fr)] = i+1;
    }
  }
  // The floor goes in LAST so nothing above can punch a drain hole in it. It is laid in
  // two alternating materials, so breaking through is several swings, not one.
  const fa = biomeIdx(d)===2 ? 10 : 2, fb = biomeIdx(d)===2 ? 2 : 10;
  for(let c=0;c<COLS;c++){
    G[idx(c,ROWS-1)] = hash(c, d, s+900) < .5 ? fa : fb;   // both hard:0, both structural
    F[idx(c,ROWS-1)] = 0;
  }
  const st = {g:G, f:F, ec:Math.max(1, Math.min(COLS-2, entryCol))};
  openEntry(st, st.ec);
  settle(st.g, st.f, -1, -1);          // hand the player a screen that is already stable
  openEntry(st, st.ec);
  return st;
}
function openEntry(st, ec){
  st.g[idx(ec,0)]=0; st.f[idx(ec,0)]=0;
  st.g[idx(ec,1)]=0; st.f[idx(ec,1)]=0;
  if(!st.g[idx(ec,2)]) st.g[idx(ec,2)] = 2;
  st.ec = ec;
}
function getScreen(d, entryCol){
  const k = String(d), want = Math.max(1, Math.min(COLS-2, entryCol));
  if(SV.screens[k]){
    const s = SV.screens[k];
    const st = {g:Uint8Array.from(s.g), f:Uint8Array.from(s.f), ec:s.ec};
    openEntry(st, want);               // re-open the way in, in case a later visit filled it
    return st;
  }
  return genScreen(d, want, SV.reroll[k]||0);
}
function storeScreen(d, st){
  if(!st || lab) return;                 // a lab board is a question, not a place you dug
  SV.screens[String(d)] = {g:Array.from(st.g), f:Array.from(st.f), ec:st.ec};
}

/* ---------------- support: what is holding what up ---------------- */
// Structural material hangs off the side walls (and off beams) through orthogonal
// contact. Loose material is held only by whatever is directly beneath it.
function computeSupport(G){
  const sup = new Uint8Array(COLS*ROWS), stack = [];
  const seed = (c,r) => { const i=idx(c,r); if(!sup[i]){ sup[i]=1; stack.push(c,r); } };
  for(let r=0;r<ROWS;r++) for(const c of [0,COLS-1]){
    const m=G[idx(c,r)]; if(m && !MAT[m].loose) seed(c,r);
  }
  for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++){
    const m=G[idx(c,r)]; if(m && MAT[m].anchor) seed(c,r);
  }
  while(stack.length){
    const r = stack.pop(), c = stack.pop();
    const nb = [[c-1,r],[c+1,r],[c,r-1],[c,r+1]];
    for(const p of nb){
      const nc=p[0], nr=p[1];
      if(nc<0||nc>=COLS||nr<0||nr>=ROWS) continue;
      const i=idx(nc,nr), m=G[i];
      if(!m || sup[i]) continue;
      // A loose tile only counts as held when the supporter is the tile right below it.
      if(MAT[m].loose && !(nc===c && nr===r-1)) continue;
      sup[i]=1; stack.push(nc,nr);
    }
  }
  return sup;
}

/* ===== THE PLAYER AND GRAVITY (LAB-04) — the authoritative rules =====

This is the mechanic that turns a collapse from a spectacle into a decision. Everything
below is decided inside the settle loop, never after it, so the preview that LAB-03 built
on top of resolve() states all of it before the tap costs anything.

  RIDE     You are standing ON a mass (the cell under you moves) and there is space below.
           You go down with it and you are fine. Riding is the cheapest way down and it is
           the reward for reading the board correctly.

  BURY     A falling cell arrives in the cell you occupy. That ends the attempt.
           Burial is fully avoidable: the preview says THIS BURIES YOU before you commit,
           every time, with no exception. Because it is avoidable, it is allowed to be
           final -- and it has to be, because it is the only real stake a board has. A
           cheap, recoverable burial would make the preview a formality instead of the
           thing you play the game with. Restart is one thumb and instant (LAB-02), so the
           cost of being wrong is a few seconds, not a run.

  EDGE     Riding and burial are one column apart, and the column decides. A mass falls
           straight down: it never spreads sideways as it goes. So for any column of a
           falling mass, standing in that column under it buries you and standing in that
           column on top of it rides you down, and the columns either side of the mass are
           untouched. Deterministic, and identical every time it is asked.

  LANDING  Costs nothing, at any height. Falling further is not more dangerous. This is a
           ruling, not an oversight: the ride is the correct move, and taxing the correct
           move by distance would push the player toward short cautious drops for reasons
           that have nothing to do with reading the structure. Fall damage would also be a
           second resource competing with picks, which DEC-19 parks.

  SIDEWAYS Does not arise. Nothing in M0 moves a mass laterally -- Q-03 ruled push, pull,
           the sledgehammer and the magnet all LATER -- so there is no carried-or-crushed
           case to rule. When a lateral force is added, it inherits BURY: a cell arriving
           where you stand is a burial regardless of the direction it came from.

  LOOSE vs RIGID  The difference is in what makes them fall, not in what happens to you
           when they do. Loose material (dirt) is held only by the cell directly beneath
           it and has no lateral support at all, so it falls in situations where rock
           holds; rock hangs off the side walls and off anchors through orthogonal
           contact. Once either is falling, ride and bury are the same rule for both. They
           are told apart on impact instead: rock throws few, tight, fast chunks and kicks
           the screen; dirt throws many, wide, slow ones and barely kicks at all. */

// One pass = one row of falling, and each pass is an animation frame. The cascade is
// watchable and, more to the point, predictable enough to plan around.
function settle(G, F, pc0, pr0){
  const frames = [], fell = [];
  // The state before anything moved. The renderer needs it to slide the very first row
  // of the fall; without it the opening row of every collapse snaps into place.
  const g0 = Uint8Array.from(G);
  let pc = pc0, pr = pr0, buried = false, out = false;
  for(let guard=0; guard<400; guard++){
    const sup = computeSupport(G);
    let moved = false;
    for(let r=ROWS-1;r>=0;r--) for(let c=0;c<COLS;c++){
      const i=idx(c,r), m=G[i];
      if(!m || sup[i]) continue;
      if(r===ROWS-1){                                               // falls into the dark
        // A find riding that tile would be gone for good, since the generator places
        // each one exactly once. Treat it as landing in your bag instead.
        if(F[i]) fell.push(F[i]-1);
        G[i]=0; F[i]=0; moved=true;
      }
      else if(!G[i+COLS]){ G[i+COLS]=m; F[i+COLS]=F[i]; G[i]=0; F[i]=0; moved=true; }
    }
    if(pr>=0){
      if(G[idx(pc,pr)]){ buried=true; frames.push({g:Uint8Array.from(G),pc:pc,pr:pr}); break; }
      if(pr>=ROWS-1){ out=true; frames.push({g:Uint8Array.from(G),pc:pc,pr:pr}); break; }
      if(!G[idx(pc,pr+1)]){ pr++; moved=true; }
    }
    if(!moved) break;
    frames.push({g:Uint8Array.from(G), pc:pc, pr:pr});
  }
  return {frames:frames, buried:buried, out:out, pc:pc, pr:pr, fell:fell, g0:g0, pc0:pc0, pr0:pr0};
}

/* ---------------- clusters ---------------- */
// One swing takes the nearest MAXBREAK tiles of the same material, breadth-first from
// where you tapped. Capping it means a big seam is several decisions instead of one
// free room-clear, and *where* in a mass you swing is itself a choice. The preview
// outlines the exact tiles, so the cap never has to be guessed at.
const MAXBREAK = 6;
function cluster(G, c, r){
  const m = G[idx(c,r)]; if(!m) return [];
  const seen = new Uint8Array(COLS*ROWS), out = [], q = [c,r];
  seen[idx(c,r)] = 1;
  let head = 0;
  while(head < q.length && out.length/2 < MAXBREAK){
    const cc = q[head++], rr = q[head++];
    out.push(cc, rr);
    const nb=[[cc,rr+1],[cc-1,rr],[cc+1,rr],[cc,rr-1]];
    for(const p of nb){
      const nc=p[0], nr=p[1];
      if(nc<0||nc>=COLS||nr<0||nr>=ROWS) continue;
      const i=idx(nc,nr);
      if(seen[i] || G[i]!==m) continue;
      seen[i]=1; q.push(nc,nr);
    }
  }
  return out;
}

/* ================= THE BOARD AND THE RESOLUTION CONTRACT (LAB-01) =================

A board is one plain object. Everything the rules read lives in it, and nothing the rules
read lives anywhere else -- no globals, no reaching into render state. That is the whole
point: a rule that can only see the board is a rule that can be replayed, previewed and
tested, and LAB-03's promise (the preview never lies) is only buildable on top of it.

  cell      material id per cell, row-major
  find      find id + 1 per cell, 0 for none
  objects   multi-cell rigid bodies that move as one   (LAB-09 fills this)
  items     things dropped into the world              (LAB-05 fills this)
  entities  things that act after the player does      (LAB-10 fills this)
  carried   the hotbar slots                           (LAB-05 fills this)
  player    where he is and what happened to him
  picks     the decision budget for this board
  meta      board name, pick budget, and whatever authored it

The four empty arrays are deliberate. Every later M0 mechanic is a kind of thing that
already has a home here, so adding one is filling a slot rather than widening the contract.

RESOLUTION ORDER. resolve(board, action) clones, then runs exactly these steps in exactly
this order, and returns the new board plus an ordered event list:

  1 VALIDATE   the action against the board. Illegal actions change nothing and come back
               as a single 'rejected' event, so callers never have to pre-check.
  2 APPLY      the action's own direct effect: remove cells, move the player, place a thing.
  3 SETTLE     recompute support and move every unsupported mass one row, repeating to a
               fixed point. The player rides or is buried inside this loop, not after it.
  4 OUTCOMES   what the settle produced: finds shaken loose, burial, falling out the bottom.
  5 ENTITIES   things that act strictly after the committed action has fully resolved.
               (LAB-10. Empty today, and its emptiness is why the order can be stated now.)
  6 TERMINAL   emit the closing event describing where the board ended up.

DETERMINISM. Nothing inside resolve may call Math.random, read the clock, or touch a
global. The same board and the same action always produce the same board and the same
events -- which is what lets LAB-03 preview by resolving against a clone and then replay
the identical resolution on commit.

Render and animation CONSUME the event list. They never mutate board state. */

const ACT = {BREAK:'break', WALK:'walk', PLACE:'place', SETTLE:'settle'};

function makeBoard(cell, find, playerC, playerR, picksLeft, meta){
  const n = COLS*ROWS;
  return {
    cols:COLS, rows:ROWS,
    cell: cell ? Uint8Array.from(cell) : new Uint8Array(n),
    find: find ? Uint8Array.from(find) : new Uint8Array(n),
    objects: [], items: [], entities: [], carried: [],
    player: {c:playerC|0, r:playerR|0, buried:false, out:false},
    picks: picksLeft|0,
    meta: meta || {},
    nextId: 1
  };
}

// Deep enough that resolve can never write through to its input. The typed arrays and the
// four collections are all copied; meta is shared because it is authored and read-only.
function cloneBoard(b){
  return {
    cols:b.cols, rows:b.rows,
    cell: Uint8Array.from(b.cell),
    find: Uint8Array.from(b.find),
    objects: b.objects.map(o => ({...o, cells:o.cells.slice()})),
    items:   b.items.map(i => ({...i})),
    entities:b.entities.map(e => ({...e})),
    carried: b.carried.map(s => ({...s})),
    player: {...b.player},
    picks: b.picks,
    meta: b.meta,
    nextId: b.nextId
  };
}

// A board round-trips through plain JSON. LAB-02 authors boards by hand in text and parses
// them into exactly this shape, so the format and the runtime never diverge.
function boardToJSON(b){
  return {cols:b.cols, rows:b.rows,
          cell:Array.from(b.cell), find:Array.from(b.find),
          objects:b.objects.map(o=>({...o, cells:o.cells.slice()})),
          items:b.items.map(i=>({...i})), entities:b.entities.map(e=>({...e})),
          carried:b.carried.map(s=>({...s})),
          player:{...b.player}, picks:b.picks, meta:b.meta, nextId:b.nextId};
}
function boardFromJSON(o){
  const b = makeBoard(o.cell, o.find, o.player.c, o.player.r, o.picks, o.meta);
  b.player.buried = !!o.player.buried; b.player.out = !!o.player.out;
  b.objects  = (o.objects ||[]).map(x=>({...x, cells:x.cells.slice()}));
  b.items    = (o.items   ||[]).map(x=>({...x}));
  b.entities = (o.entities||[]).map(x=>({...x}));
  b.carried  = (o.carried ||[]).map(x=>({...x}));
  b.nextId = o.nextId || 1;
  return b;
}

/* ---- step 1: validate ---------------------------------------------------------------- */
// Returns a reason string when the action is illegal, or null when it may proceed. Reach
// and standability are read off the board's own player position, never off a global.
function validateAction(b, a){
  const inBounds = (c,r) => c>=0 && c<COLS && r>=0 && r<ROWS;
  const nearPlayer = (c,r) => {
    const p = b.player;
    const around = [[p.c,p.r-1],[p.c-1,p.r],[p.c+1,p.r],[p.c,p.r+1],[p.c-1,p.r+1],[p.c+1,p.r+1]];
    for(const q of around) if(q[0]===c && q[1]===r) return true;
    return false;
  };
  switch(a.t){
    case ACT.SETTLE: return null;
    case ACT.BREAK: {
      if(!inBounds(a.c,a.r))                 return 'off board';
      const m = b.cell[idx(a.c,a.r)];
      if(!m)                                 return 'nothing there';
      if(MAT[m].hard > (a.tool|0))           return 'too hard for this tool';
      if(!nearPlayer(a.c,a.r))               return 'out of reach';
      if(b.picks <= 0)                       return 'no picks left';
      return null;
    }
    case ACT.WALK: {
      if(!inBounds(a.c,a.r))                 return 'off board';
      if(!walkTargets(b.cell, b.player.c, b.player.r)[idx(a.c,a.r)]) return 'cannot get there';
      return null;
    }
    case ACT.PLACE: {
      if(!inBounds(a.c,a.r))                 return 'off board';
      if(b.cell[idx(a.c,a.r)])               return 'cell is occupied';
      if(!nearPlayer(a.c,a.r))               return 'out of reach';
      if(b.picks <= 0)                       return 'no picks left';
      return null;
    }
  }
  return 'unknown action';
}

/* ---- step 2: apply ------------------------------------------------------------------- */
function applyAction(b, a, events){
  if(a.t === ACT.SETTLE) return;

  if(a.t === ACT.WALK){
    b.player.c = a.c; b.player.r = a.r;
    events.push({t:'walked', c:a.c, r:a.r});
    return;
  }

  if(a.t === ACT.PLACE){
    b.cell[idx(a.c,a.r)] = a.mat;
    b.picks--;
    events.push({t:'placed', c:a.c, r:a.r, mat:a.mat});
    return;
  }

  // BREAK. One swing takes the cluster; a burst pipe additionally blows a short shaft
  // straight down, which is the one block that digs for you.
  const cells = cluster(b.cell, a.c, a.r);
  const burst = !!MAT[b.cell[idx(a.c,a.r)]].burst;
  const taken = [], finds = [];
  let gain = 0;
  const take = (j) => {
    const m = b.cell[j]; if(!m) return;
    if(MAT[m].ore) gain += MAT[m].val;
    if(b.find[j]) finds.push(b.find[j]-1);
    b.cell[j] = 0; b.find[j] = 0;
  };
  for(let i=0;i<cells.length;i+=2){ taken.push(cells[i], cells[i+1]); take(idx(cells[i], cells[i+1])); }
  if(burst){
    for(let i=0;i<cells.length;i+=2){
      const bc = cells[i];
      for(let br=cells[i+1]+1, k=0; k<3 && br<ROWS; k++, br++){
        const j = idx(bc,br);
        if(b.cell[j] && MAT[b.cell[j]].hard <= (a.tool|0)){ taken.push(bc,br); take(j); } else break;
      }
    }
  }
  b.picks--;
  events.push({t:'removed', cells:taken, cluster:cells, at:[a.c,a.r], burst:burst});
  if(gain > 0)     events.push({t:'gain', v:gain, at:[a.c,a.r]});
  if(finds.length) events.push({t:'finds', list:finds, when:'cut'});
}

/* ---- resolve ------------------------------------------------------------------------- */
function resolve(b0, action){
  const events = [];

  // 1 VALIDATE
  const why = validateAction(b0, action);
  if(why){ events.push({t:'rejected', why:why, action:action}); return {board:b0, events:events, ok:false}; }

  const b = cloneBoard(b0);

  // 2 APPLY
  applyAction(b, action, events);

  // 3 SETTLE -- settle() mutates the arrays it is handed to the fixed point and hands back
  // one frame per row of falling. b.cell and b.find are already the clone's, so this is
  // writing into the new board and never into the caller's.
  const s = settle(b.cell, b.find, b.player.c, b.player.r);
  b.player.c = s.pc; b.player.r = s.pr;
  events.push({t:'settle', frames:s.frames, g0:s.g0, pc0:s.pc0, pr0:s.pr0});

  // 4 OUTCOMES
  if(s.fell.length) events.push({t:'finds', list:s.fell, when:'fell'});
  b.player.buried = s.buried;
  b.player.out    = s.out;
  if(s.buried) events.push({t:'buried'});
  if(s.out)    events.push({t:'out'});

  // 5 ENTITIES -- LAB-10 hooks here, strictly after the committed action has resolved.
  for(const e of b.entities) events.push({t:'entity', id:e.id, kind:e.kind});

  // 6 TERMINAL
  events.push({t:'settled', picks:b.picks, c:b.player.c, r:b.player.r});
  return {board:b, events:events, ok:true};
}

/* ================= THE LABORATORY (LAB-02) =================

Handcrafted boards, authored as text. DEC-19 builds the twelve M0 boards by hand because a
generator hides whether the design itself is good -- a bad result reads as a bad seed. So
the boards have to be writable by a person, and adding one has to cost one text block and
one nothing else.

A board is ROWS lines of exactly COLS characters, plus a name, a one-line statement of what
it teaches, and a pick budget. Legend below; unknown characters are a parse error rather
than a silent empty cell, because a typo that quietly becomes air would be a board that
lies about what was authored.

Later mechanics add legend entries and nothing else: LAB-06 a beam in the world, LAB-07 a
balloon, LAB-08 water, LAB-09 the fossil, LAB-10 the worm, LAB-11 the TNT. */

const LEGEND = {
  '.':0,             // air
  '#':2,             // stone     -- structural, hangs off the walls
  ',':1,             // dirt      -- loose, holds nothing up
  '=':10,            // tile      -- structural, reads as built rather than dug
  '~':5,             // slate
  'c':3, 'i':4, 'v':6, 'g':8,   // copper, iron, silver, gold
  'p':11,            // pipe
  'r':12,            // root
  '|':14             // beam, pre-placed by the author
};
const PLAYER_CH = '@';

// The twelve M0 boards live here (LAB-12 authors them). One entry is one board: no ids to
// keep in sync, no second list to update, no unlock order -- DEC-19 keeps the level select
// a flat list for the whole milestone.
const BOARDS = [
  // Board 1 of the twelve. One pillar holds one mass: walk two steps, cut the pillar,
  // watch the copper drop exactly where the preview said. LAB-12 authors the other eleven.
  {name:'FIRST CUT', teaches:'Cutting support drops the mass.', picks:3, art:[
    '##########',
    '#........#',
    '#........#',
    '#........#',
    '#........#',
    '#..cccc..#',
    '#..#.....#',
    '#@.#.....#',
    '#========#',
    '#........#',
    '#........#',
    '#........#',
    '#........#',
    '#........#',
    '##########',
    '##########'].join('\n')},

  // Board 2. You are standing ON the ledge, and the ledge hangs from a copper strut bolted
  // to the ceiling. Cut the strut -- it is copper, so the swing takes the strut and stops
  // there instead of eating the ceiling -- and the floor under your feet leaves. You go
  // with it, seven rows, and you are fine. The drop is deliberately long: landing costs
  // nothing at any height, and the board makes that point by letting you fall a long way
  // and walk away.
  {name:'RIDE IT DOWN', teaches:'Stand on the mass and you ride it.', picks:3, art:[
    '##########',
    '#.c......#',
    '#.c......#',
    '#.c@.....#',
    '#.======.#',
    '#........#',
    '#........#',
    '#........#',
    '#........#',
    '#........#',
    '#........#',
    '#........#',
    '#========#',
    '#........#',
    '##########',
    '##########'].join('\n')},

  // Board 3. The same collapse, seen from underneath. Cut the shelf and the copper above
  // it comes down into the square you are standing in. One column either way and it misses
  // you completely -- so this board is not about whether to cut, it is about where to
  // stand first. The preview says THIS BURIES YOU before you commit, every time, which is
  // exactly why burial is allowed to be final.
  {name:'OR UNDER IT', teaches:'Stand under it and it lands on you.', picks:3, art:[
    '##########',
    '#........#',
    '#........#',
    '#........#',
    '#..ccc...#',
    '#=======.#',
    '#...@....#',
    '#========#',
    '#........#',
    '#........#',
    '#........#',
    '#........#',
    '#........#',
    '#........#',
    '##########',
    '##########'].join('\n')}
];

// Text in, board out. Every failure names the line and the character, because an authoring
// format you cannot debug is an authoring format nobody uses.
function parseBoard(def){
  const lines = def.art.split('\n').filter(l => l.length);
  if(lines.length !== ROWS) throw new Error(def.name+': got '+lines.length+' rows, need '+ROWS);
  const g = new Uint8Array(COLS*ROWS), f = new Uint8Array(COLS*ROWS);
  let pcx = -1, pcy = -1;
  for(let r=0;r<ROWS;r++){
    if(lines[r].length !== COLS) throw new Error(def.name+' row '+r+': got '+lines[r].length+' cols, need '+COLS);
    for(let c=0;c<COLS;c++){
      const ch = lines[r][c];
      if(ch === PLAYER_CH){
        if(pcx >= 0) throw new Error(def.name+': two player starts');
        pcx = c; pcy = r; continue;                       // the player stands in air
      }
      if(!(ch in LEGEND)) throw new Error(def.name+' at '+c+','+r+': unknown character "'+ch+'"');
      g[idx(c,r)] = LEGEND[ch];
    }
  }
  if(pcx < 0) throw new Error(def.name+': no player start ("'+PLAYER_CH+'")');
  // The board must stand up on its own. Settle it with no player in it (row -1 takes the
  // player out of the simulation) and demand that nothing moved. Otherwise the board that
  // loads is not the board that was drawn, and every later reading of it -- by the author,
  // by a playtester, by the next agent -- is a reading of something nobody ever saw.
  const probe = makeBoard(g, f, 0, -1, 0, {});
  const settled = resolve(probe, {t:ACT.SETTLE}).board.cell;
  for(let i=0;i<g.length;i++) if(g[i] !== settled[i])
    throw new Error(def.name+': not stable as drawn -- cell '+(i%COLS)+','+((i/COLS)|0)+
                    ' moves before the player acts. Anchor it to a wall or a support.');
  return {g:g, f:f, ec:pcx, start:{c:pcx, r:pcy}, picks:def.picks, name:def.name, teaches:def.teaches};
}

// Parsed once at load so an authoring mistake is a loud failure at boot rather than a
// broken level select three taps in.
const BOARDS_PARSED = BOARDS.map(parseBoard);

/* The COMPARE screen is gone. It did its job: three treatments were asked about, chosen
   on a phone and shipped -- the danger marker, the falling-mass arrow and the warning
   plate. The fourth question, how to make a tile look load-bearing, was answered "none of
   these", and the designer then ruled the whole question out: the player figures out what
   is holding what up by looking at the board and breaking it. With no live questions left
   it was a dead screen with a button pointing at it. */

let mode = 'boot';           // boot | play | anim | panel
let scr = null;              // {g,f,ec}
let lab = null;              // {i, def} while a handcrafted board is loaded, else null
let depth = 0, pc = 0, pr = 0;
let picks = 0, haul = 0, beamsLeft = 0;
let pending = null;          // previewed, not yet committed
let anim = null;
let parts = [], floats = [], shake = 0, msg = '', msgT = 0, msgAt = 0;
// Touch response. A finger covers the tile it taps, so the confirmation has to happen
// OUTSIDE the fingertip -- a ring that expands past the thumb, not a highlight under it.
let rings = [], flashes = [];
function ring(c,r,col){ rings.push({x:c*TILE+TILE/2, y:HUD+r*TILE+TILE/2, t:0, c:col||'#fff'}); }
function flash(cells){ flashes.push({cells:cells, t:0}); }
// The one channel that still reaches the player through a thumb and a noisy room.
// Independent of MUTED: muting is for the people around you, and is exactly when you
// most want the phone to answer in your hand instead.
function buzz(ms){ try{ if(navigator.vibrate) navigator.vibrate(ms); }catch(e){} }
let now = 0;

/* ---------------- feel ----------------
   Everything below is presentation. None of it may answer a question the player is
   supposed to answer by swinging (DEC-18): light, weight and motion set mood, and the
   preview is still the only thing that tells you what a swing does. */
const STEP = .058;              // seconds a collapse spends on each row it falls
let hitstop = 0;                // impact freeze; render keeps drawing the stalled frame
let motes = [];                 // ambient drift, so a screen with nothing happening still breathes
let slide = 0;                  // 1 -> 0: the new screen rising into place under you
let dig = {x:0, y:0, face:1, sq:1, swing:-1, hop:0};
let hudBag = 0, popDepth = 0, popBag = 0, pips = [];

function toast(m){ msg = m; msgT = now + 1600; msgAt = now; }
function fl(x,y,t,c){ floats.push({x:x,y:y,t:t,c:c||'#e8b830',life:1,vy:-1.6,pop:1}); }
// Chunks: varied sizes and real gravity, so a broken tile throws rock rather than confetti.
function debris(x,y,pal,n){ for(let i=0;i<(n||6);i++) parts.push({
  x:x+Math.random()*TILE, y:y+Math.random()*TILE,
  vx:(Math.random()-.5)*2.4, vy:-Math.random()*1.9-.2, g:.17,
  s:1+((Math.random()*2.4)|0), c:pal[(Math.random()*pal.length)|0],
  life:.55+Math.random()*.55, fd:1.4}); }
function dust(x,y,n){ for(let i=0;i<(n||5);i++) parts.push({
  x:x+Math.random()*TILE, y:y+Math.random()*TILE,
  vx:(Math.random()-.5)*.7, vy:-Math.random()*.35, g:.02,
  s:1, c:'#8d80a4', life:.4+Math.random()*.4, fd:1.4}); }
// Ore pays out in light before it pays out in numbers.
function spark(x,y,c){ for(let i=0;i<5;i++) parts.push({
  x:x+4+Math.random()*8, y:y+4+Math.random()*8,
  vx:(Math.random()-.5)*3, vy:(Math.random()-.5)*3, g:.01,
  s:1, c:i&1?'#fffbe8':c, life:.22+Math.random()*.22, fd:3.4}); }
/* LAB-04: rock and dirt have to be tellable apart on impact with the sound off, so they
   differ in the shape of the hit, not the colour of it.

     rock   few, tight, fast, heavy  -- 3 chunks, narrow spread, hard kick
     dirt   many, wide, slow, soft   -- 9 grains, wide spread, almost no kick

   These numbers are the difference; landImpact is the only place that decides them, so
   the two materials cannot drift toward looking alike. */
const IMPACT = {
  // few, tight, heavy: chunks that arc up off the impact and drop back
  rock: {n:3, vx:[0.30, 1.10], vy:[0.35, 0.95], g:.17,  size:2, life:[.45,.35],
         shake:2.5, snd:{d:.05, v:.09, lp:500}},
  // many, wide, light: grains that skitter outward and hang low
  dirt: {n:9, vx:[1.10, 2.10], vy:[0.00, 0.18], g:.008, size:1, life:[.70,.45],
         shake:0.7, snd:{d:.09, v:.05, lp:220}}
};
function landImpact(x, y, mat){
  const loose = !!(MAT[mat] && MAT[mat].loose);
  const k = loose ? IMPACT.dirt : IMPACT.rock;
  const pal = (MAT[mat] && MAT[mat].pal) || ['#8d80a4','#6d6284','#8d80a4'];
  for(let i=0;i<k.n;i++){
    const d = Math.random()<.5 ? -1 : 1;
    parts.push({
      x:x+Math.random()*TILE, y:y+TILE-2-Math.random()*3,
      vx: d*(k.vx[0] + Math.random()*k.vx[1]),
      vy: -(k.vy[0] + Math.random()*k.vy[1]),
      g: k.g,
      s: k.size===1 ? 1 : 1+((Math.random()*2)|0),
      c: pal[(Math.random()*3)|0],
      life: k.life[0] + Math.random()*k.life[1],
      fd: loose ? 1.9 : 1.2
    });
  }
  return k;
}

// A mass landing shoves the dust sideways, which is what sells the weight of it.
function puff(x,y,n){ for(let i=0;i<(n||8);i++){ const d=Math.random()<.5?-1:1; parts.push({
  x:x+Math.random()*TILE, y:y+TILE-2-Math.random()*3,
  vx:d*(.6+Math.random()*1.7), vy:-Math.random()*.3, g:.008,
  s:1+((Math.random()*2)|0), c:Math.random()<.5?'#8d80a4':'#6d6284',
  life:.45+Math.random()*.45, fd:1.1}); } }
function newMote(anywhere){ return {
  x:Math.random()*W, y: anywhere ? HUD+Math.random()*(H-HUD) : H-Math.random()*8,
  vx:(Math.random()-.5)*.14, vy:-.05-Math.random()*.13,
  a:.10+Math.random()*.22, ph:Math.random()*6.28}; }

/* ---------------- movement ---------------- */
const standable = (G,c,r) => (c>=0 && c<COLS && r>=0 && r<ROWS-1 && !G[idx(c,r)] && !!G[idx(c,r+1)]);

// Walking the surface you have already dug is free. Picks are only ever spent breaking.
function walkTargets(G, c, r){
  const seen = new Uint8Array(COLS*ROWS), stack=[c,r];
  seen[idx(c,r)]=1;
  while(stack.length){
    const rr=stack.pop(), cc=stack.pop();
    const nb=[[cc-1,rr],[cc+1,rr],[cc-1,rr-1],[cc+1,rr-1],[cc-1,rr+1],[cc+1,rr+1]];
    for(const p of nb){
      const nc=p[0], nr=p[1];
      if(nc<0||nc>=COLS||nr<0||nr>=ROWS) continue;
      const i=idx(nc,nr);
      if(seen[i] || !standable(G,nc,nr)) continue;
      seen[i]=1; stack.push(nc,nr);
    }
  }
  return seen;
}
// Arm's reach. You have to stand next to what you break, which is exactly why a
// collapse is dangerous.
function reachCells(){
  return [[pc,pr-1],[pc-1,pr],[pc+1,pr],[pc,pr+1],[pc-1,pr+1],[pc+1,pr+1]];
}
function inReach(c,r){
  for(const p of reachCells()) if(p[0]===c && p[1]===r) return true;
  return false;
}
function breakable(m){ return !!m && MAT[m].hard <= TOOL(); }

/* ---------------- the break ---------------- */
// The live globals, packaged as a board. This is the only place the running game turns
// itself into the contract's shape, so every rule downstream reads one object.
function liveBoard(){ return makeBoard(scr.g, scr.f, pc, pr, picks, {depth:depth}); }

// A resolve result, in the shape the renderer and commit path already speak. Nothing here
// recomputes anything -- it only reads the event list, which is the point of having one.
function pendingFrom(res, c, r){
  const ev  = (t) => res.events.find(e => e.t === t);
  const rm  = ev('removed'), st = ev('settle'), gn = ev('gain');
  const cut  = res.events.find(e => e.t==='finds' && e.when==='cut');
  const fell = res.events.find(e => e.t==='finds' && e.when==='fell');
  return {
    c:c, r:r,
    cells: rm ? rm.cluster : [],
    g: res.board.cell, f: res.board.find,
    sim: {
      frames: st ? st.frames : [],
      buried: res.board.player.buried, out: res.board.player.out,
      pc: res.board.player.c, pr: res.board.player.r,
      fell: fell ? fell.list : [],
      g0: st ? st.g0 : null, pc0: st ? st.pc0 : -1, pr0: st ? st.pr0 : -1
    },
    gain: gn ? gn.v : 0,
    got:  cut ? cut.list : [],
    board: res.board, events: res.events, ok: res.ok
  };
}

function planBreak(c,r){
  return pendingFrom(resolve(liveBoard(), {t:ACT.BREAK, c:c, r:r, tool:TOOL()}), c, r);
}

function commitBreak(){
  const p = pending; pending = null;
  // The board already spent the pick during step 2 of the resolve that produced this
  // preview. Committing adopts that board wholesale rather than re-deriving any of it --
  // that identity is the whole reason the preview can be trusted.
  picks = p.board.picks;
  if(p.c !== pc) dig.face = p.c > pc ? 1 : -1;
  dig.swing = 0;                                  // the arc plays over the break
  pips.push({x:40+(picks%PIPROW)*5, y:4+((picks/PIPROW)|0)*7, life:1});
  ac(); tone(220,.06,'square',.1,90); noise(.13,.2,1400);
  // The swing lands: the whole cluster goes white for a beat, and the phone kicks harder
  // the more rock the swing cut loose.
  flash(p.cells); ring(p.c, p.r, '#fff3c0');
  buzz(p.sim.frames.length > 2 ? [14,26,40] : 18);
  for(let i=0;i<p.cells.length;i+=2){
    const m = scr.g[idx(p.cells[i],p.cells[i+1])];
    if(!m) continue;
    debris(p.cells[i]*TILE, HUD + p.cells[i+1]*TILE, MAT[m].pal, 5);
    if(MAT[m].ore) spark(p.cells[i]*TILE, HUD + p.cells[i+1]*TILE, MAT[m].pal[1]);
  }
  if(p.gain>0){
    const room = Math.max(0, CAP()-haul), got = Math.min(room, p.gain);
    haul += got; popBag = 1;
    if(got>0) fl(p.c*TILE+8, HUD+p.r*TILE, '+'+got, '#e8b830');
    if(got<p.gain) toast('SATCHEL FULL');
  }
  awardFinds(p.got);
  scr.g = p.g; scr.f = p.f;
  shake = Math.min(7, 1.5 + p.sim.frames.length*.7);
  // The bigger the thing you just cut loose, the longer the world holds its breath.
  hitstop = Math.min(.10, .035 + p.sim.frames.length*.012);
  if(p.sim.frames.length>2) noise(.3,.22,600);
  startAnim(p.sim);
}

// A break that dislodges nothing has no frames to play, so finish it on the spot
// rather than leaving an empty animation running.
function startAnim(s){
  if(!s.frames.length){ finishSim(s); return; }
  anim = {frames:s.frames, i:0, t:0, sim:s};
  mode = 'anim';
}
function awardFinds(list){
  if(!list || !list.length) return;
  for(const fi of list){
    if(FINDS[fi] === undefined || SV.finds.indexOf(fi) >= 0) continue;
    SV.finds.push(fi); SV.bank += FINDS[fi].v;
    toast(FINDS[fi].n + '  ' + FINDS[fi].txt);
    tone(880,.12,'triangle',.12,1320);
  }
}
function finishSim(s){
  anim = null;
  awardFinds(s.fell);
  if(s.frames.length){
    const last = s.frames[s.frames.length-1];
    scr.g = last.g; pc = last.pc; pr = last.pr;
  }
  storeScreen(depth, scr);
  // You rode something down. Land it: squash, dust out from under the boots, a thud
  // scaled to the drop.
  const drop = s.pr0 >= 0 ? pr - s.pr0 : 0;
  if(drop > 0 && !s.buried && !s.out){
    // He rode it and he is fine. Deep squash, dust kicked out from under the boots, a ring
    // to punctuate the arrival -- and he stays upright and yellow, which is the whole
    // difference from the burial beat when the sound is off.
    dig.sq = Math.max(.55, .84 - drop*.06);
    puff(pc*TILE, HUD+pr*TILE, 6+Math.min(10, drop*2));
    ring(pc, pr, '#9fe8bb');
    shake = Math.max(shake, Math.min(6, 1.6+drop*.9));
    hitstop = Math.max(hitstop, .05);
    tone(110-Math.min(50,drop*6), .16, 'sine', .13, 55);
    buzz(drop>4 ? [10,20,14] : 10);
  }
  if(s.buried){ startDoom(); return; }
  if(s.out){ fellThrough(); return; }
  mode = 'play';
  if(s.frames.length) noise(.12,.14,700);
  // Out of picks, or every remaining swing would bury you: either way the screen is
  // finished with you. You keep the haul -- only a burial costs it.
  if(picks<=0 || !safeSwingExists()) endLeg('stuck');
}

/* THE BURIAL MOMENT (FIX-03)

   Burial used to cut straight from the collapse to a panel. The designer played it and
   could not tell what had gone wrong -- and did not read the panel, because people do not
   read, even signs directly in front of them. The consequence has to HAPPEN, on screen,
   before anything explains it. Mario's death animation is not padding; it is the
   explanation.

   So: the rock lands on him, his hat pops off and arcs away, dust goes up, the screen
   kicks, everything holds still for a beat, and only then does the panel appear. The whole
   sequence is DOOM_TIME long -- long enough to read, short enough not to resent on the
   fourth retry of a board. */
const DOOM_TIME = 1.15;
let doomT = -1;

function startDoom(){
  mode = 'doom'; doomT = 0;
  dig.sq = .35;                                  // flattened under the mass
  dig.swing = -1; dig.hop = 0;
  hatPop(pc*TILE, HUD + pr*TILE);
  puff(pc*TILE, HUD + pr*TILE, 14);
  debris(pc*TILE, HUD + pr*TILE, MAT[scr.g[idx(pc,pr)]] ? MAT[scr.g[idx(pc,pr)]].pal : ['#8d80a4'], 10);
  shake = 7; hitstop = .12;
  buzz([40,50,40,50,140]);
  noise(.5,.3,300); tone(90,.5,'sawtooth',.13,40);
}

// The hat is the one part of him that gets out. It reads instantly and from any distance,
// which is the whole job: you know what happened without a word of text.
function hatPop(x,y){
  const d = Math.random()<.5 ? -1 : 1;
  parts.push({x:x+6, y:y+2, vx:d*1.5, vy:-3.1, g:.16, s:3, c:'#e8c23a', life:1.5, fd:.7});
  parts.push({x:x+9, y:y+3, vx:d*1.7, vy:-2.8, g:.16, s:2, c:'#c2582f', life:1.4, fd:.7});
}

/* applyBiomeQuirk is deleted.
   It ran after every commit and rewrote the board -- regrowing a root, walking a block of
   living meat one cell toward you -- at random, outside resolve, after the preview had
   already been computed and shown. That made it the one thing in the file that could make
   the preview a lie, which is the single failure DEC-19's first completion criterion is
   watching for. It was also unpreviewable in principle: it fired on a coin flip.
   Q-03 ruled regrowing roots and living material LATER, and LAB-10's worm is the M0
   representative for anything that changes the board after you act -- deterministically,
   strictly after the action resolves, at a stated boundary the game tells you about. */

function placeBeam(c,r){
  if(!SV.beams || beamsLeft<=0) return false;
  const res = resolve(liveBoard(), {t:ACT.PLACE, c:c, r:r, mat:14});
  if(!res.ok) return false;
  const p = pendingFrom(res, c, r);
  scr.g = p.g; scr.f = p.f; picks = res.board.picks; beamsLeft--;
  tone(330,.09,'square',.1); toast('BEAM SET');
  startAnim(p.sim);
  return true;
}

/* ---------------- the laboratory: load, restart, choose ---------------- */
// Load board i exactly as authored. Everything derived is rebuilt from the parse, so this
// doubles as restart -- there is no second code path that could drift from it.
function loadLab(i){
  const def = BOARDS_PARSED[i];
  lab = {i:i, def:def};
  depth = 0; haul = 0;
  scr = {g:Uint8Array.from(def.g), f:Uint8Array.from(def.f), ec:def.ec};
  pc = def.start.c; pr = def.start.r;
  picks = def.picks; beamsLeft = 0;
  pending = null; anim = null; mode = 'play';
  // Drop the player onto whatever is under the authored start, through the same resolve
  // every other action uses, so an authored board and a played board agree from frame one.
  const s = pendingFrom(resolve(liveBoard(), {t:ACT.SETTLE}), pc, pr).sim;
  if(s.frames.length) scr.g = s.frames[s.frames.length-1].g;
  pc = s.pc; pr = s.pr;
  dig.x = pc; dig.y = pr; dig.sq = .7; dig.swing = -1; dig.hop = 0;
  slide = 1; hudBag = 0;
  parts.length = 0; floats.length = 0; pips.length = 0; rings.length = 0; flashes.length = 0;
  if(!motes.length) for(let k=0;k<14;k++) motes.push(newMote(true));
  clearUI(); restartEl.hidden = false;
  if(!previewBoundaryNotice()) toast(def.name);
}

// Where the promise stops. The preview is exact about the action you are committing, all
// the way to the settled state. It does NOT predict what a living thing does on its own
// turn afterwards. That is a real limit, so the game says it out loud the first time the
// player meets something that takes turns, rather than letting them find out by losing.
// (LAB-10's worm is the first and only M0 entity; boards without one never see this.)
let boundarySaid = false;
function previewBoundaryNotice(){
  if(boundarySaid || !scr) return false;
  const b = liveBoard();
  if(!b.entities.length) return false;
  boundarySaid = true;
  toast('THE PREVIEW IS EXACT. WHAT LIVES HERE MOVES AFTER YOU DO.');
  return true;
}

// One thumb, no confirmation. A puzzle you cannot cheaply retry is a puzzle nobody
// experiments with, and experimenting is the entire thing M0 is trying to measure.
function restartLab(){
  if(!lab) return;
  tone(440,.05,'square',.08); buzz(10);
  loadLab(lab.i);
}

function leaveLab(){ lab = null; restartEl.hidden = true; surface(); }

// Reached from the surface and from pause. A flat list: no stars, no scores, no unlock
// order -- DEC-19 keeps it that way for the whole milestone.
function labPanel(back){
  mode = 'panel'; restartEl.hidden = true;
  const rows = BOARDS_PARSED.map((b,i) => `<div class="it"><div class="t">
      <div class="n">${i+1}. ${b.name}</div><div class="d">${b.teaches}</div></div>
      <button class="b" data-lab="${i}">${b.picks} PICKS</button></div>`).join('');
  ui(`<div class="panel"><div class="card">
    <h1>THE<br>LABORATORY</h1>
    <h2>${BOARDS_PARSED.length} BOARD${BOARDS_PARSED.length===1?'':'S'}</h2>
    <p class="s">Handcrafted problems. Each one is asking a single question. Restart costs
    nothing, so try the thing you think will not work.</p>
    ${rows}
    <div class="row"><button class="b g" id="back">BACK</button></div>
  </div></div>`);
  uiEl.querySelectorAll('[data-lab]').forEach(n => {
    n.onclick = () => { ac(); tone(700,.04,'square',.08); loadLab(+n.getAttribute('data-lab')); };
  });
  on('#back', back || surface);
}

// A lab board that has run out of road. No banking, no burial cost, no world state: the
// only two things worth offering are the same board again or a different one.
function labEnd(title, why){
  mode = 'panel'; restartEl.hidden = true;
  if(title === 'BURIED'){ noise(.5,.3,300); tone(90,.5,'sawtooth',.13,40); buzz([40,50,40,50,140]); }
  else { tone(392,.12,'triangle',.11); buzz(20); }
  ui(`<div class="panel"><div class="card">
    <h1>${title}</h1>
    <h2 class="${title==='BURIED'?'bad':''}">${lab.def.name}</h2>
    <p class="s">${why}</p>
    <p class="s">${lab.def.teaches}</p>
    <div class="row">
      <button class="b" id="again">TRY IT AGAIN</button>
      <button class="b g" id="levels">THE BOARDS</button>
    </div>
  </div></div>`);
  on('#again',  ()=>{ clearUI(); loadLab(lab.i); });
  on('#levels', ()=>labPanel(surface));
}

/* ---------------- descending, banking, dying ---------------- */
function enterScreen(d, entryCol){
  if(scr) storeScreen(depth, scr);
  depth = d;
  scr = getScreen(d, entryCol);
  pc = scr.ec; pr = 1;
  // Drop onto whatever is under the entry. A bare settle is a first-class action, so
  // arriving resolves through exactly the same path as a swing does.
  const s = pendingFrom(resolve(liveBoard(), {t:ACT.SETTLE}), pc, pr).sim;
  if(s.frames.length) scr.g = s.frames[s.frames.length-1].g;
  pc = s.pc; pr = Math.min(s.pr, ROWS-2);
  awardFinds(s.fell);                               // anything shaken loose on the way in
  picks = PICKS(); beamsLeft = SV.beams ? 2 : 0; pending = null; anim = null;
  // Arriving is a landing, not a cut: the room rises into place under you and you hit
  // the floor of it.
  dig.x = pc; dig.y = pr; dig.sq = .7; dig.swing = -1; dig.hop = 0;
  slide = 1; popDepth = 1; hudBag = haul;
  parts.length = 0; floats.length = 0; pips.length = 0; rings.length = 0; flashes.length = 0;
  if(!motes.length) for(let i=0;i<14;i++) motes.push(newMote(true));
  puff(pc*TILE, HUD+pr*TILE, 8);
  shake = Math.max(shake, 2.5);
  if(d > SV.deepest) SV.deepest = d;
  if(d > SV.best) SV.best = d;
  // You can arrive on a screen where every swing in reach buries you. finishSim() only
  // ever ran that check after a break, so an arrival like that left the player standing
  // with no legal input and nothing to press. Worse, the screen is persistent: ending
  // the leg would strand them again on the next visit. Reshape it instead.
  if(!safeSwingExists()) reshapeScreen();
  storeScreen(depth, scr); save();
  if(depth % 3 === 0) landingPanel();
  else { mode='play'; clearUI(); toast(biomeAt(d).name); }
}

// Re-roll this one depth and drop the player back into it. Destructive to whatever was
// already dug here, which is why it only ever runs when the alternative is a dead end.
function reshapeScreen(){
  const k = String(depth), want = scr ? scr.ec : (COLS>>1);
  for(let tries=0; tries<6; tries++){
    SV.reroll[k] = (SV.reroll[k]||0) + 1;
    delete SV.screens[k];
    scr = genScreen(depth, want, SV.reroll[k]);
    pc = scr.ec; pr = 1;
    const s = pendingFrom(resolve(liveBoard(), {t:ACT.SETTLE}), pc, pr).sim;
    if(s.frames.length) scr.g = s.frames[s.frames.length-1].g;
    pc = s.pc; pr = Math.min(s.pr, ROWS-2);
    awardFinds(s.fell);
    dig.x = pc; dig.y = pr; dig.sq = .7; dig.swing = -1; dig.hop = 0;
    if(safeSwingExists()) break;
  }
  storeScreen(depth, scr); save();
  toast('THE ROCK SHIFTED');
}

function fellThrough(){
  if(lab){ labEnd('THROUGH THE FLOOR', 'You went out the bottom of the board.'); return; }
  const bonus = Math.max(0, picks)*3;                // leftover picks are the mastery score
  if(bonus>0){ haul = Math.min(CAP(), haul+bonus); fl(pc*TILE, HUD+(ROWS-2)*TILE, '+'+bonus, '#5ed986'); }
  tone(140,.2,'sine',.13,70);
  enterScreen(depth+1, pc);
}

// Burial is the only thing that costs you the haul. Running dry or walking out is a
// worse trip, not a punishment -- that keeps efficiency and danger as separate pressures
// and keeps a three-minute session from ever ending in nothing.
function endLeg(reason){
  if(lab){
    labEnd(reason==='buried' ? 'BURIED' : 'OUT OF PICKS',
           reason==='buried' ? 'The mass came down on top of you instead of under you.'
                             : 'No swing left that does not bury you.');
    return;
  }
  mode = 'panel';
  const buried = reason==='buried';
  const amount = haul; haul = 0;
  if(!buried) SV.bank += amount;
  storeScreen(depth, scr); save();
  if(buried){ noise(.5,.3,300); tone(90,.5,'sawtooth',.13,40); buzz([40,50,40,50,140]); }
  else { tone(392,.12,'triangle',.11); buzz(20); }
  const title = buried ? 'BURIED' : (reason==='quit' ? 'BACK UP TOP' : 'THAT IS THE SCREEN');
  const why = buried
    ? 'The mass came down on top of you instead of under you.'
    : (reason==='quit' ? 'You climbed out with what you had.'
                       : 'Nothing left down here you can swing at safely.');
  ui(`<div class="panel"><div class="card">
    <h1>${title}</h1>
    <h2 class="${buried?'bad':''}">DEPTH ${depth}</h2>
    <p class="s">${why} ${buried ? `You lost <b>${amount}</b>.` : `Banked <b>${amount}</b>.`}</p>
    <p class="s">The hole is still there. So is every lift stop you have planted.</p>
    <div class="st"><span>PURSE</span><b>${SV.bank}</b></div>
    <div class="row"><button class="b" id="ok">BACK UP TOP</button></div>
  </div></div>`);
  on('#ok', surface);
}

function landingPanel(){
  mode = 'panel';
  const banked = haul; SV.bank += haul; haul = 0;
  SV.dives++;
  storeScreen(depth, scr); save();
  tone(523,.1,'triangle',.12); setTimeout(()=>tone(784,.16,'triangle',.12),90);
  const b = biomeAt(depth);
  ui(`<div class="panel"><div class="card">
    <h1>LANDING ${depth}</h1>
    <h2>${b.name}</h2>
    <p class="s">Banked <b>${banked}</b>. The lift stops here from now on.</p>
    <p class="s">${b.note}</p>
