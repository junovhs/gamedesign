<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b0812">
<title>DOWNSHAFT — BLAST CHAIN</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:#0b0812;
    font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    touch-action:none;overscroll-behavior:none;user-select:none;-webkit-user-select:none}
  canvas{display:block;width:100%;height:100%}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<script>
"use strict";
/* ============================================================================
   DOWNSHAFT — BLAST CHAIN  (proof of concept for docs/new-concept.md)

   A chamber is a rock face. You do not swing a pick at it, you BLAST it:

     powder charge  --tap-->  matching canister      (one packs it)
     powder charge  --tap-->  same canister again    (two ARMS it)
     armed canister --tap-->  matching fault seam    (the whole seam goes)

   Every rock of that mineral connected to the one you hit is destroyed, and
   anything armed that the blast touches goes off too — so the real game is
   never "which seam", it is "which seam sets off the next one".

   Under the chamber is a bedrock SEAL. Blast it open and you rappel down.
   Above you the ceiling is failing: every few actions the top row crushes in
   and the chamber gets shorter. Take the fast route down, or spend actions
   building the chain that pays.

   One file, no build, no assets, every pixel drawn by code.
   ========================================================================= */

/* ---------------- minerals -------------------------------------------------
   The first four are the four most separable hues; deeper chambers add the
   near-neighbours (ruby beside copper, cobalt beside amethyst) so telling the
   seams apart becomes part of the difficulty rather than a new rule. */
const MIN = [
  {n:'COPPER',   a:'#ff8a2b', b:'#ffc686', d:'#8f3d07'},
  {n:'JADE',     a:'#15c9a2', b:'#6bf7da', d:'#046356'},
  {n:'AMETHYST', a:'#a45cf0', b:'#d6a1ff', d:'#571a9c'},
  {n:'SULFUR',   a:'#f0cf22', b:'#fff394', d:'#8a6a04'},
  {n:'RUBY',     a:'#f2355f', b:'#ff86a1', d:'#8e0f2d'},
  {n:'COBALT',   a:'#3f7cf2', b:'#8fb6ff', d:'#173f92'}
];

const COLS = 6, ROWS = 11;          // last row is bedrock + the seal
const FLOOR = ROWS - 1;
const CHAMBER_H = 12;               // metres gained per chamber
const SEAL_CHAIN = 2;               // detonation number the bedrock demands
const REACH = 2;                    // columns the drill-line covers either side

/* ---------------- canvas / layout ----------------------------------------- */
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;
let S = 0, BX = 0, BY = 0;          // cell size, board origin
let tooSmall = false;               // landscape bail-out
const LEDGE = 52;                   // the miner's walkable band, above the board

function layout(){
  DPR = Math.min(window.devicePixelRatio || 1, 2.5);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.imageSmoothingEnabled = false;
  // the miner's ledge sits between the readout and the chamber. He is always
  // above the rock: down is progress, up is where the danger comes from.
  const HUD = 78, FOOT = 66;
  S = Math.floor(Math.min((W - 14) / COLS, (H - HUD - LEDGE - FOOT) / ROWS));
  tooSmall = S < 38;
  BX = Math.round((W - S * COLS) / 2);
  BY = Math.round(HUD + LEDGE + (H - HUD - LEDGE - FOOT - S * ROWS) / 2);
}
window.addEventListener('resize', layout);
window.addEventListener('orientationchange', ()=>setTimeout(layout,120));

/* ---------------- sound ----------------------------------------------------
   Tiny synthesised kit. No files, and it has to survive being started from the
   first touch, which is the only gesture a phone gives us. */
let AC = null;
function ac(){
  if(!AC){ const C = window.AudioContext || window.webkitAudioContext; if(!C) return null; AC = new C(); }
  if(AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(freq, dur, type, vol, slide){
  const a = ac(); if(!a) return;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type || 'square'; o.frequency.setValueAtTime(freq, a.currentTime);
  if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(40,slide), a.currentTime + dur);
  g.gain.setValueAtTime(vol || 0.12, a.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + dur);
  o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime + dur + 0.02);
}
function noise(dur, vol, lp){
  const a = ac(); if(!a) return;
  const n = Math.floor(a.sampleRate * dur);
  const buf = a.createBuffer(1, n, a.sampleRate), ch = buf.getChannelData(0);
  for(let i=0;i<n;i++) ch[i] = (Math.random()*2-1) * (1 - i/n);
  const src = a.createBufferSource(); src.buffer = buf;
  const f = a.createBiquadFilter(); f.type='lowpass'; f.frequency.value = lp || 900;
  const g = a.createGain(); g.gain.value = vol || 0.3;
  src.connect(f); f.connect(g); g.connect(a.destination); src.start();
}
const sfx = {
  pick:  ()=>tone(520, 0.07, 'square', 0.07, 700),
  deny:  ()=>tone(150, 0.10, 'sawtooth', 0.08, 90),
  fly:   ()=>tone(300, 0.16, 'triangle', 0.07, 820),
  clank: ()=>{ tone(220, 0.09, 'square', 0.09, 160); noise(0.12, 0.16, 1800); },
  step:  ()=>noise(0.09, 0.14, 600),
  hiss:  ()=>noise(0.28, 0.12, 4200),
  load:  (n)=>tone(n>=2?880:600, 0.12, 'square', 0.10, n>=2?1300:760),
  boom:  (combo)=>{ noise(0.34, 0.34, 700 + combo*220); tone(90+combo*26, 0.24, 'sawtooth', 0.13, 45); },
  crush: ()=>{ noise(0.5, 0.34, 380); tone(70, 0.4, 'sawtooth', 0.14, 34); },
  gold:  (combo)=>tone(660 + combo*90, 0.09, 'triangle', 0.09, 1000 + combo*120),
  open:  ()=>{ tone(400,0.1,'square',0.1,600); setTimeout(()=>tone(600,0.1,'square',0.1,900),90);
               setTimeout(()=>tone(900,0.22,'square',0.1,1300),180); },
  down:  ()=>tone(700, 0.5, 'triangle', 0.09, 120),
  dead:  ()=>{ tone(220,0.5,'sawtooth',0.13,60); noise(0.7,0.3,300); }
};

/* ---------------- game state ---------------------------------------------- */
let grid = [];            // grid[r][c] = cell | null
let depth = 0, gold = 0, chamber = 0;
let sealsLeft = 0;
let ceil = 0;             // number of crushed rows at the top
let actions = 0, actionsPerCollapse = 6;
let sel = null;           // {r,c} selected powder or armed vessel
let aim = null;           // {r,c,cells} previewed seam; a second tap fires
let state = 'play';       // play | busy | won | dead
let combo = 0, comboShow = 0;
let msg = '', msgT = 0;
let shakeT = 0, shakeMag = 0;
let flashT = 0, flashCol = '#fff';
let parts = [], shots = [], timers = [], floaters = [];
let minerC = 0, minerFall = 0;   // he walks the ledge along the top of the chamber
let clouds = [];                 // released gas, climbing toward that ledge
let deathMsg = 'BURIED';
let chainRocks = 0;       // rock destroyed by the chain in progress — pays out charges
let T = 0;                // seconds since load, drives every idle animation

function cell(t, o){ return Object.assign({t, c:0, ch:0, ore:false, oy:0, vy:0, pop:0}, o||{}); }
function inB(r,c){ return r>=0 && r<ROWS && c>=0 && c<COLS; }
function at(r,c){ return inB(r,c) ? grid[r][c] : null; }
const N4 = [[-1,0],[1,0],[0,-1],[0,1]];

/* ---------------- chamber generation --------------------------------------
   Seams are grown as blobs rather than sprinkled per cell, because the whole
   game is reading connected mineral; per-cell noise makes every seam size one
   and there is nothing to plan. Canisters take their colours FROM the seams
   that exist and powders from the canisters, so a chamber is always openable. */
function rnd(n){ return Math.floor(Math.random()*n); }
function pick(a){ return a[rnd(a.length)]; }

function buildChamber(){
  const palette = Math.min(3 + Math.floor(chamber/2), MIN.length);
  grid = [];
  for(let r=0;r<ROWS;r++) grid.push(new Array(COLS).fill(null));

  // --- rock body: grow blobs of one mineral until the face is full
  // the face is solid to the ceiling: an empty top row would mean the first
  // collapses crush nothing and the pressure would not be felt
  const unset = new Set();
  for(let r=0;r<FLOOR;r++) for(let c=0;c<COLS;c++) unset.add(r+','+c);
  while(unset.size){
    const [sr,sc] = unset.values().next().value.split(',').map(Number);
    const m = rnd(palette), want = 3 + rnd(5);
    const q = [{r:sr,c:sc}]; let n = 0;
    while(q.length && n < want){
      const p = q.splice(rnd(q.length),1)[0];
      const k = p.r+','+p.c;
      if(!unset.has(k)) continue;
      unset.delete(k); n++;
      grid[p.r][p.c] = cell('rock', {c:m, ore: Math.random() < 0.08});
      for(const [dr,dc] of N4){
        if(unset.has((p.r+dr)+','+(p.c+dc))) q.push({r:p.r+dr, c:p.c+dc});
      }
    }
  }

  // --- bedrock floor with the seal the chamber is locked behind
  for(let c=0;c<COLS;c++) grid[FLOOR][c] = cell('bedrock');
  const seals = 1 + (chamber >= 3 ? 1 : 0);
  const freeCols = [];
  for(let c=0;c<COLS;c++) freeCols.push(c);
  for(let i=0;i<seals;i++){
    grid[FLOOR][freeCols.splice(rnd(freeCols.length),1)[0]] = cell('seal');
  }
  sealsLeft = seals;

  // --- vessels and charges, placed into the rock face
  const present = [];
  for(let r=0;r<FLOOR;r++) for(let c=0;c<COLS;c++){
    const g = grid[r][c];
    if(g && g.t==='rock' && present.indexOf(g.c) < 0) present.push(g.c);
  }
  // Nothing is placed in the top row — it is the first thing the ceiling eats —
  // and nothing is placed directly on a seal, so the mineral the bedrock must be
  // opened with is always a readable piece of rock rather than a stray canister.
  const spots = [];
  for(let r=1;r<FLOOR;r++) for(let c=0;c<COLS;c++){
    if(r === FLOOR-1 && grid[FLOOR][c] && grid[FLOOR][c].t === 'seal') continue;
    spots.push({r,c});
  }

  const canCols = [];
  const nCan = 3 + Math.min(2, Math.floor(chamber/3));
  // The bedrock takes a chained detonation, and the relay that delivers it has
  // to be the mineral of the rock sitting on the seal — so the chamber is built
  // guaranteeing at least one canister of that mineral exists to be walked down.
  const keyMinerals = [];
  for(let c=0;c<COLS;c++){
    if(grid[FLOOR][c] && grid[FLOOR][c].t === 'seal'){
      const above = grid[FLOOR-1][c];
      if(above && above.t === 'rock') keyMinerals.push(above.c);
    }
  }
  for(let i=0;i<nCan;i++){
    const m = i < keyMinerals.length ? keyMinerals[i] : present[i % present.length];
    const p = spots.splice(rnd(spots.length),1)[0];
    if(!p) break;
    canCols.push(m);
    grid[p.r][p.c] = cell('canister', {c:m});
  }
  if(!canCols.length) canCols.push(present[0] || 0);

  // gas pockets appear once the mine gets deep: any two powders, no colour
  if(chamber >= 2){
    for(let i=0;i<1 + (chamber>=5?1:0);i++){
      const p = spots.splice(rnd(spots.length),1)[0];
      if(p) grid[p.r][p.c] = cell('gas');
    }
  }

  // two powders per canister plus slack, matching colours only
  const powders = [];
  for(const m of canCols) powders.push(m, m);
  powders.push(pick(canCols), pick(canCols));
  for(const m of powders){
    const p = spots.splice(rnd(spots.length),1)[0];
    if(p) grid[p.r][p.c] = cell('powder', {c:m});
  }

  ceil = 0; actions = 0; sel = null; aim = null; combo = 0;
  actionsPerCollapse = Math.max(4, 7 - Math.floor(chamber/2));
  minerC = Math.floor(COLS/2);
  clouds = [];
  state = 'play';
  settle(true);
}

/* ---------------- gravity --------------------------------------------------
   Everything that is not bedrock falls in its column. Rock falls too, which is
   what turns one blast into a reshaped chamber instead of a hole in a wall. */
function settle(instant){
  for(let c=0;c<COLS;c++){
    let write = FLOOR - 1;
    for(let r=FLOOR-1;r>=ceil;r--){
      const g = grid[r][c];
      if(!g) continue;
      // a pocket whose support is gone does not drop — it breaks open, and gas
      // goes the only way gas goes
      if(g.t === 'gas' && write !== r){
        grid[r][c] = null;
        clouds.push({c, r0:r, left:CLOUD_FUSE});
        burst(BX + c*S + S/2, BY + r*S + S/2, '#8dff9a', 14);
        sfx.hiss();
        say('THE POCKET BREAKS OPEN');
        continue;                       // the column keeps compacting past it
      }
      if(write !== r){
        grid[write][c] = g; grid[r][c] = null;
        if(!instant){ g.oy = (write - r) * S; g.vy = 0; }
      }
      write--;
    }
  }
}

/* Released gas climbs toward the ledge on a fixed fuse of actions rather than by
   threading empty cells: the chamber packs downward, so the void is always
   directly under the ledge and a physical rise would surface instantly with no
   chance to answer it. Three actions is the answer window — walk out of its
   column, or blast it apart. The count is drawn on the cloud. */
const CLOUD_FUSE = 3;

function cloudRow(g){ return ceil + (g.r0 - ceil) * (g.left / CLOUD_FUSE); }

function advanceClouds(){
  for(let i=clouds.length-1;i>=0;i--){
    const g = clouds[i];
    g.left--;
    sfx.hiss();
    if(g.left > 0) continue;
    clouds.splice(i,1);
    burst(BX + g.c*S + S/2, BY + ceil*S, '#8dff9a', 22);
    if(Math.abs(g.c - minerC) <= 1){
      say('THE GAS REACHES YOUR LEDGE');
      flashT = 0.3; flashCol = '#3fae6a';
      die('POISONED');
      return;
    }
  }
}

/* ---------------- seam lookup ---------------------------------------------- */
function seam(r, c){
  const g = at(r,c);
  if(!g || !conducts(g, g.c)) return [];
  const m = g.c, seen = {}, out = [], q = [{r,c}];
  seen[r+','+c] = 1;
  while(q.length){
    const p = q.pop(); out.push(p);
    for(const [dr,dc] of N4){
      const nr = p.r+dr, nc = p.c+dc, k = nr+','+nc;
      const n = at(nr,nc);
      if(n && !seen[k] && conducts(n, m)){ seen[k] = 1; q.push({r:nr, c:nc}); }
    }
  }
  return out;
}

/* Same mineral carries the blast, not just rock — so a copper canister set down
   between two separated copper seams welds them into one and a single
   detonation takes both. That is the whole point of being able to move it.

   An ARMED vessel deliberately does not conduct. It stops the flood dead and
   re-emits it one beat later at the next multiplier, which is the only way a
   player can manufacture a secondary detonation — and the bedrock takes nothing
   less. So the same canister is a weld while it is empty and a relay once it is
   armed, and choosing which it should be is the decision. */
function conducts(g, m){
  if(g.c !== m) return false;
  if(g.t === 'rock' || g.t === 'powder') return true;
  return g.t === 'canister' && g.ch < 2;
}

function area(r,c){
  const out = [];
  for(let dr=-1;dr<=1;dr++) for(let dc=-1;dc<=1;dc++){
    const n = at(r+dr, c+dc);
    if(n && n.t!=='bedrock' && n.t!=='seal' && n.t!=='crushed') out.push({r:r+dr, c:c+dc});
  }
  return out;
}

/* ---------------- effects --------------------------------------------------- */
function burst(x,y,col,n){
  for(let i=0;i<n;i++){
    const a = Math.random()*Math.PI*2, sp = 40 + Math.random()*220;
    parts.push({x, y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp - 60,
                life:0.35 + Math.random()*0.45, t:0, col, s:2 + Math.random()*4});
  }
}
function floatText(x,y,txt,col){ floaters.push({x,y,txt,col,t:0}); }
function after(ms, fn){ timers.push({t: ms/1000, fn}); }
function say(t){ msg = t; msgT = 2.0; }

/* ---------------- the blast chain ------------------------------------------
   One wave destroys a set of cells. Anything armed the wave touched goes off in
   the NEXT wave, one beat later, at a higher multiplier — which is the whole
   feel of the mechanic: you hear the chain climb before you see what it took. */
function killCell(r,c,mult,quiet){
  const g = grid[r][c]; if(!g) return;
  grid[r][c] = null;
  const x = BX + c*S + S/2, y = BY + r*S + S/2;
  const col = (g.t==='rock'||g.t==='powder'||g.t==='canister') ? MIN[g.c].a : '#9fb4c9';
  burst(x, y, col, g.t === 'rock' ? 7 : 11);
  if(g.t === 'rock' && !quiet) chainRocks++;
  if(!quiet && (g.t === 'rock' || g.t === 'powder')){
    const v = (g.ore ? 45 : 4) * Math.max(1, mult);
    gold += v;
    if(g.ore){ burst(x,y,'#ffe66a',16); sfx.gold(mult); floatText(x,y,'+'+v,'#ffe66a'); }
  }
}

function wave(cells, mult){
  combo = Math.max(combo, mult); comboShow = 0.9;
  shakeT = 0.3; shakeMag = Math.min(4 + mult*2.5, 16);
  flashT = 0.12; flashCol = '#fff2c9';
  sfx.boom(mult);

  const next = [], seen = {};

  // Armed vessels caught inside the blast are left standing for one beat and go
  // off on the next wave. Killing them here would swallow the chain the player
  // built — the whole reason for placing them there.
  const dead = [];
  for(const p of cells){
    const g = grid[p.r][p.c];
    if(!g) continue;
    if((g.t === 'canister' || g.t === 'gas') && g.ch >= 2){
      const k = p.r+','+p.c;
      if(!seen[k]){ seen[k] = 1; next.push({r:p.r, c:p.c, kind:g.t === 'gas' ? 'gas' : 'can', m:g.c}); }
      continue;
    }
    dead.push(p); killCell(p.r, p.c, mult);
  }

  // A blast blows released gas apart, so the cloud is a threat you can answer.
  // Wash, not a direct hit: the cloud floats in the void a blast never occupies,
  // so blasting rock beside it has to be enough.
  for(let i=clouds.length-1;i>=0;i--){
    const g = clouds[i];
    if(cells.some(p => Math.abs(p.c - g.c) <= 1)){
      burst(BX + g.c*S + S/2, BY + cloudRow(g)*S, '#8dff9a', 18);
      clouds.splice(i,1);
      floatText(W/2, BY + 2*S, 'GAS DISPERSED', '#8dff9a');
    }
  }

  // what the blast touched on its way out
  let sealHeld = false;
  for(const p of dead){
    for(const [dr,dc] of N4){
      const nr = p.r+dr, nc = p.c+dc, k = nr+','+nc;
      const g = at(nr,nc);
      if(!g || seen[k]) continue;
      if(g.t === 'seal'){
        // One charge is a bang. The bedrock only goes under a chain, so the
        // seam under the exit is never the answer on its own.
        if(mult < SEAL_CHAIN){ sealHeld = true; continue; }
        seen[k] = 1; grid[nr][nc] = null; sealsLeft--;
        burst(BX+nc*S+S/2, BY+nr*S+S/2, '#7dfcff', 22);
        shakeT = 0.45; shakeMag = 15; sfx.open();
      } else if(g.t === 'canister' && g.ch >= 2){ seen[k] = 1; next.push({r:nr, c:nc, kind:'can', m:g.c}); }
      else if(g.t === 'gas' && g.ch >= 2){ seen[k] = 1; next.push({r:nr, c:nc, kind:'gas'}); }
      else if(g.t === 'powder'){ seen[k] = 1; killCell(nr, nc, mult); }
    }
  }

  if(sealHeld){
    say('THE SEAL HOLDS — BEDROCK NEEDS A CHAIN');
    sfx.deny();
    for(let c=0;c<COLS;c++) if(grid[FLOOR][c] && grid[FLOOR][c].t === 'seal')
      burst(BX + c*S + S/2, BY + FLOOR*S + S/2, '#7dfcff', 8);
  }

  if(!next.length){ after(240, endChain); return; }

  after(150, ()=>{
    const cs = [], mark = {};
    for(const t of next){
      if(!grid[t.r][t.c]) continue;
      killCell(t.r, t.c, mult, true);
      if(t.kind === 'gas'){
        for(const p of area(t.r, t.c)){
          const k = p.r+','+p.c;
          if(!mark[k]){ mark[k] = 1; cs.push(p); }
        }
        // a primed pocket cracks the bedrock beside it, but only as a chained
        // detonation — the same rule the rest of the blast lives under
        if(mult + 1 >= SEAL_CHAIN) for(const [dr,dc] of N4){
          const g = at(t.r+dr, t.c+dc);
          if(g && g.t === 'seal'){ grid[t.r+dr][t.c+dc] = null; sealsLeft--; sfx.open();
            burst(BX+(t.c+dc)*S+S/2, BY+(t.r+dr)*S+S/2, '#7dfcff', 22); }
        }
      } else {
        for(const [dr,dc] of N4){
          const g = at(t.r+dr, t.c+dc);
          if(g && conducts(g, t.m)){
            for(const p of seam(t.r+dr, t.c+dc)){
              const k = p.r+','+p.c;
              if(!mark[k]){ mark[k] = 1; cs.push(p); }
            }
          }
        }
      }
    }
    if(cs.length){ wave(cs, mult+1); }
    else { // an armed vessel went off with nothing around it — still a beat
      shakeT = 0.2; shakeMag = 8; sfx.boom(mult);
      after(140, endChain);
    }
  });
}

/* A big blast shakes fresh charges out of the rock. This is the whole economy of
   a chamber: charges are finite, so the small tidy blast that opens nothing runs
   you dry, and the long connected seam pays for the next two shots. Without it a
   chamber can dead-end before the seal is reachable, which is not a puzzle. */
function dropLoose(kind){
  const free = [];
  for(let c=0;c<COLS;c++) if(!grid[ceil][c]) free.push(c);
  if(!free.length) return;
  const c = free[rnd(free.length)];
  // colour it after a vessel that is actually still in the chamber
  const cols = [];
  for(let r=ceil;r<FLOOR;r++) for(let cc=0;cc<COLS;cc++){
    const g = grid[r][cc];
    if(g && g.t === 'canister') cols.push(g.c);
    else if(kind === 'canister' && g && g.t === 'rock') cols.push(g.c);
  }
  const m = cols.length ? pick(cols) : rnd(MIN.length);
  grid[ceil][c] = cell(kind, {c:m, oy:S*2.2});
  const x = BX + c*S + S/2;
  burst(x, BY + ceil*S, MIN[m].a, 10);
  floatText(x, BY + ceil*S + S, kind === 'canister' ? 'CANISTER' : '+CHARGE', '#7dfcff');
  sfx.gold(1);
}

function endChain(){
  settle(false);
  if(combo >= 3) floatText(W/2, BY + 3*S, 'CHAIN x' + combo, '#ffe66a');
  const drops = Math.min(3, Math.floor(chainRocks/4));
  for(let i=0;i<drops;i++) dropLoose('powder');
  if(chainRocks >= 8) dropLoose('canister');
  chainRocks = 0;
  settle(false);
  combo = 0;
  tickCeiling();
  if(state === 'busy') state = 'play';
  checkChamber();
}

/* ---------------- ceiling collapse ------------------------------------------
   The pressure in the concept. A visible thing that eats the chamber from the
   top, never a meter — the pips in the HUD only say when the next row goes. */
function collapseRow(){
  if(ceil >= FLOOR - 2){ die(); return; }
  for(let c=0;c<COLS;c++){
    if(grid[ceil][c]) killCell(ceil, c, 1, true);
    grid[ceil][c] = cell('crushed');
  }
  ceil++;
  shakeT = 0.5; shakeMag = 12; flashT = 0.14; flashCol = '#4a3a55';
  sfx.crush();
  settle(false);
  if(ceil >= FLOOR - 1) die();
}

function tickCeiling(){
  actions++;
  advanceClouds();                  // released gas climbs on your clock, not its own
  if(state === 'dead') return;
  if(actions % actionsPerCollapse !== 0) return;
  say('THE CEILING COMES DOWN');
  collapseRow();
}

function die(how){
  if(state === 'dead') return;
  deathMsg = how || 'BURIED';
  state = 'dead'; sel = null; aim = null;
  shakeT = 0.8; shakeMag = 18; sfx.dead();
}

function checkChamber(){
  if(state === 'dead') return;
  if(sealsLeft <= 0){ state = 'won'; say('SHAFT OPEN'); return; }
  // dead chamber: nothing armed, and nothing left that could be armed
  let armed = 0, powder = 0, vessel = 0;
  for(let r=ceil;r<FLOOR;r++) for(let c=0;c<COLS;c++){
    const g = grid[r][c]; if(!g) continue;
    if(g.t === 'powder') powder++;
    else if(g.t === 'canister' || g.t === 'gas'){ if(g.ch >= 2) armed++; else vessel++; }
  }
  if(armed === 0 && (powder < 2 || vessel === 0)) supplyDrop();
}

/* Running out of charges must never be the thing that kills you — a chamber you
   cannot act in is not a puzzle, it is a coin flip on the layout. Instead the
   mine resupplies and charges you a row of ceiling for it, so there is exactly
   one way to lose and the player can always see it coming. */
function supplyDrop(){
  const free = [];
  for(let c=0;c<COLS;c++) if(!grid[ceil][c]) free.push(c);
  if(free.length < 3){ die(); return; }
  const seams = [];
  for(let r=ceil;r<FLOOR;r++) for(let c=0;c<COLS;c++){
    const g = grid[r][c];
    if(g && g.t === 'rock') seams.push(g.c);
  }
  if(!seams.length){ die(); return; }
  // resupply the mineral that can still open the floor, not a random one
  let m = pick(seams);
  for(let c=0;c<COLS;c++){
    if(grid[FLOOR][c] && grid[FLOOR][c].t === 'seal'){
      const above = grid[FLOOR-1][c];
      if(above && above.t === 'rock'){ m = above.c; break; }
    }
  }
  for(const kind of ['canister','powder','powder']){
    const c = free.splice(rnd(free.length),1)[0];
    grid[ceil][c] = cell(kind, {c:m, oy:S*2.4});
    burst(BX + c*S + S/2, BY + ceil*S, MIN[m].a, 12);
  }
  floatText(W/2, BY + (ceil+1)*S, 'SUPPLY DROP', '#7dfcff');
  say('SUPPLY DROP — THE ROOF PAYS FOR IT');
  settle(false);
  collapseRow();
  // the drop itself can be crushed by the row it costs; each retry eats another
  // row, so this terminates at the ceiling rather than soft-locking the chamber
  if(state !== 'dead') checkChamber();
}

/* ---------------- descent / restart ----------------------------------------- */
function descend(){
  sfx.down();
  chamber++; depth += CHAMBER_H;
  minerFall = 1;
  buildChamber();
  say('DEPTH ' + depth + 'm');
}
function restart(){
  chamber = 0; depth = 0; gold = 0;
  parts = []; shots = []; timers = []; floaters = [];
  buildChamber();
  say('BLAST A WAY DOWN');
}

/* ---------------- input ------------------------------------------------------
   Two taps, always: pick the thing, then pick where it goes. The second tap on
   a seam is the confirm, so the outline of exactly what dies is always seen
   before the blast commits. The preview is the promise. */
function cellAtPx(x,y){
  const c = Math.floor((x - BX)/S), r = Math.floor((y - BY)/S);
  return inB(r,c) ? {r,c} : null;
}
let btnDescend = null, btnRestart = null;
function hitBtn(b,x,y){ return b && x>=b.x && x<=b.x+b.w && y>=b.y && y<=b.y+b.h; }

function inReach(c){ return Math.abs(c - minerC) <= REACH; }

function walkTo(c){
  if(c === minerC) return;
  minerC = c;
  sfx.step();
  const x = BX + c*S + S/2, y = BY - 6;
  for(let i=0;i<6;i++)
    parts.push({x, y, vx:(Math.random()-0.5)*70, vy:-30-Math.random()*50,
                life:0.3, t:0, col:'#4a3a55', s:2+Math.random()*3});
}

function tap(x,y){
  ac();
  if(state === 'won'){ if(hitBtn(btnDescend,x,y)) descend(); return; }
  if(state === 'dead'){ if(hitBtn(btnRestart,x,y)) restart(); return; }
  if(state !== 'play') return;

  // the ledge is his to walk. Free, and it never cancels what he is holding —
  // getting out from under rising gas must never cost the plan you were making
  if(y >= BY - LEDGE && y < BY){
    const c = Math.floor((x - BX)/S);
    if(c >= 0 && c < COLS){ walkTo(c); return; }
  }

  const p = cellAtPx(x,y);
  if(!p){ sel = null; aim = null; return; }
  const g = at(p.r, p.c);

  // The drill-line only covers the columns near where he is standing, so where
  // he stands decides what he can work on. Firing is unrestricted — the launch
  // crosses the chamber; it is the handling that has a reach.
  const holding = sel ? at(sel.r, sel.c) : null;
  const isDeselect = sel && sel.r === p.r && sel.c === p.c;
  if(!isDeselect && !inReach(p.c) && !(holding && holding.ch >= 2)){
    sfx.deny(); say('TOO FAR — WALK ALONG THE LEDGE');
    return;
  }

  if(!sel){
    if(!g) return;
    if(g.t === 'powder' || ((g.t === 'canister' || g.t === 'gas') && g.ch >= 2)){
      sel = {r:p.r, c:p.c}; aim = null; sfx.pick();
      say(g.t === 'powder' ? 'LOAD IT INTO A MATCHING CANISTER' : 'FIRE IT INTO A MATCHING SEAM');
    } else if(g.t === 'canister'){
      // an unarmed canister comes loose on the drill-line: where it sits before
      // it is armed is the arrangement decision the whole chain hangs on
      sel = {r:p.r, c:p.c}; aim = null; sfx.pick();
      say('SET IT IN THE ROCK, OR TAP A CHARGE');
    } else if(g.t === 'gas'){
      sfx.deny(); say('GAS POCKETS CANNOT BE MOVED');
    }
    return;
  }

  if(sel.r === p.r && sel.c === p.c){ sel = null; aim = null; sfx.pick(); return; }

  const s = at(sel.r, sel.c);
  if(!s){ sel = null; aim = null; return; }

  if(s.t === 'powder'){
    if(g && g.t === 'canister' && g.c === s.c && g.ch < 2) loadShot(sel, p);
    else if(g && g.t === 'gas' && g.ch < 2) loadShot(sel, p);
    else { sfx.deny(); say(g && g.t === 'canister' ? 'WRONG MINERAL' : 'PICK A CANISTER'); }
    return;
  }

  // carrying an unarmed canister: set it into the rock, or load it where it is
  if(s.t === 'canister' && s.ch < 2){
    if(g && g.t === 'rock'){ moveShot(sel, p); return; }
    if(g && g.t === 'powder' && g.c === s.c){ loadShot(p, sel); return; }
    sfx.deny(); say(g && g.t === 'powder' ? 'WRONG MINERAL' : 'SET IT INTO ROCK');
    return;
  }

  // an armed vessel is selected: target a seam, confirm on the second tap
  if(g && g.t === 'rock'){
    if(s.t === 'canister' && g.c !== s.c){ sfx.deny(); say('WRONG MINERAL'); return; }
    if(aim && aim.r === p.r && aim.c === p.c){ fireShot(sel, p, aim.cells); return; }
    const cells = s.t === 'gas' ? area(p.r, p.c) : seam(p.r, p.c);
    aim = {r:p.r, c:p.c, cells};
    sfx.pick(); say('TAP AGAIN TO BLAST · ' + cells.length + ' ROCK');
    return;
  }
  sfx.deny();
}

/* The canister and the rock trade places. A swap rather than a drop, because the
   face is always packed to the floor — dropping into "empty space" would only
   ever land the canister on top of the pile, nowhere near the seams that matter. */
function moveShot(from, to){
  state = 'busy'; sel = null; aim = null;
  const can = grid[from.r][from.c], rock = grid[to.r][to.c];
  grid[to.r][to.c] = can; grid[from.r][from.c] = rock;
  can.pop = 0.3; rock.pop = 0.3;
  sfx.clank();
  burst(BX + to.c*S + S/2, BY + to.r*S + S/2, '#c9cee0', 9);
  burst(BX + from.c*S + S/2, BY + from.r*S + S/2, MIN[rock.c].a, 7);
  shakeT = 0.12; shakeMag = 4;
  settle(false);
  tickCeiling();
  if(state === 'busy') state = 'play';
  checkChamber();
}

function loadShot(from, to){
  state = 'busy'; sel = null; aim = null;
  const src = grid[from.r][from.c];
  grid[from.r][from.c] = null;
  sfx.fly();
  shots.push({
    x: BX + from.c*S + S/2, y: BY + from.r*S + S/2,
    tx: BX + to.c*S + S/2, ty: BY + to.r*S + S/2,
    t:0, dur:0.22, col: MIN[src.c].a, kind:'powder',
    done(){
      const v = at(to.r, to.c);
      if(v && (v.t === 'canister' || v.t === 'gas')){
        v.ch++; v.pop = 0.35; sfx.load(v.ch);
        burst(this.tx, this.ty, v.ch >= 2 ? '#fff2a8' : MIN[src.c].a, v.ch >= 2 ? 16 : 8);
        if(v.ch >= 2){ shakeT = 0.14; shakeMag = 5;
          say(v.t === 'gas' ? 'GAS POCKET PRIMED' : 'CANISTER ARMED'); }
      }
      settle(false);
      tickCeiling();
      if(state === 'busy') state = 'play';
      checkChamber();
    }
  });
}

function fireShot(from, to, cells){
  state = 'busy';
  const v = grid[from.r][from.c];
  sel = null; aim = null;
  grid[from.r][from.c] = null;
  sfx.fly();
  shots.push({
    x: BX + from.c*S + S/2, y: BY + from.r*S + S/2,
    tx: BX + to.c*S + S/2, ty: BY + to.r*S + S/2,
    t:0, dur:0.26, col: v.t === 'gas' ? '#9dff7a' : MIN[v.c].a, kind:'canister',
    done(){ combo = 0; chainRocks = 0; wave(cells, 1); }
  });
}

cv.addEventListener('pointerdown', e=>{ e.preventDefault(); tap(e.clientX, e.clientY); }, {passive:false});
cv.addEventListener('touchstart', e=>{ e.preventDefault(); }, {passive:false});

/* ---------------- drawing ----------------------------------------------------
   Every pixel here is code. The rules the player has to read at a glance are
   mineral (hue), charge state (lamps), and armed (the yellow pulse). */
function hash(r,c){ const h = Math.sin(r*127.1 + c*311.7) * 43758.5453; return h - Math.floor(h); }

function drawRock(x,y,s,m,ore,r,c){
  const p = MIN[m];
  ctx.fillStyle = p.d; ctx.fillRect(x, y, s, s);
  ctx.fillStyle = p.a; ctx.fillRect(x+1, y+1, s-3, s-3);
  ctx.fillStyle = p.b; ctx.fillRect(x+1, y+1, s-3, Math.max(2, s*0.16));
  ctx.fillStyle = p.d;
  const u = Math.max(2, Math.floor(s/9));
  for(let i=0;i<4;i++){
    ctx.fillRect(x + 3 + Math.floor(hash(r*7+i, c*13+i)*(s-8)),
                 y + 4 + Math.floor(hash(c+i, r+i)*(s-10)), u, u);
  }
  if(ore){
    ctx.globalAlpha = 0.6 + 0.4*Math.sin(T*5 + r + c);
    ctx.fillStyle = '#fff3a0';
    const gx = x + s*0.5, gy = y + s*0.55, g = s*0.17;
    ctx.beginPath(); ctx.moveTo(gx, gy-g); ctx.lineTo(gx+g, gy); ctx.lineTo(gx, gy+g); ctx.lineTo(gx-g, gy);
    ctx.closePath(); ctx.fill(); ctx.globalAlpha = 1;
  }
}

function drawCanister(x,y,s,g){
  const p = MIN[g.c], pad = s*0.16, w = s - pad*2, h = s - pad*2;
  ctx.fillStyle = '#22202c'; ctx.fillRect(x+pad-2, y+pad-2, w+4, h+4);
  ctx.fillStyle = '#8e93a6'; ctx.fillRect(x+pad, y+pad, w, h);
  ctx.fillStyle = '#c9cee0'; ctx.fillRect(x+pad, y+pad, w, h*0.28);
  ctx.fillStyle = '#5a6072'; ctx.fillRect(x+pad, y+pad+h*0.72, w, h*0.28);
  ctx.fillStyle = p.a;      ctx.fillRect(x+pad, y+pad+h*0.36, w, h*0.24);   // mineral band
  for(let i=0;i<2;i++){
    const lx = x + pad + w*(0.28 + i*0.44), ly = y + pad + h*0.16, rr = Math.max(2, s*0.055);
    ctx.fillStyle = g.ch > i ? (g.ch >= 2 ? '#fff36a' : '#ffb03a') : '#3a3f4d';
    ctx.beginPath(); ctx.arc(lx, ly, rr, 0, 7); ctx.fill();
  }
  if(g.ch >= 2){
    ctx.globalAlpha = 0.45 + 0.55*Math.abs(Math.sin(T*7));
    ctx.strokeStyle = '#fff36a'; ctx.lineWidth = 2;
    ctx.strokeRect(x+pad-3, y+pad-3, w+6, h+6); ctx.globalAlpha = 1;
  }
}

function drawGas(x,y,s,g){
  ctx.fillStyle = '#123322'; ctx.fillRect(x,y,s,s);
  ctx.globalAlpha = 0.75;
  for(let i=0;i<7;i++){
    const bx = x + 4 + hash(i, i*3)*(s-10);
    const by = y + 4 + ((hash(i*5, i)*(s-10) + T*14 + i*9) % (s-10));
    ctx.fillStyle = i%2 ? '#8dff9a' : '#4de08a';
    ctx.beginPath(); ctx.arc(bx, by, Math.max(2, s*0.07), 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.strokeStyle = g.ch >= 2 ? '#fff36a' : '#3fae6a';
  ctx.lineWidth = 2; ctx.strokeRect(x+2, y+2, s-4, s-4);
  ctx.font = 'bold ' + Math.floor(s*0.28) + 'px ui-monospace,monospace';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = g.ch >= 2 ? '#fff36a' : '#bdf7c8';
  ctx.fillText(g.ch >= 2 ? '!!' : (g.ch ? '1' : 'GAS'), x + s/2, y + s*0.75);
}

function drawPowder(x,y,s,g){
  const p = MIN[g.c], cx = x+s/2, cy = y+s/2, r = s*0.27;
  ctx.fillStyle = '#1b1622'; ctx.beginPath(); ctx.arc(cx, cy+2, r+2, 0, 7); ctx.fill();
  ctx.fillStyle = p.a;      ctx.beginPath(); ctx.arc(cx, cy, r, 0, 7); ctx.fill();
  ctx.fillStyle = p.b;      ctx.beginPath(); ctx.arc(cx - r*0.3, cy - r*0.35, r*0.34, 0, 7); ctx.fill();
  ctx.strokeStyle = '#e6d8b8'; ctx.lineWidth = Math.max(2, s*0.05);
  ctx.beginPath(); ctx.moveTo(cx + r*0.4, cy - r*0.7);
  ctx.quadraticCurveTo(cx + r*1.1, cy - r*1.2, cx + r*0.6, cy - r*1.55); ctx.stroke();
  ctx.globalAlpha = 0.5 + 0.5*Math.sin(T*12 + x);
  ctx.fillStyle = '#ffd23a';
  ctx.beginPath(); ctx.arc(cx + r*0.6, cy - r*1.55, Math.max(1.5, s*0.05), 0, 7); ctx.fill();
  ctx.globalAlpha = 1;
}

function drawBedrock(x,y,s,seal){
  if(seal){
    ctx.fillStyle = '#0d2a33'; ctx.fillRect(x,y,s,s);
    ctx.fillStyle = '#1d6f86'; ctx.fillRect(x+2,y+2,s-4,s-4);
    ctx.globalAlpha = 0.55 + 0.45*Math.abs(Math.sin(T*3));
    ctx.fillStyle = '#7dfcff'; ctx.fillRect(x + s*0.2, y + s*0.4, s*0.6, s*0.16);
    ctx.globalAlpha = 1;
    ctx.strokeStyle = '#7dfcff'; ctx.lineWidth = 2; ctx.strokeRect(x+2,y+2,s-4,s-4);
    ctx.font = 'bold ' + Math.floor(s*0.2) + 'px ui-monospace,monospace';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    // the bedrock states its own price, so the rule is never a surprise
    ctx.fillStyle = '#bff8ff'; ctx.fillText('CHAIN x' + SEAL_CHAIN, x + s/2, y + s*0.76);
  } else {
    ctx.fillStyle = '#241f2e'; ctx.fillRect(x,y,s,s);
    ctx.fillStyle = '#332c40'; ctx.fillRect(x+1,y+1,s-2,s*0.3);
    ctx.fillStyle = '#191524';
    for(let i=0;i<3;i++) ctx.fillRect(x + 3 + hash(i,x)*(s-8), y + s*0.45 + hash(x,i)*(s*0.4), 3, 3);
  }
}

function drawCrushed(x,y,s){
  ctx.fillStyle = '#151220'; ctx.fillRect(x,y,s,s);
  ctx.fillStyle = '#241f33';
  for(let i=0;i<5;i++) ctx.fillRect(x + hash(i,x)*(s-6), y + hash(x,i)*(s-6), 5, 4);
  ctx.strokeStyle = '#0d0a14'; ctx.lineWidth = 1; ctx.strokeRect(x+0.5, y+0.5, s-1, s-1);
}

/* The ledge is a real surface, not a frame: it is the thing gas is climbing
   toward, and the only place in the chamber the player can stand. */
function drawLedge(danger){
  const y = BY - LEDGE, h = LEDGE;
  ctx.fillStyle = '#191325'; ctx.fillRect(BX - 6, y, S*COLS + 12, h);
  ctx.fillStyle = '#2a2136'; ctx.fillRect(BX - 6, y + h - 12, S*COLS + 12, 12);
  ctx.fillStyle = '#3a2f4d'; ctx.fillRect(BX - 6, y + h - 12, S*COLS + 12, 3);
  // faint stops so it reads as six standable places
  ctx.fillStyle = '#241d33';
  for(let c=1;c<COLS;c++) ctx.fillRect(BX + c*S - 1, y + h - 10, 2, 8);
  drawMiner(BX + minerC*S + S/2, y + h - 12 + minerFall*70, S, danger);
}

function drawCloud(x,y,s,left){
  ctx.globalAlpha = 0.85;
  for(let i=0;i<9;i++){
    const a = (T*1.6 + i*0.7);
    const bx = x + s*0.5 + Math.cos(a)*s*0.3, by = y + s*0.5 + Math.sin(a*1.3)*s*0.28;
    ctx.fillStyle = i%2 ? '#8dff9a' : '#4de08a';
    ctx.beginPath(); ctx.arc(bx, by, s*(0.1 + 0.05*Math.sin(T*5+i)), 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 0.35;
  ctx.fillStyle = '#3fae6a';
  ctx.beginPath(); ctx.arc(x + s*0.5, y + s*0.5, s*0.36, 0, 7); ctx.fill();
  ctx.globalAlpha = 1;
  // an arrow, because the one thing the player must read is which way it goes,
  // and the count of actions before it gets there
  ctx.fillStyle = '#d8ffd8';
  const cx = x + s*0.5, ty = y + s*0.1 - 3*Math.abs(Math.sin(T*4));
  ctx.beginPath(); ctx.moveTo(cx, ty); ctx.lineTo(cx + s*0.13, ty + s*0.16);
  ctx.lineTo(cx - s*0.13, ty + s*0.16); ctx.closePath(); ctx.fill();
  label(String(left), cx, y + s*0.6, Math.floor(s*0.42), '#062012', 'center');
}

function drawMiner(x,y,s,danger){
  const u = Math.max(2, s/13);
  if(danger){
    ctx.globalAlpha = 0.3 + 0.4*Math.abs(Math.sin(T*9));
    ctx.fillStyle = '#ff4d6d';
    ctx.fillRect(x - u*5, y - u*13, u*10, u*14);
    ctx.globalAlpha = 1;
  }
  ctx.fillStyle = '#3b2a1e'; ctx.fillRect(x - u*3, y - u*7, u*6, u*7);
  ctx.fillStyle = '#f0c08a'; ctx.fillRect(x - u*2, y - u*10, u*4, u*3);
  ctx.fillStyle = danger ? '#ff4d6d' : '#f2b21f'; ctx.fillRect(x - u*3, y - u*12, u*6, u*2);
  // he is above the chamber, so the lamp shines down the shaft — the direction
  // the whole game reads in — and never up into the readout
  ctx.globalAlpha = 0.3 + (0.5 + 0.5*Math.sin(T*4))*0.28;
  ctx.fillStyle = '#fff3a0';
  ctx.beginPath(); ctx.moveTo(x + u*2, y - u*10); ctx.lineTo(x + u*12, y - u*1);
  ctx.lineTo(x + u*12, y + u*7); ctx.closePath(); ctx.fill();
  ctx.globalAlpha = 1;
  ctx.fillStyle = '#fff'; ctx.fillRect(x + u*2, y - u*11, u*1.4, u*1.4);
}

function drawCell(r,c){
  const g = grid[r][c]; if(!g) return;
  const x = BX + c*S, y = BY + r*S - (g.oy||0);
  const pop = g.pop ? 1 + g.pop*0.5 : 1;
  if(pop !== 1){
    ctx.save();
    ctx.translate(x + S/2, y + S/2); ctx.scale(pop, pop); ctx.translate(-(x + S/2), -(y + S/2));
  }
  if(g.t === 'rock') drawRock(x, y, S, g.c, g.ore, r, c);
  else if(g.t === 'canister') drawCanister(x, y, S, g);
  else if(g.t === 'gas') drawGas(x, y, S, g);
  else if(g.t === 'powder') drawPowder(x, y, S, g);
  else if(g.t === 'bedrock') drawBedrock(x, y, S, false);
  else if(g.t === 'seal') drawBedrock(x, y, S, true);
  else if(g.t === 'crushed') drawCrushed(x, y, S);
  if(pop !== 1) ctx.restore();
}

function outline(cells, col, w){
  const has = (r,c)=>cells.some(q=>q.r===r && q.c===c);
  ctx.strokeStyle = col; ctx.lineWidth = w;
  for(const p of cells){
    const x = BX + p.c*S, y = BY + p.r*S;
    for(const [dr,dc] of N4){
      if(has(p.r+dr, p.c+dc)) continue;
      ctx.beginPath();
      if(dr === -1){ ctx.moveTo(x, y); ctx.lineTo(x+S, y); }
      else if(dr === 1){ ctx.moveTo(x, y+S); ctx.lineTo(x+S, y+S); }
      else if(dc === -1){ ctx.moveTo(x, y); ctx.lineTo(x, y+S); }
      else { ctx.moveTo(x+S, y); ctx.lineTo(x+S, y+S); }
      ctx.stroke();
    }
  }
}

function label(txt, x, y, size, col, align){
  ctx.font = 'bold ' + size + 'px ui-monospace,SFMono-Regular,Menlo,monospace';
  ctx.textAlign = align || 'left'; ctx.textBaseline = 'middle';
  ctx.globalAlpha = 0.55; ctx.fillStyle = '#000'; ctx.fillText(txt, x+1.5, y+1.5);
  ctx.globalAlpha = 1;    ctx.fillStyle = col;   ctx.fillText(txt, x, y);
}

function button(txt, cy, col){
  const w = Math.min(W - 48, 300), h = 62, x = (W-w)/2, y = cy;
  ctx.fillStyle = '#000'; ctx.fillRect(x+3, y+4, w, h);
  ctx.globalAlpha = 0.85 + (0.5 + 0.5*Math.sin(T*4))*0.15;
  ctx.fillStyle = col; ctx.fillRect(x, y, w, h); ctx.globalAlpha = 1;
  ctx.fillStyle = 'rgba(255,255,255,.25)'; ctx.fillRect(x, y, w, 6);
  label(txt, W/2, y + h/2, 22, '#101018', 'center');
  return {x,y,w,h};
}

function draw(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.fillStyle = '#0b0812'; ctx.fillRect(0,0,W,H);

  if(tooSmall){
    label('ROTATE TO PORTRAIT', W/2, H/2 - 14, 20, '#ffd23a', 'center');
    label('this mine is a tall one', W/2, H/2 + 16, 13, '#8b7fa0', 'center');
    return;
  }

  ctx.save();
  if(shakeT > 0){
    const m = shakeMag * (shakeT/0.5);
    ctx.translate((Math.random()-0.5)*m, (Math.random()-0.5)*m);
  }

  ctx.fillStyle = '#150f20'; ctx.fillRect(BX-6, BY-6, S*COLS+12, S*ROWS+12);
  ctx.strokeStyle = '#2a1f3d'; ctx.lineWidth = 2;
  ctx.strokeRect(BX-6, BY-6, S*COLS+12, S*ROWS+12);

  for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++) drawCell(r,c);

  // out of the drill-line's reach: dimmed, so the limit is read off the board
  // rather than discovered by being refused
  ctx.fillStyle = 'rgba(8,5,14,.55)';
  for(let c=0;c<COLS;c++) if(!inReach(c)) ctx.fillRect(BX + c*S, BY, S, S*ROWS);

  // the promise: the seam that is about to go, and everything it will set off
  if(aim){
    ctx.globalAlpha = 0.20 + (0.5 + 0.5*Math.sin(T*10))*0.2;
    ctx.fillStyle = '#fff';
    for(const p of aim.cells) ctx.fillRect(BX + p.c*S, BY + p.r*S, S, S);
    ctx.globalAlpha = 1;
    outline(aim.cells, '#ffffff', 3);
    // Only what this blast will actually set off. The seal is deliberately NOT
    // outlined: a first detonation cannot crack it, and promising otherwise
    // would be the preview telling a lie.
    const chain = [];
    for(const p of aim.cells){
      const inside = at(p.r, p.c);
      if(inside && (inside.t === 'canister' || inside.t === 'gas') && inside.ch >= 2)
        chain.push({r:p.r, c:p.c});
      for(const [dr,dc] of N4){
        const g = at(p.r+dr, p.c+dc);
        if(g && (g.t === 'canister' || g.t === 'gas') && g.ch >= 2)
          chain.push({r:p.r+dr, c:p.c+dc});
      }
    }
    if(chain.length) outline(chain, '#ffe66a', 3);
  }

  if(sel){
    const t = 0.5 + 0.5*Math.sin(T*8);
    ctx.globalAlpha = 0.5 + t*0.5; ctx.strokeStyle = '#7dfcff'; ctx.lineWidth = 3;
    ctx.strokeRect(BX + sel.c*S + 2, BY + sel.r*S + 2, S-4, S-4);
    ctx.globalAlpha = 1;

    const s = at(sel.r, sel.c);
    if(s){
      ctx.globalAlpha = 0.22 + t*0.16; ctx.fillStyle = '#7dfcff';
      for(let r=ceil;r<FLOOR;r++) for(let c=0;c<COLS;c++){
        const g = grid[r][c]; if(!g) continue;
        // carrying an unarmed canister, every rock cell is a legal seat, so
        // glowing them all would be noise — only the matching charges glow
        const ok = s.t === 'powder'
          ? ((g.t === 'canister' && g.c === s.c && g.ch < 2) || (g.t === 'gas' && g.ch < 2))
          : (s.t === 'canister' && s.ch < 2
              ? (g.t === 'powder' && g.c === s.c)
              : (g.t === 'rock' && (s.t === 'gas' || g.c === s.c)));
        if(ok) ctx.fillRect(BX + c*S, BY + r*S, S, S);
      }
      ctx.globalAlpha = 1;
    }
    // the magnetic drill-line, from the miner to whatever he has hold of
    ctx.strokeStyle = 'rgba(125,252,255,.5)'; ctx.lineWidth = 2;
    ctx.setLineDash([6,6]); ctx.lineDashOffset = -T*30;
    ctx.beginPath();
    ctx.moveTo(BX + minerC*S + S/2, BY - 12);
    ctx.lineTo(BX + sel.c*S + S/2, BY + sel.r*S + S/2);
    ctx.stroke(); ctx.setLineDash([]);
  }

  for(const s of shots){
    const k = s.t/s.dur;
    const x = s.x + (s.tx - s.x)*k;
    const y = s.y + (s.ty - s.y)*k - Math.sin(k*Math.PI)*S*0.9;
    ctx.fillStyle = s.col;
    ctx.beginPath(); ctx.arc(x, y, S*(s.kind === 'canister' ? 0.22 : 0.16), 0, 7); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.7)';
    ctx.beginPath(); ctx.arc(x - S*0.05, y - S*0.05, S*0.06, 0, 7); ctx.fill();
  }

  for(const p of parts){
    ctx.globalAlpha = Math.max(0, 1 - p.t/p.life);
    ctx.fillStyle = p.col;
    ctx.fillRect(p.x - p.s/2, p.y - p.s/2, p.s, p.s);
  }
  ctx.globalAlpha = 1;

  // Rise lanes. A pocket still in the wall shows where its gas WOULD go if you
  // cut it loose; a released cloud shows where it is going now, and the three
  // columns of ledge it will reach. Standing in one is the mistake that kills.
  let danger = false;
  ctx.globalAlpha = 0.05 + 0.03*Math.abs(Math.sin(T*3));
  ctx.fillStyle = '#3fae6a';
  for(let r=ceil;r<FLOOR;r++) for(let c=0;c<COLS;c++){
    const g = grid[r][c];
    if(g && g.t === 'gas') ctx.fillRect(BX + c*S, BY + ceil*S, S, (r - ceil)*S);
  }
  ctx.globalAlpha = 1;

  for(const g of clouds){
    const gr = cloudRow(g);
    const lit = 0.14 + 0.1*Math.abs(Math.sin(T*4));
    for(let d=-1;d<=1;d++){
      const cc = g.c + d;
      if(cc < 0 || cc >= COLS) continue;
      if(cc === minerC) danger = true;
      ctx.globalAlpha = d === 0 ? lit : lit*0.5;
      ctx.fillStyle = '#ff4d6d';
      ctx.fillRect(BX + cc*S, BY - LEDGE, S, (gr - ceil)*S + LEDGE);
    }
    ctx.globalAlpha = 1;
    drawCloud(BX + g.c*S, BY + gr*S, S, g.left);
  }

  drawLedge(danger);

  ctx.restore();

  // ---- HUD: depth, ceiling pips, seals, gold. Nothing else.
  label('DEPTH', 14, 18, 11, '#6f6488');
  label(depth + 'm', 14, 40, 24, '#ffffff');
  label('GOLD', W - 14, 18, 11, '#6f6488', 'right');
  label(String(gold), W - 14, 40, 24, '#ffe66a', 'right');
  label('SEALS ' + Math.max(0, sealsLeft), W - 14, 64, 12, sealsLeft ? '#7dfcff' : '#63f5a0', 'right');

  const left = actionsPerCollapse - (actions % actionsPerCollapse);
  label('CEILING', W/2, 18, 11, '#6f6488', 'center');
  const pipW = 12;
  for(let i=0;i<actionsPerCollapse;i++){
    const x = W/2 - (actionsPerCollapse*pipW)/2 + i*pipW;
    ctx.fillStyle = i < left ? (left <= 2 ? '#ff4d6d' : '#8b7fa0') : '#2a2338';
    ctx.fillRect(x+2, 32, pipW-4, 10);
  }

  const fy = BY + S*ROWS + 30;
  if(msgT > 0) label(msg, W/2, fy, 13, '#cbb9e8', 'center');
  else if(state === 'play') label(sel ? 'TAP A TARGET' : 'TAP A POWDER CHARGE', W/2, fy, 13, '#6f6488', 'center');

  for(const f of floaters){
    ctx.globalAlpha = Math.max(0, 1 - f.t/1.1);
    label(f.txt, f.x, f.y - f.t*44, 18, f.col, 'center');
    ctx.globalAlpha = 1;
  }

  if(comboShow > 0 && combo > 1){
    ctx.globalAlpha = Math.min(1, comboShow*2);
    label('x' + combo, W/2, BY + S*ROWS*0.4, 60 + combo*6, '#ffe66a', 'center');
    ctx.globalAlpha = 1;
  }

  btnDescend = null; btnRestart = null;
  if(state === 'won'){
    ctx.fillStyle = 'rgba(8,6,14,.72)'; ctx.fillRect(0,0,W,H);
    label('SHAFT OPEN', W/2, H*0.34, 30, '#7dfcff', 'center');
    label('gold ' + gold, W/2, H*0.34 + 34, 15, '#ffe66a', 'center');
    btnDescend = button('DESCEND', H*0.5, '#7dfcff');
    label('the next chamber is stranger', W/2, H*0.5 + 88, 12, '#8b7fa0', 'center');
  }
  if(state === 'dead'){
    ctx.fillStyle = 'rgba(20,4,10,.76)'; ctx.fillRect(0,0,W,H);
    label(deathMsg, W/2, H*0.32, 34, '#ff4d6d', 'center');
    label('depth ' + depth + 'm  ·  gold ' + gold, W/2, H*0.32 + 36, 15, '#ffe66a', 'center');
    btnRestart = button('DIG AGAIN', H*0.5, '#ff8a2b');
  }

  if(flashT > 0){
    ctx.globalAlpha = Math.min(0.5, flashT*3);
    ctx.fillStyle = flashCol; ctx.fillRect(0,0,W,H);
    ctx.globalAlpha = 1;
  }
}

/* ---------------- update loop ------------------------------------------------ */
let last = performance.now();
function frame(now){
  const dt = Math.min(0.05, (now - last)/1000); last = now;
  T += dt;

  for(let i=timers.length-1;i>=0;i--){
    timers[i].t -= dt;
    if(timers[i].t <= 0){ const f = timers[i].fn; timers.splice(i,1); f(); }
  }
  for(let i=shots.length-1;i>=0;i--){
    const s = shots[i]; s.t += dt;
    if(s.t >= s.dur){ shots.splice(i,1); s.done(); }
  }
  for(let i=parts.length-1;i>=0;i--){
    const p = parts[i]; p.t += dt;
    p.vy += 900*dt; p.x += p.vx*dt; p.y += p.vy*dt;
    if(p.t >= p.life) parts.splice(i,1);
  }
  for(let i=floaters.length-1;i>=0;i--){
    floaters[i].t += dt;
    if(floaters[i].t > 1.1) floaters.splice(i,1);
  }
  for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++){
    const g = grid[r][c]; if(!g) continue;
    if(g.oy > 0){
      g.vy += 2600*dt; g.oy -= g.vy*dt;
      if(g.oy <= 0){ g.oy = 0; g.vy = 0; g.pop = 0.22; }
    }
    if(g.pop > 0) g.pop = Math.max(0, g.pop - dt*2.2);
  }
  if(shakeT > 0) shakeT = Math.max(0, shakeT - dt);
  if(flashT > 0) flashT = Math.max(0, flashT - dt);
  if(msgT > 0) msgT = Math.max(0, msgT - dt);
  if(comboShow > 0) comboShow = Math.max(0, comboShow - dt);
  if(minerFall > 0) minerFall = Math.max(0, minerFall - dt*1.6);

  draw();
  requestAnimationFrame(frame);
}

layout();
restart();
requestAnimationFrame(frame);

/* Exposed only so the CDP verification harness can drive real taps. */
window.__game = {
  tap, state:()=>state, grid:()=>grid, px:(r,c)=>({x:BX+c*S+S/2, y:BY+r*S+S/2}),
  selected:()=>sel && {r:sel.r, c:sel.c},
  info:()=>({state, deathMsg, sealsLeft, gold, depth, ceil, actions, minerC,
             clouds: clouds.map(g=>({c:g.c, left:g.left, r:cloudRow(g)})),
             FLOOR, COLS, S, BX, BY, LEDGE})
};
</script>
</body>
</html>
