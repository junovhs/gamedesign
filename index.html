<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>PACKHOUSE — Juicy Shift</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#07142c;touch-action:none;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
  canvas{display:block;width:100%;height:100%}
  *{box-sizing:border-box;user-select:none;-webkit-user-select:none}
</style>
</head>
<body>
<canvas id="c" aria-label="PACKHOUSE produce packing puzzle"></canvas>
<script>
"use strict";

/* ============================================================
   PACKHOUSE V2 — controlled packing puzzle

   Design commitments:
   1. The tapped cell is the package landing choice.
   2. Automatic chains use only the committed board state.
      New supply never joins the current chain.
   3. Every stage is deterministic and always remains playable.
   4. There is no move-limit failure state.
   5. Internal names use the same grounded language as the UI.
   ============================================================ */

const cv=document.getElementById('c');
const ctx=cv.getContext('2d');
let W=0,H=0,DPR=1,SAFE_TOP=0,SAFE_BOTTOM=0;
const COLS=7,ROWS=8;
let cell=48,bx=0,by=0,bw=0,bh=0,topH=122,bottomH=94;

function measureSafeArea(){
  const d=document.createElement('div');
  d.style.cssText='position:fixed;visibility:hidden;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)';
  document.body.appendChild(d);
  const cs=getComputedStyle(d);
  SAFE_TOP=parseFloat(cs.paddingTop)||0;
  SAFE_BOTTOM=parseFloat(cs.paddingBottom)||0;
  d.remove();
}
function layout(){
  topH=Math.max(106,Math.min(144,H*.17))+SAFE_TOP;
  bottomH=Math.max(82,Math.min(112,H*.14))+SAFE_BOTTOM;
  const aw=W-20, ah=H-topH-bottomH-12;
  cell=Math.floor(Math.min(aw/COLS,ah/ROWS));
  bw=cell*COLS; bh=cell*ROWS;
  bx=Math.round((W-bw)/2); by=Math.round(topH+(ah-bh)/2);
}
function resize(){
  DPR=Math.min(2,window.devicePixelRatio||1);
  W=innerWidth; H=innerHeight;
  cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR);
  cv.style.width=W+'px'; cv.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  layout();
}
addEventListener('resize',resize);

/* ---------- vivid produce palette ---------- */
const PRODUCE=[
  {name:'apple', plural:'apples', main:'#ff3f66', dark:'#a90e3c', light:'#ff9db2', leaf:'#64e572'},
  {name:'orange',plural:'oranges',main:'#ff9b1c',dark:'#c54a08',light:'#ffd26f',leaf:'#72df62'},
  {name:'pear',plural:'pears',main:'#8fe23c',dark:'#328f29',light:'#d7ff7e',leaf:'#34c96b'},
  {name:'berry',plural:'berries',main:'#995cff',dark:'#4d20a9',light:'#dabdff',leaf:'#5de28e'}
];
const INK='#f8fbff',DIM='rgba(238,247,255,.68)',FAINT='rgba(238,247,255,.34)';
const CYAN='#66e8ff',GOLD='#ffd36b',MINT='#79ffc7';

/* ---------- deterministic supply ---------- */
function mulberry32(seed){
  return function(){
    seed|=0; seed=seed+0x6D2B79F5|0;
    let t=Math.imul(seed^seed>>>15,1|seed);
    t=t+Math.imul(t^t>>>7,61|t)^t;
    return ((t^t>>>14)>>>0)/4294967296;
  };
}
function shuffleWithRng(a,rng){
  for(let i=a.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}

/* ---------- stage data ---------- */
const STAGES=[
  {name:'Fresh Sort',sub:'learn where the package lands',seed:1081,colors:3,bulk:false,pallets:0,equipment:0,goal:{baskets:5},
   hint:'Tap a matching group. The package lands on the exact item you tap.'},
  {name:'Crate Logic',sub:'use landing position to build chains',seed:2189,colors:3,bulk:false,pallets:0,equipment:0,goal:{crates:3},
   hint:'A white sparkle marks a landing cell that will chain immediately.'},
  {name:'Bulk Orders',sub:'large groups skip one package size',seed:3779,colors:3,bulk:true,pallets:0,equipment:0,goal:{crates:5},
   hint:'Groups of five or more bulk-pack two sizes at once.'},
  {name:'Dispatch Bay',sub:'park a truck where it matters',seed:4813,colors:3,bulk:true,pallets:2,equipment:1,goal:{trucks:1,equipment:1},
   hint:'A truck delivers equipment only when parked directly beside its crate.'},
  {name:'Market Rush',sub:'four crops and a crowded loading floor',seed:6397,colors:4,bulk:true,pallets:4,equipment:2,goal:{trucks:2,equipment:2},
   hint:'A waiting truck leaves after three later actions. Dispatch now or build beside it.'},
  {name:'Fleet Day',sub:'engineer two neighbouring trucks',seed:7919,colors:4,bulk:true,pallets:5,equipment:3,goal:{fleet:1,equipment:3},
   hint:'Two neighbouring trucks coordinate a fleet pickup and clear the floor.'}
];

const TOOLS=[
  {id:'handcart',name:'Handcart',verb:'MOVE',desc:'Move one item into a neighbouring space once each shift.'},
  {id:'crowbar',name:'Crowbar',verb:'CLEAR',desc:'Remove one item or broken pallet once each shift.'},
  {id:'orderSheet',name:'Order Sheet',verb:'PLAN',desc:'Show every packable group and the exact landing cells that chain.'},
  {id:'coldRoom',name:'Cold Room',verb:'STORE',desc:'Carry your best surviving package into the next shift.'}
];

const SAVE_KEY='packhouse-v2-save';
let run;
function freshRun(){return {stage:0,totalReceipts:0,equipmentDelivered:0,tools:{},known:{},bestActions:{},stored:null};}
function loadRun(){
  try{const v=JSON.parse(localStorage.getItem(SAVE_KEY));run=Object.assign(freshRun(),v||{});}catch(e){run=freshRun();}
}
function saveRun(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(run));}catch(e){}}
function unlockNextTool(){
  const index=run.equipmentDelivered-1;
  const tool=TOOLS[index];
  if(tool&&!run.tools[tool.id]){run.tools[tool.id]=true;saveRun();return tool;}
  return null;
}
function learn(id){run.known[id]=true;saveRun();}

/* ---------- audio ---------- */
let AC=null,master=null,muted=false;
function initAudio(){
  if(AC)return;
  try{AC=new (AudioContext||webkitAudioContext)();master=AC.createGain();master.gain.value=.42;master.connect(AC.destination);}catch(e){AC=null;}
}
function tone(freq,dur=.14,type='sine',vol=.12,slide=1,delay=0){
  if(!AC||muted)return;
  const t=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(freq,t);if(slide!==1)o.frequency.exponentialRampToValueAtTime(Math.max(30,freq*slide),t+dur);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+.03);
}
function noise(dur=.35,vol=.14,freq=1300){
  if(!AC||muted)return;
  const t=AC.currentTime,n=AC.createBufferSource(),len=Math.floor(AC.sampleRate*dur),buf=AC.createBuffer(1,len,AC.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*(1-i/len);
  n.buffer=buf;const f=AC.createBiquadFilter(),g=AC.createGain();f.type='bandpass';f.frequency.value=freq;f.Q.value=1;g.gain.value=vol;g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  n.connect(f);f.connect(g);g.connect(master);n.start(t);n.stop(t+dur);
}
const SCALE=[0,2,4,7,9,12,14,16,19,21,24];
const hz=i=>220*Math.pow(2,SCALE[Math.max(0,Math.min(SCALE.length-1,i))]/12);
function sfxMerge(tier,chain){tone(hz(tier+chain),.18,'triangle',.16);tone(hz(tier+chain+3),.24,'sine',.10,1,0.04);}
function sfxBad(){tone(120,.13,'square',.06,.72);}
function sfxTap(){tone(620,.05,'sine',.08);}
function sfxTruck(){noise(.55,.22,1500);tone(72,.6,'sine',.22,.45);}
function sfxTool(){[5,8,10].forEach((n,i)=>tone(hz(n),.45,'triangle',.12,1,i*.06));}
function sfxWin(){[2,5,8,10].forEach((n,i)=>tone(hz(n),.5,'triangle',.14,1,i*.08));}

/* ---------- board state ---------- */
let grid=[],flying=[],particles=[],rings=[],floaters=[];
let uid=1,busy=false,chain=0,bestChain=0,shake=0,flash=0,t=0;
let stageState=null,screen='title',previousScreen='play';
let hintText='',hintTime=0;
let uiButtons=[],pressedButton=null,pointerDown=null;
let keyboardActive=false,keyRow=ROWS-1,keyCol=Math.floor(COLS/2);

function makePiece(color,tier=1,kind='produce'){
  return {id:uid++,color,tier,kind,r:0,c:0,px:0,py:0,vx:0,vy:0,pop:0,flash:0,hint:0,scale:1,targetR:null,targetC:null,shrinking:false,wait:0,bornAction:-1};
}
function at(r,c){return r<0||c<0||r>=ROWS||c>=COLS?null:grid[r][c];}
function boardX(c){return bx+c*cell+cell/2;}
function boardY(r){return by+r*cell+cell/2;}
function tierName(t){return ['produce','basket','crate','truck'][Math.min(3,t-1)];}
function hint(s,time=4){hintText=s;hintTime=time;}
const wait=ms=>new Promise(r=>setTimeout(r,ms));

function supplyFill(n=40){
  while(stageState.supply.length<n){
    const bag=[];
    for(let repeat=0;repeat<3;repeat++)for(let c=0;c<stageState.colors;c++)bag.push(c);
    shuffleWithRng(bag,stageState.rng);
    stageState.supply.push(...bag);
  }
}
function peekSupply(n=7){supplyFill(n);return stageState.supply.slice(0,n);}
function takeSupply(){supplyFill(1);return stageState.supply.shift();}

function openingColor(r,c){
  // Fixed stage seed plus a structured stripe bias: deterministic, readable,
  // and guaranteed to begin with several possible groups.
  const stripe=(c+Math.floor(r/2)+stageState.index)%stageState.colors;
  return stageState.rng()<.52?stripe:Math.floor(stageState.rng()*stageState.colors);
}

function buildBoard(){
  grid=Array.from({length:ROWS},()=>Array(COLS).fill(null));
  flying=[];particles=[];rings=[];floaters=[];

  // Cold Room package is reserved before obstacles are placed, so it can never erase a goal object.
  let reserved=null;
  if(run.tools.coldRoom&&run.stored){reserved={r:ROWS-1,c:Math.floor(COLS/2)};}

  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    const p=makePiece(openingColor(r,c),1,'produce');
    p.r=r;p.c=c;p.px=c;p.py=r-ROWS-1;grid[r][c]=p;
  }

  if(reserved){
    const p=makePiece(run.stored.color,run.stored.tier,'produce');
    p.r=reserved.r;p.c=reserved.c;p.px=reserved.c;p.py=-2;p.flash=1;
    grid[reserved.r][reserved.c]=p;
    hint('The Cold Room returned your '+tierName(p.tier)+'.');
    run.stored=null;saveRun();
  }

  const spots=[];
  for(let r=3;r<ROWS;r++)for(let c=0;c<COLS;c++){
    if(reserved&&reserved.r===r&&reserved.c===c)continue;
    spots.push([r,c]);
  }
  shuffleWithRng(spots,stageState.rng);
  let si=0;
  for(let i=0;i<stageState.pallets;i++){
    const [r,c]=spots[si++],p=makePiece(0,1,'pallet');p.r=r;p.c=c;p.px=c;p.py=r-ROWS-2;grid[r][c]=p;
  }
  for(let i=0;i<stageState.equipment;i++){
    const [r,c]=spots[si++],p=makePiece(0,1,'equipment');p.r=r;p.c=c;p.px=c;p.py=r-ROWS-2;grid[r][c]=p;
  }

  ensurePlayable();
}

function startStage(index){
  const cfg=STAGES[index];
  run.stage=index;
  stageState={index,cfg,colors:cfg.colors,pallets:cfg.pallets,equipment:cfg.equipment,bulk:cfg.bulk,
    rng:mulberry32(cfg.seed),supply:[],actions:0,receipts:0,baskets:0,crates:0,trucks:0,fleet:0,equipmentDelivered:0,
    complete:false,charges:{handcart:run.tools.handcart?1:0,crowbar:run.tools.crowbar?1:0},armed:null,handcartFrom:null,orderSheet:false};
  busy=false;chain=0;bestChain=0;flash=0;
  buildBoard();
  screen='play';hint(cfg.hint,5.5);saveRun();
}

/* ---------- grouping and deterministic simulation ---------- */
function floodGroup(r,c,board=grid){
  const start=(r<0||c<0||r>=ROWS||c>=COLS)?null:board[r][c];
  if(!start||start.kind!=='produce')return[];
  const out=[start],stack=[start],seen=new Set([start.id]);
  while(stack.length){
    const p=stack.pop();
    for(const [rr,cc] of [[p.r-1,p.c],[p.r+1,p.c],[p.r,p.c-1],[p.r,p.c+1]]){
      const q=(rr<0||cc<0||rr>=ROWS||cc>=COLS)?null:board[rr][cc];
      if(q&&q.kind==='produce'&&!seen.has(q.id)&&q.color===start.color&&q.tier===start.tier){seen.add(q.id);out.push(q);stack.push(q);}
    }
  }
  return out;
}
function anyMove(board=grid){
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    const p=board[r][c];
    if(!p||p.kind!=='produce')continue;
    if(p.tier>=4||floodGroup(r,c,board).length>=2)return true;
  }
  return false;
}
function ensurePlayable(){
  if(anyMove())return;
  // Deterministically create one adjacent pair at the top without changing fixed objects.
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS-1;c++){
    const a=grid[r][c],b=grid[r][c+1];
    if(a&&b&&a.kind==='produce'&&b.kind==='produce'&&a.tier===1&&b.tier===1){b.color=a.color;b.flash=1;return;}
  }
  // If the board is almost entirely fixed objects, clear one non-goal pallet rather than deadlock.
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)if(grid[r][c]?.kind==='pallet'){grid[r][c]=null;refillBoard();return;}
}
function compactBoard(board=grid,animate=true){
  for(let c=0;c<COLS;c++){
    let write=ROWS-1;
    for(let r=ROWS-1;r>=0;r--){
      const p=board[r][c];
      if(!p)continue;
      if(write!==r){board[write][c]=p;board[r][c]=null;p.r=write;p.c=c;if(!animate){p.px=c;p.py=write;}}
      write--;
    }
  }
}
function cloneBoard(){
  return grid.map(row=>row.map(p=>p?{id:p.id,color:p.color,tier:p.tier,kind:p.kind,r:p.r,c:p.c,marker:false}:null));
}
function simulateLanding(r,c){
  const board=cloneBoard(),target=board[r][c];
  if(!target||target.kind!=='produce'||target.tier>=4)return null;
  const group=floodGroup(r,c,board);
  if(group.length<2)return null;
  const leap=stageState.bulk&&group.length>=5?2:1;
  for(const q of group)if(q!==target)board[q.r][q.c]=null;
  target.tier=Math.min(4,target.tier+leap);target.marker=true;
  compactBoard(board,false);
  let located=null;
  for(let rr=0;rr<ROWS;rr++)for(let cc=0;cc<COLS;cc++)if(board[rr][cc]?.marker)located=board[rr][cc];
  if(!located)return null;
  const next=located.tier<4?floodGroup(located.r,located.c,board):[];
  return {groupSize:group.length,leap,chain:next.length>=2,resultTier:located.tier,finalR:located.r,finalC:located.c};
}
function chainDepthForLanding(r,c){
  // A compact deterministic preview used by the Order Sheet. It follows only
  // existing pieces and stops before supply enters.
  const board=cloneBoard();
  let target=board[r][c],depth=0;
  if(!target||target.kind!=='produce'||target.tier>=4)return 0;
  while(target&&target.tier<4){
    const group=floodGroup(target.r,target.c,board);
    if(group.length<2)break;
    depth++;
    const leap=stageState.bulk&&group.length>=5?2:1;
    for(const q of group)if(q!==target)board[q.r][q.c]=null;
    target.tier=Math.min(4,target.tier+leap);target.marker=true;
    compactBoard(board,false);
    target=null;
    for(let rr=0;rr<ROWS;rr++)for(let cc=0;cc<COLS;cc++)if(board[rr][cc]?.marker){target=board[rr][cc];target.marker=false;}
  }
  return depth;
}

/* ---------- effects ---------- */
function ring(x,y,color,max,width=3){rings.push({x,y,r:cell*.2,max,color,width,life:1});}
function burst(x,y,color,count=18,power=2){
  for(let i=0;i<count;i++){
    const a=Math.random()*Math.PI*2,s=(.35+Math.random())*power;
    particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-.4,life:1,decay:.016+Math.random()*.018,size:cell*(.025+Math.random()*.075),color,rot:Math.random()*6.28,spin:(Math.random()-.5)*.4});
  }
  if(particles.length>700)particles.splice(0,particles.length-700);
}
function floatText(x,y,text,color=INK,size=16){floaters.push({x,y,text,color,size,life:1,vy:-.65});}

/* ---------- actions ---------- */
function ageWaitingTrucks(exemptId=null){
  const leaving=[];
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    const p=grid[r][c];
    if(p&&p.kind==='produce'&&p.tier>=4&&p.id!==exemptId&&p.bornAction<stageState.actions){p.wait--;if(p.wait<=0)leaving.push(p);}
  }
  for(const p of leaving){
    if(grid[p.r][p.c]===p)grid[p.r][p.c]=null;
    burst(boardX(p.c),boardY(p.r),PRODUCE[p.color].main,18,2);floatText(boardX(p.c),boardY(p.r),'DEPARTED',DIM,13);
    tone(92,.42,'triangle',.10,.75);hint('A waiting truck departed. You can always build another.');
  }
}
function countAction(exemptTruckId=null){stageState.actions++;ageWaitingTrucks(exemptTruckId);}

async function attemptAction(r,c){
  if(busy||screen!=='play')return;
  const p=at(r,c);

  if(stageState.armed==='crowbar'){
    if(!p){sfxBad();return;}
    stageState.armed=null;stageState.charges.crowbar=0;busy=true;countAction();
    grid[r][c]=null;burst(boardX(c),boardY(r),'#d9f4ff',26,3);ring(boardX(c),boardY(r),CYAN,cell*1.4,4);noise(.25,.14,2300);
    await wait(170);await compactAndRefill();busy=false;afterAction();return;
  }

  if(stageState.armed==='handcart'){
    if(!stageState.handcartFrom){if(!p){sfxBad();return;}stageState.handcartFrom={r,c};hint('Now tap a neighbouring space.');return;}
    const f=stageState.handcartFrom,d=Math.abs(f.r-r)+Math.abs(f.c-c);
    if(d!==1){sfxBad();stageState.handcartFrom=p?{r,c}:null;return;}
    const a=grid[f.r][f.c],b=grid[r][c];grid[f.r][f.c]=b;grid[r][c]=a;
    if(a){a.r=r;a.c=c;a.pop=.5;}if(b){b.r=f.r;b.c=f.c;b.pop=.5;}
    stageState.armed=null;stageState.handcartFrom=null;stageState.charges.handcart=0;busy=true;countAction();tone(760,.15,'triangle',.13,1.35);
    await wait(220);busy=false;afterAction();return;
  }

  if(!p){sfxBad();return;}
  if(p.kind==='pallet'){p.hint=1;sfxBad();hint('Broken pallet: clear it with the Crowbar or park a truck beside it.');learn('pallet');return;}
  if(p.kind==='equipment'){p.hint=1;sfxBad();hint('Equipment crate: park a truck directly beside it, then dispatch.');learn('equipment');return;}
  if(p.tier>=4){await dispatchTruck(p);return;}

  const group=floodGroup(r,c);
  if(group.length<2){p.hint=1;sfxBad();hint('Match touching items with the same produce and package size.');return;}

  busy=true;chain=0;countAction();
  await resolveMerge(group,p);
  await refillBoard();
  busy=false;afterAction();
}

async function resolveMerge(group,target){
  chain++;bestChain=Math.max(bestChain,chain);
  const oldTier=target.tier,color=PRODUCE[target.color],leap=stageState.bulk&&group.length>=5?2:1;
  sfxMerge(oldTier,chain);
  for(const q of group){q.pop=.4+chain*.08;q.flash=.8;}
  await wait(100);

  for(const q of group){
    if(q===target)continue;
    grid[q.r][q.c]=null;q.targetR=target.r;q.targetC=target.c;q.shrinking=true;flying.push(q);
  }
  await wait(150);flying.length=0;

  target.tier=Math.min(4,oldTier+leap);target.pop=1;target.flash=1;
  const x=boardX(target.c),y=boardY(target.r);
  burst(x,y,color.main,12+group.length*4,1.5+target.tier*.35);ring(x,y,color.light,cell*(1+target.tier*.28),2+target.tier);
  shake=Math.max(shake,2+target.tier+chain);
  const points=10*oldTier*group.length*chain;stageState.receipts+=points;floatText(x,y-cell*.38,'+'+points,color.light,15+Math.min(8,chain*2));
  if(leap===2){floatText(x,y-cell*.82,'BULK +2',GOLD,15);learn('bulk');}
  if(chain>1){floatText(x,y-cell*1.05,'CHAIN '+chain,INK,14);learn('chain');}

  if(target.tier===2)stageState.baskets++;
  if(target.tier===3)stageState.crates++;
  if(target.tier===4){target.wait=3;target.bornAction=stageState.actions;learn('truck');hint('Truck ready. Dispatch it, or risk three later actions to build a neighbour.');}

  await wait(150);
  compactBoard(grid,true);
  await wait(240);

  // Crucial rule: only the committed board may continue this chain.
  if(target.tier<4){
    const next=floodGroup(target.r,target.c);
    if(next.length>=2){await wait(80);await resolveMerge(next,target);}
  }
}

async function compactAndRefill(){compactBoard(grid,true);await wait(230);await refillBoard();}
async function refillBoard(){
  // Supply enters only after the entire player-created chain is finished.
  let spawned=false;
  for(let c=0;c<COLS;c++){
    let missing=0;for(let r=0;r<ROWS;r++)if(!grid[r][c])missing++;
    let k=missing;
    for(let r=missing-1;r>=0;r--){
      if(grid[r][c])continue;
      const p=makePiece(takeSupply(),1,'produce');p.r=r;p.c=c;p.px=c;p.py=-k-.5;k--;grid[r][c]=p;spawned=true;
    }
  }
  if(spawned)tone(930,.05,'sine',.045);
  await wait(300);ensurePlayable();
}

function adjacentFixed(p){
  const out=[];
  for(const [rr,cc] of [[p.r-1,p.c],[p.r+1,p.c],[p.r,p.c-1],[p.r,p.c+1]]){
    const q=at(rr,cc);if(q&&(q.kind==='pallet'||q.kind==='equipment'))out.push(q);
  }
  return out;
}
async function removeFixed(q){
  if(grid[q.r][q.c]!==q)return;
  grid[q.r][q.c]=null;
  const x=boardX(q.c),y=boardY(q.r);
  if(q.kind==='equipment'){
    stageState.equipmentDelivered++;run.equipmentDelivered++;
    burst(x,y,GOLD,44,3.4);ring(x,y,GOLD,cell*2.1,4);floatText(x,y-cell*.4,'TOOL DELIVERED',GOLD,17);sfxTool();learn('equipment');
    const tool=unlockNextTool();if(tool)hint(tool.name+' added to the Tool Shed.');
  }else{burst(x,y,'#86b8d8',24,2.6);ring(x,y,'#86b8d8',cell*1.3,3);noise(.25,.13,900);learn('pallet');}
}
async function dispatchTruck(truck){
  const neighbour=[[truck.r-1,truck.c],[truck.r+1,truck.c],[truck.r,truck.c-1],[truck.r,truck.c+1]].map(([r,c])=>at(r,c)).find(q=>q&&q.kind==='produce'&&q.tier>=4);
  busy=true;countAction(truck.id);
  if(neighbour)await fleetPickup(truck,neighbour);else await singleDispatch(truck);
  await refillBoard();busy=false;afterAction();
}
async function singleDispatch(truck){
  const color=PRODUCE[truck.color],fixed=adjacentFixed(truck),doomed=[];
  truck.pop=1;truck.flash=1;ring(boardX(truck.c),boardY(truck.r),color.light,cell*1.5,4);await wait(200);
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    const q=grid[r][c];if(q&&q.kind==='produce'&&q.color===truck.color)doomed.push(q);
  }
  // Visible route lines make the global collection rule causal.
  ctx.save();ctx.restore();
  sfxTruck();flash=.32;shake=Math.max(shake,18);
  for(const q of doomed){
    grid[q.r][q.c]=null;burst(boardX(q.c),boardY(q.r),color.main,10,2.2);
    routeLines.push({x1:boardX(q.c),y1:boardY(q.r),x2:boardX(truck.c),y2:boardY(truck.r),color:color.light,life:1});
  }
  stageState.trucks++;stageState.receipts+=doomed.length*45;floatText(boardX(truck.c),boardY(truck.r)-cell*.5,'DISPATCHED',color.light,20);
  await wait(220);for(const q of fixed)await removeFixed(q);compactBoard(grid,true);await wait(240);
}
async function fleetPickup(a,b){
  learn('fleet');sfxTruck();sfxTool();flash=1;shake=Math.max(shake,25);hint('FLEET PICKUP');await wait(250);
  const equipment=[];let count=0;
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    const q=grid[r][c];if(!q)continue;
    if(q.kind==='equipment'){equipment.push(q);continue;}
    grid[r][c]=null;count++;burst(boardX(c),boardY(r),q.kind==='pallet'?'#86b8d8':PRODUCE[q.color].main,10,2.8);
  }
  stageState.fleet++;stageState.trucks+=2;stageState.receipts+=count*40;floatText(W/2,by+bh/2,'FLEET PICKUP',INK,27);
  await wait(220);for(const q of equipment)await removeFixed(q);compactBoard(grid,true);await wait(240);
}

function goalMet(){
  const g=stageState.cfg.goal;
  return (g.baskets===undefined||stageState.baskets>=g.baskets)&&
         (g.crates===undefined||stageState.crates>=g.crates)&&
         (g.trucks===undefined||stageState.trucks>=g.trucks)&&
         (g.fleet===undefined||stageState.fleet>=g.fleet)&&
         (g.equipment===undefined||stageState.equipmentDelivered>=g.equipment);
}
function afterAction(){
  if(goalMet()&&!stageState.complete){stageState.complete=true;sfxWin();hint('Orders filled. Close the shift, or keep packing for a better result.',5);}
  ensurePlayable();
}
function closeShift(){
  if(!stageState.complete)return;
  run.totalReceipts+=stageState.receipts;
  const prior=run.bestActions[stageState.index];
  run.bestActions[stageState.index]=prior===undefined?stageState.actions:Math.min(prior,stageState.actions);
  if(run.tools.coldRoom){
    let best=null;
    for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
      const p=grid[r][c];if(p&&p.kind==='produce'&&p.tier<4&&(!best||p.tier>best.tier))best=p;
    }
    if(best&&best.tier>=2)run.stored={color:best.color,tier:Math.min(3,best.tier)};
  }
  saveRun();screen='result';
}

/* ---------- animation ---------- */
function spring(p){
  const tr=p.targetR!==null?p.targetR:p.r,tc=p.targetC!==null?p.targetC:p.c;
  p.vy+=(tr-p.py)*.42;p.vy*=.7;p.py+=p.vy;
  p.vx+=(tc-p.px)*.42;p.vx*=.7;p.px+=p.vx;
  p.pop*=.86;p.flash*=.9;p.hint*=.92;if(p.shrinking)p.scale=Math.max(0,p.scale-.1);
}
let routeLines=[];
function update(dt){
  t+=dt;
  for(const row of grid)if(row)for(const p of row)if(p)spring(p);
  for(const p of flying)spring(p);
  for(let i=particles.length-1;i>=0;i--){const q=particles[i];q.x+=q.vx*cell*.06;q.y+=q.vy*cell*.06;q.vy+=.09;q.vx*=.985;q.rot+=q.spin;q.life-=q.decay;if(q.life<=0)particles.splice(i,1);}
  for(let i=rings.length-1;i>=0;i--){const q=rings[i];q.r+=(q.max-q.r)*.15;q.life-=.034;if(q.life<=0)rings.splice(i,1);}
  for(let i=floaters.length-1;i>=0;i--){const q=floaters[i];q.y+=q.vy;q.vy*=.97;q.life-=.015;if(q.life<=0)floaters.splice(i,1);}
  for(let i=routeLines.length-1;i>=0;i--){routeLines[i].life-=.04;if(routeLines[i].life<=0)routeLines.splice(i,1);}
  shake*=.84;flash*=.86;if(hintTime>0)hintTime-=dt;
}

/* ---------- drawing helpers ---------- */
function rr(x,y,w,h,r){ctx.beginPath();r=Math.min(r,w/2,h/2);ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();}
function txt(s,x,y,size,color=INK,align='center',weight=700){ctx.font=weight+' '+size+'px ui-rounded,"Avenir Next","Segoe UI",system-ui,sans-serif';ctx.textAlign=align;ctx.textBaseline='middle';ctx.fillStyle=color;ctx.fillText(s,x,y);}
function measureText(s,size,weight=700){ctx.font=weight+' '+size+'px ui-rounded,"Avenir Next","Segoe UI",system-ui,sans-serif';return ctx.measureText(s).width;}
function wrapText(text,x,y,maxWidth,lineHeight,size,color=INK,align='left'){
  ctx.font='600 '+size+'px ui-rounded,"Avenir Next","Segoe UI",system-ui,sans-serif';ctx.textAlign=align;ctx.textBaseline='middle';ctx.fillStyle=color;
  const words=text.split(' ');let line='';
  for(const word of words){const test=line?line+' '+word:word;if(ctx.measureText(test).width>maxWidth&&line){ctx.fillText(line,x,y);y+=lineHeight;line=word;}else line=test;}
  if(line){ctx.fillText(line,x,y);y+=lineHeight;}return y;
}

function chainPreviewCells(){
  const out=[];
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    const p=grid[r][c];if(!p||p.kind!=='produce'||p.tier>=4)continue;

  }
  return out;
}

function drawBoard(){
  ctx.save();ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
  ctx.save();ctx.shadowColor='rgba(0,0,0,.55)';ctx.shadowBlur=32;ctx.shadowOffsetY=10;
  const panel=ctx.createLinearGradient(bx,by,bx+bw,by+bh);panel.addColorStop(0,'rgba(14,49,98,.94)');panel.addColorStop(1,'rgba(18,24,70,.95)');ctx.fillStyle=panel;rr(bx-8,by-8,bw+16,bh+16,20);ctx.fill();ctx.restore();
  ctx.strokeStyle='rgba(111,232,255,.48)';ctx.lineWidth=2;rr(bx-8,by-8,bw+16,bh+16,20);ctx.stroke();
  ctx.strokeStyle='rgba(192,240,255,.09)';ctx.lineWidth=1;
  for(let r=1;r<ROWS;r++){ctx.beginPath();ctx.moveTo(bx,by+r*cell);ctx.lineTo(bx+bw,by+r*cell);ctx.stroke();}
  for(let c=1;c<COLS;c++){ctx.beginPath();ctx.moveTo(bx+c*cell,by);ctx.lineTo(bx+c*cell,by+bh);ctx.stroke();}

  ctx.save();ctx.beginPath();rr(bx-2,by-2,bw+4,bh+4,13);ctx.clip();

  if(stageState?.orderSheet){
    const seen=new Set();
    for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
      const p=grid[r][c];if(!p||p.kind!=='produce'||p.tier>=4||seen.has(p.id))continue;
      const group=floodGroup(r,c);group.forEach(q=>seen.add(q.id));if(group.length<2)continue;
      ctx.strokeStyle='rgba(164,241,255,.46)';ctx.lineWidth=1.3;ctx.setLineDash([4,4]);
      for(const q of group){rr(bx+q.c*cell+4,by+q.r*cell+4,cell-8,cell-8,9);ctx.stroke();}
      ctx.setLineDash([]);
    }
  }

  // Exact landing cells that create a deliberate chain.
  for(const q of chainPreviewCells()){
    const x=boardX(q.c),y=boardY(q.r),pulse=.62+.3*Math.sin(t*5+q.r+q.c);
    ctx.globalAlpha=pulse;ctx.strokeStyle='#ffffff';ctx.lineWidth=stageState?.orderSheet?2.4:1.5;

    if(stageState?.orderSheet){txt(q.depth+'x',x+cell*.22,y-cell*.23,cell*.18,q.bulk?GOLD:INK,'center',900);}
    ctx.globalAlpha=1;
  }

  if(stageState?.handcartFrom){const f=stageState.handcartFrom;ctx.strokeStyle=CYAN;ctx.lineWidth=3;rr(bx+f.c*cell+2,by+f.r*cell+2,cell-4,cell-4,9);ctx.stroke();}

  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)if(grid[r][c])drawPiece(grid[r][c]);
  for(const p of flying)drawPiece(p,Math.max(0,p.scale));

  if(keyboardActive&&screen==='play'){ctx.strokeStyle='rgba(255,255,255,'+(.55+.3*Math.sin(t*6))+')';ctx.lineWidth=2.5;rr(bx+keyCol*cell+2,by+keyRow*cell+2,cell-4,cell-4,9);ctx.stroke();}

  for(const l of routeLines){ctx.globalAlpha=l.life;ctx.strokeStyle=l.color;ctx.lineWidth=2;ctx.setLineDash([5,6]);ctx.beginPath();ctx.moveTo(l.x1,l.y1);ctx.quadraticCurveTo((l.x1+l.x2)/2,l.y1-cell*.6,l.x2,l.y2);ctx.stroke();ctx.setLineDash([]);}
  ctx.globalAlpha=1;
  for(const r of rings){ctx.globalAlpha=r.life*.85;ctx.strokeStyle=r.color;ctx.lineWidth=r.width;ctx.beginPath();ctx.arc(r.x,r.y,r.r,0,Math.PI*2);ctx.stroke();}
  for(const p of particles){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.color;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillRect(-p.size*.5,-p.size*.22,p.size,p.size*.44);ctx.restore();}
  ctx.globalAlpha=1;ctx.restore();

  ctx.restore();
}

function drawHud(){
  const y0=18+SAFE_TOP;txt(stageState.cfg.name.toUpperCase(),14,y0,15,INK,'left',900);txt(stageState.cfg.sub,14,y0+19,11,DIM,'left',600);
  const size=Math.max(38,Math.min(44,W*.105));button('guide',W-14-size,y0-8,size,size,'?',{round:size/2,size:18});button('mute',W-22-size*2,y0-8,size,size,muted?'×':'♪',{round:size/2,size:17});button('restart',W-30-size*3,y0-8,size,size,'↻',{round:size/2,size:19});

  const infoY=topH-34;txt('ACTIONS',14,infoY-12,9,FAINT,'left',800);txt(String(stageState.actions),14,infoY+7,22,INK,'left',900);
  txt('RECEIPTS',W/2,infoY-12,9,FAINT,'center',800);txt(stageState.receipts.toLocaleString(),W/2,infoY+6,15,GOLD,'center',900);

  let gx=W-14;const goals=goalItems();
  for(let i=goals.length-1;i>=0;i--){const [label,have,need]=goals[i],done=have>=need,text=Math.min(have,need)+'/'+need,w=Math.max(58,measureText(text,13,900)+22);gx-=w;ctx.fillStyle=done?'rgba(121,255,199,.14)':'rgba(255,255,255,.06)';rr(gx,infoY-13,w,28,14);ctx.fill();ctx.strokeStyle=done?'rgba(121,255,199,.6)':'rgba(255,255,255,.14)';rr(gx,infoY-13,w,28,14);ctx.stroke();txt(text,gx+w/2,infoY+1,13,done?MINT:INK,'center',900);txt(label,gx+w/2,infoY-26,8,FAINT,'center',800);gx-=7;}

  const incoming=peekSupply(7),startX=Math.max(82,W*.17);txt('INCOMING',startX,infoY-12,8,FAINT,'center',800);
  for(let i=0;i<incoming.length;i++){ctx.save();ctx.translate(startX-30+i*10,infoY+7);drawFruit(incoming[i],4.5);ctx.restore();}
}
function drawAbilityBar(){
  const list=[];
  if(run.tools.handcart)list.push({id:'handcart',label:'HANDCART',sub:'move one',available:stageState.charges.handcart>0});
  if(run.tools.crowbar)list.push({id:'crowbar',label:'CROWBAR',sub:'clear one',available:stageState.charges.crowbar>0});
  if(run.tools.orderSheet)list.push({id:'orderSheet',label:'ORDER SHEET',sub:'exact plans',available:true,toggle:true});
  if(stageState.complete)list.push({id:'closeShift',label:'CLOSE SHIFT',sub:'orders filled',available:true,primary:true});
  const y=H-bottomH+9;
  if(!list.length){if(hintTime>0){ctx.globalAlpha=Math.min(1,hintTime);wrapText(hintText,W/2,y+22,W-34,15,12.5,DIM,'center');ctx.globalAlpha=1;}return;}
  const gap=7,total=Math.min(W-20,470),w=(total-gap*(list.length-1))/list.length,h=Math.min(58,bottomH-16);let x=(W-total)/2;
  for(const b of list){button(b.id,x,y,w,h,b.label,{sub:b.sub,disabled:!b.available&&!b.toggle,active:stageState.armed===b.id||(b.id==='orderSheet'&&stageState.orderSheet),primary:b.primary,size:Math.min(13,w*.16)});x+=w+gap;}
  if(hintTime>0){ctx.globalAlpha=Math.min(1,hintTime)*.92;wrapText(hintText,W/2,y-14,W-28,14,12,DIM,'center');ctx.globalAlpha=1;}
}
function drawPlay(){drawBoard();drawHud();drawAbilityBar();if(flash>.01){ctx.fillStyle='rgba(255,255,255,'+Math.min(.82,flash)+')';ctx.fillRect(0,0,W,H);}}

function drawTitle(){
  const cx=W/2,cy=H*.28;
  for(let i=0;i<4;i++){const a=t*.5+i*Math.PI/2,x=cx+Math.cos(a)*Math.min(W,H)*.22,y=cy+Math.sin(a)*Math.min(W,H)*.09;ctx.save();ctx.translate(x,y);drawFruit(i,13+2*Math.sin(t*2+i));ctx.restore();}
  const glow=ctx.createRadialGradient(cx,cy,0,cx,cy,Math.min(W,H)*.4);glow.addColorStop(0,'rgba(102,232,255,.2)');glow.addColorStop(1,'rgba(102,232,255,0)');ctx.fillStyle=glow;ctx.fillRect(0,0,W,H);
  txt('PACKHOUSE',cx,cy,Math.min(54,W*.13),INK,'center',950);txt('juicy produce · deliberate chains',cx,cy+40,13,CYAN,'center',700);
  const w=Math.min(310,W*.76);button('start',cx-w/2,H*.61,w,58,run.stage>0?'RETURN TO SHIFT':'START SORTING',{primary:true,size:16});button('guide',cx-w/2,H*.61+70,w,46,'PACKING GUIDE',{size:13});button('toolShed',cx-w/2,H*.61+126,w,46,'TOOL SHED',{size:13});
  txt('No move limits. Every stage stays solvable.',cx,H-30,11,FAINT,'center',650);
}
function drawResult(){
  drawBoard();drawHud();ctx.fillStyle='rgba(5,10,29,.86)';ctx.fillRect(0,0,W,H);uiButtons=[];
  const cx=W/2;let y=H*.24;txt('SHIFT COMPLETE',cx,y,Math.min(30,W*.075),INK,'center',900);y+=34;txt(stageState.cfg.name,cx,y,13,DIM,'center',650);y+=48;
  for(const [a,b] of [['Actions',stageState.actions],['Receipts',stageState.receipts.toLocaleString()],['Longest chain',bestChain],['Tools delivered',stageState.equipmentDelivered]]){txt(a,cx-8,y,13,DIM,'right',650);txt(String(b),cx+8,y,14,INK,'left',900);y+=27;}
  const best=run.bestActions[stageState.index];if(best!==undefined){y+=6;txt('Best: '+best+' actions',cx,y,12,MINT,'center',800);y+=30;}
  const w=Math.min(310,W*.74),last=stageState.index===STAGES.length-1;button('next',cx-w/2,y,w,56,last?'OPEN TOOL SHED':'NEXT SHIFT',{primary:true,size:16});y+=68;button('replay',cx-w/2,y,w,44,'REPLAY THIS SHIFT',{size:13});
}
function drawToolShed(){
  const cx=W/2;txt('TOOL SHED',cx,46+SAFE_TOP,24,INK,'center',900);txt(run.equipmentDelivered+' of '+TOOLS.length+' tools delivered · '+run.totalReceipts.toLocaleString()+' receipts',cx,73+SAFE_TOP,11,DIM,'center',650);
  const total=Math.min(W-26,450),gap=8,w=(total-gap*3)/4,x0=(W-total)/2,y0=116+SAFE_TOP,icons=['↔','⌁','✓','▣'];
  for(let i=0;i<TOOLS.length;i++){const owned=!!run.tools[TOOLS[i].id],x=x0+i*(w+gap);ctx.globalAlpha=owned?1:.27;ctx.fillStyle=owned?'rgba(102,232,255,.12)':'rgba(255,255,255,.04)';rr(x,y0,w,92,12);ctx.fill();ctx.strokeStyle=owned?'rgba(102,232,255,.55)':'rgba(255,255,255,.14)';rr(x,y0,w,92,12);ctx.stroke();txt(owned?icons[i]:'?',x+w/2,y0+29,24,owned?CYAN:FAINT,'center',900);txt(owned?TOOLS[i].name.toUpperCase():'LOCKED',x+w/2,y0+64,Math.min(10,w*.14),owned?INK:FAINT,'center',850);ctx.globalAlpha=1;}
  let y=y0+120;for(const tool of TOOLS)if(run.tools[tool.id]){txt(tool.name,cx,y,14,CYAN,'center',850);y+=18;y=wrapText(tool.desc,22,y,W-44,15,11.5,DIM,'left')+8;}
  if(!run.equipmentDelivered){txt('Equipment crates appear in later shifts.',cx,y,12,FAINT,'center',650);y+=25;}
  button('back',cx-Math.min(270,W*.66)/2,Math.min(H-72,Math.max(y+10,H*.78)),Math.min(270,W*.66),50,'BACK',{primary:true,size:15});
}
function drawGuide(){
  if(previousScreen==='play'&&stageState)drawBoard();ctx.fillStyle='rgba(5,10,29,.93)';ctx.fillRect(0,0,W,H);uiButtons=[];
  const cx=W/2;txt('PACKING GUIDE',cx,42+SAFE_TOP,18,INK,'center',900);let y=80+SAFE_TOP;
  const entries=[
    ['LAND','Tap a matching group. The upgraded package lands on the exact item you tap.'],
    ['CHAIN','A white sparkle marks a landing cell that immediately touches a matching next-size package.'],
    ['SUPPLY','Incoming produce follows a fixed queue. New supply never joins the chain you just created.'],
    ['BULK','From Bulk Orders onward, groups of five or more skip one package size.'],
    ['TRUCK','A truck collects its produce color. Only pallets or equipment directly beside the parked truck are loaded.'],
    ['FLEET','Two neighbouring trucks clear the loading floor together.'],
    ['NO DEAD END','There is no move-limit loss. If a board has no packable group, the floor corrects itself.']
  ];
  for(const [title,body] of entries){txt(title,20,y,13,CYAN,'left',900);y+=18;y=wrapText(body,20,y,W-40,15,11.5,DIM,'left')+9;}
  button('closeGuide',cx-Math.min(240,W*.6)/2,Math.min(H-68,y+6),Math.min(240,W*.6),48,'BACK',{primary:true,size:15});
}

/* ---------- input ---------- */
function position(e){const rect=cv.getBoundingClientRect(),p=e.touches?.[0]||e.changedTouches?.[0]||e;return{x:p.clientX-rect.left,y:p.clientY-rect.top};}
function cellAt(x,y){if(x<bx||x>=bx+bw||y<by||y>=by+bh)return null;return{r:Math.floor((y-by)/cell),c:Math.floor((x-bx)/cell)};}
function buttonAt(x,y){for(let i=uiButtons.length-1;i>=0;i--){const b=uiButtons[i],pad=6;if(x>=b.x-pad&&x<=b.x+b.w+pad&&y>=b.y-pad&&y<=b.y+b.h+pad)return b;}return null;}
function down(e){e.preventDefault();initAudio();const {x,y}=position(e),b=buttonAt(x,y);if(b){pressedButton=b.id;pointerDown={x,y,button:b.id};tone(680,.06,'triangle',.08);return;}const cellPos=screen==='play'?cellAt(x,y):null;pointerDown={x,y,cell:cellPos};if(cellPos&&!busy){const p=at(cellPos.r,cellPos.c);if(p){p.pop=Math.max(p.pop,.18);sfxTap();}}}
function up(e){
  e.preventDefault();const {x,y}=position(e),pd=pointerDown;pointerDown=null;pressedButton=null;if(!pd)return;
  if(pd.button){const b=buttonAt(x,y);if(b&&b.id===pd.button&&!b.disabled)handleButton(b.id);return;}
  if(screen!=='play')return;const c=cellAt(x,y);if(!c||!pd.cell)return;
  const dx=Math.abs(x-pd.x),dy=Math.abs(y-pd.y);
  if(dx>cell*.45||dy>cell*.45){
    if(stageState.charges.handcart>0&&!stageState.armed){const d=Math.abs(pd.cell.r-c.r)+Math.abs(pd.cell.c-c.c);if(d===1){stageState.armed='handcart';stageState.handcartFrom=pd.cell;attemptAction(c.r,c.c);return;}}
    return;
  }
  if(c.r===pd.cell.r&&c.c===pd.cell.c){keyboardActive=false;attemptAction(c.r,c.c);}
}

function handleButton(id){
  if(id==='start'){startStage(run.stage);return;}
  if(id==='guide'){previousScreen=screen;screen='guide';return;}
  if(id==='closeGuide'){screen=previousScreen;return;}
  if(id==='mute'){muted=!muted;if(master)master.gain.value=muted?0:.42;return;}
  if(id==='restart'||id==='replay'){startStage(stageState.index);return;}
  if(id==='next'){if(stageState.index>=STAGES.length-1){screen='toolShed';return;}startStage(stageState.index+1);return;}
  if(id==='toolShed'){previousScreen=screen;screen='toolShed';return;}
  if(id==='back'){screen=previousScreen==='toolShed'?'title':previousScreen;return;}
  if(id==='closeShift'){closeShift();return;}
  if(id==='orderSheet'){stageState.orderSheet=!stageState.orderSheet;return;}
  if(id==='handcart'||id==='crowbar'){
    if(stageState.charges[id]<=0)return;stageState.armed=stageState.armed===id?null:id;stageState.handcartFrom=null;
    hint(id==='handcart'?'Tap an item, then a neighbouring space.':'Tap one item or pallet to clear it.');
  }
}

cv.addEventListener('pointerdown',down,{passive:false});cv.addEventListener('pointerup',up,{passive:false});cv.addEventListener('pointercancel',()=>{pointerDown=null;pressedButton=null;});cv.addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('keydown',e=>{
  initAudio();const k=e.key;
  if(screen==='title'){if(k==='Enter'||k===' ')handleButton('start');return;}
  if(screen==='guide'){if(k==='Escape'||k==='Enter'||k===' ')handleButton('closeGuide');return;}
  if(screen==='toolShed'){if(k==='Escape'||k==='Enter')handleButton('back');return;}
  if(screen==='result'){if(k==='Enter'||k===' ')handleButton('next');return;}
  if(screen!=='play')return;
  if(k==='ArrowLeft'){keyboardActive=true;keyCol=Math.max(0,keyCol-1);e.preventDefault();}
  else if(k==='ArrowRight'){keyboardActive=true;keyCol=Math.min(COLS-1,keyCol+1);e.preventDefault();}
  else if(k==='ArrowUp'){keyboardActive=true;keyRow=Math.max(0,keyRow-1);e.preventDefault();}
  else if(k==='ArrowDown'){keyboardActive=true;keyRow=Math.min(ROWS-1,keyRow+1);e.preventDefault();}
  else if(k==='Enter'||k===' '){keyboardActive=true;attemptAction(keyRow,keyCol);e.preventDefault();}
  else if(k==='1')handleButton('handcart');else if(k==='2')handleButton('crowbar');else if(k==='3')handleButton('orderSheet');
  else if(k.toLowerCase()==='i'){previousScreen='play';screen='guide';}
  else if(k.toLowerCase()==='r')handleButton('restart');else if(k.toLowerCase()==='f'&&stageState.complete)handleButton('closeShift');else if(k.toLowerCase()==='m')handleButton('mute');
});

/* ---------- frame ---------- */
let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;update(dt);uiButtons=[];drawBackground();
  if(screen==='title')drawTitle();else if(screen==='play')drawPlay();else if(screen==='result')drawResult();else if(screen==='toolShed')drawToolShed();else if(screen==='guide')drawGuide();
  requestAnimationFrame(frame);
}

measureSafeArea();resize();loadRun();requestAnimationFrame(frame);
</script>
