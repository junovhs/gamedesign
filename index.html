<script>
"use strict";
/* =============================================================================
   PACKHOUSE

   Rules, complete:
     1. Press a group of touching, matching produce. It packs into one bigger
        package, which settles in the COLUMN YOU PRESSED.
     2. If it lands touching a match, it packs again. And again.
     3. Five or more at once skips a size.
     4. Press a truck to send it out. It takes every piece of its crop, and
        whatever is left settles and consolidates on its own.
     5. Two trucks side by side leave together and clear the floor.

   Everything else is a crop, and each crop bends exactly one of those rules.
   One shift teaches one thing. Nothing is invisible.
   ========================================================================== */

const cv=document.getElementById('c');
const ctx=cv.getContext('2d');
let W=0,H=0,DPR=1,ST=0,SB=0;
let COLS=7,ROWS=8,cell=48,bx=0,by=0,bw=0,bh=0,topH=120,botH=84,chuteH=32;

function measureSafe(){
  const d=document.createElement('div');
  d.style.cssText='position:fixed;visibility:hidden;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)';
  document.body.appendChild(d);const cs=getComputedStyle(d);
  ST=parseFloat(cs.paddingTop)||0;SB=parseFloat(cs.paddingBottom)||0;d.remove();
}
function layout(){
  topH=Math.max(104,Math.min(140,H*.158))+ST;
  botH=Math.max(62,Math.min(86,H*.1))+SB;
  const aw=W-16,ah=H-topH-botH-6;
  cell=Math.max(22,Math.floor(Math.min(aw/COLS,ah/(ROWS+0.78))));
  chuteH=Math.round(cell*.66);
  bw=cell*COLS;bh=cell*ROWS;
  bx=Math.round((W-bw)/2);
  by=Math.round(topH+chuteH+Math.max(0,(ah-chuteH-bh)/2));
}
function resize(){
  DPR=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  cv.style.width=W+'px';cv.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);layout();
}
addEventListener('resize',resize);

const INK='#f6fbff',DIM='rgba(236,246,255,.66)',FAINT='rgba(236,246,255,.3)';
const CYAN='#6ae9ff',GOLD='#ffd36b',MINT='#79ffc7';

 {name:'Night Market',crops:null,cols:7,rows:8,seed:9901,endless:true,

/* ============================ SAVE ====================================== */
const KEY='packhouse-p5';
let run={stage:0,total:0,best:{},owned:[],equip:[],loadout:['apple','orange','pear'],
  stored:null,seenChain:false,seenTruck:false,unlockedNight:false};
function load(){try{const v=JSON.parse(localStorage.getItem(KEY));if(v)run=Object.assign(run,v);}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(run));}catch(e){}}
const hasGear=id=>run.equip.indexOf(id)>=0;

/* ============================ AUDIO ===================================== */
let AC=null,master=null,muted=false;
function initAudio(){if(AC)return;try{AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=.4;master.connect(AC.destination);}catch(e){AC=null;}}
function tone(f,dur,type,vol,slide,delay){
  if(!AC||muted)return;dur=dur||.14;type=type||'sine';vol=vol||.12;slide=slide||1;delay=delay||0;
  const t2=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t2);
  if(slide!==1)o.frequency.exponentialRampToValueAtTime(Math.max(30,f*slide),t2+dur);
  g.gain.setValueAtTime(.0001,t2);g.gain.exponentialRampToValueAtTime(vol,t2+.012);
  g.gain.exponentialRampToValueAtTime(.0001,t2+dur);
  o.connect(g);g.connect(master);o.start(t2);o.stop(t2+dur+.03);
}
function noise(dur,vol,f){
  if(!AC||muted)return;dur=dur||.3;vol=vol||.14;f=f||1300;
  const t2=AC.currentTime,n=AC.createBufferSource(),len=Math.floor(AC.sampleRate*dur);
  const buf=AC.createBuffer(1,len,AC.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*(1-i/len);
  n.buffer=buf;const bp=AC.createBiquadFilter(),g=AC.createGain();
  bp.type='bandpass';bp.frequency.value=f;bp.Q.value=1;g.gain.value=vol;
  g.gain.exponentialRampToValueAtTime(.0001,t2+dur);
  n.connect(bp);bp.connect(g);g.connect(master);n.start(t2);n.stop(t2+dur);
}
const SC=[0,2,4,7,9,12,14,16,19,21,24,26,28,31,33];
const hz=i=>220*Math.pow(2,SC[Math.max(0,Math.min(SC.length-1,i))]/12);
function sfxPack(tier,chain){tone(hz(tier+chain*2),.17,'triangle',.15);tone(hz(tier+chain*2+3),.22,'sine',.09,1,.04);}
function sfxNo(){tone(300,.09,'sine',.05);}
function sfxTap(){tone(600,.045,'sine',.06);}
function sfxCrane(){tone(280,.18,'triangle',.09,1.8);noise(.16,.05,600);}
function sfxTruck(){noise(.5,.2,1500);tone(70,.55,'sine',.2,.45);}
function sfxBig(){[2,5,8,11,13].forEach((n,i)=>tone(hz(n),.5,'triangle',.14,1,i*.07));}
function sfxOrder(){[4,7,11,14].forEach((n,i)=>tone(hz(n),.42,'sine',.12,1,i*.07));noise(.5,.08,2600);}

/* ============================ STATE ===================================== */
let grid=[],flying=[],parts=[],rings=[],floats=[],lines=[];
let uid=1,busy=false,shakeAmt=0,flash=0,t=0,slowmo=0;
let cfg=STAGES[0],st=null,rng=null,colQ=[],crops=[];
let screen='title',prevScreen='play';
let hintText='',hintTime=0;
let buttons=[],pressBtn=null,down=null,preview=null;
let spotIds=new Set();
let hook={on:false,x:0,y:0,tx:0,ty:0};
let intro=0,celebrate=0,celebrateText='';
let cardOffer=[],pickedCard=null,loadPick=[];
let familyGlow=null;

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let x=Math.imul(a^a>>>15,1|a);x=x+Math.imul(x^x>>>7,61|x)^x;return((x^x>>>14)>>>0)/4294967296;};}
function shuffle(a,r){for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));const s=a[i];a[i]=a[j];a[j]=s;}return a;}

function makeP(color,tier){
  return {id:uid++,color,tier,r:0,c:0,px:0,py:0,vx:0,vy:0,pop:0,flash:0,wig:0,scale:1,tR:null,tC:null,gone:false};
}
const at=(r,c)=>(r<0||c<0||r>=ROWS||c>=COLS)?null:grid[r][c];
const bxc=c=>bx+c*cell+cell/2, byr=r=>by+r*cell+cell/2;
function hint(s,time){hintText=s;hintTime=time===undefined?4.5:time;}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const tierName=tr=>['produce','basket','crate','truck'][Math.min(3,Math.max(0,tr-1))];
const tierPlural=tr=>['produce','baskets','crates','trucks'][Math.min(3,Math.max(0,tr-1))];

/* ============================ PHYSICS =================================== */
const isHang=(color,tier)=>{const c=crops[color];return !!(c&&c.hang&&tier>=c.hang);};
function applyGravity(b){
  for(let c=0;c<COLS;c++){
    let w=ROWS-1;
    for(let r=ROWS-1;r>=0;r--){
      const q=b[r][c];if(!q)continue;
      if(isHang(q.color,q.tier)){w=r-1;continue;}
      if(w!==r){b[w][c]=q;b[r][c]=null;q.r=w;q.c=c;}
      w--;
    }
  }
}

/* ============================ SUPPLY ==================================== */
function fillQ(c){
  while(colQ[c].length<6){
    const bag=[];
    for(let k=0;k<2;k++)for(let i=0;i<crops.length;i++)bag.push({color:i,tier:1});
    shuffle(bag,rng);
    if(cfg.basketDrop&&rng()<cfg.basketDrop)bag[Math.floor(rng()*bag.length)].tier=2;
    colQ[c].push.apply(colQ[c],bag);
  }
}
function pull(c){fillQ(c);const s=colQ[c].shift();fillQ(c);return s;}

/* ============================ BOARD ===================================== */
function buildBoard(){
  grid=Array.from({length:ROWS},()=>Array(COLS).fill(null));
  flying=[];parts=[];rings=[];floats=[];lines=[];
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    const stripe=(c+((r/2)|0)+st.index)%crops.length;
    const color=rng()<.5?stripe:Math.floor(rng()*crops.length);
    const p=makeP(color,1);p.r=r;p.c=c;p.px=c;p.py=r-ROWS-1;grid[r][c]=p;
  }
  const spots=[];
  for(let r=2;r<ROWS;r++)for(let c=0;c<COLS;c++)spots.push([r,c]);
  shuffle(spots,rng);
  let i=0;
  for(let k=0;k<cfg.seedCrates&&i<spots.length;k++){const s=spots[i++],p=grid[s[0]][s[1]];p.tier=3;p.color=Math.floor(rng()*crops.length);}
  for(let k=0;k<cfg.seedBaskets&&i<spots.length;k++){const s=spots[i++],p=grid[s[0]][s[1]];p.tier=2;p.color=Math.floor(rng()*crops.length);}
  if(hasGear('coldroom')&&run.stored){
    const cc=Math.floor(COLS/2);
    const p=makeP(Math.min(run.stored.color,crops.length-1),run.stored.tier);
    p.r=ROWS-1;p.c=cc;p.px=cc;p.py=-2;p.flash=1;grid[ROWS-1][cc]=p;
    run.stored=null;save();
  }
  applyGravity(grid);
  for(const row of grid)for(const p of row)if(p){p.px=p.c;p.py=p.r-ROWS-1;}
  ensurePlayable();ensureOpportunity();refreshSpots();
}

/* ============================ GROUPS & SIM ============================== */
function nbrs(p,color){
  const d=[[p.r-1,p.c],[p.r+1,p.c],[p.r,p.c-1],[p.r,p.c+1]];
  if(crops[color]&&crops[color].diag)d.push([p.r-1,p.c-1],[p.r-1,p.c+1],[p.r+1,p.c-1],[p.r+1,p.c+1]);
  return d;
}
function floodGrid(r,c){
  const s=at(r,c);if(!s)return[];
  const out=[s],stack=[s],seen=new Set([s.id]);
  while(stack.length){
    const p=stack.pop();
    for(const d of nbrs(p,s.color)){
      const q=at(d[0],d[1]);
      if(q&&!seen.has(q.id)&&q.color===s.color&&q.tier===s.tier){seen.add(q.id);out.push(q);stack.push(q);}
    }
  }
  return out;
}
function cloneB(){return grid.map((row,r)=>row.map((p,c)=>p?{color:p.color,tier:p.tier,r,c}:null));}
function floodB(b,r,c){
  const s=b[r][c];if(!s)return[];
  const out=[s],stack=[s],seen=new Set([s]);
  while(stack.length){
    const p=stack.pop();
    for(const d of nbrs(p,s.color)){
      const r2=d[0],c2=d[1];
      if(r2<0||c2<0||r2>=ROWS||c2>=COLS)continue;
      const q=b[r2][c2];
      if(q&&!seen.has(q)&&q.color===s.color&&q.tier===s.tier){seen.add(q);out.push(q);stack.push(q);}
    }
  }
  return out;
}
const isBulk=(color,n)=>!!(cfg.bulk&&n>=5&&!crops[color].noBulk);
const packScore=(fromTier,size,chainIdx)=>10*fromTier*size*chainIdx;

/* The whole consequence of pressing (r,c). Drives the plan overlay. */
function simulate(r,c){
  const src=at(r,c);
  if(!src||src.tier>=4)return null;
  const live=floodGrid(r,c);
  if(live.length<2)return null;
  const b=cloneB(),tgt=b[r][c];
  const g=floodB(b,r,c);
  const bulk=isBulk(tgt.color,g.length);
  let leave=null;
  if(bulk&&crops[tgt.color].leaveBehind){
    let far=null,fd=-1;
    for(const q of g){if(q===tgt)continue;const d=Math.abs(q.r-r)+Math.abs(q.c-c);if(d>fd){fd=d;far=q;}}
    if(far)leave={r:far.r,c:far.c};
  }
  for(const q of g)b[q.r][q.c]=null;
  let cur={color:tgt.color,tier:Math.min(4,tgt.tier+(bulk?2:1)),r,c};
  b[r][c]=cur;
  if(leave&&!b[leave.r][leave.c])b[leave.r][leave.c]={color:tgt.color,tier:1,r:leave.r,c:leave.c};
  applyGravity(b);
  const landR=cur.r,landC=cur.c;
  let chain=1,pts=packScore(tgt.tier,g.length,1),matches=[];
  while(cur.tier<4){
    const g2=floodB(b,cur.r,cur.c);
    if(g2.length<2)break;
    if(chain===1)matches=g2.filter(q=>q!==cur).map(q=>({r:q.r,c:q.c}));
    chain++;
    const b2=isBulk(cur.color,g2.length),from=cur.tier;
    for(const q of g2)b[q.r][q.c]=null;
    cur={color:cur.color,tier:Math.min(4,from+(b2?2:1)),r:cur.r,c:cur.c};
    b[cur.r][cur.c]=cur;applyGravity(b);
    pts+=packScore(from,g2.length,chain);
  }
  return {group:live.map(q=>({r:q.r,c:q.c})),groupSize:live.length,bulk,
    landR,landC,tier:Math.min(4,src.tier+(bulk?2:1)),chain,matches,points:pts,
    color:src.color,finalTier:cur.tier};
}

/* ============================ THE FLOOR ALWAYS WORKS ==================== */
function anyMove(){
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    const p=grid[r][c];if(!p)continue;
    if(p.tier>=4)return true;
    if(floodGrid(r,c).length>=2)return true;
  }
  return false;
}
function ensurePlayable(){
  if(anyMove())return;
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS-1;c++){
    const a=grid[r][c],b=grid[r][c+1];
    if(a&&b&&a.tier<4&&b.tier<4){b.color=a.color;b.tier=a.tier;b.flash=1;return;}
  }
}
function chainRoots(){
  const s=new Set();
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    const p=grid[r][c];if(!p||p.tier>=4)continue;
    const sim=simulate(r,c);
    if(sim&&sim.chain>1)s.add(p.id);
  }
  return s;
}
function ensureOpportunity(){
  if(cfg.noGuarantee)return;
  if(chainRoots().size)return;
  let best=null;
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    const p=grid[r][c];if(!p||p.tier>=4)continue;
    const s=simulate(r,c);
    if(s&&s.tier<4&&(!best||s.groupSize>best.s.groupSize))best={r,c,s};
  }
  if(!best)return;
  const inG=new Set(best.s.group.map(q=>q.r*COLS+q.c));
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    if(inG.has(r*COLS+c))continue;
    const p=grid[r][c];if(!p||p.tier>=4)continue;
    const oc=p.color,ot=p.tier;
    p.color=best.s.color;p.tier=best.s.tier;
    const s2=simulate(best.r,best.c);
    if(s2&&s2.chain>1){p.flash=1;p.pop=.55;return;}
    p.color=oc;p.tier=ot;
  }
}
function refreshSpots(){spotIds=(st&&st.index<=2)?chainRoots():new Set();}

/* ============================ EFFECTS =================================== */
function ring(x,y,color,max,width){rings.push({x,y,r:cell*.2,max,color,width:width||3,life:1});}
function burst(x,y,color,n,power){
  n=n||18;power=power||2;
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2,s=(.35+Math.random())*power;
    parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-.4,life:1,decay:.015+Math.random()*.018,
      size:cell*(.03+Math.random()*.08),color,rot:Math.random()*6.28,spin:(Math.random()-.5)*.4});
  }
  if(parts.length>800)parts.splice(0,parts.length-800);
}
function pop(x,y,text,color,size){floats.push({x,y,text,color:color||INK,size:size||16,life:1,vy:-.7});}

/* ============================ THE ORDER ================================= */
function goalText(g){
  if(g.fleet)return 'Pull off a fleet pickup';
  if(g.tier===2)return 'Pack '+g.count+' baskets';
  if(g.tier===3)return 'Build '+g.count+' crates';
  return 'Send out '+g.count+' trucks';
}
function goalShort(g){
  if(g.fleet)return 'FLEET';
  return tierPlural(g.tier).toUpperCase();
}
const goalHave=()=>cfg.goal.fleet?st.fleet:st.made[cfg.goal.tier];
const goalNeed=()=>cfg.goal.fleet?1:cfg.goal.count;
const goalDone=()=>goalHave()>=goalNeed();

function creditPackage(p){
  st.made[p.tier]=(st.made[p.tier]||0)+1;
  if(cfg.goal.fleet||p.tier!==cfg.goal.tier)return;
  st.orderPulse=1;
  if(!goalDone())pop(bxc(p.c),byr(p.r)-cell*.75,goalHave()+' of '+goalNeed(),MINT,14);
  else finishOrder();
}
function finishOrder(){
  if(st.done)return;
  st.done=true;
  celebrateText='ORDER FILLED';celebrate=2.1;
  flash=Math.max(flash,.45);shakeAmt=Math.max(shakeAmt,16);sfxOrder();
  for(let i=0;i<5;i++)burst(W*(.2+i*.15),H*.42,[MINT,GOLD,CYAN,'#fff',MINT][i],26,3.4);
  st.receipts+=500;
}

/* ============================ ACTIONS =================================== */
function startStage(i){
  cfg=STAGES[i];run.stage=i;
  COLS=cfg.cols;ROWS=cfg.rows;layout();
  crops=(cfg.crops||run.loadout).map(id=>CROPS[cropIndex(id)]);
  rng=mulberry32(cfg.seed+(cfg.endless?Math.floor(Math.random()*99999):0));
  colQ=Array.from({length:COLS},()=>[]);
  for(let c=0;c<COLS;c++)fillQ(c);
  st={index:i,actions:0,receipts:0,bestChain:0,chains:0,trucks:0,fleet:0,
      made:{1:0,2:0,3:0,4:0},crane:cfg.crane+(hasGear('gloves')&&cfg.crane>0?1:0),
      done:false,orderPulse:0,lastChain:1};
  busy=false;preview=null;down=null;flash=0;familyGlow=null;
  hook={on:false,x:0,y:0,tx:0,ty:0};
  buildBoard();
  screen='play';intro=2.4;hint(cfg.teach,8);save();
}

async function attemptPack(r,c){
  if(busy||screen!=='play')return;
  const p=at(r,c);if(!p)return;
  if(p.tier>=4){await dispatch(p);return;}
  const g=floodGrid(r,c);
  if(g.length<2){
    /* never a flat refusal: show this fruit's whole family instead */
    p.wig=1;sfxNo();familyGlow={color:p.color,tier:p.tier,life:1.6};
    hint('Nothing touching it yet. Its family is lit up \u2014 bring them together.');
    return;
  }
  busy=true;st.actions++;st.lastChain=1;
  await doPack(g,p,1);
  await refill();
  busy=false;after();
}

async function doPack(group,target,chainIdx,auto){
  st.bestChain=Math.max(st.bestChain,chainIdx);
  st.lastChain=Math.max(st.lastChain,chainIdx);
  const from=target.tier,crop=crops[target.color];
  const bulk=isBulk(target.color,group.length);
  let leave=null;
  if(bulk&&crop.leaveBehind){
    let far=null,fd=-1;
    for(const q of group){if(q===target)continue;const d=Math.abs(q.r-target.r)+Math.abs(q.c-target.c);if(d>fd){fd=d;far=q;}}
    if(far)leave={r:far.r,c:far.c};
  }
  sfxPack(from,chainIdx);
  for(const q of group){q.pop=.42+chainIdx*.09;q.flash=.85;}
  await wait(chainIdx>2?130:95);
  for(const q of group){
    if(q===target)continue;
    grid[q.r][q.c]=null;q.tR=target.r;q.tC=target.c;q.gone=true;flying.push(q);
  }
  await wait(140);flying.length=0;
  target.tier=Math.min(4,from+(bulk?2:1));
  target.pop=1;target.flash=1;
  if(leave&&!grid[leave.r][leave.c]){
    const lp=makeP(target.color,1);
    lp.r=leave.r;lp.c=leave.c;lp.px=leave.c;lp.py=leave.r;lp.pop=.7;
    grid[leave.r][leave.c]=lp;
    pop(bxc(leave.c),byr(leave.r)-cell*.4,'LEFT BEHIND',crop.light,12);
  }
  const x=bxc(target.c),y=byr(target.r);
  burst(x,y,crop.main,12+group.length*5,1.4+target.tier*.4+chainIdx*.3);
  ring(x,y,crop.light,cell*(1+target.tier*.3+chainIdx*.2),2+target.tier);
  shakeAmt=Math.max(shakeAmt,2+target.tier+chainIdx*1.6);
  const pts=packScore(from,group.length,chainIdx);
  st.receipts+=pts;
  pop(x,y-cell*.36,'+'+pts,crop.light,15+Math.min(10,chainIdx*3));
  if(bulk)pop(x,y-cell*.8,'BULK',GOLD,15);
  if(chainIdx>1){
    st.chains++;
    pop(x,y-cell*1.05,'CHAIN \u00d7'+chainIdx,chainIdx>2?GOLD:INK,16+chainIdx*2);
    flash=Math.max(flash,.06*chainIdx);
    if(chainIdx>=3){slowmo=Math.max(slowmo,.5);ring(x,y,GOLD,cell*3.2,5);}
    if(!run.seenChain){run.seenChain=true;save();hint('That is a chain \u2014 it landed touching a match, so it packed again.',7);}
  }
  if(auto)pop(x,y+cell*.5,'AUTO',CYAN,11);
  if(target.tier===4){
    st.trucks++;
    if(cfg.goal.fleet&&st.trucks===1)hint('Leave that truck exactly where it is. Build a second one right beside it.',9);
    else if(!run.seenTruck){run.seenTruck=true;save();hint('A truck. Press it to send it out \u2014 it takes every '+crop.name.toLowerCase()+' with it.',8);}
  }
  await wait(140);
  applyGravity(grid);
  await wait(chainIdx>2?290:230);
  creditPackage(target);
  if(target.tier<4){
    const next=floodGrid(target.r,target.c);
    if(next.length>=2){await wait(70);await doPack(next,target,chainIdx+1,auto);}
  }
}

async function refill(){
  let any=false;
  for(let c=0;c<COLS;c++){
    let top=ROWS;
    for(let r=0;r<ROWS;r++)if(grid[r][c]){top=r;break;}
    let k=top;
    for(let r=top-1;r>=0;r--){
      const s=pull(c),p=makeP(s.color,s.tier);
      p.r=r;p.c=c;p.px=c;p.py=-k-.5;k--;grid[r][c]=p;any=true;
    }
  }
  if(any)tone(920,.05,'sine',.04);
  applyGravity(grid);
  await wait(280);
}

/* The floor tidies itself after a truck leaves. Packages consolidate on
   their own, which is where the long watchable cascades come from. */
async function cascade(){
  for(let n=0;n<12;n++){
    let best=null;
    for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
      const p=grid[r][c];
      if(!p||p.tier<2||p.tier>=4)continue;
      const g=floodGrid(r,c);
      if(g.length>=2&&(!best||g.length>best.g.length))best={g};
    }
    if(!best)return;
    let target=best.g[0];
    for(const q of best.g)if(q.r>target.r)target=q;
    await wait(150);
    await doPack(best.g,target,1,true);
  }
}

async function dispatch(truck){
  busy=true;st.actions++;
  const mate=[[truck.r-1,truck.c],[truck.r+1,truck.c],[truck.r,truck.c-1],[truck.r,truck.c+1]]
    .map(d=>at(d[0],d[1])).find(q=>q&&q.tier>=4);
  if(mate)await fleetRun(truck,mate);
  else{await singleRun(truck);await cascade();}
  await refill();busy=false;after();
}
async function singleRun(truck){
  const crop=crops[truck.color],doomed=[];
  truck.pop=1;truck.flash=1;ring(bxc(truck.c),byr(truck.r),crop.light,cell*1.7,4);
  await wait(180);
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){const q=grid[r][c];if(q&&q.color===truck.color)doomed.push(q);}
  sfxTruck();flash=.32;shakeAmt=Math.max(shakeAmt,18);
  let value=0;
  for(const q of doomed){
    grid[q.r][q.c]=null;value+=15*q.tier;
    burst(bxc(q.c),byr(q.r),crop.main,10,2.2);
    lines.push({x1:bxc(q.c),y1:byr(q.r),x2:bxc(truck.c),y2:byr(truck.r),color:crop.light,life:1});
  }
  st.receipts+=value;
  pop(bxc(truck.c),byr(truck.r)-cell*.5,'DISPATCHED +'+value,crop.light,19);
  await wait(260);applyGravity(grid);await wait(240);
}
async function fleetRun(a,b){
  sfxTruck();sfxBig();flash=1;shakeAmt=Math.max(shakeAmt,26);slowmo=.8;
  hint('Fleet pickup \u2014 the whole floor goes out at once.');
  await wait(260);
  let value=0;
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    const q=grid[r][c];if(!q)continue;
    grid[r][c]=null;value+=18*q.tier;
    burst(bxc(c),byr(r),crops[q.color].main,10,2.8);
  }
  st.fleet++;st.trucks++;st.receipts+=value;
  pop(W/2,by+bh/2,'FLEET PICKUP +'+value,INK,26);
  if(cfg.goal.fleet)finishOrder();
  await wait(280);
}

async function doSwap(r1,c1,r2,c2){
  if(st.crane<=0||busy)return;
  const a=grid[r1][c1],b=grid[r2][c2];
  if(!a||!b)return;
  const before=hasGear('grease')?chainRoots():null;
  busy=true;
  hook.on=true;hook.x=bxc(c1);hook.y=by-cell;hook.tx=bxc(c1);hook.ty=byr(r1);
  sfxCrane();await wait(260);
  grid[r1][c1]=b;grid[r2][c2]=a;
  a.r=r2;a.c=c2;a.pop=.5;b.r=r1;b.c=c1;b.pop=.5;
  hook.tx=bxc(c2);hook.ty=byr(r2);
  st.crane--;st.actions++;
  await wait(220);
  hook.ty=by-cell;await wait(180);hook.on=false;
  applyGravity(grid);await wait(200);
  if(before){
    const after=chainRoots();let fresh=false;
    after.forEach(id=>{if(!before.has(id))fresh=true;});
    if(fresh){st.crane++;sfxTap();pop(bxc(c2),byr(r2)-cell*.8,'GREASE RAG \u2014 LOAD BACK',CYAN,12);}
  }
  busy=false;after();
}

function after(){
  ensurePlayable();ensureOpportunity();refreshSpots();
}
function closeShift(){
  run.total+=st.receipts;
  run.best[st.index]=Math.max(run.best[st.index]||0,st.receipts);
  if(hasGear('coldroom')){
    let best=null;
    for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
      const p=grid[r][c];
      if(p&&p.tier>=2&&p.tier<4&&(!best||p.tier>best.tier))best=p;
    }
    run.stored=best?{color:best.color,tier:best.tier}:null;
  }
  const unowned=GEAR.filter(g=>run.owned.indexOf(g.id)<0);
  cardOffer=(st.index>=5&&unowned.length)?shuffle(unowned.slice(),Math.random).slice(0,2):[];
  pickedCard=null;
  save();screen='result';
}
function takeCard(g){
  if(pickedCard)return;
  pickedCard=g.id;run.owned.push(g.id);
  if(run.equip.length<MAX_EQUIP)run.equip.push(g.id);
  sfxBig();save();
}
function advanceStage(){
  if(cfg.endless){screen='title';return;}
  const next=st.index+1;
  if(next>=STAGES.length-1){run.unlockedNight=true;run.stage=STAGES.length-1;save();screen='title';return;}
  run.stage=next;save();
  startStage(next);
}

/* ============================ PREVIEW =================================== */
function buildPreview(r,c){
  const p=at(r,c);if(!p)return null;
  if(p.tier>=4){
    const targets=[];let mate=false,value=0;
    for(const d of [[r-1,c],[r+1,c],[r,c-1],[r,c+1]]){const q=at(d[0],d[1]);if(q&&q.tier>=4)mate=true;}
    for(let r2=0;r2<ROWS;r2++)for(let c2=0;c2<COLS;c2++){
      const q=grid[r2][c2];if(q&&q.color===p.color){targets.push({r:r2,c:c2});value+=15*q.tier;}
    }
    return {kind:'dispatch',r,c,targets,mate,value,color:p.color};
  }
  const s=simulate(r,c);
  if(!s)return {kind:'invalid',r,c,color:p.color,tier:p.tier};
  s.kind='pack';s.r=r;s.c=c;
  return s;
}

/* ============================ ANIMATION ================================= */
function spring(p){
  const tr=p.tR!==null?p.tR:p.r,tc=p.tC!==null?p.tC:p.c;
  p.vy+=(tr-p.py)*.42;p.vy*=.7;p.py+=p.vy;
  p.vx+=(tc-p.px)*.42;p.vx*=.7;p.px+=p.vx;
  p.pop*=.86;p.flash*=.9;p.wig*=.9;
  if(p.gone)p.scale=Math.max(0,p.scale-.1);
}
function update(dt){
  t+=dt;
  if(intro>0)intro-=dt;
  if(celebrate>0)celebrate-=dt;
  if(slowmo>0)slowmo-=dt;
  if(familyGlow){familyGlow.life-=dt;if(familyGlow.life<=0)familyGlow=null;}
  if(st&&st.orderPulse>0)st.orderPulse=Math.max(0,st.orderPulse-dt*1.6);
  if(hook.on){hook.x+=(hook.tx-hook.x)*.2;hook.y+=(hook.ty-hook.y)*.2;}
  for(const row of grid)for(const p of row)if(p)spring(p);
  for(const p of flying)spring(p);
  for(let i=parts.length-1;i>=0;i--){const q=parts[i];q.x+=q.vx*cell*.06;q.y+=q.vy*cell*.06;q.vy+=.09;q.vx*=.985;q.rot+=q.spin;q.life-=q.decay;if(q.life<=0)parts.splice(i,1);}
  for(let i=rings.length-1;i>=0;i--){const q=rings[i];q.r+=(q.max-q.r)*.15;q.life-=.034;if(q.life<=0)rings.splice(i,1);}
  for(let i=floats.length-1;i>=0;i--){const q=floats[i];q.y+=q.vy;q.vy*=.97;q.life-=.014;if(q.life<=0)floats.splice(i,1);}
  for(let i=lines.length-1;i>=0;i--){lines[i].life-=.04;if(lines[i].life<=0)lines.splice(i,1);}
  shakeAmt*=.84;flash*=.87;if(hintTime>0)hintTime-=dt;
}

/* ============================ DRAW HELPERS ============================== */
function rr(x,y,w,h,r){ctx.beginPath();r=Math.min(r,w/2,h/2);ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();}
function txt(s,x,y,size,color,align,weight){ctx.font=(weight||700)+' '+size+'px ui-rounded,"Avenir Next","Segoe UI",system-ui,sans-serif';ctx.textAlign=align||'center';ctx.textBaseline='middle';ctx.fillStyle=color||INK;ctx.fillText(s,x,y);}
function tw(s,size,weight){ctx.font=(weight||700)+' '+size+'px ui-rounded,"Avenir Next","Segoe UI",system-ui,sans-serif';return ctx.measureText(s).width;}
function wrap(text,x,y,maxW,lh,size,color,align){
  ctx.font='600 '+size+'px ui-rounded,"Avenir Next","Segoe UI",system-ui,sans-serif';
  ctx.textAlign=align||'left';ctx.textBaseline='middle';ctx.fillStyle=color||INK;
  const words=text.split(' ');let line='';
  for(const w of words){const test=line?line+' '+w:w;if(ctx.measureText(test).width>maxW&&line){ctx.fillText(line,x,y);y+=lh;line=w;}else line=test;}
  if(line){ctx.fillText(line,x,y);y+=lh;}return y;
}

function drawFruit(crop,rad){
  ctx.save();
  const g=ctx.createRadialGradient(-rad*.28,-rad*.34,rad*.05,0,0,rad);
  g.addColorStop(0,crop.light);g.addColorStop(.42,crop.main);g.addColorStop(1,crop.dark);ctx.fillStyle=g;
  const s=crop.shape;
  if(s==='pear'){ctx.beginPath();ctx.ellipse(0,rad*.08,rad*.66,rad*.92,0,0,Math.PI*2);ctx.fill();}
  else if(s==='cluster'){for(const d of [[-.26,-.22,.4],[.26,-.22,.4],[-.42,.2,.38],[0,.18,.4],[.42,.2,.38],[0,.58,.36]]){ctx.beginPath();ctx.arc(d[0]*rad,d[1]*rad,rad*d[2],0,Math.PI*2);ctx.fill();}}
  else if(s==='lemon'){ctx.beginPath();ctx.ellipse(0,0,rad*.9,rad*.6,-.35,0,Math.PI*2);ctx.fill();}
  else if(s==='spiky'){
    ctx.beginPath();ctx.ellipse(0,0,rad*.68,rad*.9,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=crop.leaf;
    for(let i=0;i<5;i++){ctx.save();ctx.rotate(i*1.256+.5);ctx.beginPath();ctx.moveTo(0,-rad*.5);ctx.lineTo(rad*.24,-rad*.98);ctx.lineTo(-rad*.12,-rad*.86);ctx.closePath();ctx.fill();ctx.restore();}
  }
  else{ctx.beginPath();ctx.arc(0,0,rad*.84,0,Math.PI*2);ctx.fill();}
  if(s!=='spiky'){
    ctx.fillStyle=crop.leaf;ctx.fillRect(-rad*.07,-rad*.98,rad*.14,rad*.34);
    ctx.save();ctx.rotate(-.45);ctx.beginPath();ctx.ellipse(rad*.25,-rad*.72,rad*.36,rad*.17,0,0,Math.PI*2);ctx.fill();ctx.restore();
  }
  ctx.fillStyle='rgba(255,255,255,.6)';ctx.beginPath();ctx.ellipse(-rad*.3,-rad*.3,rad*.2,rad*.1,-.55,0,Math.PI*2);ctx.fill();
  ctx.restore();
}
function drawPack(crop,tier,base,phase){
  if(tier<=1){drawFruit(crop,base*.5);return;}
  if(tier===2){
    ctx.fillStyle='#4fe0f2';rr(-base*.7,-base*.16,base*1.4,base*.86,base*.18);ctx.fill();
    ctx.strokeStyle='#bcfbff';ctx.lineWidth=Math.max(1,base*.045);
    for(let i=-2;i<=2;i++){ctx.beginPath();ctx.moveTo(i*base*.25,-base*.1);ctx.lineTo(i*base*.19,base*.6);ctx.stroke();}
    ctx.save();ctx.translate(-base*.27,-base*.3);drawFruit(crop,base*.23);ctx.restore();
    ctx.save();ctx.translate(base*.25,-base*.28);drawFruit(crop,base*.23);ctx.restore();
    return;
  }
  if(tier===3){
    const g=ctx.createLinearGradient(-base,-base,base,base);g.addColorStop(0,'#6d86ff');g.addColorStop(1,'#3a2496');
    ctx.fillStyle=g;rr(-base*.74,-base*.58,base*1.48,base*1.16,7);ctx.fill();
    ctx.strokeStyle='#c1cdff';ctx.lineWidth=Math.max(1,base*.06);
    for(const y of [-.34,0,.34]){ctx.beginPath();ctx.moveTo(-base*.64,base*y);ctx.lineTo(base*.64,base*y);ctx.stroke();}
    ctx.fillStyle=crop.main;rr(-base*.33,-base*.2,base*.66,base*.4,5);ctx.fill();
    txt(crop.L,0,base*.02,base*.34,'#fff','center',900);
    return;
  }
  ctx.fillStyle='rgba(0,0,0,.25)';ctx.fillRect(-base*.78,base*.36,base*1.56,base*.16);
  ctx.fillStyle=crop.dark;rr(-base*.74,-base*.44,base*.96,base*.76,6);ctx.fill();
  ctx.fillStyle=crop.main;rr(-base*.67,-base*.37,base*.82,base*.58,5);ctx.fill();
  ctx.fillStyle='#e7f5ff';rr(base*.13,-base*.26,base*.53,base*.57,5);ctx.fill();
  ctx.fillStyle='#72d9ff';rr(base*.29,-base*.18,base*.24,base*.21,2);ctx.fill();
  ctx.fillStyle='#101f3c';
  for(const wx of [-base*.42,base*.44]){ctx.beginPath();ctx.arc(wx,base*.37,base*.16,0,Math.PI*2);ctx.fill();}
  ctx.fillStyle='#bdefff';
  for(const wx of [-base*.42,base*.44]){ctx.beginPath();ctx.arc(wx,base*.37,base*.06,0,Math.PI*2);ctx.fill();}
  ctx.fillStyle='rgba(255,255,255,'+(.45+.35*Math.sin(phase||0))+')';
  ctx.beginPath();ctx.moveTo(base*.66,0);ctx.lineTo(base*.84,-base*.1);ctx.lineTo(base*.84,base*.1);ctx.closePath();ctx.fill();
}
function drawPiece(p,alpha){
  const x=bx+p.px*cell+cell/2,y=by+p.py*cell+cell/2;
  if(y<by-cell*2.5||y>by+bh+cell*2.5)return;
  const base=cell*.5,sc=p.scale*(1+p.pop*.4),crop=crops[p.color];
  ctx.save();ctx.globalAlpha=alpha===undefined?1:alpha;
  ctx.translate(x+p.wig*Math.sin(t*40)*cell*.07,y);ctx.scale(sc,sc*(1-p.pop*.15));
  if(familyGlow&&familyGlow.color===p.color&&familyGlow.tier===p.tier){
    ctx.strokeStyle=crop.light;ctx.globalAlpha=(alpha===undefined?1:alpha)*Math.min(1,familyGlow.life)*(.5+.4*Math.sin(t*9));
    ctx.lineWidth=2.4;ctx.beginPath();ctx.arc(0,0,base*.8,0,Math.PI*2);ctx.stroke();
    ctx.globalAlpha=alpha===undefined?1:alpha;
  }
  if(p.flash>.02){
    const g=ctx.createRadialGradient(0,0,0,0,0,base*1.4);
    g.addColorStop(0,'rgba(255,255,255,'+(.08+p.flash*.26)+')');g.addColorStop(.45,crop.main+'55');g.addColorStop(1,crop.main+'00');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,base*1.4,0,Math.PI*2);ctx.fill();
  }
  if(isHang(p.color,p.tier)){
    ctx.strokeStyle='rgba(200,225,255,.4)';ctx.lineWidth=1.4;ctx.setLineDash([3,3]);
    ctx.beginPath();ctx.moveTo(-base*.82,base*.74);ctx.lineTo(base*.82,base*.74);ctx.stroke();ctx.setLineDash([]);
  }
  drawPack(crop,p.tier,base,t*6+p.id);
  ctx.restore();
}

function drawBg(){
  const g=ctx.createLinearGradient(0,0,W,H);
  g.addColorStop(0,'#123069');g.addColorStop(.45,'#0b1c45');g.addColorStop(1,'#071127');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  const gl=ctx.createRadialGradient(W*.2,H*.06,0,W*.2,H*.06,Math.max(W,H)*.85);
  gl.addColorStop(0,'rgba(93,240,255,.25)');gl.addColorStop(.42,'rgba(112,96,255,.09)');gl.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=gl;ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='rgba(128,226,255,.05)';ctx.lineWidth=1;
  for(let y=0;y<H;y+=38){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y+12);ctx.stroke();}
}

function drawChutes(){
  const y0=by-chuteH-3;
  const depth=hasGear('clipboard')?3:1;
  txt('NEXT',bx-6,y0+chuteH*.55,8,FAINT,'right',800);
  for(let c=0;c<COLS;c++){
    const q=colQ[c]||[];
    for(let i=Math.min(depth,q.length)-1;i>=0;i--){
      const s=q[i];if(!s)continue;
      ctx.save();ctx.globalAlpha=i===0?.95:.3;
      ctx.translate(bx+c*cell+cell*.5+(i?(i%2?cell*.2:-cell*.2):0),y0+chuteH*.55-i*cell*.13);
      drawPack(crops[s.color],s.tier,i===0?cell*.3:cell*.18,0);
      ctx.restore();
    }
    ctx.fillStyle='rgba(150,235,255,.16)';
    ctx.beginPath();ctx.moveTo(bx+c*cell+cell*.5-4,y0+chuteH);ctx.lineTo(bx+c*cell+cell*.5+4,y0+chuteH);
    ctx.lineTo(bx+c*cell+cell*.5,y0+chuteH+5);ctx.closePath();ctx.fill();
  }
}
function drawHook(){
  if(!hook.on)return;
  ctx.strokeStyle='rgba(160,225,255,.6)';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(hook.x,by-cell*1.4);ctx.lineTo(hook.x,hook.y-cell*.2);ctx.stroke();
  ctx.strokeStyle=CYAN;ctx.lineWidth=2.6;
  ctx.beginPath();ctx.arc(hook.x,hook.y-cell*.14,cell*.15,.6,2.55);ctx.stroke();
  ctx.beginPath();ctx.arc(hook.x,hook.y-cell*.14,cell*.15,3.73,5.68);ctx.stroke();
}

function drawPreview(){
  const pv=preview;if(!pv)return;
  if(pv.kind==='invalid'){
    ctx.strokeStyle='rgba(255,255,255,.6)';ctx.lineWidth=2;ctx.setLineDash([4,4]);
    rr(bx+pv.c*cell+3,by+pv.r*cell+3,cell-6,cell-6,9);ctx.stroke();ctx.setLineDash([]);
    txt('needs one touching it',bxc(pv.c),by+pv.r*cell-7,10.5,DIM,'center',800);
    return;
  }
  if(pv.kind==='move'){
    const ok=st.crane>0;
    const col=ok?CYAN:'rgba(255,255,255,.4)';
    const a={x:bxc(pv.c),y:byr(pv.r)},b={x:bxc(pv.to.c),y:byr(pv.to.r)};
    ctx.strokeStyle=col;ctx.lineWidth=2.5;
    rr(bx+pv.c*cell+3,by+pv.r*cell+3,cell-6,cell-6,9);ctx.stroke();
    rr(bx+pv.to.c*cell+3,by+pv.to.r*cell+3,cell-6,cell-6,9);ctx.stroke();
    ctx.setLineDash([5,5]);ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();ctx.setLineDash([]);
    txt(ok?'SWAP':'NO CRANE LOADS LEFT',(a.x+b.x)/2,(a.y+b.y)/2-cell*.55,11.5,col,'center',900);
    return;
  }
  if(pv.kind==='dispatch'){
    const crop=crops[pv.color];
    for(const q of pv.targets){
      ctx.strokeStyle=crop.light;ctx.globalAlpha=.5+.25*Math.sin(t*7);ctx.lineWidth=2;
      ctx.beginPath();ctx.arc(bxc(q.c),byr(q.r),cell*.42,0,Math.PI*2);ctx.stroke();ctx.globalAlpha=1;
    }
    const lonely=cfg.goal.fleet&&!pv.mate;
    txt(pv.mate?'FLEET PICKUP \u2014 CLEARS THE FLOOR':'TAKES '+pv.targets.length+' \u00b7 +'+pv.value,
      bxc(pv.c),by+pv.r*cell-8,11.5,pv.mate?GOLD:crop.light,'center',900);
    if(lonely)txt('leaves alone \u2014 no fleet',bxc(pv.c),by+pv.r*cell-21,10,GOLD,'center',800);
    return;
  }

  ctx.save();
  ctx.setLineDash([4,4]);ctx.lineWidth=1.8;ctx.strokeStyle='rgba(255,255,255,.75)';
  for(const q of pv.group)rr(bx+q.c*cell+4,by+q.r*cell+4,cell-8,cell-8,9);
  ctx.stroke();ctx.setLineDash([]);

  const sx=bxc(pv.c),sy=byr(pv.r),lx=bxc(pv.landC),ly=byr(pv.landR);
  if(pv.landR!==pv.r||pv.landC!==pv.c){
    ctx.strokeStyle='rgba(255,255,255,.4)';ctx.lineWidth=2;ctx.setLineDash([3,6]);
    ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(lx,ly-cell*.3);ctx.stroke();ctx.setLineDash([]);
    ctx.fillStyle='rgba(255,255,255,.6)';
    ctx.beginPath();ctx.moveTo(lx-cell*.11,ly-cell*.36);ctx.lineTo(lx+cell*.11,ly-cell*.36);ctx.lineTo(lx,ly-cell*.18);ctx.closePath();ctx.fill();
  }
  ctx.globalAlpha=.55+.15*Math.sin(t*6);
  ctx.save();ctx.translate(lx,ly);drawPack(crops[pv.color],pv.tier,cell*.5,t*6);ctx.restore();
  ctx.globalAlpha=1;
  ctx.strokeStyle='#fff';ctx.lineWidth=2.4;ctx.setLineDash([6,4]);
  rr(bx+pv.landC*cell+3,by+pv.landR*cell+3,cell-6,cell-6,9);ctx.stroke();ctx.setLineDash([]);

  for(const m of pv.matches){
    ctx.strokeStyle=GOLD;ctx.lineWidth=2.6;ctx.globalAlpha=.65+.3*Math.sin(t*8);
    ctx.beginPath();ctx.arc(bxc(m.c),byr(m.r),cell*.4,0,Math.PI*2);ctx.stroke();
    ctx.setLineDash([4,4]);ctx.beginPath();ctx.moveTo(lx,ly);ctx.lineTo(bxc(m.c),byr(m.r));ctx.stroke();ctx.setLineDash([]);
    ctx.globalAlpha=1;
  }

  let label=tierName(pv.tier).toUpperCase();
  if(pv.bulk)label='BULK '+label;
  const sub=pv.chain>1?('CHAIN \u00d7'+pv.chain+'  \u00b7  +'+pv.points):('+'+pv.points);
  const boxW=Math.max(tw(label,12,900),tw(sub,12,800))+20;
  let py=by+pv.landR*cell-24;
  if(py<by+4)py=by+pv.landR*cell+cell+10;
  ctx.fillStyle='rgba(6,16,38,.88)';rr(lx-boxW/2,py-13,boxW,26,8);ctx.fill();
  ctx.strokeStyle=pv.chain>1?GOLD:'rgba(255,255,255,.3)';ctx.lineWidth=1.4;rr(lx-boxW/2,py-13,boxW,26,8);ctx.stroke();
  txt(label,lx,py-4,11,INK,'center',900);
  txt(sub,lx,py+7,11,pv.chain>1?GOLD:DIM,'center',800);
  ctx.restore();
}

function drawBoard(){
  ctx.save();ctx.translate((Math.random()-.5)*shakeAmt,(Math.random()-.5)*shakeAmt);
  ctx.save();ctx.shadowColor='rgba(0,0,0,.5)';ctx.shadowBlur=30;ctx.shadowOffsetY=10;
  const panel=ctx.createLinearGradient(bx,by,bx+bw,by+bh);
  panel.addColorStop(0,'rgba(14,49,98,.94)');panel.addColorStop(1,'rgba(18,24,70,.95)');
  ctx.fillStyle=panel;rr(bx-8,by-8,bw+16,bh+16,18);ctx.fill();ctx.restore();
  ctx.strokeStyle='rgba(111,232,255,.42)';ctx.lineWidth=2;rr(bx-8,by-8,bw+16,bh+16,18);ctx.stroke();
  ctx.strokeStyle='rgba(192,240,255,.08)';ctx.lineWidth=1;
  for(let r=1;r<ROWS;r++){ctx.beginPath();ctx.moveTo(bx,by+r*cell);ctx.lineTo(bx+bw,by+r*cell);ctx.stroke();}
  for(let c=1;c<COLS;c++){ctx.beginPath();ctx.moveTo(bx+c*cell,by);ctx.lineTo(bx+c*cell,by+bh);ctx.stroke();}

  drawChutes();

  ctx.save();ctx.beginPath();rr(bx-2,by-2,bw+4,bh+4,12);ctx.clip();
  if(!preview&&spotIds.size){
    for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
      const p=grid[r][c];if(!p||!spotIds.has(p.id))continue;
      ctx.globalAlpha=.35+.3*Math.sin(t*4+r+c);ctx.strokeStyle='#fff';ctx.lineWidth=1.4;
      ctx.beginPath();ctx.arc(bxc(c),byr(r)+cell*.34,cell*.07,0,Math.PI*2);ctx.stroke();ctx.globalAlpha=1;
    }
  }
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)if(grid[r][c]){
    let a=1;
    if(preview&&preview.kind==='pack'&&preview.group.some(q=>q.r===r&&q.c===c))a=.5;
    drawPiece(grid[r][c],a);
  }
  for(const p of flying)drawPiece(p,Math.max(0,p.scale));
  drawPreview();
  for(const l of lines){ctx.globalAlpha=l.life;ctx.strokeStyle=l.color;ctx.lineWidth=2;ctx.setLineDash([5,6]);ctx.beginPath();ctx.moveTo(l.x1,l.y1);ctx.quadraticCurveTo((l.x1+l.x2)/2,l.y1-cell*.6,l.x2,l.y2);ctx.stroke();ctx.setLineDash([]);}
  ctx.globalAlpha=1;
  for(const rg of rings){ctx.globalAlpha=rg.life*.85;ctx.strokeStyle=rg.color;ctx.lineWidth=rg.width;ctx.beginPath();ctx.arc(rg.x,rg.y,rg.r,0,Math.PI*2);ctx.stroke();}
  for(const p of parts){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.color;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillRect(-p.size*.5,-p.size*.22,p.size,p.size*.44);ctx.restore();}
  ctx.globalAlpha=1;ctx.restore();
  drawHook();
  for(const f of floats){ctx.globalAlpha=Math.max(0,Math.min(1,f.life*1.6));txt(f.text,f.x,f.y,f.size,f.color,'center',900);}
  ctx.globalAlpha=1;ctx.restore();
}

function button(id,x,y,w,h,label,opts){
  opts=opts||{};
  buttons.push({id,x,y,w,h,disabled:!!opts.disabled});
  const hot=pressBtn===id;ctx.save();ctx.globalAlpha=opts.disabled?.3:1;
  if(opts.primary){const g=ctx.createLinearGradient(0,y,0,y+h);g.addColorStop(0,'#84f5ff');g.addColorStop(1,'#3c7dff');ctx.fillStyle=g;}
  else ctx.fillStyle=opts.active?'rgba(105,235,255,.2)':'rgba(255,255,255,.065)';
  const rad=opts.round!==undefined?opts.round:h*.31;
  rr(x+(hot?1:0),y+(hot?1:0),w,h,rad);ctx.fill();
  ctx.strokeStyle=opts.active?'rgba(160,248,255,.9)':opts.primary?'rgba(255,255,255,.55)':'rgba(255,255,255,.17)';
  ctx.lineWidth=1.3;rr(x,y,w,h,rad);ctx.stroke();
  txt(label,x+w/2,y+h/2+(opts.sub?-h*.14:0),opts.size||14,opts.primary?'#07152d':INK,'center',800);
  if(opts.sub)txt(opts.sub,x+w/2,y+h/2+h*.24,10,opts.primary?'rgba(7,21,45,.72)':DIM,'center',650);
  ctx.restore();
}

/* the order lives in one place: a clipboard you can always tap to re-read */
function orderChipRect(){
  const w=Math.min(152,W*.42),h=38;
  return {x:W-13-w,y:topH-h-10,w,h};
}
function drawOrderChip(){
  const R=orderChipRect(),done=goalDone(),pulse=st.orderPulse;
  buttons.push({id:'order',x:R.x,y:R.y,w:R.w,h:R.h,disabled:false});
  ctx.save();
  ctx.fillStyle=done?'rgba(121,255,199,.16)':'rgba(255,255,255,.06)';rr(R.x,R.y,R.w,R.h,10);ctx.fill();
  ctx.strokeStyle=done?'rgba(121,255,199,.75)':'rgba(255,255,255,.18)';
  ctx.lineWidth=1.2+pulse*3;rr(R.x,R.y,R.w,R.h,10);ctx.stroke();
  ctx.save();ctx.translate(R.x+19,R.y+R.h*.5);ctx.scale(1+pulse*.25,1+pulse*.25);
  if(cfg.goal.fleet)drawPack(crops[0],4,11,t*6);else drawPack(crops[0],cfg.goal.tier,11,t*6);
  ctx.restore();
  txt('ORDER',R.x+36,R.y+12,8.5,done?MINT:FAINT,'left',900);
  txt(cfg.goal.fleet?(st.fleet?'DONE':'FLEET PICKUP'):goalHave()+' / '+goalNeed()+'  '+goalShort(cfg.goal),
      R.x+36,R.y+26,12,done?MINT:INK,'left',900);
  ctx.restore();
}

function drawBottom(){
  const y=H-botH+4,h=Math.min(42,botH-12);
  if(goalDone()){
    const w=Math.min(230,W*.6);
    button('close',W/2-w/2,y,w,h,cfg.endless?'CLOSE SHIFT':'FINISH SHIFT',{primary:true,size:15});

    const w=Math.min(190,W*.5),x=W/2-w/2;
    ctx.fillStyle='rgba(255,255,255,.05)';rr(x,y+h*.12,w,h*.76,9);ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,.13)';ctx.lineWidth=1;rr(x,y+h*.12,w,h*.76,9);ctx.stroke();
    txt('CRANE',x+14,y+h*.5,11,st.crane>0?CYAN:FAINT,'left',900);
    for(let i=0;i<Math.max(cfg.crane,st.crane);i++){
      ctx.beginPath();ctx.arc(x+w-18-i*14,y+h*.5,5,0,Math.PI*2);
      ctx.fillStyle=i<st.crane?CYAN:'rgba(255,255,255,.15)';ctx.fill();

  }
  if(hintTime>0){ctx.globalAlpha=Math.min(1,hintTime);wrap(hintText,W/2,y-13,W-28,13,11.5,DIM,'center');ctx.globalAlpha=1;}

/* opening order card: full screen, then it flies to the clipboard */
function drawIntro(){
  const total=2.4,k=1-intro/total;
  const settle=Math.max(0,Math.min(1,(k-.72)/.28));
  const e=settle<1?settle*settle*(3-2*settle):1;
  const R=orderChipRect();
  const cw=Math.min(300,W*.8),ch=150;
  const x=(W/2-cw/2)+(R.x-(W/2-cw/2))*e;
  const y=(H*.36-ch/2)+(R.y-(H*.36-ch/2))*e;
  const w=cw+(R.w-cw)*e,h=ch+(R.h-ch)*e;
  ctx.save();
  ctx.globalAlpha=Math.min(1,(1-e)*1.1+.05);
  ctx.fillStyle='rgba(4,10,26,'+(.72*(1-e))+')';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(11,31,68,.97)';rr(x,y,w,h,14);ctx.fill();
  ctx.strokeStyle='rgba(160,240,255,.75)';ctx.lineWidth=2;rr(x,y,w,h,14);ctx.stroke();
  if(e<.75){
    ctx.globalAlpha=Math.min(1,(1-e/.75));
    txt('TODAY\u2019S ORDER',x+w/2,y+30,11,CYAN,'center',900);
    ctx.save();ctx.translate(x+w/2,y+66);drawPack(crops[0],cfg.goal.fleet?4:cfg.goal.tier,20,t*6);ctx.restore();
    txt(goalText(cfg.goal),x+w/2,y+104,17,INK,'center',900);
    wrap(cfg.brief,x+14,y+128,w-28,13,10.5,DIM,'center');
  }
  ctx.restore();
}
function drawCelebrate(){
  const k=celebrate/2.1,e=1-k;
  ctx.save();
  ctx.globalAlpha=Math.min(1,k*2.2);
  ctx.fillStyle='rgba(4,10,26,.5)';ctx.fillRect(0,0,W,H);
  const sc=1+.16*Math.sin(Math.min(1,e*4)*Math.PI);
  ctx.translate(W/2,H*.42);ctx.scale(sc,sc);
  ctx.fillStyle='rgba(11,31,68,.96)';rr(-Math.min(290,W*.82)/2,-56,Math.min(290,W*.82),112,16);ctx.fill();
  ctx.strokeStyle=MINT;ctx.lineWidth=2.5;rr(-Math.min(290,W*.82)/2,-56,Math.min(290,W*.82),112,16);ctx.stroke();
  txt(celebrateText,0,-22,25,MINT,'center',950);
  txt(goalText(cfg.goal),0,6,13,INK,'center',800);
  txt('+500 receipts \u00b7 keep packing or finish the shift',0,30,10.5,DIM,'center',650);

}

  if(cardOffer.length&&!pickedCard){
    txt('SOMETHING FOR YOUR KIT',cx,y,11.5,CYAN,'center',900);y+=20;
    const n=cardOffer.length,cw=Math.min(140,(W-46)/n),x0=(W-cw*n-10*(n-1))/2,ch=104;
    for(let i=0;i<n;i++){
      const g=cardOffer[i],x=x0+i*(cw+10);
      buttons.push({id:'card:'+g.id,x,y,w:cw,h:ch,disabled:false});
      ctx.fillStyle='rgba(255,255,255,.06)';rr(x,y,cw,ch,10);ctx.fill();
      ctx.strokeStyle='rgba(255,255,255,.2)';ctx.lineWidth=1.2;rr(x,y,cw,ch,10);ctx.stroke();
      txt(g.name,x+cw/2,y+22,11,INK,'center',900);
      wrap(g.desc,x+9,y+46,cw-18,12,9.5,DIM,'left');
    }
    y+=ch+14;
  }else if(pickedCard){
    const g=gearById(pickedCard);
    txt('ADDED TO YOUR KIT',cx,y,10.5,FAINT,'center',800);y+=17;
    txt(g.name,cx,y,14,CYAN,'center',900);y+=20;
  }
  const w=Math.min(280,W*.72),blocked=cardOffer.length>0&&!pickedCard;
  button('next',cx-w/2,Math.min(H-100,y),w,50,cfg.endless?'BACK TO TITLE':'NEXT SHIFT',{primary:true,size:15,disabled:blocked});
  button('replay',cx-w/2,Math.min(H-46,y+58),w,36,'REPLAY THIS SHIFT',{size:12});
}
function drawKit(){
  const cx=W/2;txt('YOUR KIT',cx,40+ST,19,INK,'center',900);
  txt('Carry any two.',cx,62+ST,11,DIM,'center',650);
  let y=86+ST;
  for(const g of GEAR){
    const owned=run.owned.indexOf(g.id)>=0,on=hasGear(g.id),x=16,w=W-32,h=54;
    if(owned)buttons.push({id:'equip:'+g.id,x,y,w,h,disabled:false});
    ctx.globalAlpha=owned?1:.3;
    ctx.fillStyle=on?'rgba(106,233,255,.15)':'rgba(255,255,255,.05)';rr(x,y,w,h,10);ctx.fill();
    ctx.strokeStyle=on?'rgba(160,248,255,.85)':'rgba(255,255,255,.12)';ctx.lineWidth=on?2:1;rr(x,y,w,h,10);ctx.stroke();
    txt(owned?g.name:'LOCKED',x+14,y+18,12,owned?INK:FAINT,'left',900);
    if(owned)wrap(g.desc,x+14,y+36,w-28,11,10,DIM,'left');
    if(on)txt('CARRIED',x+w-14,y+18,9,CYAN,'right',900);
    ctx.globalAlpha=1;
    y+=60;
  }
  button('back',cx-Math.min(230,W*.6)/2,Math.min(H-60,y+8),Math.min(230,W*.6),44,'BACK',{primary:true,size:14});
}
function drawGuide(){
  if(prevScreen==='play'&&st)drawBoard();
  ctx.fillStyle='rgba(5,10,29,.95)';ctx.fillRect(0,0,W,H);buttons=[];
  const cx=W/2;txt('HOW PACKING WORKS',cx,36+ST,16,INK,'center',900);
  let y=64+ST;
  const lw=Math.min(W-40,300),lx=cx-lw/2;
  for(let i=0;i<4;i++){
    const x=lx+lw*(i+.5)/4;
    ctx.save();ctx.translate(x,y+11);drawPack(CROPS[0],i+1,16,t*6);ctx.restore();
    txt(['produce','basket','crate','truck'][i],x,y+34,8.5,DIM,'center',700);
    if(i<3)txt('\u2192',lx+lw*(i+1)/4,y+11,12,FAINT,'center',900);
  }
  y+=58;
  const rows=[
    ['PRESS','Hold a piece to see its group, the exact cell the package will land in, what it will chain with, and the score. Release to pack it. Drag away to cancel.'],
    ['LANDING','The package settles in the column you pressed, as low as the stack allows. Choosing the column is the whole game.'],
    ['CHAIN','Land it touching a match of the same size and it packs again straight away.'],
    ['BULK','Five or more in one group skips a whole size.'],
    ['TRUCK','Press a truck to send it out. It takes every piece of its crop, and the floor consolidates itself afterwards.'],
    ['FLEET','Two trucks side by side leave together and clear the floor.'],
    ['CRANE','Drag a piece onto a neighbour to swap them. A few loads a shift, no more.']
  ];
  for(const r of rows){txt(r[0],18,y,11,CYAN,'left',900);y+=15;y=wrap(r[1],18,y,W-36,13,10.5,DIM,'left')+7;}
  button('closeGuide',cx-Math.min(220,W*.6)/2,Math.min(H-58,y+6),Math.min(220,W*.6),44,'BACK',{primary:true,size:14});
}

/* ============================ INPUT ===================================== */
function pos(e){const r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top};}
function cellAt(x,y){if(x<bx||x>=bx+bw||y<by||y>=by+bh)return null;return{r:Math.floor((y-by)/cell),c:Math.floor((x-bx)/cell)};}
function btnAt(x,y){for(let i=buttons.length-1;i>=0;i--){const b=buttons[i],p=5;if(x>=b.x-p&&x<=b.x+b.w+p&&y>=b.y-p&&y<=b.y+b.h+p)return b;}return null;}

function onDown(e){
  e.preventDefault();initAudio();
  if(screen==='play'&&intro>0){intro=Math.min(intro,.55);return;}
  if(screen==='play'&&celebrate>0){celebrate=Math.min(celebrate,.3);return;}
  const q=pos(e),b=btnAt(q.x,q.y);
  if(b){pressBtn=b.id;down={btn:b.id};tone(660,.05,'triangle',.07);return;}
  if(screen!=='play'||busy)return;
  const g=cellAt(q.x,q.y);if(!g)return;
  down={x:q.x,y:q.y,r:g.r,c:g.c,mode:'pack',to:null};
  preview=buildPreview(g.r,g.c);
  const p=at(g.r,g.c);if(p)p.pop=Math.max(p.pop,.2);
  sfxTap();
}
function onMove(e){
  if(!down||down.btn||screen!=='play'||!st)return;
  const q=pos(e),dx=q.x-down.x,dy=q.y-down.y;
  if(Math.sqrt(dx*dx+dy*dy)>cell*.5&&st.crane>0){
    const g=cellAt(q.x,q.y);
    if(g){
      const adj=Math.abs(g.r-down.r)+Math.abs(g.c-down.c)===1;
      const colOK=hasGear('longhook')&&g.c===down.c&&g.r!==down.r;
      if(adj||colOK){
        if(down.mode!=='move'||!down.to||down.to.r!==g.r||down.to.c!==g.c){
          down.mode='move';down.to=g;preview={kind:'move',r:down.r,c:down.c,to:g};sfxTap();
        }
        return;
      }
    }
  }
  if(down.mode==='move'){down.mode='pack';down.to=null;preview=buildPreview(down.r,down.c);}
}
function onUp(e){
  const d=down;down=null;pressBtn=null;
  if(!d)return;
  const q=pos(e);
  if(d.btn){const b=btnAt(q.x,q.y);if(b&&b.id===d.btn&&!b.disabled)handleBtn(b.id);preview=null;return;}
  preview=null;
  if(screen!=='play'||busy)return;
  if(d.mode==='move'&&d.to){doSwap(d.r,d.c,d.to.r,d.to.c);return;}
  const g=cellAt(q.x,q.y);
  if(g&&g.r===d.r&&g.c===d.c)attemptPack(d.r,d.c);
}
function handleBtn(id){
  if(id.indexOf('crop:')===0){
    const cid=id.slice(5),i=loadPick.indexOf(cid);
    if(i>=0)loadPick.splice(i,1);else if(loadPick.length<3)loadPick.push(cid);
    sfxTap();return;
  }
  if(id.indexOf('card:')===0){const g=gearById(id.slice(5));if(g)takeCard(g);return;}
  if(id.indexOf('equip:')===0){
    const g=gearById(id.slice(6));
    if(!g||run.owned.indexOf(g.id)<0)return;
    const i=run.equip.indexOf(g.id);
    if(i>=0)run.equip.splice(i,1);
    else{if(run.equip.length>=MAX_EQUIP)run.equip.shift();run.equip.push(g.id);}
    save();sfxTap();return;
  }
  if(id==='start'){
    if(STAGES[run.stage].crops)startStage(run.stage);
    else{loadPick=run.loadout.slice(0,3);screen='loadout';}
    return;
  }
  if(id==='golive'){
    if(loadPick.length!==3)return;
    run.loadout=loadPick.slice();save();startStage(run.stage);return;
  }
  if(id==='reset'){
    run={stage:0,total:0,best:{},owned:[],equip:[],loadout:['apple','orange','pear'],
      stored:null,seenChain:false,seenTruck:false,unlockedNight:false};
    save();startStage(0);return;
  }
  if(id==='kit'){prevScreen=screen;screen='kit';return;}
  if(id==='guide'){prevScreen=screen;screen='guide';return;}
  if(id==='order'){prevScreen='play';screen='order';return;}
  if(id==='closeOrder'){screen='play';return;}
  if(id==='closeGuide'||id==='back'){screen=prevScreen==='play'?'play':'title';return;}
  if(id==='mute'){muted=!muted;if(master)master.gain.value=muted?0:.4;return;}
  if(id==='restart'||id==='replay'){startStage(st.index);return;}
  if(id==='next'){advanceStage();return;}
  if(id==='close'){closeShift();return;}
}

cv.addEventListener('pointerdown',onDown,{passive:false});
cv.addEventListener('pointermove',onMove,{passive:false});
cv.addEventListener('pointerup',onUp,{passive:false});
cv.addEventListener('pointercancel',()=>{down=null;pressBtn=null;preview=null;});
cv.addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('keydown',e=>{
  initAudio();const k=e.key,kl=k.toLowerCase();
  if(screen==='title'&&(k==='Enter'||k===' '))handleBtn('start');
  else if(screen==='guide'&&(k==='Escape'||k==='Enter'||k===' '))handleBtn('closeGuide');
  else if(screen==='order'&&(k==='Escape'||k==='Enter'||k===' '))handleBtn('closeOrder');
  else if(screen==='kit'&&(k==='Escape'||k==='Enter'))handleBtn('back');
  else if(screen==='result'&&k==='Enter')handleBtn('next');
  else if(screen==='play'){
    if(kl==='i')handleBtn('guide');
    else if(kl==='o')handleBtn('order');
    else if(kl==='r')handleBtn('restart');
    else if(kl==='m')handleBtn('mute');
    else if(kl==='f'&&st&&goalDone())handleBtn('close');
  }
});

/* ============================ FRAME ===================================== */
let last=performance.now();
function frame(now){
  let dt=Math.min(.05,(now-last)/1000);last=now;
  if(slowmo>0)dt*=.55;
  update(dt);buttons=[];drawBg();
  if(screen==='title')drawTitle();
  else if(screen==='loadout')drawLoadout();
  else if(screen==='play')drawPlay();
  else if(screen==='order'){drawBoard();drawOrderCard();}
  else if(screen==='result')drawResult();
  else if(screen==='kit')drawKit();
  else if(screen==='guide')drawGuide();
  requestAnimationFrame(frame);
}

measureSafe();load();
cfg=STAGES[Math.min(run.stage,STAGES.length-1)];
COLS=cfg.cols;ROWS=cfg.rows;
crops=(cfg.crops||run.loadout).map(id=>CROPS[cropIndex(id)]);
resize();requestAnimationFrame(frame);
</script>
